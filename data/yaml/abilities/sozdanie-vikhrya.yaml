description: В точке, которую джинн видит в пределах 120 футов от себя, магически
  появляется вихрь в виде цилиндра радиусом 5 футов и высотой 30 футов. Вихрь существует,
  пока джинн сохраняет концентрацию (как если бы концентрировался на заклинании).
  Все существа, кроме джинна, которые входят в Вихрь, должны пройти испытание Силы
  со СЛ 18, при провале они &reference[restrained]{обездвижены} им. Джинн может в
  качестве действия переместить вихрь на расстояние до 60 футов. Существа, обездвиженные
  вихрем, перемещаются вместе с ним. Вихрь исчезает, если джинн перестаёт его видеть.
  Существо может использовать действие, чтобы освободить существо, обездвиженное вихрем
  (в том числе и себя), пройдя проверку Силы со СЛ 18. При успехе проверки существо
  перестаёт быть обездвиженным и перемещается в ближайшее пространство за пределами
  вихря.
