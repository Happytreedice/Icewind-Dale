description: 'Если цель — существо, оно должно пройти испытание Силы СЛ 16, при провале
  бехолдер перемещает его на расстояние до 30 футов в любом направлении. Цель &reference[restrained]{обездвижена}
  телекинетической хваткой до начала следующего хода бехолдера или пока бехолдер не
  &reference[incapacitated]{выведен из строя}.

  Если цель — объект, весящий не больше 300 фунтов, который никто не носит и не держит,
  он перемещается в любом направлении на расстояние до 30 футов. Бехолдер может совершать
  аккуратные действия этим лучом, например манипулировать простым инструментом, открывать
  двери или контейнеры.'
