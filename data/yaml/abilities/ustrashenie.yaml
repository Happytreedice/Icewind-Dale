description: '(1 в день)

  Одно существо по выбору квазита в пределах 20 футов от него должно пройти испытание
  Мудрости со СЛ 10, при провале оно &reference[frightened]{испугано} на 1 минуту.
  Цель может повторять это испытание в конце каждого своего хода, с помехой, если
  квазит на линии видимости. При успехе эффект для неё прекращается. 


  Квазит устрашает одно существо, цель должна пройти испытание Мудрости, при провале
  оно &reference[frightened]{испугано}. Цель может повторять это испытание в конце
  каждого своего хода.'
