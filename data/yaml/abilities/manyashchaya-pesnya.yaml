description: 'Гарпия поёт магическую мелодию. Все гуманоиды и великаны в пределах
  300 футов от гарпии, слышащие песню, должны пройти испытание Мудрости со СЛ 11,
  при провале они &reference[charmed]{обворожены} до окончания песни. Чтобы продолжать
  петь, гарпия должна использовать бонусное действие каждый следующий свой ход. Она
  может прекратить петь в любой момент. Песня прекращается, если гарпия &reference[incapacitated]{выведена
  из строя}.


  &reference[charmed]{Обворожённая} гарпией цель &reference[incapacitated]{выведена
  из строя} и игнорирует песни других гарпий. Если обворожённая цель находится более
  чем в 5 футах от гарпии, цель должна в свой ход переместиться к гарпии кратчайшим
  путём. Она не избегает внеочередных атак, но перед перемещением в опасную местность,
  такую как лава или яма, а также при получении урона от любого источника, кроме этой
  гарпии, цель может повторить испытание. Существо также может повторять испытание
  в конце каждого своего хода. При успехе эффект для него прекращается.


  При успехе испытания цель получает невосприимчивость к песне этой гарпии на следующие
  24 часа.


  Гарпия поёт магическую мелодию. Все гуманоиды и великаны в пределах 300 футов от
  гарпии, слышащие песню, должны пройти испытание Мудрости.'
