description: Ревенант выбирает целью одно существо, которое видит в пределах 30 футов
  от себя и которому он поклялся отомстить. Цель должна пройти испытание Мудрости
  со СЛ 15. При провале цель &reference[paralyzed]{парализована}, пока ревенант не
  нанесёт ей урон или до конца следующего хода ревенанта. Когда паралич прекращается,
  цель &reference[frightened]{испугана} ревенантом на 1 минуту. Испуганная цель может
  повторять это испытание в конце каждого своего хода (с помехой, если видит ревенанта),
  при успехе прекращая для себя испуг.
