description: 'Если существо начинает свой ход в пределах 30 футов от бурого увальня
  и при этом может видеть его глаза, бурый увалень может магически заставить это существо
  пройти испытание Харизмы со СЛ 15, если он &reference[incapacitated]{не выведен
  из строя}.


  При провале испытания существо не может совершать @UUID[Compendium.dnd5e.srd-actions.Item.mMwkUE20bEfKeetq]{ответные
  действия} до начала своего следующего хода и бросает [[/r d8]], чтобы определить,
  что оно будет делать в этот ход. При результате от 1 до 4 существо ничего не делает.
  При результате 5 или 6 существо не совершает действий, а всю свою скорость тратит
  на перемещение в случайном направлении. При результате 7 или 8 существо совершает
  одну атаку ближнего боя по случайно выбранному существу или не делает ничего, если
  в зоне досягаемости существ нет.


  Если существо не застигнуто врасплох, оно может отвести взгляд, чтобы не проходить
  испытание в начале своего хода. В этом случае оно не может видеть бурого увальня
  до начала своего следующего хода, после чего может снова отвести взгляд. Если существо
  в этот период посмотрит на бурого увальня, оно тут же должно пройти испытание. 


  Монстр пристально смотрит на существо находящееся невдалеке. Цель должна пройти
  испытание Харизмы.'
