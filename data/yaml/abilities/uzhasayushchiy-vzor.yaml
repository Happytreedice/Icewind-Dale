description: Мумия выбирает целью одно существо, которое видит в пределах 60 футов
  от себя. Если цель видит мумию, то должна пройти испытание Мудрости со СЛ 11 против
  этой магии, при провале цель &reference[frightened]{испугана} до конца следующего
  хода мумии. Если цель проваливает испытание на 5 и более, она также &reference[paralyzed]{парализована}
  на то же время. При успехе испытания цель получает невосприимчивость к Ужасающему
  взору всех мумий (но не лордов-мумий) на следующие 24 часа.
