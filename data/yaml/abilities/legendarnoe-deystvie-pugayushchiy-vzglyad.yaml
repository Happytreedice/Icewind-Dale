description: 'Лич фиксирует взгляд на одном существе, которое видит в пределах 10
  футов от себя. Цель должна пройти испытание Мудрости со СЛ 18 против этой магии,
  при провале она &reference[frightened]{испугана} на 1 минуту. Испуганная цель может
  повторять это испытание в конце каждого своего хода, при успехе эффект для неё прекращается.
  При успехе или если эффект для цели прекратился, она получает невосприимчивость
  к взгляду этого лича на следующие 24 часа. 

