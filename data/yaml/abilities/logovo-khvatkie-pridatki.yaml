description: Стены в пределах 120 футов от бехолдера отращивают хваткие придатки,
  которые существуют до значения инициативы 20 в раунде после следующего. Все существа
  по выбору бехолдера, начинающие свой ход в пределах 10 футов от такой стены, должны
  пройти испытание Ловкости со СЛ 15, при провале они &reference[grappled]{захвачены}.
  Для освобождения требуется успешная проверка Силы (Атлетика) или Ловкости (Акробатика)
  со СЛ 15.
