description: 'Местность, в которой находится логово бехолдера, искажается из-за присутствия
  этого существа, что создаёт один или несколько из следующих эффектов:


  Существа в пределах 1 мили от логова бехолдера иногда чувствуют, что за ними наблюдают,
  даже если на самом деле это не так.

  Когда бехолдер спит, в пределах 1 мили от его логова происходят небольшие искажения
  реальности, исчезающие через 24 часа. Метки на стенах пещеры могут незначительно
  поменяться, там, где ничего не было, может появиться таинственная безделушка, статуя
  может покрыться безвредной слизью и так далее. Эти эффекты проявляются только на
  естественных поверхностях и на немагических объектах, которые не носят и не держат.


  Если бехолдер умирает, эти эффекты исчезают через [[/r 1d10]] дней.'
