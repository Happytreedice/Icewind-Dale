description: Все существа, кроме нежити, в пределах 60 футов от привидения и способные
  видеть его, должны пройти испытание Мудрости со СЛ 13, при провале они &reference[frightened]{испуганы}
  на 1 минуту. Если цель проваливает испытание на 5 и более, она также стареет на
  [[/r 1d4 * 10]] лет. Испуганная цель может повторять это испытание в конце каждого
  своего хода, прекращая состояние испуга при успехе. При успехе испытания или если
  эффект для цели прекратился, она получает невосприимчивость к Ужасному облику этого
  привидения на следующие 24 часа. Эффект старения можно отменить заклинанием @UUID[Compendium.laaru-dnd5-hw.spells.Item.lFqzcFBz3F0u96i1]{Высшее
  восстановление}, но только если оно будет сотворено в течение 24 часов после воздействия.
