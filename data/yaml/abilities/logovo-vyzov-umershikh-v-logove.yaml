description: 'Лич вызывает существ, умерших в логове. Их образы материализуются и
  атакуют одно существо, которое лич видит в пределах 60 футов от себя. Цель должна
  пройти испытание Выносливости со СЛ 18, получая 52 ([[/r 15d6]]) некротического
  урона при провале или половину этого урона при успехе. После этого образы исчезают. 

  Лич вызывает существ, умерших в логове. Их образы материализуются и атакуют одно
