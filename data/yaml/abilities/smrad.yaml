description: 'Все существа, начинающие свой ход в пределах 5 футов от вурдалака, должны
  проходить испытание Выносливости со СЛ 10, при провале они &reference[poisoned]{отравлены}
  до начала своего следующего хода. При успехе существо получает невосприимчивоть
  к Смраду этого вурдалака на следующие 24 часа. 


  От вурдалака исходит отвратительный смрад. Все существа, начинающие свой ход в пределах 5 футов
  от вурдалака, должны проходить испытание Выносливости.'
