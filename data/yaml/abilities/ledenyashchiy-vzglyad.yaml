description: Йети выбирает целью одно существо, которое видит в пределах 30 футов
  от себя. Если цель видит йети, она должна пройти испытание Выносливости со СЛ 13
  против этой магии, при провале она получит 10 ([[/r 3d6]]) урона холодом и &reference[paralyzed]{парализована}
  на 1 минуту, если только не обладает невосприимчивостью к урону холодом. Цель может
  повторять это испытание в конце каждого своего хода, при успехе эффект для неё прекращается.
  При успехе или если эффект для цели прекратился, цель получает невосприимчивость
  к леденящему взгляду всех йети (но не отвратительных йети) на 1 час.
