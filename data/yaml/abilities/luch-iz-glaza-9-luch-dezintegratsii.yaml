description: Если цель — существо, оно должно пройти испытание Ловкости со СЛ 16,
  при провале оно получает 45 ([[/r 10d8]]) урона силой. Если этот урон снижает ПЗ
  существа до 0, его тело становится кучкой серой пыли. Если цель — немагический объект
  или творение магической силы размером не больше &reference[size]{крупного}, она
  дезинтегрирована без испытания. Если цель — немагический обьект или творение магической
  силы огромного размера или более, этот луч дезинтегрирует её часть объемом с 10-футовый
  куб.
