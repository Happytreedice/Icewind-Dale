description: '(перезарядка 6)

  Один гуманоид, которого привидение видит в пределах 5 футов от себя, должен пройти
  испытание Харизмы со СЛ 13, при провале привидение в него вселяется. После этого
  привидение исчезает, а цель &reference[incapacitated]{выведена из строя} и теряет
  контроль над своим телом. Теперь привидение контролирует это тело, но цель воспринимает
  происходящее. Привидение не может быть целью атак, заклинаний и прочих эффектов,
  кроме тех, что изгоняют нежить, и оно сохраняет свои мировоззрение, Интеллект, Мудрость,
  Харизму и невосприимчивость к &reference[frightened]{испугу} и &reference[charmed]{обворожению}.
  Во всём остальном привидение использует параметры цели, но оно не получает доступ
  к знаниям, классовым особенностям и умениям цели.

  Вселение длится до тех пор, пока ПЗ тела не опустятся до 0, пока привидение не прекратит
  его в качестве бонусного действия или пока привидение не изгонят или не заставят
  уйти таким эффектом, как заклинание @UUID[Compendium.laaru-dnd5-hw.spells.Item.S7e8t6AIgYh9AJV0]{рассеивание
  зла и добра}. Когда вселение заканчивается, привидение возвращается в свободное
  пространство в пределах 5 футов от тела. При успехе испытания или если вселение
  прекратилось, цель получает невосприимчивость ко Вселению этого привидения на 24
  часа.'
