description: 'Ремораз совершает одну атаку укусом по существу размером не больше среднего,
  &reference[grappled]{захваченному} им. Если эта атака попадает, существо получает
  урон от укуса, становится проглоченным, а захват прекращается.

  Пока существо проглочено, оно &reference[blinded]{ослеплено}, &reference[restrained]{обездвижено}
  и полностью укрыто от атак и прочих эффектов, исходящих снаружи ремораза, а также
  получает 21 ([[/r 6d6]]) урона кислотой в начале каждого хода ремораза.

  Если ремораз получает за один ход 30 или больше урона от существа внутри, он должен
  в конце этого хода пройти испытание Выносливости со СЛ 15. При провале он отрыгнёт
  всех проглоченных существ, которые падают &reference[prone]{распластанными} в пространстве
  в пределах 10 футов от ремораза. Если ремораз умирает, проглоченное существо перестаёт
  быть обездвиженным им и может освободиться из трупа, потратив 15 футов перемещения
  и оказываясь на выходе &reference[prone]{распластанным}.'
