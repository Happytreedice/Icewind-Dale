description: 'Лич выбирает целью одно существо, которое видит в пределах 30 футов
  от себя. Цель связывает с личем потрескивающий жгут негативной энергии. Каждый раз,
  когда лич получает урон, цель должна пройти испытание Выносливости со СЛ 18. При
  провале лич получает половину урона (округляя в меньшую сторону), а оставшийся урон
  получает цель. Этот жгут существует до значения инициативы 20 в следующем раунде
  или пока цель или лич не покинут логово.

