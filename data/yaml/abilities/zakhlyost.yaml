description: '(перезарядка 4–6)

  Все существа в пространстве элементаля должны пройти испытание Силы со СЛ 15. При
  провале цель получает 13 ([[/r 2d8 + 4]]) дробящего урона. Если цель размером не
  больше крупного, она также &reference[grappled]{захвачена} (СЛ освобождения 14).
  Пока длится захват, цель &reference[restrained]{обездвижена} и не может дышать (если
  только не способна дышать под водой). При успехе испытания цель выталкивается из
  пространства элементаля.

  Элементаль может одновременно держать в захвате одно существо крупного размера или
  до двух существ размером не больше среднего. В начале каждого хода элементаля каждая
  захваченная им цель получает 13 ([[/r 2d8 + 4]]) дробящего урона. Существо в пределах
  5 футов от элементаля может вытянуть существо или объект из него, если в качестве
  действия успешно пройдёт проверку Силы со СЛ 14.

  Все существа в пространстве элементаля должны пройти испытание Силы.'
