description: 'Элементаль может перемещаться через пространство шириной в 1 дюйм и
  более, не протискиваясь. Существо, которое касается элементаля или попадает по нему
  атакой ближнего боя, находясь в пределах 5 футов от него, получает 5 ([[/r 1d10]])
  урона огнём. Кроме того, элементаль может входить в пространство враждебных существ
  и останавливаться там. Когда он впервые за ход входит в пространство существа, это
  существо получает 5 ([[/r 1d10]]) урона огнём и загорается; пока кто-нибудь не потушит
  огонь, потратив действие, это существо получает 5 ([[/r 1d10]]) урона огнём в начале
  каждого своего хода. 

  Существо, которое касается элементаля или попадает по нему атакой ближнего боя,
  находясь в пределах 5 футов от него, получает урон огнём.

  Кроме того, элементаль может входить в пространство враждебных существ и останавливаться
  там. Когда он впервые за ход входит в пространство существа, это существо получает
  урон огнём и загорается.'
