description: Скелет бросается на существо крупного или меньшего @UUID[Compendium.dnd5e.srd-actions.Item.sDPntYBdmN7jMZc6]{размера}
  в радиусе 5 футов от него. Цель должна преуспеть в испытании Ловкости СЛ 12 или
  будет захвачена (СЛ освобождения 12). При провале цель также получает 3 ([[/r 1d6]])
  урона огнем в начале каждого из своих ходов, даже после окончания захвата. Если
  цель или существо в радиусе 5 футов от нее использует действие, чтобы потушить пламя,
  или если какой-либо другой эффект гасит пламя (например, цель погружается в воду),
  эффект заканчивается.
