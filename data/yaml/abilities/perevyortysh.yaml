description: 'Квазит может использовать действие, чтобы принять форму животного, напоминающую
  летучую мышь (скорость 10 футов, полёт 40 футов), многоножку (скорость 40 футов,
  лазание 40 футов) или жабу (скорость 40 футов, плавание 40 футов), или вернуться
  в истинную форму. Его параметры не меняются в зависимости от формы, кроме указанных
  изменений скорости. Снаряжение, которое он носит или держит, не превращается. Квазит
  возвращается в истинную форму, если умирает. 


  Квазит превращается в животное.'
