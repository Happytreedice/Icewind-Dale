actions:
- name: Моргенштерн +1 [Morning Star +1]
  type: weapon
  description: 'Моргенштерн — это деревянное древко, увенчанное металлической головкой
    в шипастой железной оболочке. Общая длина моргенштерна — около четырёх футов.
    Этот экземпляр снабжён золотой головкой, магически усиленной, чтобы улучшить боевые
    качества и избавиться от мягкости золота.

    Точность: Оружие ближнего боя, бонус +1 к атаке и урону.

    Моргенштерн, или утренняя звезда, состоит из деревянной рукояти и металлического
    навершия с шипами. Общая длина оружия — около 4 футов. Навершие этого моргенштерна
    сделано из золота и зачаровано, чтобы избежать деформации драгоценного металла
    и увеличить эффективность оружия.'
- name: Невосприимчивость к немагическому оружию
  type: feat
  description: Существо не получает урон от немагических атак.
- name: Благословение Девы Зимы
  type: feat
  description: Заклинания холода наносят дополнительно +4 урона.
- name: Призыв йети
  type: feat
  description: Действием может призвать 1 Снежного йети на помощь.
- name: Ледяной моргенштерн Лизан
  type: weapon
  description: 'Природная атака: Ледяной моргенштерн Лизан.'
- name: Мультиатака
  type: feat
  description: Существо совершает две атаки, выбирая между Ледяным моргенштерном Лизан
    и Моргенштерном +1.
- name: Врождённые заклинания (псионика)
  type: feat
  description: 'Заклинательная характеристика [[lookup @name capitalize]] — Интеллект
    (СЛ испытаний против заклинаний 13, [[/r 1d20+5]] (+5) к броску атаки заклинанием).
    У него есть следующие врождённые заклинания, ему не требуются для них никакие
    компоненты:

    Неограниченно:

    @UUID[Compendium.laaru-dnd5-hw.spells.Item.bv1jcEHUx0G3I976]{Магическая рука}
    (рука невидима);

    3 в день каждое:

    @UUID[Compendium.laaru-dnd5-hw.spells.Item.pu6riAdb2LChGsD3]{Необнаружимость}(только
    на себя),

    @UUID[Compendium.laaru-dnd5-hw.spells.Item.zateDc7zDCKnqjiE]{Полиглот},

    @UUID[Compendium.laaru-dnd5-hw.spells.Item.V5VnbpElqrpvDzpM]{Прыжок},

    @UUID[Compendium.laaru-dnd5-hw.spells.Item.DulrpjBUeVVgrrNA]{Туманный шаг};

    1 в день каждое:

    @UUID[Compendium.laaru-dnd5-hw.spells.Item.gxAncMbwLb3QJayh]{Планарный переход},

    @UUID[Compendium.laaru-dnd5-hw.spells.Item.MDvLGhwXCJnaTmwt]{Телекинез}.'
- name: Сопротивление урону
  type: feat
  description: 'Существо получает лишь половину урона следующих видов: дробящий, колющий,
    рубящий (от немагических атак).'
- name: Иммунитет к урону
  type: feat
  description: 'Существо не получает урон следующих видов: холод.'
