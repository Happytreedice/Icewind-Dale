- name: Тонкий нюх
  type: feat
  description: Ползающий падальщик совершает с преимуществом проверки Мудрости (Внимательность),
    полагающиеся на обоняние.
- name: Паучье лазание [Spider Climb]
  type: feat
  description: Ползающий падальщик может лазать по сложным поверхностям, включая потолки,
    без совершения проверок характеристик.
- name: Мультиатака [Multiattack]
  type: feat
  description: 'Ползающий падальщик совершает две атаки: одну Щупальцами и одну Укусом.'
- name: Щупальца [Tentacle]
  type: weapon
  description: 'Рукопашная атака оружием: +8 к попаданию, досягаемость 10 фт., одно
    существо. Попадание: 4 (1d4 + 2) урона ядом, и цель должна преуспеть в спасброске
    Телосложения со Сл 13, иначе станет отравленной на 1 минуту. Пока цель отравлена,
    она парализована. Цель может повторять этот спасбросок в конце каждого своего
    хода, оканчивая отравление на себе при успехе.'
- name: Укус [Bite]
  type: weapon
  description: 'Рукопашная атака оружием: +4 к попаданию, досягаемость 5 фт., одна
    цель. Попадание: 7 (2d4 + 2) колющего урона.'
