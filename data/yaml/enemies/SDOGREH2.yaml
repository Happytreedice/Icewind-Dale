actions:
- name: Удар
  type: weapon
  description: 'Природная атака: Удар.'
- name: Иммунитет к урону
  type: feat
  description: 'Существо не получает урон следующих видов: холод, яд.'
- name: Иммунитет к заклинаниям
  type: feat
  description: 'На существо не действуют заклинания: Облако-убийца (Cloudkill), Ядовитое
    облако (Poison Fog).'
- name: Безмозглость
  type: feat
  description: 'Существо лишено разума: оно иммунно к состояниям Очарованный и Испуганный,
    а также к эффектам, читающим мысли или влияющим на разум (Смятение, Удержание
    личности, Сон, Устрашение).'
- name: Мультиатака
  type: feat
  description: Существо совершает две атаки Ударом.
- name: Иммунитет к состояниям
  type: feat
  description: 'Существо иммунно к состояниям: Очарованный, Отравленный, Парализованный,
    Бессознательный, Истощение.'
- name: Сюжетная неуязвимость
  type: feat
  description: Пока не выполнено условие сценария (диалог, событие или квест), хиты
    существа не могут опуститься ниже 1, и оно не может быть убито. После выполнения
    условия Мастер снимает эту особенность.
- name: Легендарное сопротивление (3/день)
  type: feat
  description: Если существо проваливает спасбросок, оно может вместо этого сделать
    спасбросок успешным.
- name: Легендарные действия (3/раунд)
  type: feat
  description: 'Существо может совершить 3 легендарных действия на выбор в конце хода
    другого существа: Атака (1 действие), Перемещение без провокации атак (1 действие),
    Мощное заклинание/Всплеск (2 действия).'
