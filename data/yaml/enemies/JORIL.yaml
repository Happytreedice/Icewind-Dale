actions:
- name: Бросок ледяной глыбы
  type: weapon
  description: 'Природная атака: Бросок ледяной глыбы.'
- name: Иммунитет к урону
  type: feat
  description: 'Существо не получает урон следующих видов: холод.'
- name: Мультиатака
  type: feat
  description: Существо совершает две атаки, выбирая между Броском ледяной глыбы,
    Двуручной секирой Джорила и Топором Джорила +3.
- name: Двуручная секира Джорила
  type: weapon
  description: 'Природная атака: Двуручная секира Джорила.'
- name: Топор Джорила +3 [Joril's Axe +3]
  type: weapon
  description: 'Это могучее оружие состоит из древка длиной пять-шесть футов и тяжёлого
    лезвия. Секира двусторонняя, с лезвиями по обе стороны древка. Оружие это неповоротливо,
    но умелый воин способен наносить им удары чудовищной силы. Этой секирой владел
    Джорил Морозная Борода, вождь ледяных великанов. Оружие зачаровано несколькими
    благотворными заклинаниями.

    Точность: Оружие ближнего боя, бонус +3 к атаке и урону.

    Дар Джорила: Пока вы держите этот топор, ваше Телосложение увеличивается на 1,
    а Ловкость уменьшается на 1.

    Топор — мощное оружие, которое представляет собой тяжелое лезвие, закрепленное
    на рукояти длиной в пять-шесть футов. Этот топор двойной, с лезвиями по обе стороны
    древка. Это громоздкое оружие, но в руках умелого воина очень эффективное.

    Раньше этим топором владел Джорил Ледобрад, правитель морозных великанов. Оружие
    обладает некоторыми полезными волшебными свойствами.'
- name: Ледяная ярость
  type: feat
  description: Удары секирой наносят дополнительно 2d6 урона холодом.
- name: Легендарное сопротивление (3/день)
  type: feat
  description: Если существо проваливает спасбросок, оно может вместо этого сделать
    спасбросок успешным.
- name: Легендарные действия (3/раунд)
  type: feat
  description: 'Существо может совершить 3 легендарных действия на выбор в конце хода
    другого существа: Атака (1 действие), Перемещение без провокации атак (1 действие),
    Мощное заклинание/Всплеск (2 действия).'
