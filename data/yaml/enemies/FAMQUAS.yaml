actions:
- name: Перевёртыш [Shapechanger]
  type: feat
  description: Квазит может Действием принять звериный облик, напоминающий летучую
    мышь (скорость 10 фт. летая 40 фт.), многоножку (40 фт., лазая 40 фт.), или жабу
    (40 фт., плавая 40 фт.), или принять свой истинный облик. Во всех обликах его
    характеристики остаются теми же самыми, исключая указанные изменения скорости.
    Всё несомое и носимое им снаряжение не превращается. Он принимает свой истинный
    облик, если умирает.
- name: Сопротивление магии [Magic Resistance]
  type: feat
  description: Квазит совершает с преимуществом спасброски от заклинаний и прочих
    магических эффектов.
- name: Когти (в зверином облике Укус)
  type: weapon
  description: 'Рукопашная атака оружием: +4 к попаданию, досягаемость 5 фт., одна
    цель. Попадание: 5 (1d4 + 3) колющего урона, и цель должна преуспеть в спасброске
    Телосложения со Сл 10, иначе получит 5 (2d4) урона ядом и станет отравленной на
    1 минуту. Цель может повторять этот спасбросок в конце каждого своего хода, оканчивая
    эффект на себе при успехе.'
- name: Испуг (1/день) [Scare]
  type: feat
  description: Одно существо на выбор квазита в пределах 20 футов от него должно преуспеть
    в спасброске Мудрости со Сл 10, иначе станет испуганным на 1 минуту. Цель может
    повторять этот спасбросок в конце каждого своего хода, с помехой, если квазит
    находится в пределах линии обзора, оканчивая эффект на себе при успехе.
- name: Невидимость
  type: feat
  description: Квазит магическим образом становится невидимым, пока не атакует или
    не использует Испуг, или пока не окончится его концентрация (как при концентрации
    на заклинании). Все снаряжение, которое квазит несет или носит, становится невидимым
    вместе с ним.
