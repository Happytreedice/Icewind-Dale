actions:
- name: Раскалённое тело
  type: feat
  description: Существо, касающееся саламандры или попадающее по ней рукопашной атакой,
    находясь в пределах 5 футов от неё, получает 7 (2d6) урона огнём.
- name: Раскалённое оружие
  type: feat
  description: Всё металлическое рукопашное оружие, используемое саламандрой, причиняет
    дополнительно 3 (1d6) урона огнём при попадании (уже учтено в атаках).
- name: Мультиатака [Multiattack]
  type: feat
  description: 'Саламандра совершает две атаки: одну Копьём и одну Хвостом.'
- name: Копьё [Spear]
  type: weapon
  description: 'Дальнобойная или рукопашная атака оружием: +7 к попаданию, досягаемость
    5 фт. или дистанция 20 фт./60 фт., одна цель. Попадание: 11 (2d6 + 4) колющего
    урона, или 13 (2d8 + 4) колющего урона, если используется двумя руками для совершения
    рукопашной атаки, плюс 3 (1d6) урона огнём.'
- name: Хвост [Tail]
  type: weapon
  description: 'Рукопашная атака оружием: +7 к попаданию, досягаемость 10 фт., одна
    цель. Попадание: 11 (2d6 + 4) дробящего урона плюс 7 (2d6) урона огнём, и цель
    становится опутана, саламандра может автоматически попадать по ней хвостом, и
    не может совершать атаки хвостом по другим целям.'
