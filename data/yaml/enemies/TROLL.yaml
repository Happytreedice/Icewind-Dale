  type: weapon
  description: 'Рукопашная атака оружием: +7 к попаданию, досягаемость 5 фт., одна
    цель. Попадание: 7 (1d6 + 4) колющего урона.'
- name: Коготь [Claw]
  type: weapon
  description: 'Рукопашная атака оружием: +7 к попаданию, досягаемость 5 фт., одна
