    облако (Poison Fog).'
- name: Иммунитет к состояниям
  type: feat
  description: 'Существо иммунно к состояниям: Очарованный, Отравленный, Парализованный,
    Бессознательный, Истощение.'
- name: Мультиатака
  type: feat
  description: Существо совершает две атаки Ударом.
