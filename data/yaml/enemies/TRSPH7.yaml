actions:
- name: Иммунитет к заклинаниям
  type: feat
  description: 'На существо не действуют заклинания: Облако-убийца (Cloudkill), Ядовитое
    облако (Poison Fog).'
- name: Иммунитет к состояниям
  type: feat
  description: 'Существо иммунно к состояниям: Очарованный, Отравленный, Парализованный,
    Бессознательный, Истощение.'
- name: Иммунитеты нежити
  type: feat
  description: Существо не нуждается в воздухе, пище, питье и сне. Оно иммунно к яду
    и болезням, к состояниям Отравленный и Истощение, к магическому сну, очарованию
    и удержанию (парализации).
- name: Иммунитет к урону
  type: feat
  description: 'Существо не получает урон следующих видов: холод, яд.'
- name: Короткий меч действия +2 [Short Sword of Action +2]
  type: weapon
  description: 'Короткий меч — первый из появившихся типов мечей. Проще говоря, короткий
    меч можно считать кинжалом с клинком настолько длинным, что кинжалом его уже не
    назовёшь. В классификации мечей термина «короткий меч» не существует, однако им
    принято называть обоюдоострый клинок длиной около двух футов. Остриё обычно заострено
    и идеально подходит для колющих ударов. На поверхности клинка видны выгравированные
    письмена силы.

    Точность: Оружие ближнего боя, бонус +2 к атаке и урону.

    Проворство: Пока меч у вас в руке, ваша Ловкость повышается на 1 (максимум 20).

    Короткий меч — самая древняя разновидность меча. Фактически, короткий меч — это
    обоюдоострый кинжал, слишком длинный, чтобы его можно было именовать кинжалом.
    Официальная классификация мечей не включает этот тип, однако в обиходе название
    «короткий меч» часто употребляется по отношению к обоюдоострым клинкам длиной
    около двух футов. Кончик обычно заострен, что очень удобно для колющих ударов.
    На поверхности этого клинка магические символы.'
- name: Природа тени
  type: feat
  description: 'Существо сотворено из тьмы: оно иммунно к яду и состояниям Очарованный,
    Испуганный, Истощение, Схваченный, Парализованный, Окаменевший, Отравленный. На
    прямом солнечном свете оно совершает броски атаки с помехой.'
- name: Праща +1 [Sling +1]
  type: weapon
  description: 'Пращи существуют с начала письменной истории. Простейшая праща — кожаный
    или тканевый ремень с карманом для снаряда; эта, впрочем, наделена небольшими
    чарами. Оружие держат за оба конца ремня и раскручивают над головой. Набрав скорость,
    снаряд выпускают, отпуская один из концов ремня.

    Точность: Оружие дальнего боя, бонус +1 к атаке и урону.

    Пращи известны с древнейших времен. Праща обычно представляет собой ремешок из
    кожи или ткани, снабженный кармашком, который удерживает снаряд. Пращу берут рукой
    за оба конца ремешка и раскручивают над головой. Добившись максимальной скорости
    вращения, один из концов отпускают, метая снаряд.'
