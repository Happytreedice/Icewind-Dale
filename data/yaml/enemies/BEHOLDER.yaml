actions:
- name: Конус антимагии
  type: feat
  description: Центральный глаз злобоглаза создаёт 150-футовым конусом зону антимагии,
    как заклинание преграда магии [antimagic field]. В начале каждого своего хода
    злобоглаз решает, в какую сторону направлен конус, и будет ли он активен. Эта
    зона работает и против лучей из глаз самого злобоглаза.
- name: Укус [Bite]
  type: weapon
  description: 'Рукопашная атака оружием: +5 к попаданию, досягаемость 5 фт., одна
    цель. Попадание: 14 (4d6) колющего урона.'
- name: Лучи из глаз
  type: weapon
  description: 'Злобоглаз испускает три магических луча из глаз, выбранных случайным
    образом (перебрасывая повторяющиеся результаты), выбирая от одной до трёх целей,
    видимых в пределах 120 футов:

    Очаровывающий луч. Целевое существо должно преуспеть в спасброске Мудрости со
    Сл 16, иначе станет очарованным злобоглазом на 1 час, или пока злобоглаз не причинит
    ему вред.Парализующий луч. Целевое существо должно преуспеть в спасброске Телосложения
    со Сл 16, иначе станет парализованным на 1 минуту. Цель может повторять этот спасбросок
    в конце каждого своего хода, оканчивая эффект на себе при успехе.Луч страха. Целевое
    существо должно преуспеть в спасброске Мудрости со Сл 16, иначе станет испуганным
    на 1 минуту. Цель может повторять этот спасбросок в конце каждого своего хода,
    оканчивая эффект на себе при успехе.Замедляющий луч. Целевое существо должно преуспеть
    в спасброске Ловкости со Сл 16. При провале скорость цели на 1 минуту уменьшается
    вдвое. Кроме того, существо не может совершать реакции, и может в свой ход совершать
    либо Действие, либо бонусное действие, но не то и другое. Существо может повторять
    этот спасбросок в конце каждого своего хода, оканчивая эффект на себе при успехе.Луч
    бессилия. Целевое существо должно совершить спасброске Телосложения со Сл 16,
    получая 36 (8d8) урона некротической энергией при провале, или половину этого
    урона при успехе.Телекинетический луч. Если цель — существо, она должна преуспеть
    в спасброске Силы со Сл 16., иначе злобоглаз переместит её на расстояние до 30
    футов в любом направлении. Цель опутана телекинетической хваткой луча до начала
    следующего хода злобоглаза, либо пока злобоглаз не станет недееспособным. Если
    цель — предмет, весящий не больше 300 фунтов, никем не несомый и не носимый, он
    перемещается в любом направлении на расстояние до 30 футов. Злобоглаз может этим
    лучом совершать аккуратные действия, например, манипулировать простым инструментом,
    открывать дверь или контейнеры.Усыпляющий луч. Целевое существо должно преуспеть
    в спасброске Мудрости со Сл 16, иначе уснёт и в течение 1 минуты будет лишено
    сознания. Цель просыпается, если получает урон или другое существо действием разбудит
    его. Этот луч не оказывает никакого эффекта на конструктов и нежить.Луч окаменения.
    Целевое существо должно совершить спасбросок Ловкости со Сл 16. При провале существо
    начинает превращаться в камень и становится опутанным. В конце своего следующего
    хода оно должно повторить этот спасбросок. При успехе эффект оканчивается. При
    провале существо становится окаменевшим, пока не будет использовано заклинание
    высшее восстановление [greater restoration] или подобная магия.Луч расщепления.
    Если цель — существо, она должна преуспеть в спасброске Ловкости со Сл 16, иначе
    получит 45 (10d8) урона силовым полем. Если этот урон снижает хиты существа до
    0, его тело становится кучкой серой пыли. Если цель — немагический предмет или
    творение магической силы с размером не больше Большого, она расщепляется без спасброска.
    Если цель — немагический предмет или творение магической силы с размером Огромный
    или больше, этот луч расщепляет объём куба с длиной ребра 10 футов.Луч смерти.
    Целевое существо должно преуспеть в спасброске Ловкости со Сл 16, иначе получит
    55 (10d10) урона некротической энергией. Цель умирает, если луч уменьшает её хиты
    до 0.'
- name: 'Легендарное: Луч из глаз'
  type: feat
  description: Злобоглаз использует один случайным образом выбранный Луч из глаз.
