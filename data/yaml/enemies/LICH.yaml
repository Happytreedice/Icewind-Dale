actions:
- name: Легендарное сопротивление (3/день) [Legendary Resistance]
  type: feat
  description: Если лич проваливает спасбросок, он может вместо этого сделать спасбросок
    успешным.
- name: Восстановление [Rejuvenation]
  type: feat
  description: Если у лича есть филактерий, лич через (1d10) дней после уничтожения
    получает новое тело, восстанавливает все хиты и становится живым. Новое тело появляется
    в пределах 5 футов от филактерия.
- name: Использование заклинаний [Spellcasting]
  type: feat
  description: 'Лич является заклинателем 18 уровня. Его базовой характеристикой является
    Интеллект (Сл спасброска от заклинания 20, +12 к попаданию атаками заклинаниями).
    У него подготовлены следующие заклинания волшебника:

    Заговоры (неограниченно): волшебная рука [mage hand], луч холода [ray of frost],
    фокусы [prestidigitation]

    1 уровень (4 ячейки): волна грома [thunderwave], волшебная стрела [magic missile],
    обнаружение магии [detect magic], щит [shield]

    2 уровень (3 ячейки): Мельфова кислотная стрела [Melf’s acid arrow], невидимость
    [invisibility], обнаружение мыслей [detect thoughts], отражения [mirror image]

    3 уровень (3 ячейки): восставший труп [animate dead], контрзаклинание [counterspell],
    огненный шар [fireball], рассеивание магии [dispel magic]

    4 уровень (3 ячейки): переносящая дверь [dimension door], усыхание [blight]

    5 уровень (3 ячейки): наблюдение [scrying], облако смерти [cloudkill]

    6 уровень (1 ячейка): распад [disintegrate], сфера неуязвимости [globe of invulnerability]

    7 уровень (1 ячейка): перст смерти [finger of death], уход в иной мир [plane shift]

    8 уровень (1 ячейка): подчинение чудовища [dominate monster], Слово силы: оглушение
    [power word stun]

    9 уровень (1 ячейка): Слово силы: смерть [power word kill]'
- name: Сопротивление изгнанию [Turn Resistance]
  type: feat
  description: Лич совершает с преимуществом спасброски от всех эффектов, изгоняющих
    нежить.
- name: Парализующее касание
  type: weapon
  description: 'Рукопашная атака заклинанием: +12 к попаданию, досягаемость 5 фт.,
    одно существо. Попадание: 10 (3d6) урона холодом. Цель должна преуспеть в спасброске
    Телосложения со Сл 18, иначе станет парализованной на 1 минуту. Цель может повторять
    этот спасбросок в конце каждого своего хода, оканчивая эффект на себе при успехе.'
- name: 'Легендарное: Заговор'
  type: feat
  description: Лич накладывает заговор.
- name: 'Легендарное: Парализующее касание (стоит 2 действия)'
  type: feat
  description: Лич использует Парализующее касание.
- name: 'Легендарное: Разрушение жизни (стоит 3 действия'
  type: feat
  description: Все существа, не являющиеся нежитью, в пределах 20 футов от лича должны
    совершить спасбросок Телосложения со Сл 18 от этой магии, получая 21 (6d6) урона
    некротической энергией при провале, или половину этого урона при успехе.
- name: 'Легендарное: Пугающий взгляд (стоит 2 действия)'
  type: feat
  description: 'Лич фиксирует взгляд на одном существе, видимом в пределах 10 футов.
    Цель должна преуспеть в спасброске Мудрости со Сл 18 от этой магии, иначе станет
    испуганной на 1 минуту.

    Испуганная цель может повторять этот спасбросок в конце каждого своего хода, оканчивая
    эффект на себе при успехе. Если цель успешно совершила спасбросок или действие
    эффекта закончилось, она получает иммунитет к взгляду этого лича на следующие
    24 часа.'
