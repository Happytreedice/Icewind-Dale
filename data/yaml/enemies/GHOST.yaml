actions:
- name: Эфирное зрение [Ethereal Sight]
  type: feat
  description: Зрение привидения простирается на 60 футов на Эфирный План, когда оно
    находится на Материальном Плане, и наоборот.
- name: Бестелесное перемещение [Incorporeal Movement]
  type: feat
  description: Привидение может перемещаться сквозь других существ и предметы, как
    если бы они были труднопроходимой местностью. Оно получает 5 (1d10) урона силовым
    полем, если оканчивает ход внутри предмета.
- name: Иссушающее касание [Withering Strike]
  type: weapon
  description: 'Рукопашная атака оружием: +5 к попаданию, досягаемость 5 фт., одна
    цель. Попадание: 17 (4d6 + 3) урона некротической энергией.'
- name: Эфирность [Etherealness]
  type: feat
  description: Привидение входит на Эфирный План с Материального Плана, или наоборот.
    Оно видимо на Материальном Плане, пока находится в Пограничном Эфире, и наоборот,
    хотя не может воздействовать на то, что находится на другом плане, и становиться
    целью эффектов, происходящих на другом плане.
- name: Ужасный облик [Horrifying Visage]
  type: feat
  description: 'Все существа, находящиеся в пределах 60 футов от привидения, не являющиеся
    нежитью, и способные видеть его, должны преуспеть в спасброске Мудрости со Сл
    13, иначе станут испуганными на 1 минуту. Если цель проваливает спасбросок на
    5 и более единиц, она также стареет на 1к4 × 10 лет.

    Испуганная цель может повторять этот спасбросок в конце каждого своего хода, оканчивая
    состояние испуга на себе при успехе. Если цель успешно совершила спасбросок или
    действие эффекта закончилось, она получает иммунитет к Ужасному облику этого привидения
    на следующие 24 часа. Эффект старения можно отменить заклинанием высшее восстановление
    [greater restoration] но только если оно будет наложено в течение 24 часов после
    воздействия.'
- name: Одержимость (перезарядка 6) [Possession]
  type: feat
  description: 'Один гуманоид, видимый привидением в пределах 5 футов от себя, должен
    преуспеть в спасброске Харизмы со Сл 13, иначе станет одержимым привидением; после
    этого привидение исчезает, а цель становится недееспособной и теряет контроль
    над своим телом.

    Теперь привидение контролирует это тело, но цель не теряет сознание. Привидение
    не может быть целью атак, заклинаний и прочих эффектов, кроме тех, что изгоняют
    нежить, и оно сохраняет своё мировоззрение, Интеллект, Мудрость, Харизму и иммунитет
    к состояниям испуга и очарования. Во всём остальном привидение использует статистику
    одержимой цели, но оно не получает доступ к знаниям, классовым умениям и владениям
    цели.

    Одержимость длится до тех пор, пока хиты тела не опустятся до 0, пока привидение
    не окончит его бонусным действием, или пока привидение не изгонят или не заставят
    уйти таким эффектом как заклинание рассеивание добра и зла [dispel evil and good].

    Когда одержимость заканчивается, привидение возвращается в свободное пространство
    в пределах 5 футов от тела. Цель получает на 24 часа иммунитет к Одержимости этого
    привидения после того как преуспеет в спасброске или после того как одержимость
    закончится.'
