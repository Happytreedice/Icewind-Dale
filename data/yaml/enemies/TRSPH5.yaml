actions:
- name: Иммунитет к состояниям
  type: feat
  description: 'Существо иммунно к состояниям: Очарованный, Отравленный, Парализованный,
    Бессознательный, Истощение.'
- name: Иммунитет к заклинаниям
  type: feat
  description: 'На существо не действуют заклинания: Облако-убийца (Cloudkill), Ядовитое
    облако (Poison Fog).'
- name: Иммунитеты нежити
  type: feat
  description: Существо не нуждается в воздухе, пище, питье и сне. Оно иммунно к яду
    и болезням, к состояниям Отравленный и Истощение, к магическому сну, очарованию
    и удержанию (парализации).
- name: Природа тени
  type: feat
  description: 'Существо сотворено из тьмы: оно иммунно к яду и состояниям Очарованный,
    Испуганный, Истощение, Схваченный, Парализованный, Окаменевший, Отравленный. На
    прямом солнечном свете оно совершает броски атаки с помехой.'
- name: Ошеломитель [Dazer]
  type: weapon
  description: 'Могучее оружие, созданное волшебником Ретландом из Вестгейта; Ошеломителем
    обычно орудовали головорезы у него на службе. Несмотря на высокую учёность, Ретланд
    был не более чем вымогателем и бандитом. Его шайка, «Мостовые парни», десять лет
    запугивала и притесняла кварталы Вестгейта, пока волшебник на службе Тира, Алистар
    Лавелл, не поднял союзников против приспешников Ретланда. Одолев Ретланда и его
    банду, Алистар передал Ошеломитель церкви Тира, а та вручила его странствующему
    жрецу.

    Точность: Оглушитель — булава, дающая бонус +1 к броскам атаки и урона. Тяжёлый
    удар этого оружия способен на миг оглушить противника.

    Это мощное оружие создал маг Ретлэнд из Западных Врат, и пользовались им обычно
    его подручные-бандиты. Ретлэнд, хоть и получил прекрасное образование, оставался
    обыкновенным бандитом и главарем вымогателей. Его «Крутые парни» держали в страхе
    и притесняли все окрестности Западных Врат в течение доброго десятка лет, пока
    маг Алистер Лавелл, служивший Тиру, не побудил своих союзников выступить против
    бесчинств Ретлэнда. Разгромив бандитов, Алистер передал Ошеломитель в храм Тира,
    а потом оружие было подарено странствующему жрецу.'
- name: Иммунитет к урону
  type: feat
  description: 'Существо не получает урон следующих видов: холод, яд.'
