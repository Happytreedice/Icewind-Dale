actions:
- name: Элементальная гибель
  type: feat
  description: Если джинн умирает, его тело распадается на тёплый ветерок, оставляя
    только снаряжение, которое джинн носил и нёс.
- name: Врождённое колдовство [Innate Spellcasting]
  type: feat
  description: 'Базовой характеристикой джинна является Харизма (Сл спасброска от
    заклинания 17, +9 к попаданию атаками заклинаниями). Он может накладывать следующие
    заклинания, не нуждаясь в материальных компонентах:

    Неограниченно: волна грома [thunderwave], обнаружение добра и зла [detect evil
    and good], обнаружение магии [detect magic]

    3/день каждое: сотворение пищи и воды [create food and water] (может создавать
    вино вместо воды), хождение по ветру [wind walk], языки [tongues]

    1/день каждое: газообразная форма [gaseous form], невидимость [invisibility],
    образ [major image], призыв элементаля [conjure elemental] (только воздушный элементаль
    [air elemental]), сотворение [creation], уход в иной мир [plane shift]'
- name: Мультиатака [Multiattack]
  type: feat
  description: Джинн совершает три атаки Скимитаром.
- name: Скимитар [Scimitar]
  type: weapon
  description: 'Рукопашная атака оружием: +9 к попаданию, досягаемость 5 фт., одна
    цель. Попадание: 12 (2d6 + 5) рубящего урона плюс 3 (1d6) урона звуком или электричеством
    (на выбор джинна).'
- name: Создание смерча
  type: feat
  description: 'В точке, которую джинн видит в пределах 120 футов от себя, магическим
    образом появляется смерч в виде цилиндра с радиусом 5 футов и высотой 30 футов.
    Смерч существует, пока джинн поддерживает концентрацию (как при концентрации на
    заклинании).

    Все существа кроме джинна, входящие в смерч, должны преуспеть в спасброске Силы
    со Сл 18, иначе станут опутанным и перемещается в ближайшее пространство за пределами
    смерча.'
