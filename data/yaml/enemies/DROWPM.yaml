actions:
- name: Сопротивление магии
  type: feat
  description: 'Существо совершает с преимуществом спасброски от заклинаний и других
    магических эффектов. В оригинале (AD&D 2e): сопротивление магии 76%.'
- name: Освященный моргенштерн +3 [Sanctified Morning Star +3]
  type: weapon
  description: 'Моргенштерн — это деревянное древко, увенчанное металлической головкой
    в шипастой железной оболочке. Общая длина моргенштерна — около четырёх футов.
    Этот экземпляр снабжён золотой головкой, магически усиленной, чтобы улучшить боевые
    качества и избавиться от мягкости золота.

    Точность: Оружие ближнего боя, бонус +3 к атаке и урону.

    Освящение: Пока вы держите моргенштерн, он хранит частицу божественной благодати:
    вы можете сотворить до двух подготовленных заклинаний жреца 1-го уровня, не тратя
    ячейки заклинаний. Потраченные таким образом заклинания восстанавливаются после
    Длинного отдыха.

    Моргенштерн, или утренняя звезда, состоит из деревянной рукояти и металлического
    навершия с шипами. Общая длина оружия — около 4 футов. Навершие этого моргенштерна
    сделано из золота и зачаровано, чтобы избежать деформации драгоценного металла
    и увеличить эффективность оружия.'
