actions:
- name: Заряженный боевой топор +2 [Charged Battle Axe +2]
  type: weapon
  description: 'Помимо превосходной работы мастера, по всей поверхности видны выгравированные
    крошечные руны силы. Очевидно, что на создание этой вещи ушло немало времени и
    труда, и, хотя это заметно не сразу, от рун исходит слабое синее свечение.

    Точность: Оружие ближнего боя, бонус +2 к атаке и урону.

    Дополнительный урон: Наносит дополнительно [[/damage 1d6 lightning]] при каждом
    попадании.

    Оглушение: При попадании цель должна преуспеть в спасброске Телосложения [[/save
    ability=con]], иначе она Ошеломлена до конца своего следующего хода.

    Этот топор не только великолепно сделан — он украшен крохотными рунами силы по
    всей поверхности. Даже трудно представить, сколько времени и труда ушло на изготовление
    такой вещи. От рун исходит слабое голубое свечение.'
- name: Мультиатака
  type: feat
  description: Существо совершает две атаки Заряженным боевым топором +2.
