actions:
- name: Иммунитет к заклинаниям
  type: feat
  description: 'На существо не действуют заклинания: Облако-убийца (Cloudkill), Ядовитое
    облако (Poison Fog).'
- name: Скрытые свойства движка
  type: feat
  description: 'Скрытые предметы движка Infinity Engine без описания в оригинале:
    RING90. В игре они задавали невидимые иммунитеты и модификаторы существа; в D&D
    5e их эффект учтён в блоке характеристик (иммунитеты, сопротивления, особенности)
    и отдельного действия не требует.'
- name: Когти Иказарахт
  type: weapon
  description: 'Природная атака: Когти Иказарахт.'
- name: Удар хвостом
  type: weapon
  description: 'Природная атака: Удар хвостом.'
- name: Укус Древней Драконицы
  type: weapon
  description: 'Природная атака: Укус Древней Драконицы.'
- name: Иммунитет к урону
  type: feat
  description: 'Существо не получает урон следующих видов: холод, яд.'
- name: Несокрушимость (минимум 1 хит)
  type: feat
  description: 'Хиты существа не могут опуститься ниже 1 от обычного урона: его нельзя
    убить, пока не выполнено сюжетное условие. Мастер снимает эту особенность, когда
    условие выполнено.'
- name: Легендарное сопротивление (3/день)
  type: feat
  description: Если проваливает спасбросок, может вместо этого сделать его успешным.
    (преодолевается магическим оружием).
- name: Сопротивление урону
  type: feat
  description: 'Существо получает лишь половину урона следующих видов: рубящий, колющий,
    дробящий (от немагических атак).'
- name: Ледяное дыхание (Перезарядка 5–6)
  type: feat
  description: Выдыхает конус холода на 90 футов. Существа совершают спасбросок Телосложения
    Сл 22, получая 72 (16d8) урона холодом при провале.
- name: Мультиатака
  type: feat
  description: 'Существо совершает три атаки: одну Укусом Древней Драконицы, одну
    Когтями Иказарахт и одну Ударом хвостом.'
- name: Сопротивление магии
  type: feat
  description: 'Существо совершает с преимуществом спасброски от заклинаний и других
    магических эффектов. В оригинале (AD&D 2e): сопротивление магии 25%. (преодолевается
    магическим оружием).'
- name: Камень Души (Soul Gem)
  type: feat
  description: Пока Камень Души Иказарахт цел, ее дух не может быть окончательно уничтожен.
- name: Иммунитет к состояниям
  type: feat
  description: 'Существо иммунно к состояниям: Очарованный, Отравленный, Парализованный,
    Бессознательный.'
- name: Легендарные действия (3/раунд)
  type: feat
  description: 'Существо может совершить 3 легендарных действия на выбор в конце хода
    другого существа: Атака (1 действие), Перемещение без провокации атак (1 действие),
    Мощное заклинание/Всплеск (2 действия).'
