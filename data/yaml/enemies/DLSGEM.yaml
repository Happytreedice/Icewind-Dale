actions:
- name: Укус
  type: weapon
  description: 'Природная атака: Укус.'
- name: Иммунитет к заклинаниям
  type: feat
  description: 'На существо не действуют заклинания: Облако-убийца (Cloudkill), Ядовитое
    облако (Poison Fog).'
- name: Иммунитет к состояниям
  type: feat
  description: 'Существо иммунно к состояниям: Очарованный, Отравленный, Парализованный,
    Бессознательный.'
- name: Сопротивление урону
  type: feat
  description: 'Существо получает лишь половину урона следующих видов: кислота, огонь,
    холод, электричество (от немагических атак).'
- name: Когти
  type: weapon
  description: 'Природная атака: Когти.'
- name: Иммунитет к урону
  type: feat
  description: 'Существо не получает урон следующих видов: яд.'
- name: Иммунитеты конструкта
  type: feat
  description: Существо иммунно к яду, болезням, психическому урону и состояниям Очарованный,
    Испуганный, Парализованный, Окаменевший, Отравленный и Истощение. Ему не нужны
    воздух, пища, питьё и сон.
- name: Скрытые свойства движка
  type: feat
  description: 'Скрытые предметы движка Infinity Engine без описания в оригинале:
    RING91. В игре они задавали невидимые иммунитеты и модификаторы существа; в D&D
    5e их эффект учтён в блоке характеристик (иммунитеты, сопротивления, особенности)
    и отдельного действия не требует.'
- name: Сопротивление магии
  type: feat
  description: 'Существо совершает с преимуществом спасброски от заклинаний и других
    магических эффектов. В оригинале (AD&D 2e): сопротивление магии 50%.'
- name: Легендарное сопротивление (3/день)
  type: feat
  description: Если существо проваливает спасбросок, оно может вместо этого сделать
    спасбросок успешным.
- name: Легендарные действия (3/раунд)
  type: feat
  description: 'Существо может совершить 3 легендарных действия на выбор в конце хода
    другого существа: Атака (1 действие), Перемещение без провокации атак (1 действие),
    Мощное заклинание/Всплеск (2 действия).'
