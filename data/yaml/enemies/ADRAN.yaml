actions:
- name: Посох радости повешенных +1 [Staff of the Hanged Man's Glee +1]
  type: weapon
  description: 'Мрачный посох из древесины Древа Мертвеца, помнящий лица казнённых.

    Мрачная слава: Харизма −2, пока посох у вас (лица в древесине пугают собеседников).

    Восстание мёртвых (3/день): Сотворяет заклинание @UUID[Compendium.dnd5e.spells24.Item.phbsplAnimateDea]
    без траты ячейки.

    Этот жутковатый посох, пользующийся дурной славой, изготовлен из Дерева Мертвеца,
    древней черной ивы, растущей на границе забытой деревушки на Муншейских островах.
    На ней вешали преступников, и на ее ветвях качалось множество разбойников, убийц,
    насильников и прочих нарушителей закона, к вящей радости могильщика Мордигана.
    Дело в том, что Мордиган тайно изучал некромантию и не мог упустить подобную возможность
    для совершенствования своих талантов. Останки злодеев он зарывал под самым деревом
    и затем творил мерзостный ритуал, призывая на черную иву темные силы с Негативного
    Плана. В результате дерево стало отчасти разумным и научилось питаться останками
    тех, кто недавно еще свисал с ее ветвей. Черные корни пробивали разлагающуюся
    плоть, и жутким образом на узловатом стволе ивы начали проступать лица казненных,
    изуродованные гримасой страдания. Иву было решено сжечь, но Мордиган успел вырезать
    из нее посох, и, к удивлению жителей деревни, он в самом деле обладал мощными
    магическими свойствами, которые и погубили всю деревню. Так совершилась месть
    висельников с Дерева Мертвеца.'
