actions:
- name: Мультиатака
  type: feat
  description: Существо совершает три атаки Ударом.
- name: Иммунитеты нежити
  type: feat
  description: Существо не нуждается в воздухе, пище, питье и сне. Оно иммунно к яду
    и болезням, к состояниям Отравленный и Истощение, к магическому сну, очарованию
    и удержанию (парализации).
- name: Сопротивление урону
  type: feat
  description: 'Существо получает лишь половину урона следующих видов: дробящий, колющий,
    рубящий (от немагических атак).'
- name: Удар
  type: weapon
  description: 'Природная атака: Удар (оригинальный предмет движка SHAX4D4C).'
- name: Невосприимчивость к оружию слабее +2
  type: feat
  description: Существо получает урон только от магического оружия с бонусом не ниже
    +2. Атаки обычным оружием и оружием +1 не наносят ему урона.
- name: Невосприимчивость к немагическому оружию
  type: feat
  description: Существо не получает урон от немагических атак.
- name: Иммунитет к заклинаниям
  type: feat
  description: 'На существо не действуют заклинания: Облако-убийца (Cloudkill), Ядовитое
    облако (Poison Fog).'
- name: Иммунитет к состояниям
  type: feat
  description: 'Существо иммунно к состояниям: Очарованный, Отравленный, Парализованный,
    Бессознательный, Истощение.'
- name: Иммунитет к урону
  type: feat
  description: 'Существо не получает урон следующих видов: холод, яд.'
