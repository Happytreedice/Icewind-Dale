actions:
- name: Невосприимчивость к оружию слабее +2
  type: feat
  description: Существо получает урон только от магического оружия с бонусом не ниже
    +2. Атаки обычным оружием и оружием +1 не наносят ему урона.
- name: Мультиатака
  type: feat
  description: Существо совершает две атаки Двуручным мечом.
- name: Двуручный меч
  type: weapon
- name: Невосприимчивость к немагическому оружию
  type: feat
  description: Существо не получает урон от немагических атак.
- name: Несокрушимость (минимум 1 хит)
  type: feat
  description: 'Хиты существа не могут опуститься ниже 1 от обычного урона: его нельзя
    убить, пока не выполнено сюжетное условие. Мастер снимает эту особенность, когда
    условие выполнено.'
- name: Сопротивление урону
  type: feat
  description: 'Существо получает лишь половину урона следующих видов: дробящий, колющий,
    рубящий (от немагических атак).'
- name: Иммунитеты конструкта
  type: feat
  description: Существо иммунно к яду, болезням, психическому урону и состояниям Очарованный,
    Испуганный, Парализованный, Окаменевший, Отравленный и Истощение. Ему не нужны
    воздух, пища, питьё и сон.
- name: Иммунитет к состояниям
  type: feat
  description: 'Существо иммунно к состояниям: Очарованный, Отравленный, Парализованный,
    Бессознательный.'
- name: Иммунитет к урону
  type: feat
  description: 'Существо не получает урон следующих видов: яд, огонь, холод, кислота.'
- name: Иммунитет к заклинаниям
  type: feat
  description: 'На существо не действуют заклинания: Облако-убийца (Cloudkill), Ядовитое
    облако (Poison Fog).'
