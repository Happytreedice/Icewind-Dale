actions:
- name: Посох призывателя +3 [The Summoner's Staff +3]
  type: weapon
  description: 'Создан могучим архимагом Убатом Небесного Знака из Агларонда, прославленным
    призывателем зверей и элементалей.

    Точность: Оружие ближнего боя, бонус +3 к атаке и урону.

    Огненная стрела: Действием вы выпускаете из посоха две огненные стрелы в цель
    в пределах 30 футов: каждая наносит [[/damage 1d6 piercing]] и [[/damage 4d6 fire]];
    успешный спасбросок Ловкости [[/save ability=dex]] уменьшает урон огнём вдвое
    (1/день).

    Призыв чудовищ: Действием вы призываете [[/r 1d3]] чудовищ (по выбору Ведущего,
    в оригинале — чудовищ 4-го уровня): они появляются в пределах 20 футов и сражаются
    на вашей стороне до полутора минут (1/день).

    Невидимый охотник: Действием вы призываете невидимого охотника: он появляется
    в пределах 30 футов и служит вам 2 часа (1/день).

    Этот посох — мощное оружие и инструмент — создал могущественный архимаг Убат из
    Небесного Знамения. Этот уроженец Агларонда славился своими способностями призывать
    чудовищ и элементалей. К сожалению, в погоне за еще большей силой Убат был готов
    пойти на многое. К конце концов его сгубило призывание крайне могущественных существ
    с нижних планов. Самое значительное, что от него осталось — этот посох, немного
    почерневший, когда его хозяина утащили в Ахерон.'
- name: Мультиатака
  type: feat
  description: Существо совершает две атаки Посохом призывателя +3.
