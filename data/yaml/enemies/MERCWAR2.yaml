- name: Мультиатака
  type: feat
  description: Существо совершает две атаки Длинным мечом действия +4.
- name: Длинный меч действия +4 [Long Sword of Action +4]
  type: weapon
  description: 'Покрытый чародейскими символами клинок, подгоняющий руку владельца.

    Порыв действия: +1 к КД и сопротивление рубящему урону, пока меч в руке; раз в
    ход вы можете совершить одну дополнительную атаку этим мечом при использовании
    действия Атака.

    Быстрое: Когда вы совершаете дополнительную атаку, можете совершить её не Бонусным
    действием, а частью действия Атака. Вы можете совершить эту дополнительную атаку
    только один раз за ход.

    Такие мечи обычно называют военными, солдатскими или обоюдоострыми, хотя нередко
    встречаются и длинные мечи, заточенные лишь с одной стороны. Существует множество
    форм и вариантов длинного меча, его конструкция и размеры различаются в зависимости
    от культуры и времени изготовления. Длина таких мечей обычно от 35 до 47 дюймов
    (в последнем случает длина самого клинка достигает 40 дюймов). Большинство длинных
    мечей — обоюдоострые; часто они имеют острый конец, но предназначены все же для
    рубящих, а не колющих ударов. Клинок этого меча покрывают разнообразные магические
    знаки.'
