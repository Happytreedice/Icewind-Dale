actions:
- name: Раскалённое тело
  type: feat
  description: Существо, касающееся ремораза или попадающее по нему рукопашной атакой,
    находясь в пределах 5 футов от него, получает 10 (3d6) урона огнём.
- name: Укус [Bite]
  type: weapon
  description: 'Рукопашная атака оружием: +11 к попаданию, досягаемость 10 фт., одна
    цель. Попадание: 40 (6d10 + 7) колющего урона плюс 10 (3d6) урона огнём. Если
    цель — существо, она становится схваченной (Сл высвобождения 17). Пока цель схвачена,
    она опутана, и ремораз не может кусать другую цель.'
- name: Проглатывание [Swallow]
  type: weapon
  description: 'Ремораз совершает одну атаку Укусом по существу с размером не больше
    Среднего, схваченному им. Если эта атака попадает, существо получает урон от укуса,
    становится проглоченным и перестает быть схваченным. Будучи проглоченным, существо
    ослеплено и опутано, и обладает полным укрытием от атак и прочих эффектов, исходящих
    снаружи ремораза, и получает 21 (6d6) урона кислотой в начале каждого хода ремораза.

    Если ремораз получает за один ход 30 или больше урона от существа, находящегося
    внутри, ремораз должен в конце этого хода преуспеть в спасброске Телосложения
    со Сл 15, иначе отрыгнет всех проглоченных существ, которые падают ничком в пространстве
    в пределах 10 футов от ремораза. Если ремораз умирает, проглоченное существо перестает
    быть опутанным им, и может высвободиться из трупа, потратив 15 футов перемещения,
    при выходе падая ничком.'
