- name: Амфибия [Amphibious]
  type: feat
  description: Ним может дышать и воздухом и под водой.
- name: Использование заклинаний [Spellcasting]
  type: feat
  description: 'Базовой характеристикой Ним является Харизма (Сл спасброска от заклинания
    17). Он может накладывать следующие заклинания, не нуждаясь в материальных компонентах:

    Неограниченно: левитация [levitate], обнаружение магии [detect magic], свет [light]

    3/день каждое: власть над погодой [control weather], подводное дыхание [water
    breathing]'
- name: Мультиатака [Multiattack]
  type: feat
  description: Ним совершает две атаки Двуручным мечом.
- name: Двуручный меч [Greatsword]
  type: weapon
  description: 'Рукопашная атака оружием: +14 к попаданию, досягаемость 10 фт., одна
    цель. Попадание: 30 (6d6 + 9) рубящего урона.'
- name: Камень [Rock]
  type: weapon
  description: 'Дальнобойная атака оружием: +14 к попаданию, дистанция 60/240 фт.,
    одна цель. Попадание: 35 (4d12 + 9) дробящего урона.'
- name: Удар молнии (перезарядка 5–6)
  type: weapon
  description: Ним вызывает магическую молнию в точку, которую он видит в пределах
    500 футов от себя. Все существа в пределах 10 футов от этой точки должны совершить
    спасбросок Ловкости со Сл 17, получая 54 (12d8) урона электричеством при провале,
    или половину этого урона при успехе.
