- name: Мультиатака
  type: feat
  description: Существо совершает три атаки Ударом.
- name: Сопротивление урону
  type: feat
  description: 'Существо получает лишь половину урона следующих видов: дробящий, колющий,
    рубящий (от немагических атак).'
- name: Удар
  type: weapon
  description: 'Природная атака: Удар.'
- name: Смерть от огня и кислоты
  type: feat
  description: Тролль погибает окончательно, только если получил урон огнём или кислотой,
    находясь при 0 хитов.
- name: Иммунитет к заклинаниям
  type: feat
  description: 'На существо не действуют заклинания: Облако-убийца (Cloudkill), Ядовитое
    облако (Poison Fog).'
- name: Живучесть тролля
  type: feat
  description: Опустившись до 0 хитов, тролль не умирает, а падает без сознания и
    продолжает регенерировать, если его не добить огнём или кислотой.
- name: Иммунитет к состояниям
  type: feat
  description: 'Существо иммунно к состояниям: Очарованный, Отравленный, Парализованный,
    Бессознательный.'
- name: Иммунитет к урону
  type: feat
  description: 'Существо не получает урон следующих видов: холод, яд, электричество.'
