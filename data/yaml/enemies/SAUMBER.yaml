actions:
- name: Бушующий поток
  type: feat
  description: Водяной выпускает поток речной воды 30-футовой линией и шириной 5 футов.
    Каждое существо в этой области должно пройти испытание Ловкости Сл 17. При провале
    существо получает 11 (2d10) дробящего урона и распластывается. При успехе существо
    получает половину этого урона и не распластывается.
- name: Когти
  type: weapon
  description: 'Природная атака: Когти.'
- name: Водоворот
  type: feat
  description: Водяной магическим образом телепортируется в незанятое пространство,
    которое он может видеть в пределах 30 футов от себя. Пространство, которое он
    покидает и место куда он перемещается должны находиться в воде или на поверхности
    воды.
- name: Использование заклинаний
  type: feat
  description: 'Творит одно из следующих заклинаний, используя Харизму в качестве
    базовой характеристики (СЛ испытания от заклинаний 17):

    Неограниченно: 

    @UUID[Compendium.laaru-dnd5-hw.spells.Item.RHHEkJjFUFe1YRww]{Управление водой}

    @UUID[Compendium.laaru-dnd5-hw.spells.Item.2CzE8KsLIdmcvsy6]{Облако тумана}

    1/день:

    @UUID[Compendium.laaru-dnd5-hw.spells.Item.lFqzcFBz3F0u96i1]{Высшее восстановление}'
- name: Полноводный удар
  type: feat
  description: 'Атака оружием в ближнем бою: [[/r d20 + 9]] к попаданию, досягаемость
    10 футов, одна цель.

    Попадание: 14 ([[/r 2d8 + 5]]) дробящего урона плюс 10 ([[/r 3d6]]) урона холодом.'
- name: Мультиатака
  type: feat
  description: Речник совершает две атаки Полноводным ударом.
- name: Легендарная устойчивость
  type: feat
  description: Если речник проваливает испытание, он может вместо этого сделать испытание
    успешным.
- name: Амфибия
  type: feat
  description: Речник может дышать и воздухом и под водой.
- name: Укус
  type: weapon
  description: 'Природная атака: Укус.'
- name: Стремительный водоворот
  type: feat
  description: Водяной использует Водоворот. Сразу после телепортации каждое существо
    в пределах 5 футов от места назначения речника получает 5 ([[/r 1d10]]) урона
    холодом.
- name: Иммунитет к урону
  type: feat
  description: 'Существо не получает урон следующих видов: холод.'
