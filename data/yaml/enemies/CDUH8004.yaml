actions:
- name: Сбивающий с толку взгляд
  type: feat
  description: 'Если существо начинает ход в пределах 30 футов от бурого увальня и
    при этом может видеть глаза увальня, бурый увалень может магическим образом заставить
    его совершить спасбросок Харизмы со Сл 15, если он при этом не недееспособен.

    При провале спасброска существо не может совершать реакции до начала своего следующего
    хода, и бросает d8, чтобы определить, что оно будет делать в текущем ходу.

    При результате «1–4» существо ничего не делает.При результате «5–6» существо не
    совершает Действий, а всё перемещение тратит на то, что перемещается в случайном
    направлении.При результате «7–8» существо совершает одну рукопашную атаку по случайным
    образом выбранному существу или не делает ничего, если в пределах досягаемости
    существ нет.Если существо не захвачено врасплох, оно может отводить взгляд, чтобы
    не совершать спасбросок в начале своего хода. Если существо делает это, оно не
    видит бурого увальня до начала своего следующего хода, после чего может снова
    отводить взгляд.

    Если существо в этот период посмотрит на бурого увальня, оно тут же совершает
    спасбросок.'
- name: Прокладывание туннеля [Tunneler]
  type: feat
  description: Бурый увалень может копать сквозь сплошной камень со скоростью копания,
    уменьшенной вдвое, оставляя за собой туннель шириной 5 футов и высотой 8 футов.
- name: Мультиатака [Multiattack]
  type: feat
  description: 'Бурый увалень совершает три атаки: две Когтями, и одну Жвалами.'
- name: Коготь [Claw]
  type: weapon
  description: 'Рукопашная атака оружием: +8 к попаданию, досягаемость 5 фт., одна
    цель. Попадание: 9 (1d8 + 5) рубящего урона.'
- name: Жвалы
  type: weapon
  description: 'Рукопашная атака оружием: +8 к попаданию, досягаемость 5 фт., одна
    цель. Попадание: 14 (2d8 + 5) рубящего урона.'
