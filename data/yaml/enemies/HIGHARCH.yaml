- name: Посланник Ссета +1 [Messenger of Sseth +1]
  type: weapon
  description: 'Этот зловещий лук создали тысячи лет назад для могущественного лучника
    юань-ти по имени Апали. Число мужчин, женщин и детей, убитых Апали с помощью этого
    лука, почти не укладывается в голове: сотни лет воин вёл войну с людьми, пока
    в Чессенте его не сразил жрец Ассурана, бога мести, — за сто с лишним лет до того
    Апали убил в Чалте его прапрадеда. Вещь легко узнать по красно-чёрной обмотке
    рукояти и резным змеиным головам на концах лука. Красно-чёрные полосы — знак рода
    Апали, из касты жрецов; змеиные головы — знак Ссета, бога юань-ти.

    Точность: Оружие дальнего боя, бонус +1 к атаке и урону.

    Меткость: Благодаря качеству изготовления это оружие даёт бонус +1 к броскам атаки.

    Быстрое: Когда вы совершаете дополнительную атаку, можете совершить её не Бонусным
    действием, а частью действия Атака. Вы можете совершить эту дополнительную атаку
    только один раз за ход.

    Этот страшный лук изготовили тысячи лет назад для Апали, выдающегося лучника юань-ти.
    Число мужчин, женщин и детей, которых Апали застрелил из этого лука, невероятно,
    ведь он сражался с людьми не одну сотню лет. В конце концов юань-ти пал в Чессенте
    — его убил жрец бога мести Ассурана, отплатив ему за смерть своего прапрадеда.
    Этот лук легко узнать по черным и красным лентам на рукояти, которые символизируют
    семью Апали, принадлежавшую к касте жрецов, и по головам змей на концах лука —
    символу Ссета, бога юань-ти.'
