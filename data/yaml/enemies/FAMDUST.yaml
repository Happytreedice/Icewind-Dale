actions:
- name: Предсмертная вспышка
  type: feat
  description: Когда мефит умирает, он разлетается во все стороны пылью. Все существа
    в пределах 5 футов от него должны преуспеть в спасброске Телосложения со Сл 10,
    иначе станут ослеплёнными на 1 минуту. Ослеплённое существо может повторять спасбросок
    в каждом своём ходу, оканчивая эффект на себе при успехе.
- name: Врождённое колдовство [Innate Spellcasting]
  type: feat
  description: 'Мефит может накладывать заклинания, не нуждаясь в материальных компонентах.
    Его базовой характеристикой является Харизма.

    1/день: усыпление [sleep]'
- name: Когти [Claws]
  type: weapon
  description: 'Рукопашная атака оружием: +4 к попаданию, досягаемость 5 фт., одно
    существо. Попадание: 4 (1d4 + 2) рубящего урона.'
- name: Ослепляющее дыхание (перезарядка 6)
  type: feat
  description: 'Мефит выдыхает ослепляющую пыль 15-футовым конусом.

    Все существа в этой области должны преуспеть в спасброске Ловкости со Сл 10, иначе
    станут ослеплёнными на 1 минуту.

    Существо может повторять этот спасбросок в конце каждого своего хода, оканчивая
    эффект на себе при успехе.'
