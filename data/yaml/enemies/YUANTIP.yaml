actions:
- name: Перевертыш [Shapechanger]
  type: feat
  description: Юань-ти может Действием превратиться в змею Среднюю размера или принять
    свой истинный облик. Во всех обликах его характеристики остаются теми же самыми.
    Все несомое и носимое им снаряжение не превращается. Он не меняет облик, если
    умирает.
- name: Врождённое колдовство (только в облике юань-ти) [Innate Spellcasting]
  type: feat
  description: 'Базовой характеристикой юань-ти является Харизма (Сл спасброска от
    заклинания 13). Он может накладывать следующие заклинания, не нуждаясь в материальных
    компонентах:

    Неограниченно: дружба с животными [animal friendship] (только змеи), мистический
    заряд [eldritch blast], малая иллюзия [minor illusion] и ядовитые брызги [poison
    spray]

    3/день: внушение [suggestion]'
- name: Сопротивление магии [Magic Resistance]
  type: feat
  description: Юань-ти совершает с преимуществом спасброски от заклинаний и прочих
    магических эффектов.
- name: Вид проклинателя [Malison Type]
  type: feat
  description: Юань-ти с человеческой головой и торсом со змеиным телом вместо ног.
- name: Мультиатака (только в облике юань-ти) [Multiattack]
  type: feat
  description: Юань-ти совершает две дальнобойные атаки или две рукопашные атаки,
    но Сжимание может использовать только раз.
- name: Укус (только в облике змеи) [Bite]
  type: weapon
  description: 'Рукопашная атака оружием: +5 к попаданию, досягаемость 5 фт., одно
    существо. Попадание: 5 (1d4 + 3) колющего урона плюс 7 (2d6) урона ядом.'
- name: Сжимание [Constrict]
  type: weapon
  description: 'Рукопашная атака оружием: +5 к попаданию, досягаемость 5 фт., одна
    цель. Попадание: 10 (2d6 + 3) дробящего урона, и цель становится схваченной (Сл
    высвобождения 13). Пока цель схвачена, она опутана, а юань-ти не может сжимать
    другую цель.'
- name: Скимитар (только в облике юань-ти) [Scimitar ]
  type: weapon
  description: 'Рукопашная атака оружием: +5 к попаданию, досягаемость 5 фт., одна
    цель. Попадание: 6 (1d6 + 3) рубящего урона.'
- name: Мистический заряд (заговор, 2 луча)
  type: weapon
  description: 'Дальнобойная атака заклинанием: +5 к попаданию, дистанция 120 фт.,
    одна цель. Попадание: 8 (1d10 + 3) урона силовым полем за каждый луч.'
