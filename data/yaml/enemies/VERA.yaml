  description: Существо совершает две атаки Кинжалом +2.
- name: Кинжал +2 [Dagger +2]
  type: weapon
  description: 'Это кинжал отменной работы. Наложенные на него чары не дают кромке
    тупиться: таким кинжалом можно крошить камень, а лезвие останется бритвенно-острым.
    Рукоять слегка тёплая, и в деле кинжал сам подстраивает вес и баланс под каждого
    владельца.

    Точность: Оружие ближнего боя, бонус +2 к атаке и урону.

    Этот кинжал великолепно сработан. На него наложили особые заклинания, чтобы клинок
    никогда не тупился. Он может разрубить камень и при этом останется острым как
    бритва. Рукоять его чуть-чуть теплая на ощупь, а под каждого владельца он сам
    подбирает свой вес и баланс.'
