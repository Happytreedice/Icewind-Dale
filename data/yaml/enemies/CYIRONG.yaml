- name: Меч
  type: weapon
  description: 'Рукопашная атака оружием: +13 к попаданию, досягаемость 10 фт., одна
    цель. Попадание: 23 (3d10 + 7) рубящего урона.'
- name: Ядовитое дыхание (перезарядка 6)
  type: weapon
  description: Голем выдыхает ядовитый газ 15-футовым конусом. Все существа в этой
    области должны совершить спасбросок Телосложения со Сл 19, получая 45 (10d8) урона
    ядом при провале, или половину этого урона при успехе.
