actions:
- name: Ограниченный иммунитет к магии
  type: feat
  description: 'На ракшаса не действуют заклинания 6 уровня или ниже, и они же не
    могут его обнаружить, если только он сам не желает, чтобы они на него подействовали.

    Он совершает с преимуществом спасброски от всех остальных заклинаний и магических
    эффектов.'
- name: Врождённое колдовство [Innate Spellcasting]
  type: feat
  description: 'Базовой характеристикой ракшаса является Харизма (Сл спасброска от
    заклинания 18, +10 к попаданию атаками заклинаниями). Ракшас может накладывать
    следующие заклинания, не нуждаясь в материальных компонентах:

    Неограниченно: волшебная рука [mage hand], малая иллюзия [minor illusion], маскировка
    [disguise self], обнаружение мыслей [detect thoughts]

    3/день каждое: внушение [suggestion], невидимость [invisibility], обнаружение
    магии [detect magic], образ [major image], очарование личности [charm person]

    1/день каждое: истинное зрение [true seeing], подчинение личности [dominate person],
    полёт [fly], уход в иной мир [plane shift]'
- name: Мультиатака [Multiattack]
  type: feat
  description: Ракшас совершает две атаки Когтём.
- name: Коготь [Claw]
  type: weapon
  description: 'Рукопашная атака оружием: +7 к попаданию, досягаемость 5 фт., одна
    цель. Попадание: 9 (2d6 + 2) рубящего урона, и если цель — существо, она становится
    проклятой.

    Магическое проклятье вступает в действие каждый раз, когда существо совершает
    короткий или продолжительный отдых, наполняя мысли цели ужасными образами и грёзами.
    Проклятая цель не получает преимуществ от окончания короткого и продолжительного
    отдыха.

    Проклятье длится до тех пор, пока не будет снято заклинанием снятие проклятья
    [remove curse] или подобной магией.'
