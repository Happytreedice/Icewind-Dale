actions:
- name: Невосприимчивость к немагическому оружию
  type: feat
  description: Существо не получает урон от немагических атак.
- name: Природа тени
  type: feat
  description: 'Существо сотворено из тьмы: оно иммунно к яду и состояниям Очарованный,
    Испуганный, Истощение, Схваченный, Парализованный, Окаменевший, Отравленный. На
    прямом солнечном свете оно совершает броски атаки с помехой.'
- name: Сны Мертвого Бога +4, +6 пр. добрых [Dead God's Dreaming +4, +6 vs. good]
  type: weapon
  description: 'Клинок из руды астрального острова — сгустка убитой божественности.

    Против добрых: Против существ добрых убеждений бонус меча возрастает с +4 до +6
    (примените +2 к атаке и урону вручную; для урона — активность «Против добрых»).

    Эмоция: страх (3/день): Действием вы источаете отчаяние в радиусе 10 футов в пределах
    50 футов: каждое существо в области должно преуспеть в спасброске Мудрости [[/save
    ability=wis dc=15]], иначе Испугано на 5 раундов.

    Символ боли (1/день): Действием вы чертите пылающий знак: каждое существо по вашему
    выбору в радиусе 15 футов в пределах 35 футов должно преуспеть в спасброске Телосложения
    [[/save ability=con dc=15]], иначе на 1 минуту его пронзает боль: помеха на броски
    атаки и проверки характеристик.

    Легенда о том, как Бэйн, Баал и Миркул стали богами распри, убийства и смерти,
    хорошо известна образованным жителям Фаэруна. Однако большинство теологов до сих
    пор не знает, что произошло с незадачливым умирающим божеством, которого зловещая
    троица поглотила до встречи с Джергалом. Известно лишь, что малая часть его сущности
    попала на Астральный План, где из нее возник крохотный островок поверженной божественности.
    Сотни лет спустя этим кусочком земли завладел маг-чародей по имени Медрос и нашел
    там странную руду. Его слуги-дуэргары выковали из необычного металла клинок для
    самого одного воина, сильнейшего из соратников Медроса. Те, кто пользовался этим
    мечом, говорили, что чувствуют, держа его в руках, как по нему текут последние
    воспоминания мертвого бога.'
- name: Видит невидимое
  type: feat
  description: Существо видит невидимых существ и предметы в пределах своего зрения,
    как если бы они были видимы, и не поддаётся иллюзиям невидимости.
- name: Иммунитет к состояниям
  type: feat
  description: 'Существо иммунно к состояниям: Парализованный, Бессознательный, Отравленный,
    Истощение.'
- name: Мультиатака
  type: feat
  description: Существо совершает три атаки Снами Мертвого Бога +4, +6 пр. добрых.
- name: Иммунитет к урону
  type: feat
  description: 'Существо не получает урон следующих видов: холод, яд.'
- name: Иммунитет к заклинаниям
  type: feat
  description: 'На существо не действуют заклинания: Облако-убийца (Cloudkill).'
- name: Сопротивление урону
  type: feat
  description: 'Существо получает лишь половину урона следующих видов: дробящий, колющий,
    рубящий (от немагических атак).'
- name: Сопротивление магии
  type: feat
  description: 'Существо совершает с преимуществом спасброски от заклинаний и других
    магических эффектов. В оригинале (AD&D 2e): сопротивление магии 75%. (преодолевается
    магическим оружием).'
- name: Легендарное сопротивление (3/день)
  type: feat
  description: Если существо проваливает спасбросок, оно может вместо этого сделать
    спасбросок успешным.
- name: Легендарные действия (3/раунд)
  type: feat
  description: 'Существо может совершить 3 легендарных действия на выбор в конце хода
    другого существа: Атака (1 действие), Перемещение без провокации атак (1 действие),
    Мощное заклинание/Всплеск (2 действия).'
