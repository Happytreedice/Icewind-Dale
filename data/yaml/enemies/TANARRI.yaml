actions:
- name: Невосприимчивость к немагическому оружию
  type: feat
  description: Существо не получает урон от немагических атак.
- name: Магический длинный меч (Изуномей)
  type: weapon
  description: 'Природная атака: Магический длинный меч (Изуномей).'
- name: Иммунитет к Облаку-убийце
  type: feat
  description: Изуномей полностью невосприимчива к эффектам и урону заклинания Облако-убийца
    (Cloudkill).
- name: Удар змеиным хвостом
  type: weapon
  description: 'Природная атака: Удар змеиным хвостом.'
- name: Невосприимчивость к оружию слабее +2
  type: feat
  description: Существо получает урон только от магического оружия с бонусом не ниже
    +2. Атаки обычным оружием и оружием +1 не наносят ему урона.
- name: Иммунитет к состояниям
  type: feat
  description: 'Существо иммунно к состояниям: Очарованный, Отравленный, Испуганный.'
- name: Иммунитет к заклинаниям
  type: feat
  description: 'На существо не действуют заклинания: Облако-убийца (Cloudkill), Ядовитое
    облако (Poison Fog).'
- name: Иммунитет к урону
  type: feat
  description: 'Существо не получает урон следующих видов: огонь, яд, электричество.'
- name: Сопротивление магии
  type: feat
  description: 'Существо совершает с преимуществом спасброски от заклинаний и других
    магических эффектов. Существо совершает с преимуществом спасброски от заклинаний
    и других магических эффектов. В оригинале (AD&D 2e): сопротивление магии 70%.
    (преодолевается магическим оружием).'
- name: Мультиатака
  type: feat
  description: 'Существо совершает семь атак: шесть Магическим длинным мечом и одну
    Ударом змеиным хвостом.'
- name: Сопротивления Изуномей
  type: feat
  description: Изуномей иммунна к яду и заклинаниям, влияющим на разум, и совершает
    с преимуществом спасброски от заклинаний.
- name: Сопротивление урону
  type: feat
  description: 'Существо получает лишь половину урона следующих видов: колющий, дробящий,
    электричество, холод, рубящий, кислота (от немагических атак).'
- name: Реактивность (Reactive)
  type: feat
  description: Изуномей может совершать одну реакцию в каждом ходе каждого существа
    в бою.
- name: Парирование (Parry)
  type: feat
  description: Добавляет +5 к КД против одной атаки ближнего боя, которая должна по
    ней попасть.
- name: Легендарное сопротивление (3/день)
  type: feat
  description: Если существо проваливает спасбросок, оно может вместо этого сделать
    спасбросок успешным.
- name: Легендарные действия (3/раунд)
  type: feat
  description: 'Существо может совершить 3 легендарных действия на выбор в конце хода
    другого существа: Атака (1 действие), Перемещение без провокации атак (1 действие),
    Мощное заклинание/Всплеск (2 действия).'
