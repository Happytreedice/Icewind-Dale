actions:
- name: Перевёртыш [Shapechanger]
  type: feat
  description: Бес может Действием принять звериный облик, напоминающий ворона (20
    фт., летая 60 фт.), крысу (скорость 20 фт.) или паука (20 фт., лазая 20 фт.),
    или принять свой истинный облик. Во всех обликах его статистика остаётся той же
    самой, исключая указанные изменения скорости. Всё несомое и носимое им снаряжение
    не превращается. Он принимает свой истинный облик, если умирает.
- name: Дьявольское зрение [Devil's Sight]
  type: feat
  description: Магическая тьма не мешает тёмному зрению беса.
- name: Сопротивление магии [Magic Resistance]
  type: feat
  description: Бес совершает с преимуществом спасброски от заклинаний и прочих магических
    эффектов.
- name: Жало (в зверином облике Укус) [Sting]
  type: weapon
  description: 'Рукопашная атака оружием: +5 к попаданию, досягаемость 5 фт., одна
    цель. Попадание: 5 (1d4 + 3) колющего урона, и цель должна совершить спасбросок
    Телосложения со Сл 11, получая 10 (3d6) урона ядом при провале, или половину этого
    урона при успехе.'
- name: Невидимость
  type: feat
  description: Бес магическим образом становится невидимым, пока не атакует или не
    утратит концентрацию (как при концентрации на заклинании). Все снаряжение, которое
    бес несет или носит, становится невидимым вместе с ним.
