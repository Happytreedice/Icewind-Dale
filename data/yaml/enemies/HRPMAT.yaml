  type: weapon
  description: 'Природная атака: Укус.'
- name: Мультиатака
  type: feat
  description: 'Существо совершает три атаки: одну Укусом и две Когтями.'
- name: Невосприимчивость к немагическому оружию
  type: feat
  description: Существо не получает урон от немагических атак.
- name: Скрытые свойства движка
  type: feat
  description: 'Скрытые предметы движка Infinity Engine без описания в оригинале:
    CIBOSST. В игре они задавали невидимые иммунитеты и модификаторы существа; в D&D
    5e их эффект учтён в блоке характеристик (иммунитеты, сопротивления, особенности)
    и отдельного действия не требует.'
