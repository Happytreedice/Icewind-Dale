actions:
- name: Мультиатака
  type: feat
  description: Существо совершает две атаки Моргенштерном +1.
- name: Иммунитет к заклинаниям
  type: feat
  description: 'На существо не действуют заклинания: Облако-убийца (Cloudkill), Ядовитое
    облако (Poison Fog).'
- name: Моргенштерн +1 [Morning Star +1]
  type: weapon
  description: 'Моргенштерн — это деревянное древко, увенчанное металлической головкой
    в шипастой железной оболочке. Общая длина моргенштерна — около четырёх футов.
    Этот экземпляр снабжён золотой головкой, магически усиленной, чтобы улучшить боевые
    качества и избавиться от мягкости золота.

    Точность: Оружие ближнего боя, бонус +1 к атаке и урону.

    Моргенштерн, или утренняя звезда, состоит из деревянной рукояти и металлического
    навершия с шипами. Общая длина оружия — около 4 футов. Навершие этого моргенштерна
    сделано из золота и зачаровано, чтобы избежать деформации драгоценного металла
    и увеличить эффективность оружия.'
- name: Иммунитет к состояниям
  type: feat
  description: 'Существо иммунно к состояниям: Очарованный, Отравленный, Парализованный,
    Бессознательный, Истощение.'
- name: Иммунитеты нежити
  type: feat
  description: Существо не нуждается в воздухе, пище, питье и сне. Оно иммунно к яду
    и болезням, к состояниям Отравленный и Истощение, к магическому сну, очарованию
    и удержанию (парализации).
- name: Иммунитет к урону
  type: feat
  description: 'Существо не получает урон следующих видов: холод, яд.'
- name: Природа тени
  type: feat
  description: 'Существо сотворено из тьмы: оно иммунно к яду и состояниям Очарованный,
    Испуганный, Истощение, Схваченный, Парализованный, Окаменевший, Отравленный. На
    прямом солнечном свете оно совершает броски атаки с помехой.'
