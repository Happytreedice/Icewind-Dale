actions:
- name: Врождённое колдовство [Innate Spellcasting]
  type: feat
  description: 'Базовой характеристикой глабрезу является Интеллект (Сл спасброска
    от заклинания 16). Глабрезу может накладывать следующие заклинания, не нуждаясь
    в материальных компонентах:

    Неограниченно: обнаружение магии [detect magic], рассеивание магии [dispel magic],
    тьма [darkness]

    1/день каждое: полёт [fly],Слово силы: оглушение [power word stun], смятение [confusion]'
- name: Сопротивление магии [Magic Resistance]
  type: feat
  description: Глабрезу совершает с преимуществом спасброски от заклинаний и прочих
    магических эффектов.
- name: Мультиатака [Multiattack]
  type: feat
  description: 'Глабрезу совершает четыре атаки: две Клешнями и две Кулаками.

    В качестве альтернативы, он совершает две атаки Клешнями и накладывает одно заклинание.'
- name: Клешня [Claw]
  type: weapon
  description: 'Рукопашная атака оружием: +9 к попаданию, досягаемость 10 фт., одна
    цель. Попадание: 16 (2d10 + 5) дробящего урона. Если цель — существо с размером
    не больше Среднего, оно становится схваченным (Сл высвобождения равна 15). У глабрезу
    есть две клешни, и каждая может держать по одной цели.'
- name: Кулак [Fist]
  type: weapon
  description: 'Рукопашная атака оружием: +9 к попаданию, досягаемость 5 фт., одна
    цель. Попадание: 7 (2d4 + 2) дробящего урона.'
