- name: Мультиатака
  type: feat
  description: Маршал гоблинов-лучников совершает две атаки коротким луком или две атаки кинжалом.
- name: Короткий лук
  type: weapon
  description: 'Дальнобойная атака оружием: +4 к попаданию, дистанция 80/320 фт., одна цель. Попадание: 5 (1d6 + 2) колющего урона.'
- name: Кинжал
  type: weapon
  description: 'Рукопашная или дальнобойная атака оружием: +4 к попаданию, досягаемость 5 фт. или дистанция 20/60 фт., одна цель. Попадание: 4 (1d4 + 2) колющего урона.'
- name: Проворное бегство
  type: feat
  description: Гоблин может в каждом своём ходу бонусным действием совершать действие Засада или Отход.
- name: Перенаправление атаки
  type: feat
  description: Если видимое гоблином существо нацеливается атакой на него, гоблин выбирает другого гоблина в пределах 5 фт. от себя. Два гоблина меняются местами, и целью атаки становится выбранный гоблин.
