actions:
- name: 'Боевой молот +4: Защитник [War Hammer +4: Defender]'
  type: weapon
  description: 'Как и другие боевые молоты, этот целиком сделан из стали: крушащий
    кости боёк насажен на восемнадцатидюймовую рукоять. Вдобавок он наделён несколькими
    магическими свойствами, делающими его более действенным в бою.

    Точность: Оружие ближнего боя, бонус +4 к атаке и урону.

    Обережные чары: Вы получаете бонус +3 к спасброскам, вызванным эффектами типа
    «Заклинание».

    Защитник: Пока молот у вас в руках, вы получаете бонус +2 к КД и сопротивление
    дробящему, колющему и рубящему урону.

    Исцеляющий удар: При провале спасброска СЛ 14 при попадании этим молотом вы восстанавливаете
    [[/heal 1d4]] хитов.

    Боевые молоты обыкновенно изготавливают целиком из стали; этот молот — не исключение.
    На 18-дюймовой рукояти укреплен боек, которым можно дробить кости. Волшебные свойства
    этого молота весьма полезны в бою.'
- name: Мультиатака
  type: feat
  description: 'Существо совершает две атаки Боевым молотом +4: Защитник.'
- name: Сопротивление урону
  type: feat
  description: 'Существо получает лишь половину урона следующих видов: холод (от немагических
    атак).'
- name: Несокрушимость (минимум 1 хит)
  type: feat
  description: 'Хиты существа не могут опуститься ниже 1 от обычного урона: его нельзя
    убить, пока не выполнено сюжетное условие. Мастер снимает эту особенность, когда
    условие выполнено.'
- name: Сопротивление магии
  type: feat
  description: 'Существо совершает с преимуществом спасброски от заклинаний и других
    магических эффектов. В оригинале (AD&D 2e): сопротивление магии 50%.'
