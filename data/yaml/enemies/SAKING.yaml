actions:
- name: Тяжелый арбалет +1 [Heavy Crossbow +1]
  type: weapon
  description: 'Арбалет с зачарованным ложем из ясеня.

    Меткость: Благодаря качеству изготовления это оружие даёт бонус +2 к броскам атаки.

    Арбалетом называется лук, укрепленный на ложе — деревянной или железной ручке.
    Сам лук обычно делают из ясеня или тиса. Для стрельбы из арбалета применяют особые
    стрелы, которые называют болтами.'
- name: Копье +1 [Spear +1]
  type: weapon
  description: 'Древнее оружие, доведённое чарами до совершенства.

    Копья относятся к самым древним видам оружия, известным еще в первобытные времена,
    когда копье представляло собой деревянный посох или палку с заостренным концом.
    С развитием обработки металла наконечники стали изготавливать из железа и стали.
    Затем мастера-оружейники начали придумывать новые варианты наконечников, лучше
    приспособленные для конкретных задач, — так появились различные виды древкового
    оружия. Это копье несколько отличается от других, поскольку оно наделено магическими
    свойствами.'
- name: Мультиатака
  type: feat
  description: Существо совершает две атаки Копьём +1 или две атаки Тяжелым арбалетом
    +1.
- name: Иммунитет к урону
  type: feat
  description: 'Существо не получает урон следующих видов: холод.'
