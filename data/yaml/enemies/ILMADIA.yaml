- name: Аламион +3 [Alamion +3]
  type: weapon
  description: 'Часть парного набора; второй — короткий меч Маламион. Клинок Аламиона
    чуть тоньше обычного длинного меча.

    Точность: Оружие ближнего боя, бонус +3 к атаке и урону.

    Сопротивление огню: Пока это оружие у вас в руках, вы имеете сопротивление урону
    огнём.

    Уязвимость к холоду: Пока это оружие у вас в руках, вы имеете уязвимость к урону
    холодом.

    Есть два парных клинка: короткий меч Маламион и этот длинный меч. Лезвие Аламиона
    тоньше, чем у простого длинного меча, а по центру у него проходит узкий желоб.
    По всей длине идет травленный кислотой узор в виде снежинок, большинство которых
    сконцентрировано у эфеса. Бронзовый эфес зажат с двух сторон белесыми пластинками
    слоновой кости, на которых вырезаны грозовые тучи, несущие снег и бурю. Рукоять
    покрывает перламутр, закрепленный бронзовой проволокой. Головка рукояти — цельный
    бронзовый шар с изображением символа Аурил, ромбовидной снежинки.

    Вся история этого клинка и его брата была подробно записана. Около двух сотен
    лет назад Обрену Левше, волшебнику из Шанната, заказали пару мечей во славу Аурил.
    Неохотно он взялся за работу и пять лет потратил на то, чтобы сделать Аламион
    («Морозного Папашу») и Маламион («Морозного Малыша»). Не сойдясь с Обреном в вопросе
    оплаты, жрецы Аурил хотели забрать мечи силой. Как закончилась эта схватка, точно
    никто не знает, но мечи Обрена в руки служителей Морозной Девы не попали. Тридцать
    лет спустя в Прокампуре воин по имени Бердино похвалялся своим мечом, будто он
    убивает демонов с одного удара. Два десятка дней спустя на берегу нашли тело Бердино,
    утыканное отравленными арбалетными стрелами.

    Новым владельцем Аламиона стал тщеславный и самовлюбленный вор по прозвищу Пеллас
    Светлый. Четырнадцатью годами ранее Пеллас случайно завладел Маламионом и жаждал
    получить второй меч с тех пор, как узнал о его существовании. Пеллас хранил их
    до самой смерти, которую он принял от клинка паладина Торма по имени Гариджон
    Ренольд. Гариджон оценил пользу этих парных мечей в сражениях с огненными обитателями
    внешних планов, и много лет Аламион и Маламион переходили от паладина к паладину.

    Хелебан Итмонгский, паладин Тира, был последним из известных владельцев этих мечей.
    Судя по всему, свою безвременную кончину он встретил на Побережье Меча, когда
    пытался искоренить там пиратство и работорговлю.'
- name: Алебарда Девы Ильмадии
  type: weapon
  description: 'Природная атака: Алебарда Девы Ильмадии.'
- name: Огненная кара
  type: feat
  description: Атаки алебардой наносят дополнительно 2d8 урона огнем.
- name: Легендарное сопротивление (3/день)
  type: feat
  description: Если существо проваливает спасбросок, оно может вместо этого сделать
    спасбросок успешным.
- name: Легендарные действия (3/раунд)
  type: feat
  description: 'Существо может совершить 3 легендарных действия на выбор в конце хода
    другого существа: Атака (1 действие), Перемещение без провокации атак (1 действие),
    Мощное заклинание/Всплеск (2 действия).'
