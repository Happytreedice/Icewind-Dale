actions:
- name: Мультиатака [Multiattack]
  type: feat
  description: Мумия может использовать Ужасающий взгляд и совершить одну атаку Разлагающим
    кулаком.
- name: Разлагающий кулак
  type: weapon
  description: 'Рукопашная атака оружием: +5 к попаданию, досягаемость 5 фт., одна
    цель. Попадание: 10 (2d6 + 3) дробящего урона плюс 10 (3d6) урона некротической
    энергией.

    Если цель — существо, она должна преуспеть в спасброске Телосложения со Сл 12,
    иначе станет проклятой гнилью мумии. Проклятая цель не может восстанавливать хиты,
    и её максимум хитов уменьшается на 10 (3d6) за каждые прошедшие 24 часа. Если
    проклятье уменьшает максимум хитов цели до 0, цель умирает, а её тело становится
    прахом. Проклятье длится до тех пор, пока не будет снято заклинанием снятие проклятья
    [remove curse] или другой магией.'
- name: Ужасающий взгляд
  type: feat
  description: Мумия нацеливается на одно существо, которое видит в пределах 60 футов.
    Если цель видит мумию, она должна преуспеть в спасброске Мудрости со Сл 11 от
    этой магии, иначе станет испуганной до конца следующего хода мумии. Если цель
    проваливает спасбросок на 5 и более единиц, она также становится парализованной
    на тот же период. Цель, преуспевшая в спасброске, получает иммунитет к Ужасающему
    взгляду всех мумий (но не лорд-мумий) на следующие 24 часа.
