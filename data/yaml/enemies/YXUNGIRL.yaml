actions:
- name: Истинный облик демоницы (Превращение в Марилит)
  type: feat
  description: В начале боя или при получении урона иллюзия мгновенно рассеивается.
    Существо принимает свой истинный демонический облик шестирукой Марилит Изуномей
    (КД 18, 210 хитов, 7 атак оружием, сопротивление магии, спасброски СЛ 16).
- name: Когти
  type: weapon
  description: 'Природная атака: Когти.'
- name: Несокрушимость (минимум 1 хит)
  type: feat
  description: 'Хиты существа не могут опуститься ниже 1 от обычного урона: его нельзя
    убить, пока не выполнено сюжетное условие. Мастер снимает эту особенность, когда
    условие выполнено.'
- name: Укус
  type: weapon
  description: 'Природная атака: Укус.'
- name: Иммунитет к урону
  type: feat
  description: 'Существо не получает урон следующих видов: кислота, огонь, холод,
    электричество.'
- name: Сопротивление урону
  type: feat
  description: 'Существо получает лишь половину урона следующих видов: дробящий, колющий,
    рубящий (от немагических атак).'
- name: Сопротивление магии
  type: feat
  description: 'Существо совершает с преимуществом спасброски от заклинаний и других
    магических эффектов. В оригинале (AD&D 2e): сопротивление магии 100%. (преодолевается
    магическим оружием).'
- name: Легендарное сопротивление (3/день)
  type: feat
  description: Если существо проваливает спасбросок, оно может вместо этого сделать
    спасбросок успешным.
- name: Легендарные действия (3/раунд)
  type: feat
  description: 'Существо может совершить 3 легендарных действия на выбор в конце хода
    другого существа: Атака (1 действие), Перемещение без провокации атак (1 действие),
    Мощное заклинание/Всплеск (2 действия).'
