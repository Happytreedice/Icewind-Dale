actions:
- name: Аура холода
  type: feat
  description: Пока тролль жив, его окутывает аура сильного холода, заполняющая область
    в пределах 10 футов от него. В начале хода тролля все немагические источники огня
    в пределах действия ауры тухнут. Любое существо, начинающее свой ход в в пределах
    10 футов от тролля, получает 10 (3d6) урона холодом.
- name: Мультиатака [Multiattack]
  type: feat
  description: 'Тролль совершает три атаки: одну Укусом и две Когтями.'
- name: Укус
  type: weapon
  description: 'Рукопашная атака оружием: +7 к попаданию, досягаемость 5 фт., одна
    цель. Попадание: 7 (1d6 + 4) колющего урона плюс 9 (2d8) урона холодом.'
- name: Коготь [Claw]
  type: weapon
  description: 'Рукопашная атака оружием: +7 к попаданию, досягаемость 5 фт., одна
    цель. Попадание: 11 (2d6 + 4) рубящего урона плюс 9 (2d8) урона холодом. Если
    цель получает любое количество урона холодом, то она должна преуспеть в спасброске
    Телосложения со Сл 15, иначе будет совершать с помехой все броски атаки до конца
    её следующего хода.'
