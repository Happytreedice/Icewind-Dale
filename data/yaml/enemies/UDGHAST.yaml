actions:
- name: Вонь [Stench]
  type: feat
  description: Все существа, начинающие ход в пределах 5 футов от вурдалака, должны
    преуспеть в спасброске Телосложения со Сл 10, иначе станут отравленными до начала
    своего следующего хода. При успешном спасброске существо получает иммунитет к
    Вони этого упыря на 24 часа.
- name: Отрицание изгнания
  type: feat
  description: Вурдалак и все упыри в пределах 30 футов от него совершают с преимуществом
    спасброски от эффектов, изгоняющих нежить.
- name: Укус [Bite]
  type: weapon
  description: 'Рукопашная атака оружием: +3 к попаданию, досягаемость 5 фт., одно
    существо. Попадание: 12 (2d8 + 3) колющего урона.'
- name: Когти [Claws]
  type: weapon
  description: 'Рукопашная атака оружием: +5 к попаданию, досягаемость 5 фт., одна
    цель. Попадание: 10 (2d6 + 3) рубящего урона.

    Если цель — существо, не являющееся нежитью, она должна преуспеть в спасброске
    Телосложения со Сл 10, иначе станет парализованной на 1 минуту.

    Цель может повторять этот спасбросок в конце каждого своего хода, оканчивая эффект
    на себе при успехе.'
