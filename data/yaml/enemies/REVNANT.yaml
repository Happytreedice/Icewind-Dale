actions:
- name: Регенерация [Regeneration]
  type: feat
  description: Ревенант восстанавливает 10 хитов в начале своего хода. Если ревенант
    получает урон излучением или огнём, эта особенность не действует в начале следующего
    хода ревенанта. Тело ревенанта уничтожается только если он начинает ход с 0 хитов
    и не может регенерировать.
- name: Восстановление [Rejuvenation]
  type: feat
  description: Если тело ревенанта уничтожается, его душа остаётся. Через 24 часа
    душа вселяется в другой труп на том же плане существования и оживляет его, восстанавливая
    все хиты. Пока душа находится без тела, заклинание исполнение желаний [wish] может
    отправить душу в посмертие, не позволяя ей вернуться.
- name: Иммунитет к изгнанию
  type: feat
  description: Ревенант обладает иммунитетом к эффектам, изгоняющим нежить.
- name: Мстительный следопыт
  type: feat
  description: Ревенант знает направление и расстояние до любого существа, которому
    он хочет отомстить, даже если они находятся на разных планах существования. Если
    существо, выслеживаемое ревенантом, умирает, ревенант узнаёт об этом.
- name: Мультиатака [Multiattack]
  type: feat
  description: Ревенант совершает две атаки Кулаком.
- name: Кулак [Fist]
  type: weapon
  description: 'Рукопашная атака оружием: +7 к попаданию, досягаемость 5 фт., одна
    цель. Попадание: 11 (2d6 + 4) дробящего урона. Если цель — существо, которому
    ревенант поклялся отомстить, цель получает от атаки дополнительно 14 (4d6) дробящего
    урона. Вместо причинения урона ревенант может схватить цель (Сл высвобождения
    14), если размер цели не больше Большого.'
- name: Мстительный взор
  type: weapon
  description: 'Ревенант нацеливается на одно существо, которое видит в пределах 30
    футов от себя, которому он поклялся отомстить.

    Цель должна совершить спасбросок Мудрости со Сл 15. При провале цель становится
    парализованной, пока ревенант не причинит ей урон, или до конца следующего хода
    ревенанта. Когда паралич оканчивается, цель становится испуганной ревенантом на
    1 минуту. Испуганная цель может повторять этот спасбросок в конце каждого своего
    хода, с помехой, если видит ревенанта, оканчивая испуг на себе при успехе.'
