actions:
- name: Иммунитет к урону
  type: feat
  description: 'Существо не получает урон следующих видов: яд.'
- name: 'Боевой топор +3: Усталость [Battle Axe +3: Fatigue]'
  type: weapon
  description: 'Помимо превосходной работы мастера, по всей поверхности видны выгравированные
    крошечные руны силы. Очевидно, что на создание этой вещи ушло немало времени и
    труда, и, хотя это заметно не сразу, от рун исходит слабое синее свечение.

    Точность: Оружие ближнего боя, бонус +3 к атаке и урону.

    Усталость: При провале спасброска СЛ 13 поражённая цель замедляется на 2 раунда:
    её скорость уменьшается вдвое, она не может совершать реакции и совершает не более
    одной атаки в свой ход.

    Этот топор не только великолепно сделан — он украшен крохотными рунами силы по
    всей поверхности. Даже трудно представить, сколько времени и труда ушло на изготовление
    такой вещи. От рун исходит слабое голубое свечение.'
- name: Мультиатака
  type: feat
  description: 'Существо совершает две атаки Боевым топором +3: Усталость.'
- name: Иммунитет к состояниям
