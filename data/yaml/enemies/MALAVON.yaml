actions:
- name: Мультиатака
  type: feat
  description: Существо совершает две атаки, выбирая между Кинжалом Наблюдатель, Кинжалом
    Поцелуй огня и Огненным Поцелуем +3.
- name: Кинжал Наблюдатель
  type: weapon
  description: 'Природная атака: Кинжал Наблюдатель.'
- name: Сопротивление урону
  type: feat
  description: 'Существо получает лишь половину урона следующих видов: огонь, холод,
    кислота (от немагических атак).'
- name: Огненный Поцелуй +3 [Fire Kiss +3]
  type: weapon
  description: 'Этот толстый клинок изначально выковали дерро глубоко под поверхностью
    Фаэруна. Принадлежавший саванту Дабанту, Огненный Поцелуй редко бывал в деле:
    Дабант развлекался магическими ловушками и пытками. В конце концов Дабанта растерзала
    стая крюкастых ужасов, которые бросили кинжал в кучу прочего хлама. Тридцать лет
    спустя свежеватели разума истребили крюкастых ужасов и унесли кинжал в свою общину.
    Торговец Ним выменял кинжал у свежевателей на рабов-свирфнеблинов, а затем продал
    его Малавону.

    Точность: Оружие ближнего боя, бонус +3 к атаке и урону.

    Дополнительный урон: Наносит дополнительно [[/damage 1d6 fire]] при каждом попадании.

    Этот клинок создали дерро глубоко под поверхностью Фаэруна. Его владелец Савант
    Дабант нечасто пользовался Огненным Поцелуем — его гораздо больше привлекали волшебные
    ловушки и пытки. В конце концов Дабанта убила банда крючковатых, и кинжал долгое
    время валялся в куче с другим награбленным. Через тридцать лет пожиратели разума
    разгромили крючковатых и забрали кинжал себе, а впоследствии отдали его торговцу
    Ниму в обмен на рабов — глубинных дворфов. Тот затем продал кинжал Малавону.'
- name: Сопротивление магии
  type: feat
  description: 'Существо совершает с преимуществом спасброски от заклинаний и других
    магических эффектов. Существо совершает с преимуществом спасброски от заклинаний
    и других магических эффектов. В оригинале (AD&D 2e): сопротивление магии 86%.'
- name: Коррозийный туман
  type: feat
  description: Заклинание Облако-убийца также разъедает доспехи и оружие.
- name: Ярость Малавона
  type: feat
  description: 'Действием существо испускает волну разрушительной силы: все существа
    в конусе 30 футов совершают спасбросок Телосложения СЛ 16, получая [[/damage 8d6
    force]] урона силовым полем при провале или половину при успехе. Используется
    1 раз в день.'
- name: Иммунитет к состояниям
  type: feat
  description: 'Существо иммунно к состояниям: Очарованный, Отравленный.'
- name: Магический симулякр
  type: feat
  description: Перед началом боя управляет своей иллюзорной копией (MALAVONS).
- name: Кинжал Поцелуй огня
  type: weapon
  description: 'Природная атака: Кинжал Поцелуй огня.'
- name: Легендарное сопротивление (3/день)
  type: feat
  description: Если существо проваливает спасбросок, оно может вместо этого сделать
    спасбросок успешным.
- name: Легендарные действия (3/раунд)
  type: feat
  description: 'Существо может совершить 3 легендарных действия на выбор в конце хода
    другого существа: Атака (1 действие), Перемещение без провокации атак (1 действие),
    Мощное заклинание/Всплеск (2 действия).'
