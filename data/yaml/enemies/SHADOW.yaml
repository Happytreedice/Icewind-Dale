- name: Вытягивание силы [Strength Drain]
  type: weapon
  description: 'Рукопашная атака оружием: +4 к попаданию, досягаемость 5 фт., одно
    существо. Попадание: 9 (2d6 + 2) урона некротической энергией, и значение Силы
    цели уменьшается на 1d4. Цель умирает, если её значение Силы уменьшается до 0.
    Уменьшение длится до тех пор, пока цель не окончит короткий или продолжительный
    отдых. Если от этой атаки умрёт гуманоид с не злым мировоззрением, через 1d4 часа
    из трупа выйдет новая тень.'
