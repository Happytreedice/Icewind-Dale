actions:
- name: Молотобойный цеп +2 [Hammer Flail +2]
  type: weapon
  description: 'Цеп — это прочная деревянная рукоять, к которой крепится железный
    стержень, деревянный стержень с шипами или шипастый железный шар. Рукоять и било
    соединены шарниром или цепью. Изначально это орудие использовали для обмолота
    зерна. Этот цеп усилен магией: на каждой его поверхности светятся руны.

    Точность: Оружие ближнего боя, бонус +2 к атаке и урону.

    Оглушение: удар оглушает: цель должна преуспеть в спасброске Телосложения [[/save
    ability=con]], иначе станет Ошеломлённой до конца своего следующего хода.

    Цеп — это железный прут, деревянный брус с шипами или металлический шипованный
    шар, прикрепленный к массивной деревянной рукояти с помощью цепи или петли. Первоначально
    цеп был орудием для молотьбы зерна. Этот цеп зачарован. По всей его поверхности
    поблескивают руны.'
- name: Кинжал Пресио +2 [Presio's Dagger +2]
  type: weapon
  description: 'Кинжал Пресио явно служил лишь для церемоний: её нечестивые обеты
    запрещали ей использовать в бою клинковое оружие. Она получила его в дар, достигнув
    сана Самой Изнуряющей Святости. Клинок зачарован на особую остроту и ядовитость.

    Точность: Оружие ближнего боя, бонус +2 к атаке и урону.

    Ядовитый клинок: Существо, поражённое этим кинжалом, должно преуспеть в спасброске
    Телосложения [[/save ability=con]], иначе яд разъедает рану: цель получает 8 урона
    ядом (по 1 в секунду в течение 8 секунд).

    Очевидно, кинжал Пресио предназначен только для церемониальных нужд, так как клятвы,
    данные ею, запрещают пользоваться в бою острым оружием. Пресио получила этот кинжал
    в дар, когда получила звание Самого Болезнетворного Святейшества. Лезвие заколдовано
    для достижения максимальной остроты и обработано ядом.'
- name: Легендарное сопротивление (3/день)
  type: feat
  description: Если существо проваливает спасбросок, оно может вместо этого сделать
    спасбросок успешным.
- name: Легендарные действия (3/раунд)
  type: feat
  description: 'Существо может совершить 3 легендарных действия на выбор в конце хода
    другого существа: Атака (1 действие), Перемещение без провокации атак (1 действие),
    Мощное заклинание/Всплеск (2 действия).'
