actions:
- name: Полуторный меч [Bastard Sword]
  type: weapon
  description: 'Меч с длинной рукоятью — на полторы руки.

    Полуторный меч, или меч-бастард, называется так потому, что представляет собой
    нечто среднее между двуручным и длинным мечом. Это обоюдоострый меч с длинной
    ручкой, который при желании можно держать двумя руками. Общая длина меча — от
    четырех футов до четырех футов десяти дюймов.

    Свойства полуторного меча: 1d8 рубящий (1 рука) / 2d4 рубящий (2 руки, универсальное
    Versatile 2d4, минимальный урон 2). Критический эффект: цель становится Застигнутой
    врасплох (Off-Guard) до начала вашего следующего хода.'
- name: Иммунитет к заклинаниям
  type: feat
  description: 'На существо не действуют заклинания: Облако-убийца (Cloudkill), Ядовитое
    облако (Poison Fog).'
- name: Иммунитет к урону
  type: feat
  description: 'Существо не получает урон следующих видов: холод, яд.'
- name: Иммунитеты нежити
  type: feat
  description: Существо не нуждается в воздухе, пище, питье и сне. Оно иммунно к яду
    и болезням, к состояниям Отравленный и Истощение, к магическому сну, очарованию
    и удержанию (парализации).
- name: Иммунитет к состояниям
  type: feat
  description: 'Существо иммунно к состояниям: Очарованный, Отравленный, Парализованный,
    Бессознательный, Истощение.'
