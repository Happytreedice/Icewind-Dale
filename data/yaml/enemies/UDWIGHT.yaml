actions:
- name: Чувствительность к солнечному свету [Sunlight Sensitivity]
  type: feat
  description: Находясь на солнечном свету, умертвие совершает с помехой броски атаки,
    а также проверки Мудрости (Внимательность), полагающиеся на зрение.
- name: Мультиатака [Multiattack]
  type: feat
  description: Умертвие совершает две атаки длинным мечом или Длинным луком. Оно может
    использовать Вытягивание жизни вместо одной атаки Длинным мечом.
- name: Вытягивание жизни [Life Drain]
  type: weapon
  description: 'Рукопашная атака оружием: +4 к попаданию, досягаемость 5 фт., одно
    существо. Попадание: 5 (1d6 + 2) урона некротической энергией. Цель должна преуспеть
    в спасброске Телосложения со Сл 13, иначе максимум её хитов уменьшится на количество,
    равное полученному урону. Это уменьшение длится до тех пор, пока цель не окончит
    продолжительный отдых. Цель умирает, если этот эффект уменьшает максимум хитов
    до 0.

    Гуманоид, убитый этой атакой, восстаёт через 24 часа в качестве зомби под контролем
    умертвия, если этого гуманоида не воскресят, или его тело не уничтожат. У умертвия
    может быть не более двенадцати зомби под контролем одновременно.'
- name: Длинный меч [Longsword]
  type: weapon
  description: 'Рукопашная атака оружием: +4 к попаданию, досягаемость 5 фт., одна
    цель. Попадание: 6 (1d8 + 2) рубящего урона, или 7 (1d10 + 2) рубящего урона,
    если используется двумя руками.'
- name: Длинный лук [Longbow]
  type: weapon
  description: 'Дальнобойная атака оружием: +4 к попаданию, дистанция 150/600 фт.,
    одна цель. Попадание: 6 (1d8 + 2) колющего урона.'
