actions:
- name: Кровавое бешенство [Blood Frenzy]
  type: feat
  description: Сахуагин совершает с преимуществом броски рукопашных атак по существам,
    у которых хиты ниже максимума.
- name: Ограниченная амфибия
  type: feat
  description: Сахуагин может дышать и воздухом и под водой, но чтобы не задохнуться,
    ему нужно погружаться в воду хотя бы раз каждые 4 часа.
- name: Акулья телепатия
  type: feat
  description: Сахуагин может магическим образом командовать всеми акулами, находящимися
    в пределах 120 футов от него, при помощи ограниченной телепатии.
- name: Мультиатака [Multiattack]
  type: feat
  description: 'Сахуагин совершает две рукопашные атаки: одну Укусом и одну Когтями
    или Копьём.'
- name: Укус [Bite]
  type: weapon
  description: 'Рукопашная атака оружием: +3 к попаданию, досягаемость 5 фт., одна
    цель. Попадание: 3 (1d4 + 1) колющего урона.'
- name: Когти [Claws]
  type: weapon
  description: 'Рукопашная атака оружием: +3 к попаданию, досягаемость 5 фт., одна
    цель. Попадание: 3 (1d4 + 1) рубящего урона.'
- name: Копьё [Spear]
  type: weapon
  description: 'Дальнобойная или рукопашная атака оружием: +3 к попаданию, досягаемость
    5 фт. или дистанция 20/60 фт., одна цель. Попадание: 4 (1d6 + 1) колющего урона,
    или 5 (1d8 + 1) колющего урона, если используется двумя руками для совершения
    рукопашной атаки.'
