actions:
- name: Мультиатака
  type: feat
  description: Существо совершает три атаки, выбирая между Длинным мечом Доблести,
    Доблестью +2 и Вакидзаши +1.
- name: Доблесть +2 [Valiant +2]
  type: weapon
  description: 'Этим легендарным клинком недолго владел воин Илбан из Элтурела; своим
    именем оружие обязано его подвигам в Калимшане. До Илбана, однако, Доблестный
    принадлежал святому убийце из далёкой Захары. По словам мудрецов, лёгкий меч был
    выкован для ордена ассасинов. Владельцы Доблестного пережили множество невероятных
    испытаний — во многом благодаря магии оружия. Клинок был утерян в Калимшане, когда
    святой убийца преследовал богохульных агентов паши до самого Калимпорта. Скимитар
    около дюжины лет оставался в руках банды Бариса, пока её не разгромил Илбан со
    спутниками. С Илбаном Доблестный побывал в битвах с песчаными людьми, гигантскими
    скорпионами, пустынными разбойниками, злыми чародеями и демоническими слугами
    Селана Харада.

    Точность: Оружие ближнего боя, бонус +2 к атаке и урону.

    Быстрое: Когда вы совершаете дополнительную атаку, можете совершить её не Бонусным
    действием, а частью действия Атака. Вы можете совершить эту дополнительную атаку
    только один раз за ход.

    Дополнительная атака: Совершая действие Атака, вы можете совершить этим скимитаром
    одну дополнительную атаку.

    Этим легендарным клинком некоторое время владел воин Илбан из Эльтуреля, и именно
    его подвиги в Калимшане дали мечу имя. До Илбана, однако, Доблесть принадлежала
    святому убийце из далекой Захары. Утверждают, что этот легкий меч создали для
    ордена убийц. Волшебные силы оружия помогали его владельцам проходить самые невероятные
    испытания. Скимитар был потерян в Калимшане, когда святой убийца преследовал нечестивых
    агентов паши, бежавших в Калимпорт. Барис Кабал владел этим мечом около двенадцати
    лет, пока его банду не разбил отряд Илбана. С Доблестью в руках Илбан бился с
    песчаными людьми, гигантскими скорпионами, бандитами пустыни, злыми магами и демоническими
    прислужниками Селана Харада.'
- name: Кольцо свободы
  type: feat
  description: Игнорирует труднопроходимую местность и паралич.
- name: Вакидзаши +1 [Wakizashi +1]
  type: weapon
  description: 'Вакидзаси, «спутник меча», чрезвычайно важен для самурая. Его носят
    всегда, даже в помещении, а ночью он лежит подле спящего самурая. Мастера у-джэни
    сокрыли в этом вакидзаси великую силу, что высвобождается лишь в гуще битвы. Как
    и почему этот вакидзаси попал в Фаэрун, неизвестно, но если владевший им самурай
    жив, он наверняка его ищет.

    Точность: Оружие ближнего боя, бонус +1 к атаке и урону.

    Вакидзаши, или парный меч, крайне важен для самурая. Самурай не снимает его даже
    дома, а по ночам кладет клинок рядом с собой. Мастера ву джен вложили в этот вакидзаши
    большую силу, которая высвобождается только тогда, когда владелец меча находится
    в самой гуще сражения. Как и почему такой клинок попал в Фаэрун, неизвестно, но
    если владевший им самурай до сих пор жив, он наверняка ищет его.

    Свойства вакидзаси (PF2e): 1d4 колющий, фехтовальное (Finesse), лёгкое (Light).

    • Смертоносное d8 (Deadly d8): при критическом попадании добавляет дополнительную
    кость 1d8 урона.

    • Быстрое (Agile / Nick): атака второй рукой совершается в рамках действия Атака
    без траты бонусного действия.

    • Универсальное (Versatile S): возможность наносить рубящий урон вместо колющего.

    • Критический эффект: цель становится Застигнутой врасплох (Off-Guard) до начала
    вашего следующего хода.'
- name: Длинный меч Доблести
  type: weapon
  description: 'Природная атака: Длинный меч Доблести.'
- name: Хитрое действие (Cunning Action)
  type: feat
  description: Бонусным действием совершает Рывок, Отход или Засаду.
- name: Сопротивление магии
  type: feat
  description: 'Существо совершает с преимуществом спасброски от заклинаний и других
    магических эффектов. В оригинале (AD&D 2e): сопротивление магии 80%.'
- name: Скрытая атака (4d6)
  type: feat
  description: Наносит дополнительный урон 14 (4d6), если атакует с преимуществом.
- name: Легендарное сопротивление (3/день)
  type: feat
  description: Если существо проваливает спасбросок, оно может вместо этого сделать
    спасбросок успешным.
- name: Легендарные действия (3/раунд)
  type: feat
  description: 'Существо может совершить 3 легендарных действия на выбор в конце хода
    другого существа: Атака (1 действие), Перемещение без провокации атак (1 действие),
    Мощное заклинание/Всплеск (2 действия).'
