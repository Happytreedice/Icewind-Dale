actions:
- name: Свечение
  type: feat
  description: Скелет излучает @UUID[Compendium.dnd5e.srd-actions.Item.EvGCMCVp1VpUtCbI]{яркий
    свет} в радиусе 10 футов и @UUID[Compendium.dnd5e.srd-actions.Item.BbWvc4m610EHv070]{тусклый
    } еще на 10 футов.
- name: Иммунитет к заклинаниям
  type: feat
  description: 'На существо не действуют заклинания: Облако-убийца (Cloudkill), Ядовитое
    облако (Poison Fog).'
- name: Безмозглость
  type: feat
  description: 'Существо лишено разума: оно иммунно к состояниям Очарованный и Испуганный,
    а также к эффектам, читающим мысли или влияющим на разум (Смятение, Удержание
    личности, Сон, Устрашение).'
- name: Иммунитет к урону
  type: feat
  description: 'Существо не получает урон следующих видов: яд, огонь, холод.'
- name: Раскалённое оружие
  type: feat
  description: Когда скелет попадает металлическим оружием ближнего боя, это оружие
    наносит дополнительно 3 ([[/r 1d6]]) урона огнем (включено в атаку).
- name: Удар
  type: weapon
  description: 'Природная атака: Удар.'
- name: Поджог
  type: feat
  description: Скелет бросается на существо крупного или меньшего @UUID[Compendium.dnd5e.srd-actions.Item.sDPntYBdmN7jMZc6]{размера}
    в радиусе 5 футов от него. Цель должна преуспеть в испытании Ловкости СЛ 12 или
    будет захвачена (СЛ освобождения 12). При провале цель также получает 3 ([[/r
    1d6]]) урона огнем в начале каждого из своих ходов, даже после окончания захвата.
    Если цель или существо в радиусе 5 футов от нее использует действие, чтобы потушить
    пламя, или если какой-либо другой эффект гасит пламя (например, цель погружается
    в воду), эффект заканчивается.
- name: Мультиатака
  type: feat
  description: Существо совершает две атаки Ударом.
- name: Иммунитет к состояниям
  type: feat
  description: 'Существо иммунно к состояниям: Очарованный, Отравленный, Парализованный,
    Бессознательный, Истощение.'
spells:
