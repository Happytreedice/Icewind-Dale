  type: feat
  description: 'На существо не действуют заклинания: Облако-убийца (Cloudkill), Ядовитое
    облако (Poison Fog).'
- name: Мультиатака
  type: feat
  description: 'Существо совершает две атаки: одну Укусом и одну Когтями.'
- name: Укус
  type: weapon
  description: 'Природная атака: Укус.'
- name: Иммунитет к состояниям
  type: feat
  description: 'Существо иммунно к состояниям: Отравленный.'
- name: Иммунитет к урону
  type: feat
  description: 'Существо не получает урон следующих видов: яд, огонь, холод.'
- name: Сопротивление магии
  type: feat
  description: 'Существо совершает с преимуществом спасброски от заклинаний и других
    магических эффектов. В оригинале (AD&D 2e): сопротивление магии 25%.'
- name: Когти
  type: weapon
  description: 'Природная атака: Когти.'
- name: Призыв подкрепления
  type: feat
  description: Действием существо призывает на помощь союзников (в оригинале — жезл
    призыва монстров). Мастер выбирает 1d3 существ того же вида с показателем опасности
    не выше половины показателя призывателя; они появляются в свободных пространствах
    в 30 футах и действуют на своём ходу. Используется 1 раз в день.
