actions:
- name: Ниндзято +1 [Ninjatō +1]
  type: weapon
  description: "Сайто Кагидзу, или «Кот Востока», как звали его воры Аткатлы, привёз\
    \ с собой в Фаэрун несколько таких мечей ниндзя. Они были из его личного собрания\
    \ — ниндзято, которые он либо «коллекционировал» у соперников, либо создавал сам.\
    \ После его смерти его любовница раздарила мечи другим своим возлюбленным — все\
    \ они и сами были могущественными ворами.\nТочность: Оружие ближнего боя, бонус\
    \ +1 к атаке и урону.\nSaito Kagizu, or \"Cat of the East\" as the thieves of\
    \ Athkatla called him, brought several of these ninja swords with him when he\
    \ arrived in Faerûn. They were part of his personal collection, ninjatō that he\
    \ either \"collected\" from rivals or designed himself. When he died, his mistress\
    \ gave away the swords to her other lovers, all of them powerful thieves in their\
    \ own right.\nSTATISTICS:\nTHAC0: +1\nDamage: 1d8+1 (slashing)\nSpeed Factor:\
    \ 3\nProficiency Type: Scimitar/Wakizashi/Ninjatō\nType: One-handed\nRequires:\n\
    \ 6 Strength\nWeight: 4\nСвойства ниндзято (PF2e): 1d6 рубящий, фехтовальное (Finesse),\
    \ лёгкое (Light).\n• Быстрое (Agile / Nick): атака второй рукой в рамках действия\
    \ Атака.\n• Удар в спину (Backstabber): +1 точечного урона (+2 для оружия +3..+5)\
    \ по целям в состоянии Off-Guard.\n• Скрытное ношение (Concealable): преимущество\
    \ на проверки скрытности при спрятывании оружия в одежде."
- name: Заряженный боевой топор +2 [Charged Battle Axe +2]
  type: weapon
  description: 'Помимо превосходной работы мастера, по всей поверхности видны выгравированные
    крошечные руны силы. Очевидно, что на создание этой вещи ушло немало времени и
    труда, и, хотя это заметно не сразу, от рун исходит слабое синее свечение.

    Точность: Оружие ближнего боя, бонус +2 к атаке и урону.

    Дополнительный урон: Наносит дополнительно [[/damage 1d6 lightning]] при каждом
    попадании.

    Оглушение: При попадании цель должна преуспеть в спасброске Телосложения [[/save
    ability=con]], иначе она Ошеломлена до конца своего следующего хода.

    Этот топор не только великолепно сделан — он украшен крохотными рунами силы по
    всей поверхности. Даже трудно представить, сколько времени и труда ушло на изготовление
    такой вещи. От рун исходит слабое голубое свечение.'
- name: Мультиатака
  type: feat
  description: Существо совершает две атаки Ниндзято +1 или Заряженным боевым топором
    +2.
- name: Иммунитет к состояниям
  type: feat
  description: 'Существо иммунно к состояниям: Парализованный.'
