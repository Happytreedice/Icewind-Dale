actions:
- name: Атака в броске [Throw Attack]
  type: feat
  description: Если минотавр переместится как минимум на 10 футов по прямой к цели,
    а затем в том же ходу попадёт по ней атакой Бодания, цель получает от атаки дополнительный
    9 (2d8) колющего урона. Если цель — существо, она должна преуспеть в спасброске
    Силы со Сл 14, иначе будет оттолкнута на расстояние до 10 футов и сбита с ног.
- name: Запоминание пути [Labyrinthine Recall]
  type: feat
  description: Минотавр может с лёгкостью вспомнить любой пройдённый путь.
- name: Безрассудство [Reckless]
  type: feat
  description: В начале своего хода минотавр может решить, что в этом ходу все рукопашные
    атаки оружием будет совершать с преимуществом, но в этом случае до начала его
    следующего хода все броски атаки по нему тоже будут совершаться с преимуществом.
- name: Секира
  type: weapon
  description: 'Рукопашная атака оружием: +6 к попаданию, досягаемость 5 фт., одна
    цель. Попадание: 17 (2d12 + 4) рубящего урона.'
- name: Бодание [Gore]
  type: weapon
  description: 'Рукопашная атака оружием: +6 к попаданию, досягаемость 5 фт., одна
    цель. Попадание: 13 (2d8 + 4) колющего урона.'
