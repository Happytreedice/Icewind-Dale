actions:
- name: Праща +1 [Sling +1]
  type: weapon
  description: 'Пращи существуют с начала письменной истории. Простейшая праща — кожаный
    или тканевый ремень с карманом для снаряда; эта, впрочем, наделена небольшими
    чарами. Оружие держат за оба конца ремня и раскручивают над головой. Набрав скорость,
    снаряд выпускают, отпуская один из концов ремня.

    Точность: Оружие дальнего боя, бонус +1 к атаке и урону.

    Пращи известны с древнейших времен. Праща обычно представляет собой ремешок из
    кожи или ткани, снабженный кармашком, который удерживает снаряд. Пращу берут рукой
    за оба конца ремешка и раскручивают над головой. Добившись максимальной скорости
    вращения, один из концов отпускают, метая снаряд.'
- name: 'Моргенштерн +4: Защитник [Morning Star +4: Defender]'
  type: weapon
  description: 'Моргенштерн — это деревянное древко, увенчанное металлической головкой
    в шипастой железной оболочке. Общая длина моргенштерна — около четырёх футов.
    Этот экземпляр снабжён золотой головкой, магически усиленной, чтобы улучшить боевые
    качества и избавиться от мягкости золота.

    Точность: Оружие ближнего боя, бонус +4 к атаке и урону.

    Защитник: Пока моргенштерн у вас в руке, вы получаете +2 к КД, +1 ко всем спасброскам,
    а также сопротивление рубящему и колющему урону.

    Моргенштерн, или утренняя звезда, состоит из деревянной рукояти и металлического
    навершия с шипами. Общая длина оружия — около 4 футов. Навершие этого моргенштерна
    сделано из золота и зачаровано, чтобы избежать деформации драгоценного металла
    и увеличить эффективность оружия.'
