actions:
- name: Невосприимчивость к оружию слабее +2
  type: feat
  description: Существо получает урон только от магического оружия с бонусом не ниже
    +2. Атаки обычным оружием и оружием +1 не наносят ему урона.
- name: Невосприимчивость к немагическому оружию
  type: feat
  description: Существо не получает урон от немагических атак.
- name: Длинный меч +1 [Long Sword +1]
  type: weapon
  description: 'Такие мечи обычно называют обоюдоострыми, боевыми или военными мечами.
    Во многих случаях длинный меч имеет одностороннюю заточку. Единого образца длинного
    меча не существует: устройство и длина меняются от культуры к культуре и даже
    внутри одной культуры в зависимости от эпохи. Общая черта почти всех длинных мечей
    — длина от тридцати пяти до сорока семи дюймов; в последнем случае на клинок приходится
    сорок дюймов общей длины. У большинства длинных мечей обоюдоострый клинок и острый
    кончик, но, несмотря на остриё, длинный меч предназначен для рубящих, а не колющих
    ударов.

    Точность: Оружие ближнего боя, бонус +1 к атаке и урону.

    Такие мечи обычно называют военными, солдатскими или обоюдоострыми, хотя нередко
    встречаются и длинные мечи, заточенные лишь с одной стороны. Существует множество
    форм и вариантов длинного меча, его конструкция и размеры различаются в зависимости
    от культуры и времени изготовления. Длина таких мечей обычно от 35 до 47 дюймов
    (в последнем случает длина самого клинка достигает 40 дюймов). Большинство длинных
    мечей — обоюдоострые; часто они имеют острый конец, но предназначены всё же для
    рубящих, а не колющих ударов.'
- name: Иммунитет к урону
  type: feat
  description: 'Существо не получает урон следующих видов: огонь, яд.'
- name: Сопротивление урону
  type: feat
  description: 'Существо получает лишь половину урона следующих видов: электричество,
    дробящий, колющий, рубящий (от немагических атак).'
- name: Призыв подкрепления
  type: feat
  description: Действием существо призывает на помощь союзников (в оригинале — жезл
    призыва монстров). Мастер выбирает 1d3 существ того же вида с показателем опасности
    не выше половины показателя призывателя; они появляются в свободных пространствах
    в 30 футах и действуют на своём ходу. Используется 1 раз в день.
- name: Иммунитет к состояниям
  type: feat
  description: 'Существо иммунно к состояниям: Отравленный, Парализованный, Бессознательный.'
- name: Сопротивление магии
  type: feat
  description: 'Существо совершает с преимуществом спасброски от заклинаний и других
    магических эффектов. В оригинале (AD&D 2e): сопротивление магии 25%. (преодолевается
    магическим оружием).'
- name: Видит невидимое
  type: feat
  description: Существо видит невидимых существ и предметы в пределах своего зрения,
    как если бы они были видимы, и не поддаётся иллюзиям невидимости.
- name: Иммунитет к заклинаниям
  type: feat
  description: 'На существо не действуют заклинания: Облако-убийца (Cloudkill), Ядовитое
    облако (Poison Fog).'
- name: Иммунитеты конструкта
  type: feat
  description: Существо иммунно к яду, болезням, психическому урону и состояниям Очарованный,
    Испуганный, Парализованный, Окаменевший, Отравленный и Истощение. Ему не нужны
    воздух, пища, питьё и сон.
