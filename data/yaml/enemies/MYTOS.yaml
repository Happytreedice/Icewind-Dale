actions:
- name: Боевой молот +1 [War Hammer +1]
  type: weapon
  description: 'Как и другие боевые молоты, этот целиком сделан из стали: крушащий
    кости боёк насажен на восемнадцатидюймовую рукоять. Вдобавок он наделён несколькими
    магическими свойствами, делающими его более действенным в бою.

    Точность: Оружие ближнего боя, бонус +1 к атаке и урону.

    Боевые молоты обыкновенно изготавливают целиком из стали; этот молот — не исключение.
    На 18-дюймовой рукояти укреплен боек, которым можно дробить кости. Волшебные свойства
    этого молота весьма полезны в бою.'
- name: Иммунитет к заклинаниям
  type: feat
  description: 'На существо не действуют заклинания: Облако-убийца (Cloudkill), Ядовитое
    облако (Poison Fog).'
- name: Иммунитет к состояниям
  type: feat
  description: 'Существо иммунно к состояниям: Очарованный, Отравленный, Парализованный,
    Бессознательный, Истощение.'
- name: Иммунитет к урону
  type: feat
  description: 'Существо не получает урон следующих видов: холод, яд, электричество.'
- name: Иммунитеты нежити
  type: feat
  description: Существо не нуждается в воздухе, пище, питье и сне. Оно иммунно к яду
    и болезням, к состояниям Отравленный и Истощение, к магическому сну, очарованию
    и удержанию (парализации).
