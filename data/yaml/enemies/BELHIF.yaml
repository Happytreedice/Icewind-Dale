- name: Пламенный великий меч Белхифета
  type: weapon
  description: 'Природная атака: Пламенный великий меч Белхифета.'
- name: Иммунитет к урону
  type: feat
  description: 'Существо не получает урон следующих видов: огонь, яд.'
- name: Мультиатака
  type: feat
  description: 'Существо совершает четыре атаки: две Хвостом Дьявола, одну Пламенным
    великим мечом Белхифета и одну Булавой сокрушения.'
- name: Булава сокрушения
  type: weapon
  description: 'Природная атака: Булава сокрушения.'
- name: Сопротивление урону
  type: feat
  description: 'Существо получает лишь половину урона следующих видов: рубящий, холод,
    колющий, дробящий (от немагических атак).'
- name: Иммунитет к состояниям
  type: feat
  description: 'Существо иммунно к состояниям: Очарованный, Отравленный, Бессознательный,
    Испуганный.'
- name: Несокрушимость (минимум 1 хит)
  type: feat
  description: 'Хиты существа не могут опуститься ниже 1 от обычного урона: его нельзя
    убить, пока не выполнено сюжетное условие. Мастер снимает эту особенность, когда
    условие выполнено.'
- name: Иммунитет к заклинаниям
  type: feat
  description: 'На существо не действуют заклинания: Облако-убийца (Cloudkill), Ядовитое
    облако (Poison Fog).'
- name: Скрытые свойства движка
  type: feat
  description: 'Скрытые предметы движка Infinity Engine без описания в оригинале:
    BRING, BEHAMU. В игре они задавали невидимые иммунитеты и модификаторы существа;
    в D&D 5e их эффект учтён в блоке характеристик (иммунитеты, сопротивления, особенности)
    и отдельного действия не требует.'
- name: Сопротивление магии
  type: feat
  description: 'Существо совершает с преимуществом спасброски от заклинаний и других
    магических эффектов. Существо совершает с преимуществом спасброски от заклинаний
    и других магических эффектов. В оригинале (AD&D 2e): сопротивление магии 50%.
    (преодолевается магическим оружием).'
- name: Магическое оружие
  type: feat
  description: Атаки Белхифета считаются магическими.
- name: Регенерация
  type: feat
  description: Восстанавливает 15 хитов в начале каждого своего хода, если не получал
    урон излучением.
- name: Аура страха (Fear Aura)
  type: feat
  description: Любое враждебное существо в пределах 20 футов должно пройти спасбросок
    Мудрости Сл 19 или стать испуганным на 1 минуту.
- name: Невосприимчивость к немагическому оружию
  type: feat
  description: Существо не получает урон от немагических атак.
- name: Легендарное сопротивление (3/день)
  type: feat
  description: Если существо проваливает спасбросок, оно может вместо этого сделать
    спасбросок успешным.
- name: Легендарные действия (3/раунд)
  type: feat
  description: 'Существо может совершить 3 легендарных действия на выбор в конце хода
    другого существа: Атака (1 действие), Перемещение без провокации атак (1 действие),
    Мощное заклинание/Всплеск (2 действия).'
