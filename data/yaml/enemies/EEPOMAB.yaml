    облако (Poison Fog).'
- name: Иммунитет к урону
  type: feat
  description: 'Существо не получает урон следующих видов: огонь, электричество, яд,
    холод, кислота.'
- name: Удар
  type: weapon
  description: 'Природная атака: Удар.'
- name: Обнаружение иллюзий
  type: feat
  description: Действием существо развеивает все иллюзии в пределах 30 футов (как
    заклинание Обнаружить иллюзию). Используется 1 раз в день.
- name: Несокрушимость (минимум 1 хит)
  type: feat
  description: 'Хиты существа не могут опуститься ниже 1 от обычного урона: его нельзя
    убить, пока не выполнено сюжетное условие. Мастер снимает эту особенность, когда
    условие выполнено.'
