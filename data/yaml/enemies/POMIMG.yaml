actions:
- name: Несокрушимость (минимум 1 хит)
  type: feat
  description: 'Хиты существа не могут опуститься ниже 1 от обычного урона: его нельзя
    убить, пока не выполнено сюжетное условие. Мастер снимает эту особенность, когда
    условие выполнено.'
- name: Иммунитет к состояниям
  type: feat
  description: 'Существо иммунно к состояниям: Очарованный, Отравленный, Парализованный,
    Бессознательный.'
- name: Иммунитет к урону
  type: feat
  description: 'Существо не получает урон следующих видов: огонь, электричество, яд,
    холод, кислота.'
- name: Молния (жезл)
  type: feat
  description: 'Действием существо выпускает разряд молнии линией 100 футов длиной
    и 5 футов шириной: каждое существо на линии совершает спасбросок Ловкости СЛ 15,
    получая [[/damage 6d6 lightning]] урона электричеством при провале или половину
    при успехе. Используется 3 раза в день.'
- name: Скрытые свойства движка
  type: feat
  description: 'Скрытые предметы движка Infinity Engine без описания в оригинале:
    WAND4CA. В игре они задавали невидимые иммунитеты и модификаторы существа; в D&D
    5e их эффект учтён в блоке характеристик (иммунитеты, сопротивления, особенности)
    и отдельного действия не требует.'
- name: Удар
  type: weapon
  description: 'Природная атака: Удар.'
- name: Сопротивление магии
  type: feat
  description: 'Существо совершает с преимуществом спасброски от заклинаний и других
    магических эффектов. В оригинале (AD&D 2e): сопротивление магии 100%.'
- name: Иммунитет к заклинаниям
  type: feat
  description: 'На существо не действуют заклинания: Облако-убийца (Cloudkill), Ядовитое
    облако (Poison Fog).'
- name: Обнаружение иллюзий
  type: feat
  description: Действием существо развеивает все иллюзии в пределах 30 футов (как
    заклинание Обнаружить иллюзию). Используется 1 раз в день.
