actions:
- name: Кинжал мага +4 [Mage Dagger +4]
  type: weapon
  description: 'Как и большинство обычных кинжалов, этот кинжал имеет заострённый
    обоюдоострый клинок. Кроме того, он наделён магическими свойствами, которые сделали
    его ещё полезнее.

    Точность: Оружие ближнего боя, бонус +4 к атаке и урону.

    Обережные чары: Вы получаете бонус +3 к спасброскам, вызванным эффектами типа
    «Заклинание».

    Защитные чары: Пока кинжал у вас, вы получаете +2 к КД.

    Запас заклинаний: Пока кинжал у вас, вы можете сотворить по одному дополнительному
    заклинанию волшебника 1-го, 2-го и 3-го уровня между Длинными отдыхами, как если
    бы у вас была одна дополнительная ячейка каждого из этих уровней.

    У этого кинжала, как и у большинства других, заостренное лезвие, заточенное с
    обеих сторон. Также он обладает некоторыми магическими свойствами и поэтому более
    эффективен в бою.'
