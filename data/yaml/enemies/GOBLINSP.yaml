actions:
- name: Мультиатака
  type: feat
  description: Босс гоблинов совершает две атаки скимитаром. Вместо одной атаки скимитаром он может совершить одну дистанционную атаку пилумом.
- name: Скимитар
  type: weapon
  description: 'Рукопашная атака оружием: +4 к попаданию, досягаемость 5 фт., одна цель. Попадание: 5 (1d6 + 2) рубящего урона.'
- name: Пилум
  type: weapon
  description: 'Рукопашная или дальнобойная атака оружием: +4 к попаданию, досягаемость 5 фт. или дистанция 30/120 фт., одна цель. Попадание: 5 (1d6 + 2) колющего урона.'
- name: Проворное бегство
  type: feat
  description: Гоблин может в каждом своём ходу бонусным действием совершать действие Засада или Отход.
- name: Перенаправление атаки
  type: feat
  description: Если видимое гоблином существо нацеливается атакой на него, гоблин выбирает другого гоблина в пределах 5 фт. от себя. Два гоблина меняются местами, и целью атаки становится выбранный гоблин.
