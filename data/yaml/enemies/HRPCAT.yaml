- name: Дубина [Greatclub]
  type: weapon
  description: 'Рукопашная атака оружием: +3 к попаданию, досягаемость 5 фт., одна
    цель. Попадание: 3 (1d4 + 1) дробящего урона.'
- name: Манящая песня
  type: weapon
  description: 'Гарпия начинает петь магическую мелодию. Все гуманоиды и великаны
    в пределах 300 футов от гарпии, слышащие песню, должны преуспеть в спасброске
    Мудрости со Сл 11, иначе они станут очарованными до окончания песни. Гарпия может
    продолжать петь в следующих раундах бонусным действием. Она может прекратить петь
    в любое время. Песня оканчивается, если гарпия становится недееспособной.

    Будучи очарованной гарпией, цель недееспособна и игнорирует песни других гарпий.
    Если очарованная цель находится более чем в 5 футах от гарпии, цель должна в свой
    ход переместиться к гарпии кратчайшим маршрутом. Она не избегает провоцированных
    атак, но перед вхождением в опасную местность, такую как лава или яма, а также
    при получении урона из любого источника кроме этой гарпии цель может повторять
    спасбросок. Существо также может повторять спасбросок в конце каждого своего хода.
    Если спасбросок существа был успешным, эффект на нём прекращается. Успешно спасшаяся
    цель получает иммунитет к песне этой гарпии на следующие 24 часа.'
