actions:
- name: Убийца +5 [Slayer +5]
  type: weapon
  description: 'Падший паладин по прозвищу Маттейн «Чёрный Дозор» убил этим оружием
    сто одного рыцаря своего бывшего короля. Род Маттейна, Чемберлены, издавна давал
    миру паладинов Тира. Отец Маттейна, Гарлан, сразил могущественного верховного
    жреца Бэйна, грозившего королевству. Злая магия вернула жреца из мёртвых. Этот
    жрец, прозванный «Призраком Чемберленов», проклял род: пока его не умилостивят,
    в семье будут рождаться только мертворождённые дети. Маттейн, наследник рода,
    взялся снять проклятие. Призрак Чемберленов объявил: он должен убить сто одного
    королевского рыцаря.

    Точность: Оружие ближнего боя, бонус +5 к атаке и урону.

    Падший паладин Маттайн Чемберлен по прозвищу Черный Страж убил этим копьем сто
    одного рыцаря короля, которому прежде служил. Из семейства Чемберлен вышло множество
    паладинов Тира. Отец Маттайна, Гарлан, убил могущественного верховного жреца Бэйна,
    угрожавшего безопасности всего королевства. Черная магия жреца позволила ему восстать
    из мертвых. Его прозвали Призраком Чемберленов. Жрец проклял весь род Чемберленов
    — отныне их дети появлялись на свет только мертвыми. Чтобы снять проклятие, нужно
    было искупить вину Чемберленов перед ним, и Маттайн, наследник рода, вызвался
    сделать это. Призрак велел паладину убить сотню и еще одного рыцаря короля.

    Маттайн принялся за свое печальное дело, убивая каждого рыцаря, которого встречал.
    Череп и щит убитого он приносил призраку, как доказательство. Король посылал против
    Маттайна рыцарей и героев целыми отрядами, но падший паладин всякий раз побеждал
    их. Три года он истреблял рыцарей, и число его жертв достигло сотни. Он сказал
    Призраку Чемберленов, что пора снять проклятие, но тот напомнил, что приказал
    убить сотню рыцарей и еще одного.

    Обуреваемый виной и раскаянием, Маттайн кивнул и тут же бросился на собственное
    копье. Теперь, когда Маттайн и Гарлан были мертвы, а требование призрака выполнено
    в точности, проклятие было снято; дух со страшным криком полетел в Ахерон на зов
    Бэйна.'
- name: Мультиатака
  type: feat
  description: Существо совершает три атаки Убийцей +5.
- name: Иммунитет к урону
  type: feat
  description: 'Существо не получает урон следующих видов: огонь, холод.'
- name: Скрытые свойства движка
  type: feat
  description: 'Скрытые предметы движка Infinity Engine без описания в оригинале:
    SALSHIK. В игре они задавали невидимые иммунитеты и модификаторы существа; в D&D
    5e их эффект учтён в блоке характеристик (иммунитеты, сопротивления, особенности)
    и отдельного действия не требует.'
- name: Пламенная аура
  type: feat
  description: Существо, касающееся саламандры или попадающее по ней рукопашной атакой,
    находясь в 5 футах от неё, получает [[/damage 1d6 fire]] урона огнём.
- name: Легендарное сопротивление (3/день)
  type: feat
  description: Если существо проваливает спасбросок, оно может вместо этого сделать
    спасбросок успешным.
- name: Легендарные действия (3/раунд)
  type: feat
  description: 'Существо может совершить 3 легендарных действия на выбор в конце хода
    другого существа: Атака (1 действие), Перемещение без провокации атак (1 действие),
    Мощное заклинание/Всплеск (2 действия).'
