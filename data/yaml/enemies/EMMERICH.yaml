actions:
- name: Невосприимчивость к немагическому оружию
  type: feat
  description: Существо не получает урон от немагических атак.
- name: Мультиатака
  type: feat
  description: 'Существо совершает три атаки Превосходным длинным мечом или три атаки
    Длинным луком +4: Молот.'
- name: Превосходный длинный меч [Finest Long Sword]
  type: weapon
  description: 'Такие мечи обычно называют обоюдоострыми, боевыми или военными мечами.
    Во многих случаях длинный меч имеет одностороннюю заточку. Единого образца длинного
    меча не существует: устройство и длина меняются от культуры к культуре и даже
    внутри одной культуры в зависимости от эпохи. Общая черта почти всех длинных мечей
    — длина от тридцати пяти до сорока семи дюймов; в последнем случае на клинок приходится
    сорок дюймов общей длины. У большинства длинных мечей обоюдоострый клинок и острый
    кончик, но, несмотря на остриё, длинный меч предназначен для рубящих, а не колющих
    ударов.

    Меткость: Благодаря качеству изготовления это оружие даёт бонус +2 к броскам атаки.

    Такие мечи обычно называют военными, солдатскими или обоюдоострыми, хотя нередко
    встречаются и длинные мечи, заточенные лишь с одной стороны. Существует множество
    форм и вариантов длинного меча, его конструкция и размеры различаются в зависимости
    от культуры и времени изготовления. Длина таких мечей обычно от 35 до 47 дюймов
    (в последнем случает длина самого клинка достигает 40 дюймов). Большинство длинных
    мечей — обоюдоострые; часто они имеют острый конец, но предназначены все же для
    рубящих, а не колющих ударов.'
- name: 'Длинный лук +4: Молот [Longbow +4: Hammer]'
  type: weapon
  description: 'Длинный лук похож на короткий, но его древко почти в рост лучника
    — обычно шесть — шесть с половиной футов. Он бьёт дальше и точнее короткого лука,
    хотя и медленнее. Этот экземпляр усилен магическими свойствами, придающими ему
    ауру совершенства.

    Точность: Оружие дальнего боя, бонус +4 к атаке и урону.

    Меткость: Благодаря качеству изготовления это оружие даёт бонус +1 к броскам атаки.

    Быстрое: Когда вы совершаете дополнительную атаку, можете совершить её не Бонусным
    действием, а частью действия Атака. Вы можете совершить эту дополнительную атаку
    только один раз за ход.

    Длинный лук устроен так же, как короткий, с той лишь разницей, что в длину примерно
    равен росту лучника (от 6 до 6,5 футов). Его преимущества над коротким луком —
    большая дальность и точность стрельбы, хотя он немного медленнее. Этот лук усовершенствован
    с помощью магии.'
- name: Сопротивление магии
  type: feat
  description: 'Существо совершает с преимуществом спасброски от заклинаний и других
    магических эффектов. В оригинале (AD&D 2e): сопротивление магии 50%. (преодолевается
    магическим оружием).'
- name: Сопротивление урону
  type: feat
  description: 'Существо получает лишь половину урона следующих видов: дробящий, колющий,
    рубящий (от немагических атак).'
