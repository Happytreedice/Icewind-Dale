actions:
- name: Боевой топор
  type: weapon
- name: Невосприимчивость к оружию слабее +2
  type: feat
  description: Существо получает урон только от магического оружия с бонусом не ниже
    +2. Атаки обычным оружием и оружием +1 не наносят ему урона.
- name: Сопротивление магии
  type: feat
  description: 'Существо совершает с преимуществом спасброски от заклинаний и других
    магических эффектов. В оригинале (AD&D 2e): сопротивление магии 25%. (преодолевается
    магическим оружием).'
- name: Видит невидимое
  type: feat
  description: Существо видит невидимых существ и предметы в пределах своего зрения,
    как если бы они были видимы, и не поддаётся иллюзиям невидимости.
- name: Иммунитет к урону
  type: feat
  description: 'Существо не получает урон следующих видов: огонь, яд.'
- name: Мультиатака
  type: feat
  description: Существо совершает четыре атаки Боевым топором.
- name: Невосприимчивость к немагическому оружию
  type: feat
  description: Существо не получает урон от немагических атак.
- name: Сопротивление урону
  type: feat
  description: 'Существо получает лишь половину урона следующих видов: электричество,
    дробящий, колющий, рубящий (от немагических атак).'
- name: Иммунитет к состояниям
  type: feat
  description: 'Существо иммунно к состояниям: Отравленный, Парализованный, Бессознательный.'
- name: Иммунитет к заклинаниям
  type: feat
  description: 'На существо не действуют заклинания: Облако-убийца (Cloudkill), Ядовитое
    облако (Poison Fog).'
- name: Иммунитеты конструкта
  type: feat
  description: Существо иммунно к яду, болезням, психическому урону и состояниям Очарованный,
    Испуганный, Парализованный, Окаменевший, Отравленный и Истощение. Ему не нужны
    воздух, пища, питьё и сон.
