actions:
- name: Иммунитет к состояниям
  type: feat
  description: 'Существо иммунно к состояниям: Очарованный, Отравленный, Парализованный,
    Бессознательный, Истощение.'
- name: Природа тени
  type: feat
  description: 'Существо сотворено из тьмы: оно иммунно к яду и состояниям Очарованный,
    Испуганный, Истощение, Схваченный, Парализованный, Окаменевший, Отравленный. На
    прямом солнечном свете оно совершает броски атаки с помехой.'
- name: Иммунитет к заклинаниям
  type: feat
  description: 'На существо не действуют заклинания: Облако-убийца (Cloudkill), Ядовитое
    облако (Poison Fog).'
- name: Боевой топор +2 [Battle Axe +2]
  type: weapon
  description: 'Боевой топор +2: Отголоски Глубин Дорна. Среди множества оружия, откованного
    в тени Хребта Мира, немало клинков несёт клеймо дварфийских кузнецов. Этот великолепный
    боевой топор — не исключение. Его сталь и баланс — свидетельство труда заботливого
    оружейника, а по лезвию вплетены чары, позволяющие ранить даже сверхъестественных
    существ. Как и многое оружие дварфийской работы, клинок лёгок, что ускоряет замах,
    а никогда не тупящаяся кромка делает каждый разрез чистым. Дварфийские руны вдоль
    рукояти складываются в слово «Дорна» — несомненно, клеймо кузнеца, указывающее
    место изготовления.

    Точность: Оружие ближнего боя, бонус +2 к атаке и урону.

    Боевой топор +2: Отголоски Пещер Дорна

    Некоторое оружие, выкованное в тени Хребта Мира, украшено знаками кузниц дворфов.
    Таков и этот чудесный боевой топор. Качество стали и баланс говорят о выдающемся
    мастерстве кузнеца, а лезвие топора зачаровано, позволяя наносить этим оружием
    раны даже сверхъестественным созданиям. Как у многих топоров работы дворфов, лезвие
    у него очень легкое, что позволяет быстро им размахивать, а кромка, никогда не
    затупляющаяся, каждый раз обеспечивает идеальный и чистый удар. На рукояти рунами
    дворфов написано «Дорн» — без сомнения, это знак кузницы, где было изготовлено
    оружие.'
- name: Иммунитет к урону
  type: feat
  description: 'Существо не получает урон следующих видов: холод, яд.'
- name: Мультиатака
  type: feat
  description: Существо совершает две атаки Боевым топором +2.
- name: Иммунитеты нежити
  type: feat
  description: Существо не нуждается в воздухе, пище, питье и сне. Оно иммунно к яду
    и болезням, к состояниям Отравленный и Истощение, к магическому сну, очарованию
    и удержанию (парализации).
