actions:
- name: Водяное тело [Water Form]
  type: feat
  description: Элементаль может входить в пространство враждебных существ и останавливаться
    там. Он может перемещаться сквозь пространство шириной в 1 дюйм без протискивания.
- name: Замерзание
  type: feat
  description: Если элементаль получает урон холодом, он частично замерзает; его скорость
    уменьшается на 20 футов до конца его следующего хода.
- name: Мультиатака [Multiattack]
  type: feat
  description: Элементаль совершает два Размашистых удара.
- name: Размашистый удар
  type: weapon
  description: 'Рукопашная атака оружием: +7 к попаданию, досягаемость 5 фт., одна
    цель. Попадание: 13 (2d8 + 4) дробящего урона.'
- name: Захлёст (перезарядка 4–6)
  type: weapon
  description: 'Все существа в пространстве элементаля должны совершить спасбросок
    Силы со Сл 15. При провале цель получает 13 (2d8 + 4) дробящего урона. Если размер
    цели не больше Большого, схваченной (Сл высвобождения 14). Пока цель схвачена,
    она она также становится опутана и не может дышать, если только не может дышать
    под водой. Если спасбросок был успешным, цель выталкивается из пространства элементаля.

    Элементаль может одновременно держать в захвате одно существо Большого размера
    или до двух существ Среднего размера. В начале каждого хода элементаля каждая
    схваченная им цель получает 13 (2d8 + 4) дробящего урона. Существо, находящееся
    в пределах 5 футов от элементаля, может вытянуть существо или предмет, если совершит
    Действием проверку Силы со Сл 14 и преуспеет.'
