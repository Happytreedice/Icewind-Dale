actions:
- name: Широкий меч Эревейна +2 [Erevain's Broad Sword +2]
  type: weapon
  description: 'Этот палаш принадлежал Эревейну Чёрному Снопу, странствующему эльфу
    из Эверески. Его сделали в 1221 году ЛД эверескские Серые Плащи. Меч Эревейна
    был необычен для его народа, обычно предпочитающего клинки полегче.

    Точность: Оружие ближнего боя, бонус +2 к атаке и урону.

    Обережные чары: Вы получаете бонус +2 к спасброскам, против эффектов волшебных
    палочек и жезлов.

    Сопротивление кислоте: Пока это оружие у вас в руках, вы имеете сопротивление
    урону кислотой.

    Этот меч принадлежал Эревейну Черному Снопу, странствующему эльфу из Эверески.
    Создали его в 1221 л.д. эверескские Серые Мантии. Меч Эревейна необычен тем, что
    обычно эльфы отдают предпочтение более легким клинкам.'
