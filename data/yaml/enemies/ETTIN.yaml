actions:
- name: Две головы
  type: feat
  description: Эттин совершает с преимуществом проверки Мудрости (Внимательность),
    а также спасброски от глухоты, испуга, лишения сознания, ослепления, очарования
    и ошеломления.
- name: Неусыпный [Wakeful]
  type: feat
  description: Когда одна голова эттина спит, другая бодрствует.
- name: Мультиатака [Multiattack]
  type: feat
  description: 'Эттин совершает две атаки: одну боевым топором и одну Моргенштерном,
    либо совершает одну атаку и использует Сокрушительный взмах.'
- name: Боевой топор [Battleaxe]
  type: weapon
  description: 'Рукопашная атака оружием: +9 к попаданию, досягаемость 10 фт., одна
    цель. Попадание: 20 (3d8 + 6) рубящего урона плюс 4 (1d8) урона холодом.'
- name: Моргенштерн [Morningstar]
  type: weapon
  description: 'Рукопашная атака оружием: +9 к попаданию, досягаемость 10 фт., одна
    цель. Попадание: 20 (3d8 + 6) колющего урона плюс 4 (1d8) урона холодом.'
- name: Сокрушительный взмах [Sweeping Knockdown]
  type: feat
  description: Перезарядка 5–6. Эттин размахивает оружием по дуге 10 фт. Каждое существо
    в пределах 10 фт. должно совершить спасбросок Силы [[/save ability=str dc=16]]
    или получить 24 (4d8 + 6) дробящего урона и упасть ничком. При успехе урон уменьшается
    наполовину, и существо не сбивается с ног.
