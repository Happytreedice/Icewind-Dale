actions:
- name: Удар
  type: weapon
  description: 'Природная атака: Удар.'
- name: Сопротивление магии
  type: feat
  description: 'Существо совершает с преимуществом спасброски от заклинаний и других
    магических эффектов. В оригинале (AD&D 2e): сопротивление магии 100%. (преодолевается
    магическим оружием).'
- name: Сопротивление урону
  type: feat
  description: 'Существо получает лишь половину урона следующих видов: дробящий, колющий,
    рубящий (от немагических атак).'
- name: Иммунитет к состояниям
  type: feat
  description: 'Существо иммунно к состояниям: Парализованный, Отравленный, Истощение.'
- name: Иммунитет к урону
  type: feat
  description: 'Существо не получает урон следующих видов: кислота, огонь, холод,
    электричество, яд.'
- name: Видит невидимое
  type: feat
  description: Существо видит невидимых существ и предметы в пределах своего зрения,
    как если бы они были видимы, и не поддаётся иллюзиям невидимости.
- name: Призыв подкрепления
  type: feat
  description: Действием существо призывает на помощь союзников (в оригинале — жезл
    призыва монстров). Мастер выбирает 1d3 существ того же вида с показателем опасности
    не выше половины показателя призывателя; они появляются в свободных пространствах
    в 30 футах и действуют на своём ходу. Используется 1 раз в день.
- name: Природа тени
  type: feat
  description: 'Существо сотворено из тьмы: оно иммунно к яду и состояниям Очарованный,
    Испуганный, Истощение, Схваченный, Парализованный, Окаменевший, Отравленный. На
    прямом солнечном свете оно совершает броски атаки с помехой.'
- name: Легендарное сопротивление (3/день)
  type: feat
  description: Если существо проваливает спасбросок, оно может вместо этого сделать
    спасбросок успешным.
- name: Легендарные действия (3/раунд)
  type: feat
  description: 'Существо может совершить 3 легендарных действия на выбор в конце хода
    другого существа: Атака (1 действие), Перемещение без провокации атак (1 действие),
    Мощное заклинание/Всплеск (2 действия).'
