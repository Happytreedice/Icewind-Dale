actions:
- name: Копье Кериша +3 [Spear of Kerish +3]
  type: weapon
  description: 'Это копьё принадлежало Керишу, надсмотрщику в залах Зуба Змея. Древко
    из тёмного дерева увенчано наконечником, зачарованным на могучие +3: им Кериш
    держал в страхе рабов и врагов, пока Глубины Дорна не пали.

    Точность: Оружие ближнего боя, бонус +3 к атаке и урону.

    Сопротивление огню: Пока это оружие у вас в руках, вы имеете сопротивление урону
    огнём.

    Ледяное жало: При попадании копьё наносит дополнительно [[/damage 1d6 cold]].

    У этого копья странная конструкция: древко сделано из неизвестного материала и
    прозрачно, словно хрусталь, а наконечник напоминает сосульку и окружен ледяной
    аурой. Всё оружие окружает легкий туман ледяных кристалликов.'
- name: Мультиатака
  type: feat
  description: Существо совершает две атаки Копьём Кериша +3.
- name: Иммунитет к урону
  type: feat
  description: 'Существо не получает урон следующих видов: огонь, холод.'
- name: Пламенная аура
  type: feat
  description: Существо, касающееся саламандры или попадающее по ней рукопашной атакой,
    находясь в 5 футах от неё, получает [[/damage 1d6 fire]] урона огнём.
- name: Легендарное сопротивление (3/день)
  type: feat
  description: Если существо проваливает спасбросок, оно может вместо этого сделать
    спасбросок успешным.
- name: Легендарные действия (3/раунд)
  type: feat
  description: 'Существо может совершить 3 легендарных действия на выбор в конце хода
    другого существа: Атака (1 действие), Перемещение без провокации атак (1 действие),
    Мощное заклинание/Всплеск (2 действия).'
