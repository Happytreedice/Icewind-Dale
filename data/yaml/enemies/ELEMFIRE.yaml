actions:
- name: Огненное тело
  type: feat
  description: 'Элементаль может перемещаться сквозь пространство шириной в 1 дюйм
    без протискивания. Существо, касающееся элементаля или попадающее по нему рукопашной
    атакой, находясь в пределах 5 футов от него, получает 5 (1d10) урона огнём.

    Кроме того, элементаль может входить в пространство враждебных существ и останавливаться
    там. Когда он впервые за ход входит в пространство существа, это существо получает
    5 (1d10) урона огнём и загорается; пока кто-нибудь не потушит огонь Действием,
    это существо получает 5 (1d10) урона огнём в начале каждого своего хода.'
- name: Свечение [Illumination]
  type: feat
  description: Элементаль испускает яркий свет в радиусе 30 футов и тусклый свет в
    пределах ещё 30 футов.
- name: Восприимчивость к воде [Water Sensitivity]
  type: feat
  description: За каждые 5 футов перемещения в воде, или за каждый вылитый на него
    галлон воды, элементаль получает 1 урона холодом.
- name: Мультиатака [Multiattack]
  type: feat
  description: Элементаль совершает две атаки Касанием.
- name: Касание [Touch]
  type: weapon
  description: 'Рукопашная атака оружием: +6 к попаданию, досягаемость 5 фт., одна
    цель. Попадание: 10 (2d6 + 3) урона огнём. Если цель — существо или горючий предмет,
    она вспыхивает. Пока какое-нибудь существо не потушит огонь действием, цель получает
    5 (1d10) урона огнём в начале каждого своего хода.'
