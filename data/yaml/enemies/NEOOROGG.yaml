  description: Существо совершает две атаки Отличным двуручным мечом.
- name: Отличный двуручный меч [High Quality Two-Handed Sword]
  type: weapon
  description: 'Двуручный меч — потомок длинного меча. Оружейники всегда искали способы
    улучшить существующее оружие. Пытаясь усовершенствовать длинный меч, они удлинили
    клинок. В конце концов пришлось удлинить и рукоять, и для правильного замаха стали
    нужны обе руки. Главное предназначение двуручных мечей — рубить конных рыцарей
    и разбивать пикейные построения.

    Меткость: Благодаря качеству изготовления это оружие даёт бонус +1 к броскам атаки.

    Двуручный меч — усиленный вариант длинного меча. Оружейники всегда искали возможность
    улучшить существующее оружие. Улучшая длинный меч, лезвие еще более удлинили.
    Пришлось увеличить и рукоятку, и для обращения с мечом теперь требовались две
    руки. Изначально двуручные мечи применялись в бою против конных рыцарей и для
    разбивания строя копьеносцев.'
