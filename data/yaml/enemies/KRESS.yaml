actions:
- name: Мультиатака
  type: feat
  description: Существо совершает две атаки, выбирая между Проклятым двуручным мечом
    Кресселака и Полуторным мечом.
- name: Иммунитет к урону
  type: feat
  description: 'Существо не получает урон следующих видов: огонь, электричество, яд,
    холод, некротическая энергия, кислота.'
- name: Проклятый двуручный меч Кресселака
  type: weapon
  description: 'Природная атака: Проклятый двуручный меч Кресселака.'
- name: Сопротивление урону
  type: feat
  description: 'Существо получает лишь половину урона следующих видов: рубящий, колющий,
    дробящий (от немагических атак).'
- name: Полуторный меч [Bastard Sword]
  type: weapon
  description: 'Меч с длинной рукоятью — на полторы руки.

    Полуторный меч, или меч-бастард, называется так потому, что представляет собой
    нечто среднее между двуручным и длинным мечом. Это обоюдоострый меч с длинной
    ручкой, который при желании можно держать двумя руками. Общая длина меча — от
    четырех футов до четырех футов десяти дюймов.

    Свойства полуторного меча: 1d8 рубящий (1 рука) / 2d4 рубящий (2 руки, универсальное
    Versatile 2d4, минимальный урон 2). Критический эффект: цель становится Застигнутой
    врасплох (Off-Guard) до начала вашего следующего хода.'
- name: Несокрушимость (минимум 1 хит)
  type: feat
  description: 'Хиты существа не могут опуститься ниже 1 от обычного урона: его нельзя
    убить, пока не выполнено сюжетное условие. Мастер снимает эту особенность, когда
    условие выполнено.'
- name: Аура ужаса (Aura of Dread)
  type: feat
  description: Враги в радиусе 10 футов совершают спасброски против страха с помехой.
- name: Сопротивление магии
  type: feat
  description: 'Существо совершает с преимуществом спасброски от заклинаний и других
    магических эффектов. В оригинале (AD&D 2e): сопротивление магии 100%. (преодолевается
    магическим оружием).'
- name: Иммунитет к состояниям
  type: feat
  description: 'Существо иммунно к состояниям: Очарованный, Испуганный, Отравленный,
    Парализованный, Истощение.'
- name: Клинок Черного Волка
  type: feat
  description: Атаки наносят дополнительно 2d8 урона холодом.
