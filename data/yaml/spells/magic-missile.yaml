description: 'Вы создаёте три светящихся стрелы из магической силы. Каждая стрела
  поражает выбранное вами существо в пределах дистанции, которое вы видите. Каждая
  стрела наносит цели [[/r 1d4 + 1]] урона силой. Все три стрелы поражают цели одновременно,
  вы можете направить их как в одно существо, так и в несколько разных. 

  На высоких кругах. Если вы сотворяете это заклинание, используя ячейку 2-го круга
  или выше, заклинание создаёт по дополнительной стреле за каждый круг ячейки выше
  1-го.'
