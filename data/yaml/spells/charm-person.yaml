description: 'Вы пытаетесь обворожить выбранного гуманоида, которого видите в пределах
  дистанции. Цель должна пройти испытание Мудрости и получает преимущество к нему,
  если вы или ваши спутники сражаются с ней. При провале цель остаётся &reference[charmed]{обворожённой}
  вами, пока длится заклинание или пока вы или ваши спутники не нанесут ей какой-либо
  вред. Обворожённое существо считает вас дружественным. Когда заклинание прекращает
  действовать, существо помнит, что было обворожено вами.

  На высоких кругах. Если вы сотворяете это заклинание, используя ячейку 2-го круга
  или выше, то можете выбрать целью одно дополнительное существо за каждый круг ячейки
  выше 1-го. Эти существа должны быть в пределах 30 футов друг от друга в момент сотворения.'
