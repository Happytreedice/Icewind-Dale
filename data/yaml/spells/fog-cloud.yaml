description: 'Вы создаёте сферу тумана радиусом 20 футов вокруг точки в пределах дистанции.
  Сфера распространяется и за углы, видимость внутри неё &reference[heavilyobscured]{крайне
  затруднёна}. Она существует, пока длится заклинание или пока её не развеет ветер
  средней или большей скорости (не менее 10 миль в час).

  На высоких кругах. Если вы сотворяете это заклинание, используя ячейку 2-го круга
  или выше, радиус облака увеличивается на 20 футов за каждый круг ячейки выше 1-го.'
