description: 'Вы призываете массу плотной липкой паутины в выбранной вами точке в
  пределах дистанции. Паутина наполняет 20-футовый куб, исходящий из этой точки, пока
  длится заклинание.

  Паутина создаёт &reference[difficultterrain]{пересечённую местность} и слегка затрудняет
  в ней видимость. Если не закрепить паутину на двух твердых поверхностях (вроде стен
  или деревьев) или не нанести ее слоями на пол, стену или потолок, паутина обвалится
  и заклинание прекратит действовать в начале вашего следующего хода. Глубина слоёв
  паутины на плоской поверхности равна 5 футам.

  Каждое существо, которое начинает свой ход в паутине или вошло в нее в свой ход,
  должно пройти испытание Ловкости. При провале существо становится &reference[restrained]{обездвиженным},
  пока находится в паутине или пока не освободится.

  &reference[restrained]{Обездвиженное} паутиной существо может потратить действие,
  чтобы пройти проверку Силы со Сл, равной СЛ испытаний против ваших заклинаний. При
  успехе оно перестаёт быть обездвиженным.

  Паутина горюча. Любой 5-футовый куб паутины, попав в огонь, сгорает за 1 раунд,
  нанося [[/r 2d4]] урона огнём любому существу, которое начнёт свой ход в нём.'
