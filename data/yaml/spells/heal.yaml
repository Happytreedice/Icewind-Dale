description: 'Выберите существо, которое видите в пределах дистанции. Его окутывает
  прилив позитивной энергии, восстанавливающий ему 70 ПЗ. Заклинание также снимает
  с цели &reference[blinded]{слепоту}, &reference[deafened]{глухоту} и любые болезни.
  Заклинание не действует на конструкции и нежить.

  На высоких кругах. Если вы сотворяете это заклинание, используя ячейку 7-го круга
  или выше, исцеление увеличивается на 10 за каждый круг ячейки выше 6-го.'
