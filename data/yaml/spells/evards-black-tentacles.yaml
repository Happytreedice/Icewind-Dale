description: 'Извивающиеся угольно-чёрные щупальца заполняют 20-футовый квадрат на
  земле в месте, которое вы видите в пределах дистанции. Пока длится заклинание, щупальца
  превращают область заклинания в &reference[difficultterrain]{пересечённую местность}.

  Существо, которое входит в область заклинания впервые за ход или начинает в ней
  свой ход, должно пройти испытание Ловкости. При провале оно получает [[/r 3d6]]
  дробящего урона и &reference[restrained]{обездвижено} щупальцами, пока длится заклинание.
  Обездвиженное щупальцами существо, которое начинает свой ход в области, получает
  [[/r 3d6]] дробящего урона.

  Существо, &reference[restrained]{обездвиженное} щупальцами, может использовать действие,
  чтобы пройти проверку Силы или Ловкости (на свой выбор). СЛ равна СЛ испытаний против
  ваших заклинаний. При успехе существо освобождается.'
