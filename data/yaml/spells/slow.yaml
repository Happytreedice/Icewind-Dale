description: Вы меняете ход времени для не более чем шести выбранных вами существ
  в 40-футовом кубе в пределах дистанции. Каждая цель должна пройти испытание Мудрости.
  При провале она попадает под влияние заклинания, пока оно длится. Скорость цели
  под влиянием заклинания снижается вдвое. Цель получает штраф –2 к КБ и испытаниям
  Ловкости и не может совершать ответные действия. В свой ход она может использовать
  либо действие, либо бонусное действие, но не оба. Вне зависимости от способностей
  и магических предметов, существо не может совершить более одной атаки (дистанционной
  или ближнего боя) в свой ход. Если существо попытается сотворить заклинание, время
  сотворения которого составляет 1 действие, бросьте [[/r d20]]. Если выпало 11 или
  больше, заклинание не начнёт действовать до следующего хода существа, и существо
  должно потратить действие в следующий ход, чтобы завершить заклинание. Если оно
  не сможет этого сделать, заклинание потрачено зря. Существо, попавшее под влияние
  заклинания, снова проходит испытание Мудрости в конце каждого своего хода. При успехе
  заклинание прекращает действовать на него.
