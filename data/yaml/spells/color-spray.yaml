description: 'Ошеломляющее множество мерцающих разноцветных лучей срывается с вашей
  руки. Бросьте [[/r 6d10]]; результат укажет, на существ с каким суммарным количеством
  ПЗ влияет это заклинание. Существа в пределах 15-футового конуса, исходящего от
  вас, подвергаются воздействию в порядке возрастания текущих ПЗ (не считая существ
  &reference[unconscious]{без сознания} и существ, которые не видят).

   Начиная с существа с наименьшими текущими ПЗ, каждое существо, подвергшееся влиянию
  заклинания, &reference[blinded]{слепнет} до конца вашего следующего хода. Вычитайте
  ПЗ каждого существа из результата броска, прежде чем перейти к следующему. Количество
  ПЗ существа должно быть равно или меньше остатка результата, чтобы заклинание подействовало
  на это существо.

  На высоких кругах. Если вы сотворяете это заклинание, используя ячейку 2-го круга
  или выше, бросьте дополнительно  [[/r 2d10]] за каждый круг ячейки выше 1-го.'
