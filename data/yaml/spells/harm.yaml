description: Вы поражаете опасной болезнью существо, которое видите в пределах дистанции.
  Цель должна пройти испытание Выносливости. При провале она получает [[/r 14d6]]
  некротического урона, при успехе — половину этого урона. Урон не может уменьшить
  ПЗ цели ниже 1. Если цель провалила испытание, её максимум ПЗ уменьшается на значение,
  равное полученному некротическому урону, на 1 час. Любой эффект, исцеляющий болезнь
  существа, досрочно восстанавливает его максимум ПЗ.
