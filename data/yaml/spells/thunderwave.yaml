description: 'От вас исходит волна громовой силы. Каждое существо в пределах 15-футового
  куба, исходящего от вас, должно пройти испытание Выносливости. При провале существо
  получаеr [[/r 2d8]]  урона громом и его отталкивает прочь от вас на 10 футов. При
  успехе существо получает половину урона и его не отталкивает.

  Кроме того, незакреплённые объекты, полностью находящиеся в области действия, автоматически
  отталкиваются на 10 футов прочь от вас, заклинание издает грохот грома, который
  слышно в пределах 300 футов

  На высоких кругах. Если вы сотворяете это заклинание, используя ячейку 2-го круга
  или выше, урон увеличавается на [[/r 1d8]] за каждый круг ячейки выше 1-го.'
