description: 'Вы пытаетесь подчинить существо, которое видите в пределах дистанции.
  Оно должно пройти испытание Мудрости, при провале оно &reference[charmed]{обворожено}
  вами, пока длится заклинание. Если вы или дружественные вам существа сражаетесь
  с этим существом, у него преимущество к испытанию.

  Пока цель &reference[charmed]{обворожена}, у вас есть с ней телепатическая связь,
  если вы оба находитесь на одном плане бытия. Вы можете с помощью этой телепатической
  связи отдавать существу приказы, пока вы в сознании (действие не требуется), и оно
  будет выполнять их, насколько сможет. Можете отдавать простые приказы общего характера,
  например: «Атакуй это существо», «Беги туда», «Схвати этот предмет». Если существо
  выполняет приказ и больше не получает от вас новых указаний, оно бросает все силы
  на самозащиту.

  Вы можете использовать действие, чтобы обрести полный и точный контроль над целью.
  До конца вашего следующего хода существо совершает только те действия, которые выбираете
  вы, и не делает ничего, что вы ему не разрешили. В это время вы можете заставить
  существо совершить ответное действие, но это также потратит ваше ответное действие.

  Всякий раз, когда цель получает урон, она снова проходит испытание Мудрости против
  заклинания. При успехе заклинание прекращает действовать.

  На высоких кругах. Если вы сотворяете это заклинание, используя ячейку 9-го круга,
  его длительность — концентрация, до 8 часов.'
