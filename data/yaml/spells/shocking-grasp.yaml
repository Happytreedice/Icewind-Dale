description: 'Молния срывается с ладони в существо, которого вы касаетесь. Совершите
  по цели атаку заклинанием в ближнем бою. У вас преимущество к броску атаки, если
  цель носит металлическую броню. При попадании цель получает [[/r 1d8]] урона молнией
  и не может совершать ответные действия до начала своего следующего хода.


  Урон заклинания увеличивается на [[/r 1d8]], когда вы достигаете 5-го [[/r 2d8]],
  11-го [[/r 3d8]] и 17-го уровня [[/r 4d8]].'
