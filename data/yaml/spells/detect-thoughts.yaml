description: 'Пока длится заклинание, вы можете прочесть мысли некоторых существ.
  Когда вы сотворяете это заклинание или в качестве действия в каждый ваш ход, вы
  можете сфокусировать свой разум на одном существе, которое видите в пределах 30
  футов от вас. Если у выбранного вами существа Интеллект 3 или ниже или оно не говорит
  ни на одном языке, заклинание на него не действует


  Вы сперва узнаете поверхностные мысли существа что у него на уме в данный момент.
  В качестве действия вы можете либо переключить внимание на мысли другого существа,
  либо попытаться проникнуть глубже в разум того же существа. Если вы проникаете глубже,
  цель должна пройти испытание Мудрости. При провале вы понимаете ее рассуждения (если
  есть), эмоциональное состояние и то, что для нее важно (например, что ее волнует,
  что она любит или ненавидит). При успехе заклинание прекращает действовать. В любом
  случае цель узнаёт, что вы читали её мысли. Если вы не переключитесь на мысли другого
  существа, цель может использовать действие в свой ход, чтобы пройти проверку Интеллекта
  в состязании с вашей проверкой Интеллекта; при успехе цели заклинание прекращает
  действовать.


  Вопросы, заданные цели вслух, могут естественным образом направить течение её мыслей,
  так что заклинание особенно полезно при допросе.


  Вы также можете использовать его, чтобы обнаружить присутствие мыслящих существ,
  которых не видите. Когда вы сотворяете это заклинание или в качестве действия, пока
  оно длится, вы можете поискать чужие мысли в пределах 30 футов от вас. Заклинание
  проходит через большинство препятствий. Его блокируют 2 фута камня, 2 дюйма обычного
  металла или тонкий лист свинца. Нельзя обнаружить мысли существа с Интеллектом 3
  или ниже или такого, которое не говорит ни на одном языке.


  Обнаружив присутствие существа таким образом, вы можете читать его мысли до конца
  длительности заклинания, как описано выше, даже если не видите цель, но только пока
  она остаётся в пределах дистанции.'
