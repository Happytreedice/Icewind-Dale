description: 'Это сильнейшее заклинание, какое только может сотворить смертное существо.
  Простыми словами вы можете изменить сами основы реальности под ваши нужды.

  Основное назначение этого заклинания — дублировать любое другое заклинание 8-го
  круга или ниже. В таком случае вам не нужно соответствовать никаким требованиям,
  чтобы творить это заклинание, не нужны даже дорогие реагенты. Заклинание просто
  подействует. Помимо этого, вы можете создать один из этих эффектов на ваш выбор:

  Вы создаёте один немагический объект стоимостью до 25 000 зм и размером не более
  300 футов по любому измерению. Предмет появляется в незанятом пространстве на земле,
  которое вы видите.Вы позволяете двадцати или менее существам, которых видите, восстановить
  все ПЗ и снимаете все эффекты, описанные в заклинании @UUID[Compendium.laaru-dnd5-hw.spells.Item.lFqzcFBz3F0u96i1]{Высшее
  восстановление }.Вы даёте десяти или менее существам, которых видите, @UUID[Compendium.dnd5e.srd-actions.Item.w7WKEM8had6v4vy8]{устойчивость}
  к одному типу урона на ваш выбор.Вы даёте десяти или менее существам, которых видите,
  невосприимчивость к одному заклинанию или другому магическому эффекту на 8 часов.
  К примеру, вы можете сделать себя и ваших спутников невосприимчивыми к магической
  способности Лича.Вы отменяете одно недавнее событие, перебросив любой бросок кости
  за последний раунд (включая ваш последний ход). Реальность меняется под новый результат
  броска. К примеру, заклинанием желание можно отменить успешно пройденное врагом
  испытание, нанесённый им критический удар или испытание, проваленное вашим спутником.
  Вы можете придать новому броску преимущество или помеху и можете использовать как
  новый результат, так и старый.Вы можете достичь и чего-то, не описанного среди этих
  примеров. Опишите своё желание мастеру как можно точнее. У мастера широкий диапазон
  возможностей в данном случае: чем масштабнее желание, тем больше шансов, что что-нибудь
  пойдёт не так. Заклинание может не сработать, частично выполнить желаемое или вызвать
  и вовсе неожиданные последствия в зависимости от формулировки. К примеру, если вы
  пожелаете, чтобы ваш враг был мёртв, вы можете перенестись в такое отдалённое будущее,
  когда ваш враг уже умер, и покинуть игру. Аналогично, если пожелать, чтобы легендарный
  магический артефакт оказался перед вами, вы можете ненароком сами перенестись к
  его нынешнему владельцу.

  Попытка заставить это заклинание произвести иной эффект, нежели просто дублировать
  другое заклинание, выматывает вас. После этого каждый раз, когда вы творите заклинание,
  прежде чем завершите долгий отдых, вы получаете [[/r 1d10]] некротического урона
  за каждый круг этого заклинания. Этот урон нельзя уменьшить или пред- отвратить.
  Кроме того, ваша Сила снижается до 3 (если она была выше 3) на [[/r 2d4]] дня. Наконец,
  есть шанс [[/r 1d100]]{33%}, что вы больше никогда не сможете сотворить желание
  после такого тяжкого переживания.'
