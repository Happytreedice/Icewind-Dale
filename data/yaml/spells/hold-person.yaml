description: 'Выберите гуманоида, которого видите в пределах дистанции. Цель должна
  пройти испытание Мудрости, при провале она &reference[paralyzed]{парализована},
  пока длится заклинание. В конце каждого своего хода цель может пройти еще одно испытание
  Мудрости. При успехе заклинание прекращает действовать на цель.

  На высоких кругах. Если вы сотворяете это заклинание, используя ячейку 3-го круга
  или выше, то можете выбрать целью одного дополнительного гуманоида за каждый круг
  ячейки выше 2-го. Эти гуманоиды должны быть в пределах 30 футов друг от друга в
  момент сотворения.'
