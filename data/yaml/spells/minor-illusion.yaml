description: 'Вы создаёте звук или образ объекта в пределах дистанции. Он существует,
  пока длится заклинание. Иллюзия также рассеивается, если вы прекратите её в качестве
  действия или сотворите это заклинание снова.


  Если вы создаёте звук, его громкость может варьироваться от шёпота до крика. Это
  может быть ваш или чей-то ещё голос, рёв льва, бой барабанов или что угодно ещё
  на ваш выбор. Звук может продолжаться всю длительность, или вы можете выбрать отдельные
  звуки, звучащие в разное время, пока длится заклинание.


  Если вы создаёте образ объекта — например, кресло, грязные следы ног или сундучок,
  — он должен быть не больше 5-футового куба. Образ не может создавать звук, свет,
  запах или иной сенсорный эффект. Физическое взаимодействие с образом выдаёт, что
  это иллюзия, потому что предметы проходят сквозь неё.


  Если существо использует действие, чтобы изучить звук или образ, оно может понять,
  что это иллюзия, успешно пройдя проверку Интеллекта (Расследование). СЛ проверки
  равна СЛ испытаний против ваших заклинаний. Если существо распознаёт иллюзию, она
  становится для него едва различимой'
