description: 'Вы творите маленькое чудо, знак сверхъестественной силы. Вы можете создать
  один из этих магических эффектов в пределах дистанции:

  Сделать свой голос втрое громче обычного на 1 минуту.Заставить пламя трепетать,
  вспыхивать, тускнеть или менять цвет на 1 минуту.Вызвать безвредную дрожь земли
  на 1 минуту.Вызвать мгновенный звук, который исходит из выбранной вами точки в пределах
  дистанции, например рокот грома, крик ворона или зловещий шёпот.Заставить незапертую
  дверь или окно мгновенно открыться или закрыться.Изменить вид ваших глаз на 1 минуту.Если
  сотворить это заклинание несколько раз, можно поддерживать до трёх 1-минутных эффектов
  одновременно. Любой из таких эффектов вы можете прекратить, потратив действие.'
