description: 'Рой кусающейся саранчи заполняет сферу радиусом 20 футов вокруг выбранной
  вами точки в пределах дистанции. Сфера распространяется и за углы. Сфера существует,
  пока длится заклинание, видимость в ней слегка &reference[lightlyobscured]{затруднена},
  а её область - &reference[difficultterrain]{пересечённая местность}.

  Когда сфера появляется, каждое существо в ней должно пройти испытание Выносливости.
  Существо получает [[/r 4d10]] колющего урона при провале или половину этого урона
  при успехе. Существо также должно пройти это испытание, когда впервые за ход входит
  в область заклинания или заканчивает в ней свой ход.

  На высоких кругах. Если вы сотворяете это заклинание, используя ячейку 6-го круга
  или выше, урон увеличивается на [[/r 1d10]] за каждый круг ячейки выше 5-го.'
