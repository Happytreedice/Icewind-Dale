description: 'Клубящееся облако дыма, исходящего от раскалённых добела углей, появляется
  в сфере радиусом 20 футов вокруг точки в пределах дистанции. Облако распространяется
  и за углы, видимость в нем &reference[heavilyobscured]{крайне затруднена}. Оно существует,
  пока длится заклинание или пока его не развеет ветер средней или большей силы (не
  менее 10 миль в час).

  Когда появляется облако, каждое существо в нём должно пройти испытание Ловкости.
  Существо получает [[/r 10d8]] урона огнем при провале или половину этого урона при
  успехе. Существо также должно пройти это испытание, когда впервые за ход входит
  в область заклинания или заканчивает в ней свой ход.

  В начале каждого вашего хода облако удаляется на 10 футов от вас в выбранном вами
  направлении.'
