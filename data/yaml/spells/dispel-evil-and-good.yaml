description: 'Мерцающая энергия окружает вас, защищая от фей, нежити и тварей, происходящих
  не с Материального плана. Пока длится заклинание, бестии, небожители, нежить, феи
  и элементали получают помеху к броскам атаки по вам.

  Вы можете прервать заклинание досрочно, использовав одну из перечисленных особых
  функций.

  Разрушение чар. В качестве действия вы касаетесь существа в зоне вашей досягаемости,
  которое &reference[charmed]{обворожено} или &reference[frightened]{испугано} бестией,
  небожителем, нежитью, феей или элементалем либо в которое вселилось подобное существо,
  и прекращаете этот эффект.

  Возвращение. В качестве действия совершите атаку заклинанием в ближнем бою по бестии,
  небожителю, нежити, фее или элементалю в зоне вашей досягаемости. При попадании
  вы можете попытаться отправить существо на его родной план. Существо должно пройти
  испытание Харизмы, при провале оно отправится на родной план (если оно ещё не там).
  Нежить, если она не на родном плане, отправляется в Царство Теней, а феи — в Страну
  Фей.'
