description: 'Это маленький магический трюк, которым пользуются заклинатели-новички
  для тренировки. Вы можете создать один из перечисленных магических эффектов в пределах
  дистанции:


  Вызвать мгновенный безвредный сенсорный эффект вроде вспышки искр, порыва ветерка,
  отзвуков музыки или необычного запаха. 

  Мгновенно зажечь или погасить свечу, факел или небольшой костерок.

  Мгновенно очистить или испачкать обьект объемом не более 1 кубического фута.

  Охладить, нагреть или придать вкус и запах неживому материалу объемом не более 1
  кубического фута на 1 час.

  Нанести цвет, небольшую пометку или символ на объект или поверхность на 1 час.

  Создать немагическую безделушку или иллюзорный образ, способный поместиться у вас
  в руке. Сохраняется до конца вашего следующего хода. Если сотворить это заклинание
  несколько раз, можно поддерживать до трёх немгновенных эффектов одновременно.


  Любой из таких эффектов вы можете прекратить, потратив действие.'
