description: 'Заклинание создаёт &reference[invisible]{невидимого}, неразумного и
  бесформенного слугу среднего размера, выполняющего простые задания согласно вашим
  приказам, пока длится заклинание. Слуга появляется в незанятом пространстве на земле
  в пределах дистанции. У него КБ 10, 1 ПЗ и Сила 2, он не может атаковать. Если его
  ПЗ снижаются до 0, заклинание прекращает действовать.

  Один раз в любой ваш ход в качестве бонусного действия вы можете мысленно приказать
  слуге переместиться на расстояние до 15 футов и взаимодействовать с объектом. Слуга
  может выполнять простые задачи подобно слуге-человеку, например приносить вещи,
  убираться, чинить сломанное, складывать одежду, зажигать пламя, подавать еду и разливать
  вино. Отданный вами приказ слуга выполняет так хорошо, как может, а после выполнения
  ждёт новых приказов.

  Если вы приказываете слуге выполнить задание, для которого надо переместиться далее
  чем на 60 футов от вас, заклинание прекращает действовать.'
