description: 'Вы призываете в свою свободную руку пылающий клинок. Он похож по форме
  и размеру на скимитар и существует, пока длится заклинание. Если вы отпустите клинок,
  он исчезнет, но вы можете призвать его снова в качестве бонусного действия.

  Вы можете использовать действие, чтобы совершить атаку заклинанием в ближнем бою
  с помощью клинка. При попадании цель получает [[/r 3d6]] урона огнём. 

  Огненный клинок испускает яркий свет в радиусе 10 футов и тусклый ещё на 10 футов.

  На высоких кругах.  Если вы сотворяете это заклинание, используя ячейку 4-го круга
  или выше, урон увеличивается на [[/r 1d6]] за каждые два круга ячейки выше 2-го.'
