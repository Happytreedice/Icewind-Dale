description: 'Вы направляете негативную энергию, и она проходит сквозь существо, которое
  вы видите в пределах дистанции, вызывая у него невыносимую боль. Цель должна пройти
  испытание Выносливости. Она получает [[/r 7d8 + 30]] некротического урона при провале
  или половину этого урона при успехе.

  Гуманоид, убитый этим заклинанием, восстаёт в начале вашего следующего хода как
  зомби. Он навсегда остаётся под вашим контролем и выполняет ваши устные приказы
  по мере своих способностей.'
