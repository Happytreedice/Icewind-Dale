description: 'Заклинание создаёт слугу-нежить. Выберите груду костей или труп среднего
  или небольшого гуманоида в пределах дистанции. Ваше заклинание наделяет покойника
  нечестивым подобием жизни и превращает его в нежить. Цель становится @UUID[Compendium.laaru-dnd5-hw.monsters.Actor.b7M77dRP7LHnsNPB]{скелетом},
  если вы выбрали кости, или @UUID[Compendium.laaru-dnd5-hw.monsters.Actor.wHcIolsp84cr72UR]{зомби},
  если это был труп.

  В каждый ваш ход вы можете использовать бонусное действие, чтобы отдать мысленный
  приказ любому существу, которое вы создали этим заклинанием, если оно в пределах
  60 футов от вас. Если вы контролируете несколько существ, можете отдать одинаковый
  приказ любому их количеству одновременно. Вы можете решить, какое действие совершит
  существо и куда переместится в свой следующий ход, а можете отдать приказ общего
  характера, например охранять конкретную комнату или коридор. Если вы не прикажете
  ничего, то существо будет только защищаться от враждебных существ. Получив приказ,
  существо следует ему до выполнения задачи.

  Существо остаётся под вашим контролем 24 часа, после чего перестаёт подчиняться
  вашим приказам. Чтобы сохранить контроль над существом ещё на 24 часа, вам надо
  снова сотворить на него это заклинание, пока нынешние 24 часа не истекли. Подобное
  применение заклинания позволяет вам сохранить контроль над четырьмя или менее существами,
  которых вы оживили этим заклинанием, вместо того, чтобы оживлять новое.

  На высоких кругах. Если вы сотворяете это заклинание, используя ячейку 4-го круга
  или выше, то можете оживить или продлить контроль над двумя дополнительными существами-нежитью
  за каждый круг ячейки выше 3-го. Каждое из этих существ должно быть создано из отдельного
  трупа или груды костей.'
