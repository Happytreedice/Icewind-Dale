description: 'Выберите согласное существо, которое видите в пределах дистанции. Пока
  длится заклинание, скорость цели удваивается, она получает бонус +2 к КБ, преимущество
  к испытаниям Ловкости и дополнительное действие в каждый свой ход. Это действие
  можно использовать только для совершения действий @UUID[Compendium.dnd5e.srd-actions.Item.Y0O7jQKh7vGMSTBu]{Атака}
  (только одна атака оружием), @UUID[Compendium.dnd5e.srd-actions.Item.v1tkJ8DKVJFCNFPM]{Рывок},
  @UUID[Compendium.dnd5e.srd-actions.Item.NwKMv5Ljen62a44Y]{Отступление}, @UUID[Compendium.dnd5e.srd-actions.Item.H9TgqPZGVRUQY4GF]{Засада}
  или @UUID[Compendium.dnd5e.srd-actions.Item.ydiv2XUXmVXv5ENI]{Использование объекта}.

  Когда заклинание прекращает действовать, цель не может ни перемещаться, ни совершать
  действия до конца своего следующего хода - её охватывает слабость.'
