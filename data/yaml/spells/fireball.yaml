description: 'Полоса яркого света исходит из вашего указательного пальца в выбранную
  точку в пределах дистанции, а в ней с низким гулом взрывается шаром пламени. Каждое
  существо в пределах сферы радиусом 20 футов с центром в этой точке должно пройти
  испытание Ловкости. При провале цель получает [[/r 8d6]] урона огнём, при успехе
  половину этого урона. Огонь распространяется и за углы. Он поджигает все горючие
  объекты в области действия, кроме тех, что носят или держат.

  На высоких кругах. Если вы сотворяете это заклинание, используя ячейку 4-го круга
  или выше, урон увеличивается на [[/r 1d6]] за каждый круг ячейки выше 3-го.'
