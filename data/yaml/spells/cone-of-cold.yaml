description: 'Волна холодного воздуха срывается с ваших рук. Каждое существо в 60-футовом
  конусе должно пройти испытание Выносливости. Существо получает [[/r 8d8]] урона
  холодом при провале или половину этого урона при успехе. Существо, убитое этим заклинанием,
  становится ледяной статуей, пока не растает.

  На высоких кругах. Если вы сотворяете это заклинание, используя ячейку 6-го круга
  или выше, урон увеличивается на [[/r 1d8]] за каждый круг ячейки выше 5-го.'
