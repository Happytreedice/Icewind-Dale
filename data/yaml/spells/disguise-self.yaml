description: 'Вы придаёте себе — включая вашу одежду, броню, оружие и прочее снаряжение
  совершенно иной вид, пока длится заклинание или пока вы не прекратите его, потратив
  действие.


  Вы можете казаться на 1 фут выше или ниже, более тощим, толстым или средним.


  Однако Вы не можете полностью поменять своё тело — вам нужно принять форму с таким
  же набором конечностей. В остальном параметры иллюзии зависят только от вас. Перемены,
  вызванные этим заклинанием, не выдерживают физического осмотра. К примеру, если
  вы с помощью заклинания добавите к своему образу шляпу, сквозь неё будут проходить
  предметы и любой, кто к ней прикоснётся, не почувствует ничего, кроме волос на вашей
  голове.


  Если с помощью заклинания вы кажетесь худым, любой, кто протянет к вам руку, упрётся
  в ваши невидимые бока. Чтобы понять, что вы изменили внешность, существо может использовать
  действие, чтобы изучить ваш облик, и должно пройти проверку Интеллекта (Расследование).
  СЛ проверки равна СЛ испытаний против ваших заклинаний.'
