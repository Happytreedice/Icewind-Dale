description: 'Скользкое масло покрывает землю в 10-футовом квадрате с центром в точке
  в пределах дистанции.

  Пока длится заклинание, эта область — &reference[difficultterrain]{пересечённая
  местность}. Когда появляется масло, каждое существо, стоящее в области действия,
  должно пройти испытание Ловкости. При провале существо &reference[prone]{распластывается}.
  Существо, которое входит в область или заканчивает в ней свой ход, тоже должно пройти
  испытание Ловкости, чтобы не распластаться.'
