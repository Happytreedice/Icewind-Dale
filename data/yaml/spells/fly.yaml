description: 'Прикоснитесь к согласному существу. Цель получает скорость полёта 60
  футов, пока длится заклинание. Когда заклинание прекращает действовать, цель падает,
  если находилась в воздухе и не смогла избежать падения.

  На высоких кругах. Если вы сотворяете это заклинание, используя ячейку 4-го круга
  или выше, то можете выбрать целью одно дополнительное существо за каждый круг ячейки
  выше 3-го.'
