description: 'Вы получаете способность силой мысли перемещать существ или объекты
  и манипулировать ими. Когда вы сотворяете это заклинание и в качестве действия в
  каждый раунд, пока оно длится, вы можете управлять силой мысли одним существом или
  объектом, который вы видите в пределах дистанции, создавая один из перечисленных
  далее эффектов. Вы можете воздействовать на одну и ту же цель в каждом раунде, а
  можете каждый раз выбирать новую. Если вы поменяете цель, заклинание прекращает
  влиять на предыдущую.

  Существо. Вы можете переместить существо огромного размера или меньше. Пройдите
  проверку вашей заклинательной характеристики в состязании с проверкой Силы существа.
  Если вы выиграли, можете переместить существо на расстояние до 30 футов в любом
  направлении, в том числе вверх, но не за пределы дистанции заклинания. До конца
  вашего следующего хода существо &reference[restrained]{обездвижено} вашим телекинетическим
  захватом. Существо, поднятое вверх, останется подвешенным в воздухе.

  В последующие раунды вы можете использовать действие, чтобы попытаться поддержать
  ваш телекинетический захват на существе, повторяя это состязание.

  Объект. Вы можете переместить объект, весящий не более 1 000 фунтов. Если это не
  предмет, который носят или держат, переместите его на расстояние до 30 футов в любом
  направлении, но не за пределы дистанции заклинания.

  Если это предмет, который носит или держит существо, пройдите проверку вашей заклинательной
  характеристики в состязании с проверкой Силы существа. При успехе можете забрать
  предмет у существа и переместить его на расстояние до 30 футов в любом направлении,
  но не за пределы дистанции заклинания.

  Вы можете в точности контролировать движения предметов телекинетическим захватом:
  орудовать простыми инструментами, открывать двери и контейнеры, доставать из контейнеров
  предметы и убирать их, выливать содержимое пузырьков.'
