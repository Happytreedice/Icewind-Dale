description: 'Буря сплошного ревущего пламени появляется в выбран- ном вами месте
  в пределах дистанции. Область бури может состоять из не более чем десяти 10-футовых
  кубов, которые вы можете организовать в любую форму. Каждый куб должен соприкасаться
  хоть одной гранью с другим кубом. Каждое существо в области действия должно пройти
  испытание Ловкости. Оно получает [[/r 7d10]] урона огнём при провале, а при успехе
  — половину этого урона.


  Огонь наносит урон объектам в области и поджигает все горючие объекты, кроме тех,
  что носят или держат. По вашему выбору огонь может не наносить урон растениям в
  области.'
