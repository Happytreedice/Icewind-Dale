description: 'Вы управляете погодой в пределах 5 миль от вас, пока длится заклинание.
  Вам надо быть под открытым небом, чтобы сотворить это заклинание. Если вы окажетесь
  вместе, где нет прямого пути между вами и небом, заклинание прекращает действовать.


  Когда вы творите это заклинание, вы меняете текущую погоду, определённую мастером
  на основе климата и времени года. Вы можете поменять осадки, температуру и ветер.
  На наступление новой погоды уходит [[/r 1d4 * 10]] (1d4 × 10)  минут. После этого
  вы можете поменять погоду снова. По окончании заклинания погода постепенно возвращается
  в норму.


  Когда вы меняете погоду, найдите текущую погоду в этих таблицах и меняйте её на
  одну стадию вверх или вниз. Меняя ветер, вы можете изменить его направление.


  Осадки


