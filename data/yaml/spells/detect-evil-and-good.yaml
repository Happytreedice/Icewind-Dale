description: Пока длится заклинание, вы знаете, есть ли в пределах 30 футов от вас
  аберрация, бестия, небожитель, нежить, фея или элементаль, а также местонахождение
  этого существа. Аналогично вы узнаёте, если в пределах 30 футов есть место или объект,
  магически освящённый или осквернённый. Заклинание проходит через большинство препятствий.
  Его блокируют 1 фут камня, 1 дюйм обычного металла, тонкий лист свинца или 3 фута
  дерева или земли.
