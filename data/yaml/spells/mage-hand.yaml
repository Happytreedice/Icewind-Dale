description: Призрачная рука появляется в воздухе в выбранной вами точке в пределах
  дистанции. Она существует до окончания длительности или пока вы не прекратите заклинание,
  потратив действие. Рука исчезает, если окажется более чем в 30 футах от вас или
  если вы снова сотворите это заклинание. Вы можете использовать действие, чтобы управлять
  рукой. С её помощью вы можете манипулировать предметами, открыть незапертую дверь
  или контейнер, убрать или достать предмет из открытого контейнера или выплеснуть
  содержимое пузырька. Вы можете перемещать руку на расстояние до 30 футов каждый
  раз, когда используете её. Рука не может атаковать, активировать магические предметы
  и поднимать более 10 фунтов.
