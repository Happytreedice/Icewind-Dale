description: 'Вы можете видеть и слышать конкретное существо на ваш выбор, если оно
  на одном плане бытия с вами. Цель должна пройти испытание Мудрости, модификаторы
  к которому зависят от того, насколько хорошо вы знаете цель и какого рода физическую
  связь с ней имеете. Если цель знает, что вы творите это заклинание, она может добровольно
  провалить испытание, если она согласна на ваше наблюдение

   ЗнаниеМодификатор испытанияИз вторых рук (вы слышали о цели)+5Из первых рук (вы
  встречали цель)+0Знакомы (вы хорошо знаете цель)−5 СвязьМодификатор испытанияПортрет−2Предмет
  или одежда−4Часть тела, локон волос, ноготь и тому подобное−10 При успехе испытания
  заклинание не влияет на цель, а вы не можете снова сотворить это заклинание против
  нее следующие 24 часа.

  При провале заклинание создаёт невидимый сенсор в пределах 10 футов от цели. Вы
  можете видеть и слышать так, будто находитесь на месте сенсора. Сенсор перемещается
  вместе с целью, всегда оставаясь в 10 футах от неё, пока длится заклинание. Существо,
  способное видеть &reference[invisible]{невидимое}, видит сенсор как светящийся шар
  размером с ваш кулак.

  Вместо того чтобы выбрать целью существо, можете выбрать место, которое видели раньше.
  При этом сенсор появляется в указанном месте и не перемещается.'
