description: 'Заклинание погружает существ в магическую дрёму.

  Бросьте [[/r 5d8]]; результат укажет, на существ с каким суммарным количеством ПЗ
  влияет это заклинание.

  Существа в пределах 20 футов от выбранной вами точки в пределах дистанции подпадают
  под действие заклинания в порядке возрастания их текущих П3 (игнорируя существ &reference[unconscious]{без
  сознания}).

  Начиная с существа с наименьшими текущими П3, каждое существо, попавшее под действие
  заклинания,  &reference[unconscious]{теряет сознание}, пока длится заклинание. Существо
  приходит в сознание, если получает урон или кто-то использует действие, чтобы разбудить
  его. Вычитайте П3 каждого существа из результата броска, прежде чем перейти к следующему
  существу в порядке возрастания ПЗ. Количество ПЗ существа должно быть равно или
  меньше остатка результата, чтобы заклинание подействовало на это существо.

  На нежить и существ с невосприимчивостью к &reference[charmed]{обворожению} это
  заклинание не действует.

  На высоких кругах. Если вы сотворяете это заклинание, используя ячейку 2-го круга
  или выше, бросьте дополнительно [[/r 2d8]] за каждый круг ячейки выше 1-го.'
