description: 'Мерцающая зелёная стрела поражает цель в пределах дистанции и взрывается
  брызгами кислоты. Соверите дистанционную атаку заклинанием по цели. При попадании
  цель получит [[/r 4d4]] урона кислотой немедленно и [[/r 2d4]] урона кислотой в
  конце своего следующего хода. При промахе стрела обрызгивает цель кислотой на половину
  начального урона, а в конце следующего хода урона не будет

  На высоких кругах. Если вы сотворяете это заклинание, используя ячейку 3-го круга
  или выше, урон (как начальный, так и последующий) увеличивается на [[/r 1d4]] за
  каждый круг ячейки выше 2-го.'
