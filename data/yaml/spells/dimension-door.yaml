description: 'Вы телепортируетесь из своего текущего местоположения в любую другую
  точку в пределах дистанции. Вы попадаете точно в желаемую точку. Это может быть
  место, которое вы видите либо которое можете представить или описать, назвав расстояние
  и направление, например: «200 футов прямо вниз» или «вверх на северо-запад под углом
  45 градусов, на 300 футов».


  Вы можете брать с собой объекты, если их вес не превышает вашу грузоподъемность.
  Можете также взять с собой одно согласное существо вашего размера или меньше, снаряжение
  которого не превышает его грузоподъемность. Существо должно быть в пределах 5 фугов
  от вас, когда вы творите заклинание.


  Если вы должны попасть в место, уже занятое объектом или существом, вы и любое существо,
  телепортировавшееся с вами, получаете по [[/r 4d6]] урона силой и заклинание вас
  не телепортирует.'
