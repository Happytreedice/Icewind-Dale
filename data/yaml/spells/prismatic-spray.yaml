description: 'Восемь разноцветных лучей исходят из вашей руки. У каждого луча свой
  цвет и своя магическая сила. Каждое существо в пределах 60-футового конуса должно
  пройти испытание Ловкости. Бросьте по [[/r d8]] за каждую цель, чтобы определить,
  какого цвета луч подействовал на нее.

  Красный. Цель получает [[/r 10d6]] урона огнём при провале или половину этого урона
  при успехе.

  Оранжевый. Цель получает [[/r 10d6]] урона кислотой при провале или половину этого
  урона при успехе.

  Жёлтый. Цель получает [[/r 10d6]] урона молнией при провале или половину этого урона
  при успехе.

  Зелёный. Цель получает [[/r 10d6]] урона ядом при провале или половину этого урона
  при успехе.

  Голубой. Цель получает [[/r 10d6]] урона холодом при провале или половину этого
  урона при успехе.

  Синий. При провале цель &reference[restrained]{обездвижена}. Она должна проходить
  испытание Выносливости в конце каждого своего хода. Если цель успешно пройдёт его
  трижды, ваклинание прекращает действовать. Если цель провалит испытание трижды,
  она окончательно превратится в камень и получит состояние &reference[petrified]{окаменения}.
  Успехи и провалы необязательно должны быть подряд: подсчитывайте их, пока чего-то
  не наберётся три.

  Фиолетовый. При провале цель &reference[blinded]{ослеплена}. Она должна пройти испытание
  Мудрости в начале вашего следующего хода. При успехе слепота прекращается. При провале
  существо перемещается на другой план бытия по выбору мастера, слепота при этом прекращается.
  Как правило, если существо не на том плане, с которого родом, оно возвращается на
  родной план, остальные существа обычно попадают на Астральный или Эфирный планы.

  Особый. Цель поразили два луча. Бросьте кость ещё два раза, результат 8 перебрасывайте.'
