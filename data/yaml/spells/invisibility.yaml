description: 'Существо, которого вы коснулись, становится &reference[invisible]{невидимым},
  пока длится заклинание. Все, что цель носит или держит, остаётся невидимым, пока
  оно у цели. Заклинание прекращает действовать для цели, если она атакует или творит
  заклинание.

  На высоких кругах. Если вы сотворяете это заклинание, используя ячейку 3-го круга
  или выше, можете выбрать целью одно дополнительное существо за каждый круг ячейки
  выше 2-го.'
