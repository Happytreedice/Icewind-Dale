description: 'Вы создаёте сферу ядовитого жёлто-зелёного тумана радиусом 20 футов
  вокруг выбранной вами точки в пределах дистанции. Туман распространяется и за углы.
  Он существует, пока длится заклинание или пока его не развеет сильный ветер. В его
  области &reference[heavilyobscured]{видимость крайне затруднена}.

  Когда существо впервые за ход входит в область заклинания или начинает в ней свой
  ход, оно должно пройти испытание Выносливости. Существо получает [[/r 5d8]] урона
  ядом при провале или половину этого урона при успехе. Яд влияет на существ, даже
  если они задерживают дыхание или в принципе не дышат.

  В начале каждого вашего хода область тумана перемещается от вас на 10 футов, двигаясь
  вдоль поверхности земли. Поскольку пары тяжелее воздуха, они спускаются в любые
  расселины в земле и просачиваются вниз в отверстия.

  На высоких кругах. Если вы сотворяете это заклинание, используя ячейку 6-го круга
  или выше, урон увеличивается на [[/r 1d8]] за каждый круг ячейки выше 5-го.'
