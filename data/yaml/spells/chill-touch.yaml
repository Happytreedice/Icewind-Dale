description: 'Вы создаёте призрачную ладонь скелета в пространстве, занимаемом существом
  в пределах дистанции. Совершите дистанционную атаку заклинанием по существу, чтобы
  обдать его холодом могилы. При попадании цель получает [[/r 1d8]] некротического
  урона и не может восстанавливать ПЗ до начала вашего следующего хода. Все это время
  ладонь цепляется за цель.


  Если вы попали этой атакой по нежити, она также получает помеху к броскам атаки
  по вам до конца вашего следующего хода.


  Урон заклинания увеличивается на [[/r 1d8]], когда вы достигаете 5-го ([[/r 2d8]]),
  11-го ([[/r 3d8]]) и 17-го уровня ([[/r 4d8]]).'
