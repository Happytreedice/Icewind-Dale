description: 'Вы магически внушаете выбранному существу в пределах дистанции, которое
  может вас слышать и понимать, совершить определённые действия (описание которых
  ограничено одним-двумя предложениями). На существ с невосприимчивостью к  &reference[charmed]{обворожению}
  заклинание не действует. Внушение должно быть сформулировано так, чтобы существу
  эти действия показались разумными. Если вы прикажете существу заколоться, броситься
  на копьё, поджечь себя или каким-то ещё образом явно нанести себе вред, заклинание
  сразу прекращает действовать.

  Цель должна пройти испытание Мудрости. При провале она выполняет внушённые вами
  действия по мере своих возможностей. Выполнение может занимать всю длительность
  заклинания. Если внушённые действия можно совершить быстрее, заклинание прекращает
  действовать, как только цель совершит их.

  Можно также указать условия, при которых внушение сработает в пределах длительности.
  К примеру, вы можете внушить рыцарю отдать своего коня первому встречному нищему.
  Если условия не выполняются до конца длительности, действия тоже не совершаются.

  Если вы или ваши спутники наносите цели урон, заклинание прекращает действовать.'
