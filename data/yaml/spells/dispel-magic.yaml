description: 'Выберите одно существо, объект или магический эффект в пределах дистанции.
  Любое заклинание 3-го круга или ниже, наложенное на цель, прекращает действовать.
  Для каждого заклинания 4-го круга или выше пройдите проверку своей заклинательной
  характеристики. СЛ равна 10+ круг заклинания. При успехе заклинание прекращает действовать.

  На высоких кругах. Если вы сотворяете это заклинание, используя ячейку 4-го круга
  или выше, вы автоматически рассеиваете те заклинания, сотворённые на цель, чей круг
  ниже или равен кругу использованной вами ячейки.'
