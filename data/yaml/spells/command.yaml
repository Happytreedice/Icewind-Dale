description: 'Вы отдаете приказ из одного слова существу, которое вы видите в пределах
  дистанции. Цель должна успешно пройти испытание Мудрости, иначе в следующий свой
  ход она исполнит ваш приказ. Заклинание не действует на нежить, на тех, кто не понимает
  ваш язык, и в случае, если приказ наносит цели прямой вред.

  Вот некоторые типичные приказы и их эффекты. Вы можете отдать другой приказ, не
  описанный тут. В таком случае мастер решает, как поведет себя цель. Если цель не
  может выполнить ваш приказ, заклинание прекращает действовать.

  Подойди. Цель перемещается к вам по кратчайшему прямому пути. Оказавшись в пределах
  5 футов от вас она заканчивает ход.Брось. Цель бросает то, что держит в руках, и
  заканчивает ход.Пади. Цель падает, &reference[prone]{распластывается} и заканчивает
  ход.Беги. Цель тратит свой ход на перемещение прочь от вас самым быстрым способом.Стой.
  Цель не перемещается и не совершает действий. Летающее существо продолжает парить,
  если может. Если ему нужно перемещаться, чтобы держаться в воздухе, оно пролетает
  минимальное необходимое расстояние.На высоких кругах. Если вы сотворяете это заклинание,
  используя ячейку 2-го круга или выше, то можете выбрать целью одно дополнительное
  существо за каждый круг ячейки выше 1-го. Эти существа должны быть в пределах 20
  футов друг от друга в момент сотворения.'
