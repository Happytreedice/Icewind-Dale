description: 'Вы касаетесь мёртвого существа и возвращаете его к жизни, если оно было
  мертво не дольше 10 дней. Если душа существа свободна и хочет вернуться в тело,
  существо оживает с1 ПЗ.


  Заклинание нейтрализует все яды и исцеляет немагические болезни, влиявшие на существо
  на момент смерти. Однако заклинание не снимает магические болезни, проклятия и тому
  подобные эффекты. Если их не снять перед сотворением этого заклинания, они продолжат
  действовать, когда существо вернётся к жизни. Заклинание не может вернуть к жизни
  нежить.


  Заклинание заставляет все смертельные раны зарасти, но потерянные части тела не
  восстанавливает. Если существу не хватает жизненно важных частей тела или органов
  — например, головы, — заклинание автоматически не срабатывает.


  Возвращение из мёртвых — тяжёлое испытание. Цель получает штраф -4 ко всем броскам
  атак, испытаниям и проверкам характеристик. Каждый раз, когда цель завершает долгий
  отдых, штраф уменьшается на 1, пока не исчезнет.'
