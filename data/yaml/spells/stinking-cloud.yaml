description: 'Вы создаёте сферу тошнотворного жёлтого газа радиусом 20 футов вокруг
  точки в пределах дистанции. Облако распространяется и за углы, и в его области видимость
  &reference[heavilyobscured]{крайне затруднена}. Облако существует, пока длится заклинание.

  Каждое существо, полностью оказавшееся в пределах облака в начале своего хода, должно
  пройти испытание Выносливости против яда. При провале существо тратит своё действие
  в этот ход на рвоту. Существа, которым не нужно дышать или невосприимчивые к яду,
  автоматически проходят испытание успешно.

  Средний ветер (не менее 10 миль в час) может развеять облако за 4 раунда. Сильный
  ветер (не менее 20 миль в час) развеет его за 1 раунд.'
