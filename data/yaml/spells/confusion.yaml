description: 'Заклинание затуманивает разум существ, вызывая у них бред и провоцируя
  на неуправляемые действия. Каждое существо в пределах сферы радиусом 10 футов вокруг
  выбранной вами точки в пределах дистанции должно пройти испытание Мудрости, при
  провале оно попадает под влияние заклинания.

   Под влиянием заклинания цель не может совершать ответные действия и должна бросать
  [[/r d10]] в начале каждого своего хода, чтобы определить, как она поведёт себя
  в этот ход.

  Поведение замешательства[[/r d10]]Поведение 1Цель тратит всю свою скорость на перемещение
  в случайном направлении. Чтобы определить направление, бросьте [[/r d8]], назначив
  направление для каждого значения. В этот ход существо не совершает действие. 2-6Цель
  не перемещается и не совершает действий в этот ход.7-8Цель использует действие,
  чтобы совершить атаку ближнего боя по случайно выбранному существу в пределах зоны
  досягаемости. Если в зоне досяга емости нет существ, цель ничего не делает в этот
  ход 9-10Цель перемещается и действует как обычно.В конце каждого своего хода цель
  может пройти испытание Мудрости. При успехе заклинание прекращает действовать на
  неё.

  На высоких кругах. Если вы сотворяете это заклинание, используя ячейку 5-го круга
  или выше, радиус сферы увеличивается на 5 футов за каждый круг ячейки выше 4-го.'
