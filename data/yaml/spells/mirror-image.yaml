description: 'Три ваших иллюзорных двойника появляются в занимаемом вами пространстве.
  Пока длится заклинание, двойники перемещаются вместе с вами, повторяя ваши действия
  и меняясь местами, так что невозможно уследить, кто из вас реален. Вы можете использовать
  действие, чтобы рассеять иллюзорных двойников.

  Пока длится заклинание, каждый раз, когда существо выбирает вас целью атаки, бросьте
  [[/r d20]], чтобы определить, будет ли атака нацелена на вас или на ваших двойников.

  Если у вас три двойника, то двойник станет целью атаки при результате 6 и более.
  Если двойников двое, надо получить 8 или более. Если двойник один 11 или более.

  КБ двойника равен 10 + ваш модификатор Ловкости. Если атака попадает в двойника,
  он уничтожается. Двойника можно уничтожить только попавшей по нему атакой. Он невосприимчив
  к любому другому урону и эффектам. Заклинание прекращает действовать, когда уничтожены
  все три двойника.

  Заклинание не действует на существо, которое не может видеть или полагается на другие
  способы восприятия, например обладает @UUID[Compendium.dnd5e.srd-actions.Item.x7Ty7ddxZGFudOeO]{слепозрением},
  или если оно способно распознавать иллюзии, например обладает &reference[truesight]{истинным
  зрением}.'
