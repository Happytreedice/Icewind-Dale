description: Вы защищаете существо в пределах дистанции от атак. Пока длится заклинание,
  любое существо, прежде чем выбрать защищённое существо целью атаки или вредоносного
  заклинания, должно пройти испытание Мудрости. При провале оно должно выбрать другую
  цель или потерять свою атаку или заклинание. Это заклинание не защищает существо
  от эффектов с областью действия, например от взрыва  @UUID[Compendium.laaru-dnd5-hw.spells.Item.j2cNLHZYnbKl46gZ]{огненного
  шара}. Если защищённое существо совершает атаку, творит заклинание, действующее
  на врага, или наносит урон другому существу, это заклинание прекращает действовать.
