description: 'Вы наполняете воздух вращающимися кинжалами в 5-футовом кубе с центром
  в выбранной вами точке в пределах дистанции. Существо получает [[/r 4d4]] режущего
  урона, когда впервые за ход входит в область действия заклинания или начинает в
  ней свой ход.

  На высоких кругах. Если вы сотворяете это заклинание, используя ячейку 3-го круга
  или выше, урон увеличивается на [[/r 2d4]] за каждый круг ячейки выше 2-го.'
