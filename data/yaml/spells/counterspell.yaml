description: 'Вы пытаетесь помешать другому существу сотворить заклинание. Если существо
  творит заклинание 3-го круга или ниже, оно не срабатывает. Если это заклинание 4-го
  круга или выше, пройдите проверку вашей заклинательной характеристики. СЛ равна
  10 + круг вражеского заклинания. При успехе заклинание существа не срабатывает.

  На высоких кругах. Если вы сотворяете это заклинание, используя ячейку 4-го круга
  или выше, заклинание существа не срабатывает, если его круг не превышает круга использованной
  вами ячейки.'
