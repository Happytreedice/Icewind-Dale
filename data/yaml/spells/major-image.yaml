description: 'Вы создаёте образ объекта, существа или иного видимого явления, размером
  не больше 20-футового куба. Образ появляется в точке, которую вы видите в пределах
  дистанции, и существует, пока длится заклинание. Он кажется абсолютно реальным,
  производит звуки, запах и подходящую температуру окружающего воздуха. Однако нельзя
  создать достаточный холод или жар, чтобы нанести урон, достаточно громкий звук,
  чтобы он наносил урон громом или оглушал, или запах, способный вызвать тошноту (вроде
  смрада троглодитов).

  Пока вы находитесь в пределах дистанции от иллюзии, вы можете использовать действие,
  чтобы переместить образ в любую другую точку в пределах дистанции. Когда образ перемещается,
  вы можете изменять его так, чтобы его движение казалось естественным. К примеру,
  если вы перемещаете образ существа, можете заставить его перебирать ногами, будто
  оно идёт. Аналогично вы можете заставить иллюзию издавать разные звуки в разное
  время и даже изображать, будто она разговаривает.

  Физическое взаимодействие с образом выдаёт, что это иллюзия, потому что предметы
  проходят сквозь нее.  Существо, которое использует действие, чтобы изучить образ,
  сможет понять, что это иллюзия, успешно пройдя проверку Интеллекта (Расследование).
  СЛ проверки равна СЛ испытаний против ваших заклинаний. Если существо распознаёт
  иллюзию, оно может видеть сквозь образ, а прочие свойства образа становятся для
  него едва различимыми.

  На высоких кругах. Если вы сотворяете это заклинание, используя ячейку 6-го круга
  или выше, оно длится, пока не рассеяно, и не требует концентрации.'
