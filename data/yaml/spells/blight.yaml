description: 'Энергия некромантии омывает существо по вашему выбору, которое вы видите
  в пределах дистанции, и высасывает из него жизненные соки. Цель должна пройти испытание
  Выносливости. При провале цель получает [[/r 8d8]] некротического урона, при успехе
  — половину этого урона. Заклинание не действует на нежить и конструкции.

  Если ваша цель — существо-растение или магическое растение, оно проходит испытание
  с помехой и заклинание наносит ему максимальный урон.

  Если ваша цель — немагическое растение (не существо, а просто дерево или куст),
  оно не проходит испытание, а просто засыхает и умирает.

  На высоких кругах. Если вы сотворяете это заклинание, используя ячейку 5-го круга
  или выше, урон увеличивается на [[/r 1d8]] за каждый круг ячейки выше 4-го.'
