description: 'Вы пытаетесь обратить в камень одно существо, которое видите в пределах
  дистанции. Если тело цели состоит из плоти, она должна пройти испытание Выносливости.
  При провале цель &reference[restrained]{обездвижена}, а её плоть начинает твердеть.
  При успехе заклинание не срабатывает на цель.

  Существо, обездвиженное этим заклинанием, должно проходить испытание Выносливости
  в конце каждого своего хода. Если оно успешно пройдёт это испытание трижды, заклинание
  прекратит действовать. Провалив испытание трижды, существо обратится в камень —
  получит состояние &reference[petrified]{окаменения}, пока длится заклинание. Успехи
  и провалы необязательно должны быть подряд; подсчитывайте их, пока чего-то не наберётся
  три.

  Если существо получает физические повреждения, будучи окаменевшим, после возвращения
  в обычную форму оно сохраняет эту травму.

  Если вы концентрируетесь на заклинании всю его длительность, существо останется
  окаменевшим, пока эффект не будет снят.'
