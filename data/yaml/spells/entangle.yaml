description: 'Цепкие лозы и лианы выползают из земли в 20-футовом квадрате, начинающемся
  с точки в пределах дистанции. Пока длится заклинание, эти растения превращают область
  действия в пересечённую местность.

  Каждое существо в области в момент сотворения должно пройти испытание Силы. При
  провале оно &reference[restrained]{обездвижено} лозами, пока длится заклинание.
  Существо, обездвиженное лозами, может использовать действие, чтобы пройти проверку
  Силы. СЛ равна СЛ испытаний против ваших заклинаний. При успехе существо освобождается.

  Когда заклинание прекращает действовать, созданные растения увядают.'
