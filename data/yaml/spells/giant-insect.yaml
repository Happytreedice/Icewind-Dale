description: 'Вы превращаете до десяти многоножек, трех пауков, пяти ос или одного
  скорпиона в пределах дистанции в их гигантские варианты. На время, пока длится заклинание,
  они становятся гигантскими многоножками, гигантскими пауками, гигантскими осами
  или гигантским скорпионом соответственно


  Каждое из этих существ подчиняется вашим устным приказам. В бою они действуют в
  ваш ход каждый раунд. У мастера есть параметры этих существ, он разыгрывает их действия
  и перемещение.


  Существо остаётся гиганским, пока длится заклинание, пока его ПЗ не снизятся до
  0 или пока вы не прекратите эффект, потратив действие.


  С разрешения мастера вы можете выбрать другие цели. К примеру, если вы превратите
  пчелу, она может получить параметры гигантской осы.'
