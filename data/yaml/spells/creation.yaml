description: "Вы вытягиваете клочья теневой ткани из Царства Теней и создаёте в пределах\
  \ дистанции неживой объект из растительной материи: ткани, верёвки, древесину или\
  \ что-то подобное. Вы можете также использовать заклинание, чтобы создать минеральные\
  \ объекты, такие как камни, кристаллы или металл. Созданный объект должен быть не\
  \ больше 5-футового куба и иметь форму и материал, которые вы раньше видели.\n\n\
   Длительность заклинания зависит от материала объекта. Если он создан из разных\
  \ материалов, используйте самую короткую длительность.\n\nCreation\n\nМатериал\n\
  \nДлительность\n\nРастительная материя\n1 день\n\nКамень или кристалл\n12 часов\n\
  \nДрагоценный металл\n1 час\n\nДрагоценный камень\n10 минут\n\nАдамантин или мифрал\n\
  1 минута\n\n Если использовать материал, созданный этим заклинанием, как реагент\
  \ для другого заклинания, оно не сработает. \n На высоких кругах.  Если вы сотворяете\
  \ это заклинание, используя ячейку 6-го круга или выше, куб увеличивается на 5 футов\
  \ за каждый круг ячейки выше 5-го."
