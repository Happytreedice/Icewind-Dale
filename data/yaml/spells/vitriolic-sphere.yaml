description: 'В указанной вами точке в пределах дистанции заклинания появляется сияющий
  шар изумрудно-зелёной кислоты диаметром 1 фут, взрывающийся сферой с радиусом 20
  футов.

  Все существа в этой области должны пройти испытание Ловкости. При провале существо
  получает урон кислотой [[/r 10d4]] и ещё [[/r 5d4]] урона кислотой в конце своего
  следующего хода. В случае успешного испытания существо получает половину первичного
  урона и не получает урона в конце своего следующего хода.

  На высоких кругах.  Если вы сотворяете это заклинание, используя ячейку 5 круга
  или выше, то первичный урон увеличивается на [[/r 2d4]] за каждый круг ячейки выше
  4.'
