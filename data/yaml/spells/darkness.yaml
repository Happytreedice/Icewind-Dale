description: 'Из выбранной вами точки в пределах дистанции исходит магическая тьма,
  наполняя сферу радиусом 15 футов, пока длится заклинание. &reference[darkness]{Тьма} распространяется
  и за углы. Существо с ночным зрением не может видеть в ней, и никакой немагический
  свет не может её осветить.

  Если начальная точка находится на объекте, который вы держите, или на объекте, который
  не носят и не держат другие существа, то тьма исходит от этого предмета и перемещается
  вместе с ним. Если полностью накрыть источник тьмы непрозрачным предметом вроде
  ведра или шлема, он заблокирует тьму.

  Если область действия этого заклинания накладывается на область света, созданного
  заклинанием 2-го круга или ниже, заклинание, создавшее свет, рассеивается.'
