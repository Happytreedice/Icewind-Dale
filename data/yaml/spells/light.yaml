description: 'Прикоснитесь к объекту размером не более 10 футов в любом измерении,
  Пока длится заклинание, этот объект будет испускать &reference[brightlight]{яркий
  свет} в радиусе 20 футов и &reference[dimlight]{тусклый свет} ещё на 20 футов. Свет
  может быть любого цвета на ваш выбор. Если полностью накрыть объект чем-то непрозрачным,
  свет блокируется. Заклинание прекращает действовать, если вы сотворите его снова
  или прекратите его, потратив действие.

  Если цель — объект, который носит или держит враждебное существо, оно должно успешно
  пройти испытание Ловкости, чтобы избежать заклинания.  

  *Для удобства можно использовать макрос @UUID[Compendium.laaru-dnd5-hw.macro.Macro.QO6uifHkpXXX6xWI]{Свет}
  (игроку надо перенести его на панель быстрого доступа).'
