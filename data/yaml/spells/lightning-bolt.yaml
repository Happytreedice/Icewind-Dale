description: 'Удар молнии в виде линии длиной 100 футов и шириной в 5 футов исходит
  от вас в выбранном вами направлении. Каждое существо на линии должно пройти испытание
  Ловкости. При провале существо получает [[/r 8d6]] урона молнией, а при успехе —
  половину этого урона.

  Молния поджигает все горючие предметы в области действия, кроме тех, что носят или
  держат.

  На высоких кругах. Если вы сотворяете это заклинание, используя ячейку 4-го круга
  или выше, урон увеличивается на [[/r 1d6]] за каждый круг ячейки выше 3-го.'
