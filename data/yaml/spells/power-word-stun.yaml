description: 'Вы произносите слово силы, и оно поражает разум одного существа, которое
  вы видите в пределах дистанции. Если у цели 150 ПЗ или меньше, она в &reference[stunned]{шоке}.
  В противном случае заклинание не действует.

  Цель в шоке должна проходить испытание Выносливости в конце каждого своего хода.
  При успехе эффект шока прекращается.'
