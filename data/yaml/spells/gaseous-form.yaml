description: 'Вы касаетесь согласного существа и превращаете его вместе со всем, что
  оно носит и держит, в облако тумана, пока длится заклинание. Заклинание прекращает
  действовать, если ПЗ существа снижаются до 0.

  На бестелесных существ заклинание не влияет. Находясь в этой форме, цель может перемещаться
  только со скоростью полёта в 10 футов. Цель может входить в пространство, занятое
  любым другим существом, и оставаться там. У цели @UUID[Compendium.dnd5e.srd-actions.Item.w7WKEM8had6v4vy8]{устойчивость}
  к немагическому урону и преимущество к испытаниям Силы, Ловкости и выносливости.
  Цель может проходить сквозь небольшие отверстия, щели и даже трещины, а вот жидкость
  для неё не отличается от сплошной твёрдой поверхности. Цель не может упасть и продолжает
  парить в воздухе, даже если она  &reference[stunned]{в шоке} или  &reference[incapacitated]{выведена
  из строя}.

  Находясь в форме облака, цель не может говорить или взаимодействовать с объектами.
  Любые предметы, которые цель несла или держала, нельзя бросить, использовать или
  как-то ещё с ними взаимодействовать. Цель не может атаковать или творить заклинания.'
