description: 'Вы создаёте вертикальную стену вращающихся острых лезвий из магической
  энергии. Стена появляется в пределах дистанции и существует, пока длится заклинание.
  Вы можете сделать прямую стену длиной до 100 футов, высотой до 20 футов и толщиной
  до 5 футов либо кольцевую стену диаметром до 60 футов, высотой до 20 футов и толщиной
  до 5 футов. Стена даёт существам за ней &reference[cover]{укрытие} на три четверти,
  ее пространство — &reference[difficultterrain]{пересеченная местность}.

  Когда существо входит в область стены впервые за ход или начинает там свой ход,
  оно должно пройти испытание Ловкости. При провале существо получает [[/r 6d10]]
  режущего урона, при успехе — половину этого урона.'
