description: 'Вы поднимаете руки, сложив вместе большие пальцы и растопырив остальные,
  и тонкие полоски пламени вырываются из выставленных пальцев. Каждое существо в пределах
  15-футового конуса должно пройти испытание Ловкости. При провале существо получает
  [[/r 3d6]] урона огнём, при успехе — половину этого урона.

  Пламя поджигает все горючие предметы в области действия, кроме тех, что носят или
  держат.

  На высоких кругах. Если вы сотворяете это заклинание, используя ячейку 2-го круга
  или выше, урон увеличивается на [[/r 1d6]] за каждый круг ячейки выше 1-го.'
