description: 'Вокруг точки, которую вы видите прямо над вами в пределах дистанции,
  появляется грозовое облако в форме цилиндра 10 футов высотой и радиусом 60 футов.
  Заклинание не сработает, если вы не видите точки, где может появиться облако (к
  примеру, если вы в комнате, где оно не поместится).


  Когда вы творите это заклинание, выберите точку, которую видите, находящуюся под
  облаком. Молния обрушивается из облака в эту точку. Каждое существо в пределах 5
  футов от точки должно пройти испытание Ловкости. При провале существо получает [[/r
  3d10]] урона молнией, при успехе — половину этого урона. В каждый ваш ход, пока
  длится заклинание, вы можете использовать действие, чтобы таким образом вызвать
  молнию в ту же точку или в другую.


  Если вы творите это заклинание под открытым небом в бурю, оно даёт вам власть над
  уже существующей грозой, а не создаёт новую. В таких условиях урон заклинания увеличивается
  на [[/r 1d10]].


  На высоких кругах. Если  вы сотворяете это заклинание, используя ячейку 4-го круга
  или выше, урон увеличивается на [[/r 1d10]] за каждый круг ячейки выше 3-го.'
