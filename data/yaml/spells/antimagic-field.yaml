description: 'Вас окружает невидимая сфера антимагии радиусом 10 футов. Её область
  отрезана от магической энергии, наполняющей мультивселенную. Внутри сферы нельзя
  творить заклинания, призванные существа исчезают и даже магические предметы становятся
  обычными. Пока длится заклинание, сфера перемещается вместе с вами — вы остаётесь
  в её центре.

  Заклинания и прочие магические эффекты, кроме тех, что созданы артефактом или божеством,
  подавляются в сфере и не могут проникнуть в неё. Ячейка для творения подавленного
  заклинания всё равно тратится. Пока эффект подавлен, он не действует, но это время
  все равно учитывается в длительности.

  Нацеленные эффекты. Заклинания и прочие магические эффекты, такие как @UUID[Compendium.laaru-dnd5-hw.spells.Item.FgeTrsMqHnbTEIPl]{Волшебная
  стрела} и @UUID[Compendium.laaru-dnd5-hw.spells.Item.KcziiS01MniKTNZ9]{Приворот
  гуманоида}, нацеленные на существо или объект внутри сферы, не действуют на цель.

  Области магии. Области действия других заклинаний и магических эффектов, таких как
  @UUID[Compendium.laaru-dnd5-hw.spells.Item.j2cNLHZYnbKl46gZ]{Огненный шар}, не распространяются
  в сферу. Если сфера попадает в область действия магии, в той части, где они совпадают,
  эффект подавляется. К примеру, пламя, которое вызвала огненная стена, подавляется
  в пределах сферы, так что в стене может появиться проход

  Заклинания. Любые активные заклинания или иные магические эффекты, действовавшие
  на существо или объект внутри сферы, подавляются, пока существо или объект находятся
  в сфере.

  Магические предметы. Свойства и силы магических предметов внутри сферы подавляются.
  К примеру, +1 длинный меч в сфере действует как обычный немагический длинный меч.
  Свойства и силы магического оружия подавляются, если использовать его против цели,
  находящейся в сфере, или если атакующий им находится в сфере. Но когда магическое
  оружие или магический боеприпас полностью покидает сферу (к примеру, если вы выстрелите
  магической стрелой или бросите магическое копьё в цель вне сферы), его магия перестаёт
  подавляться сразу по выходу из сферы.

  Магическое перемещение. Телепортация и планарные путешествия в сфере невозможны:
  нельзя магически переместиться ни в неё, ни из неё. Порталы в иное место, мир или
  план бытия и межпространственные карманы вроде тех, что создаёт заклинание @UUID[Compendium.laaru-dnd5-hw.spells.Item.iWE8zdeYjqUf6pg6]{Фокус
  с верёвкой}, закрываются, пока находятся в сфере.

  Существа и объекты. Существо или объект, призванные или созданные магией, временно
  прекращают существовать, попав в сферу. Существо немедленно появляется вновь, как
  только место, где оно находилось, оказывается за пределами сферы.

  Рассеивание магии. Заклинания и магические эффекты, такие как @UUID[Compendium.laaru-dnd5-hw.spells.Item.ZdDJVUlzYudd4nHO]{Рассеивание
  магии}, не действуют на сферу. Аналогичным образом две сферы, созданные разными
  заклинаниями поле антимагии, не аннулируют друг друга.'
