description: 'Одно существо или незакрепленный объект на ваш выбор, которых вы видите
  в пределах дистанции, поднимается вертикально вверх на 20 футов или менее и остается
  там подвешенным, пока длится заклинание. Заклинание может поднять цель, весящую
  не более 500 фунтов. Если существо не согласно, оно может пройти испытание Выносливости,
  при успехе заклинание на него не подействует.


  Цель может перемещаться, только подтягиваясь к неподвижным предметам или поверхностям
  в зоне ее досягаемости или отталкиваясь от них (например, от стен или потолка),
  что позволяет ей перемещаться как при лазании. Вы можете поднять или опустить цель
  на 20 или менее футов в ваш ход. Если ваша цель — вы сами, вы можете двигаться вверх
  или вниз в качестве части вашего перемещения. В противном случае вы можете использовать
  действие, чтобы переместить цель, и она должна оставаться в пределах дистанции заклинания.


  Когда заклинание прекращает действовать, цель плавно опускается на землю, если ещё
  находилась в воздухе на тот момент.'
