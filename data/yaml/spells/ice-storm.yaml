description: 'Ледяной град обрушивается на землю в цилиндре высотой 40 футов и радиусом
  20 футов с центром в точке в пределах дистанции. Каждое существо в пределах цилиндра
  должно пройти испытание Ловкости. При провале существо получает [[/r 2d8]] дробящего
  урона и [[/r 4d6]] урона холодом или половину этого урона при успехе. Градины превращают
  область действия бури в пересечённую местность до конца вашего следующего хода.

  На высоких кругах. Если вы сотворяете это заклинание, используя ячейку 5-го круга
  или выше, дробящий урон увеличивается на [[/r 1d8]]  за каждый круг ячейки выше
  4-го.'
