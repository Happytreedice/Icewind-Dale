description: 'Вы создаёте молнию, и она поражает цель на ваш выбор, которую вы видите
  в пределах дистанции. Затем три молнии исходят от цели к трем другим, каждая из
  которых должна быть в пределах 30 футов от первой. Целью может быть существо или
  объект, нельзя нацелить на неё больше одной молнии.

  Каждая цель должна пройти испытание Ловкости. Цель получает [[/r 10d8]] урона молнией
  при провале или половину этого урона при успехе.

  На высоких кругах. Если вы сотворяете это заклинание, используя ячейку 7-го круга
  или выше, то за каждый круг ячейки выше 6-го из первой цели исходит на одну молнию
  больше.'
