description: 'Вы и не более десяти согласных существ на ваш выбор, которых вы видите
  в пределах дистанции, принимаете газообразную форму и выглядите как облака, пока
  длится заклинание. Оставаясь в форме облака, существо может перемещаться со скоростью
  полёта 300 футов и получает @UUID[Compendium.dnd5e.srd-actions.Item.w7WKEM8had6v4vy8]{устойчивость}
  к урону от немагического оружия. Единственные действия, доступные в этой форме,
  — @UUID[Compendium.dnd5e.srd-actions.Item.v1tkJ8DKVJFCNFPM]{Рывок} и возвращение
  в обычную форму. На возвращение уходит 1 минута, во время которой существо &reference[incapacitated]{выведено
  из строя} и не может перемещаться. Пока длится заклинание, существо может снова
  вернуться в форму облака, на это превращение тоже требуется 1 минута.


  Если существо находится в форме облака и летит в момент, когда заклинание прекращает
  действовать, существо опускается на 60 футов за раунд в течение 1 минуты, чтобы
  безопасно приземлиться. Если оно не успевает приземлиться за 1 минуту, оставшееся
  расстояние оно падает.'
