description: 'Пока длится заклинание, вы управляете любой свободной водой в выбранной
  вами области (куб с ребром до 100 футов). При сотворении вы можете выбрать один
  из перечисленных эффектов заклинания. В качестве действия в свой ход вы можете повторить
  тот же эффект или выбрать другой.

  Водоворот. Для этого эффекта требуется водоём площадью не менее 50 на 50 футов и
  глубиной не менее 25 футов. Водоворот образует воронку 5 футов в ширину у основания,
  50 футов в ширину наверху и 25 футов в высоту в центре области. Любое существо или
  объект в воде в пределах 25 футов от воронки будет притянуто на 10 футов в её сторону.
  Существо может отплыть от воронки, успешно пройдя проверку Силы (Атлетика). СЛ равна
  СЛ испытаний против ваших заклинаний.

  Когда существо впервые за ход попадает в воронку или начинает в ней свой ход, оно
  должно пройти испытание Силы. При провале существо получает [[/r 2d8]] дробящего
  урона и остаётся затянутым в воронку, пока длится заклинание. При успехе существо
  получает половину этого урона и не затянуто в воронку. Существо, затянутое в воронку,
  может использовать действие, чтобы попытаться выплыть из нее, как описано выше,
  но у него помеха к этой проверке Силы (Атлетика).

  Когда объект впервые за ход оказывается в воронке, он получает [[/r 2d8]] дробящего
  урона. Этот урон повторяется каждый раунд, пока он остаётся в воронке.

  Перенаправление потока. Вы заставляете текущую воду в области течь в другом направлении
  на ваш выбор, даже если воде придется перетекать через препятствия,  вверх по стенам
  или в других необычных направлениях. Вода в области двигается туда, куда вы её направите,
  но, выйдя за пределы области, она снова течёт в обычном направлении. Вода продолжает
  течь в указанном вами направлении, пока длится заклинание или пока вы не выберете
  иной эффект.

  Потоп. Вы заставляете уровень всей стоячей воды в области подняться на 20 футов.
  Если в область входит берег, вода выплескивается на него.

  Если вы выбрали область внутри большего водоёма, вместо этого вы создаёте 20-футовую
  волну, которая проносится с одной стороны области на другую, а затем обрушивается.
  Любой транспорт огромного размера или меньше на пути волны будет перенесён на другой
  конец области. Любой транспорт огромного размера или меньше, попавший под удар волны,
  переворачивается с шансом [[/r 1d100]] 25%.

  Уровень воды остаётся высоким, пока длится заклинание или пока вы не выберете иной
  эффект. Если эффект вызвал волну, она повторяется в начале вашего следующего хода,
  пока длится эффект потопа.

  Разделение вод. Вы заставляете воду в области расступиться, создав проход. Он тянется
  через всю область действия, а расступившаяся вода образует стены по бокам. Проход
  остаётся, пока длится заклинание или пока вы не выберете иной эффект. После этого
  воды плавно заполнят проход в течение следующего раунда, пока не восстановится обычный
  уровень воды.'
