description: "Вы призываете слугу-элементаля. Выберите область воздуха, земли, огня\
  \ или воды объёмом с 10-футовый куб в пределах дистанции. Элементаль с классом опасности\
  \ не выше 5, соответствующий выбранной вами области, появляется в незанятом пространстве\
  \ в пределах 10 футов от неё. К примеру, элементаль огня вылезает из костра, элементали\
  \ земли — из-под земли. Элементаль исчезает, когда его ПЗ снижаются до 0 или когда\
  \ заклинание прекращает действовать. \nЭлементаль дружественен вам и вашим спутникам,\
  \ пока длится заклинание. Сделайте бросок инициативы для элементаля, чтобы он совершал\
  \ собственные ходы. Он подчиняется вашим устным приказам (действие от вас не требуется).\
  \ Если вы не отдаёте приказов, он защищается от враждебных существ, но других действий\
  \ не совершает. Если ваша концентрация нарушена, элементаль не исчезнет, но вы потеряете\
  \ контроль над ним. Он станет враждебен вам и вашим спутникам и может атаковать.\
  \ Вы не можете прервать призыв неуправляемого элементаля, он исчезнет сам через\
  \ 1 час после призыва. Параметры элементалей есть у мастера. \nНа высоких кругах.\
  \ Если вы сотворяете это заклинание, используя ячейку 6-го круга или выше, класс\
  \ опасности увеличивается на 1 за каждый круг ячейки выше 5-го.\nПримечание. Для\
  \ работоспособности Призыва, мастеру нужно в настройках прав игроков разрешить создавать\
  \ Токены и Актёров."
