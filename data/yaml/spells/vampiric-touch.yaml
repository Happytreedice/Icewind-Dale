description: 'Касание вашей руки, облечённой в тень, способно высасывать жизненную
  силу из других, чтобы исцелять ваши раны. Совершите атаку заклинанием в ближнем
  бою по существу в пределах вашей зоны досягаемости. При попадании цель получает
  [[/r 3d6]] некротического урона, а вы восстанавливаете ПЗ в количестве, равном половине
  нанесенного урона. Пока длится заклинание, можете в качестве действия повторять
  эту атаку в любой ваш ход.

  На высоких кругах.  Если вы сотворяете это заклинание, используя ячейку 4-го круга
  или выше, урон увеличивается на [[/r 1d6]] за каждый круг ячейки выше 3-го.'
