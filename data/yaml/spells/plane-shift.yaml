description: 'Вы и не более восьми согласных существ, сцепивших руки в круг, переноситесь
  на другой план бытия. Вы можете указать место перемещения в общих чертах, например
  Латунный город на Стихийном плане Огня или дворец Дисплатера на втором круге Девяти
  Преисподних, и вы окажетесь в указанном месте. Если, к примеру, вы пытаетесь попасть
  в Латунный город, то по усмотрению мастера вы можете попасть на Стальную улицу,
  к Пепельным вратам, а можете и оказаться напротив него по другую сторону узкого
  пролива в Море Огня.

  Как вариант, если вы знаете последовательность символов круга телепортации на другом
  плане бытия, заклинание может перенести вас в этот круг. Если размеров круга телепортации
  недостаточно, чтобы вместить всех перенесённых вами существ, они появятся в ближайшем
  незанятом пространстве рядом с кругом.

  Вы можете применить это заклинание, чтобы изгнать несогласное существо на другой
  план. Выберите существо в пределах вашей зоны досягаемости и совершите по нему атаку
  заклинанием в ближнем бою. При попадании существо должно пройти испытание Харизмы.
  При провале оно перемещается в случайно выбранное место на указанном вами плане
  бытия. Существо, перенесённое таким образом, должно само найти, как вернуться на
  ваш план.'
