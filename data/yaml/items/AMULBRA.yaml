description: 'Простой стальной амулет, освящённый жрецами Темпуса.

  Отвага (1/день): Действием вы взываете к амулету. На 1 час вы и союзники в пределах
  10 футов от вас получаете +1 к броскам атаки, +3 к броскам урона, [[/heal 5 temp]]
  временных хитов и иммунитет к состоянию Испуганный.

  Жрецы Темпуса благословили этот простой стальной амулет для воина по имени Телн
  Грэм. Этот могучий воин в крупных сражениях легко поддавался панике. Благодаря этому
  значку, который он носил у сердца, Телн справлялся со своими приступами паники в
  важных битвах. Однако жрецы Темпуса отобрали у воина амулет, когда сочли, что Телн
  — неисправимый трус. Говорят, после этого он бросил поиски приключений и стал фермером.'
