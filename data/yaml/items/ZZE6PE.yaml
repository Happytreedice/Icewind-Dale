description: 'Клинок, посвящённый истреблению орков; его истинное имя — Груумшакан.

  Точность: Прекрасный эльфийский клинок, дающий бонус +2 к броскам атаки и урона.
  Против орков бонус возрастает до +4.

  Ослепление орков: Половина попаданий этим клинком ослепляет орков. При попадании
  по орку бросьте [[/r 1d6]] — при результате 1–3 цель ослеплена до конца её следующего
  хода.

  Это красивое оружие с насмешливым именем Глаз Хряка — эльфийский клинок, предназначенный
  для уничтожения орков. Настоящее его название — Груумшакан, но большинству он известен
  как Глаз Хряка. Это имя напоминает о решающем ударе, который Кореллон Ларетиан,
  покровитель эльфийской расы, нанес Груумшу, главе орочьего пантеона. Характерная
  особенность клинка — вплавленный в стекло орочий глаз в рукояти.

  Этот меч изготовил в 239 л.д. эльфийский чародей и оружейник Шенарр Кэйт. Наложив
  на оружие чары, он преподнес клинок своему двоюродному брату, следопыту по имени
  Велаик Кэйт, и тот нередко пускал его в дело против орков близ Кормантира. Сын следопыта
  Тредейн и внук Галесик в течение нескольких столетий благополучно продолжали дело
  Велаика. Со временем семейство собралось в далекий путь на Эвермит. Так как Груумшакан
  не был лунным клинком семьи, Кэйты предпочли продать его и собрать необходимые компоненты,
  чтобы превратить старого дядюшку Шенарра в баэльнорна. Последние записанные слова
  Шенарра свидетельствуют, что его изрядно позабавило, как маленький меч помог ему
  обойти смерть.'
