description: 'О владельце известно мало; мудрецы полагают, что оружие происходит из
  иного мира под названием «Эйбранча».

  Оружие дальнего боя.

  Меткость (1 раз в день): Бонусным действием вы можете на 2 раунда получить бонус +5 к броскам атаки дистанционным оружием.

  Об этом оружии и его владельце известно немного. Мудрецы считают, что оно происходит
  из другого мира под названием Эйбранха. Волшебники, путешествующие по другим планам,
  побывав в Эйбранхе, отзывались о ней как о редкостно неинтересном месте. Жизнь там
  обыденна и скучна, герои встречаются редко, а население большей частью совершенно
  ординарное. Вероятно, потому об этом мире нет практически никаких сведений. О владельце
  оружия известно лишь, что это был образованный человек. Фиолетовое дерево, из которого
  изготовлено ложе арбалета, вероятно, произрастает исключительно в Эйбранхе.

  Получив с другого плана сведения о Брене Мюллере, вы узнали о новой особенности
  этого оружия. Раз в день, оно может значительно повышать свою точность на два раунда.'
