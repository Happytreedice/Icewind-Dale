description: 'С виду ничем не примечательное кольцо.

  Проклятие: Кольцо срастается с пальцем и снимается лишь заклинанием @UUID[Compendium.dnd5e.spells.Item.XZhdgVK3cLoxNCQl]{«Снятие
  проклятия»}. Пока оно надето, носитель получает дополнительный урон от всех рукопашных
  атак.

  Это проклятое кольцо срастается с пальцем носителя и снимается лишь заклинанием
  снятия проклятия. Пока оно надето, носитель получает дополнительный урон от всех
  рукопашных атак. Известно, что такие вещицы создают ловиатарцы и разбрасывают их
  по Королевствам себе на потеху.

  Это проклятое кольцо впивается в палец носящему, и его можно снять только с помощью
  заклинания «Снять проклятие». Надевший его получает дополнительный урон в ближнем
  бою. Известно, что такие кольца создают последователи Ловиатар и распространяют
  их для собственного развлечения.'
