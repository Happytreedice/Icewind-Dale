description: 'Стрела с оплетающими путами, спутывающая жертву.

  Путы: Поражённая цель должна преуспеть в спасброске Силы [[/save ability=str dc=13]],
  иначе станет Опутанной на 4 раунда (может повторять спасбросок действием).

  Стрелы обездвиживания используют преимущественно следопыты-последователи Эльдат,
  живущие в Срединных Западных землях Фаэруна. Они высоко ценят эти снаряды за способность
  обезвредить цель, не нанеся ей большого вреда. Чаще всего с их помощью ловят животных,
  но и против гуманоидных злоумышленников они достаточно эффективны. Обычно такие
  стрелы они украшены голубыми и зелеными лентами и цветами, чтобы показать, что они
  созданы миротворцами Эльдат. Это, к сожалению, делает их менее эффективными в бою.'
