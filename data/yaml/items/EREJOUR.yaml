description: '«Завтра попробую перебраться через горы у перевала Кулдахар. Отчасти
  мне кажется, что я должен помочь Хротгару и остальным в их расследовании: случись
  поблизости чудовища, защиты у них почти никакой. Ба! Может, братья мои и правы:
  нам, эльфам, не след вмешиваться в мир людей. Эти земли когда-то принадлежали нашему
  народу, но то было давно. Теперь это край диких варваров-регедов и Десяти Городов.
  Зачем противиться потоку? Те, кто противится, часто скатываются во тьму войны и
  завоеваний, чтобы вернуть земли, которыми мы когда-то правили. Затея, обречённая
  на провал. Ну вот, опять я за своё. Кореллон, помоги мне, я начинаю говорить как
  кузен Ксан!»

  Выдержка...

  «Завтра я попробую перебраться через горы рядом с Кулдахарским Перевалом. С одной
  стороны, я чувствую, что обязан помочь Хротгару и остальным с расследованием. Всё-таки
  они недостаточно защищены, а если встретятся с монстрами... Тьфу! Возможно, мои
  собратья правы. Нам, эльфам, не следует вмешиваться в дела людей. Пусть когда-то
  эти земли принадлежали нашему народу, но те дни позади. Теперь здесь правят дикие
  варвары Регеда и Десять Городов. Что пользы пытаться вернуть прошлое? Это лишь ввергает
  нас во тьму новых войн в стремлении вернуть земли, которыми мы когда-то правили.
  И мы обречены на поражение. Ну вот, опять. Помоги мне Кореллон, я говорю, как кузен
  Кзан!»'
