description: 'Пылающие кулаки Линь Мэй — оружие мастера боевых искусств; удары окутаны
  магическим пламенем.

  Пламенный удар: Пока наручи надеты, ваши безоружные удары наносят дополнительно
  [[/damage 1d2 fire]] урона огнём.

  Горящие руки (1/день): Действием вы выпускаете веер пламени: каждое существо в 15-футовом
  конусе должно совершить спасбросок Ловкости [[/save ability=dex]], получая [[/damage
  3d6 fire]] урона огнём при провале или половину этого урона при успехе.

  Лин Мэй прославилась своей изысканной красотой и отвратительным нравом. Когда родители
  решили подыскать ей мужа, она объявила, что только тот, кто сумеет одолеть ее в
  поединке один на один, получит ее руку и сердце. Претенденты стекались со всех уголков
  Кара-Тура и каждый из них жаждал победы, но могучая Лин одолела каждого из них голыми
  руками. Число воздыхателей таяло на глазах, и в итоге остался только один юноша,
  чьи глаза сверкали от доброты ничуть не меньше, чем его позолоченные наручи от лучей
  солнца. Он подарил эти наручи неприступной девушке со словами: «Никто не в силах
  приручить твою страсть, а те кто надеется это сделать не замечают твоих чувств.
  Прими эти украшения и пусть они напоминают тебе, что никто и никогда не сможет покорить
  тебя». Лин Мэй не вышла замуж за этого человека, но в тот же день ушла с ним из
  дома на поиски приключений. Вместе они провели остаток своей жизни и были всё это
  время друг другу ближе, чем любые муж и жена. В конце концов они скрылись от любопытных
  глаз и никто не знает, что с ними стало. Эти наручи — всё что осталось после Лин,
  и в них до сих пор пылает ее дикая страсть.'
