description: 'Это с виду потёртое одеяние «уснуло» по приказу Лисан, чтобы не выдать
  в ней жрицу Аурил. Стоит на него упасть хоть одной снежинке, оно превращается в
  искрящийся белый плащ, позволяющий парить над сугробами и с лёгкостью переходить
  даже бушующие реки. Большинство торговцев не захотят покупать эту вещь — или дадут
  за неё гроши: они видят в ней святыню Аурил Ледяной Девы, способную привлечь её
  последователей… и её недовольство. Магический предмет, надеваемый.

  Сопротивление: Даёт сопротивление урону электричеством.

  Обережные чары: Вы получаете бонус +1 к спасброскам, против превращения.

  Свобода перемещения: Раз в день действием носитель может призвать силу одеяния:
  в течение 40 минут его скорость не может быть уменьшена магией, он не может быть
  парализован или опутан и беспрепятственно выбирается из любых удерживающих эффектов
  (паутина, паралич упыря, удержание личности и подобное).

  Эта старая мантия «впала в спячку» по желанию Лизан, чтобы не выдать в ней жрицу
  Аурил. Когда хотя бы одна снежинка касается этой мантии, она обращается в белоснежную
  накидку, которая позволяет облаченному в нее перелетать сугробы и без труда преодолевать
  даже бушующие реки. Вряд ли кто-то из купцов хорошо заплатит за эту вещь, если вообще
  захочет купить ее — это священный предмет Аурил, Ледяной Девы, и он может привлечь
  внимание ее последователей и вызвать немилость самой богини.

  Такие мантии создают во время ритуала Скорой Бури, отмечающего приход зимы. Они
  помогают последователям Аурил противостоять огню и любым попыткам остановить или
  замедлить их движение. Хотя жрицы Аурил обладают естественным сопротивлением холоду
  и без труда преодолевают снежные заносы и замерзшие реки, такие мантии усиливают
  божественную защиту. Жрицы получают дополнительное сопротивление холоду (а при наличии
  иммунитета к холоду — способность поглощать его силу) и могут частично вытягивать
  тепло из огненных атак, направленных на носителя. Кроме того, чары мантии могут
  преодолеть эффект заклинаний «Паутина» и «Удержать персону», паралича и тому подобных
  сил.'
