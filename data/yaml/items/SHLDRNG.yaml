description: 'Кольцо, окружающее носителя незримым барьером силы.

  Щит: Пока кольцо надето и настроено на вас, вы получаете +2 к КД, а заклинание @UUID[Compendium.dnd5e.spells24.Item.phbsplMagicMissi]{Волшебная
  стрела} не может причинить вам вреда. Кольцо признаёт лишь волшебников.

  Это простое кольцо из жадеита обладает мощными магическими силами. Его изготовил
  Бил, язвительный маг, не снискавший славы создатель заклинаний «Фантастический эль
  Била» и «Лопающийся шар Била». В своих нередких схватках с другими магами Бил находил
  это кольцо весьма полезным. Когда он исчез из Королевств 20 лет назад, это кольцо
  было одним из множества предметов, оставшихся его друзьям и коллегам. Так как большинство
  из них были простыми разбойниками, то кольцо, вероятнее всего, сразу же продали
  предложившему наибольшую цену.'
