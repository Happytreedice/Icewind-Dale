description: 'История Монеты Судьбы:

  В старых сказках говорится, что удача играет решающую роль в жизни любого разумного
  существа. Каждый раз, когда в Королевствах появляется на свет младенец, Тимора подбрасывает
  монету, отлитую из останков Тихе, первой богини удачи. Бешаба называет сторону монеты,
  луна (орел) или плащ (решка). Если она угадывает, какой стороной упадет монета,
  то новорожденному до конца дней будет сопутствовать невезение, а если нет, то всю
  жизнь ему будет улыбаться Госпожа Удача. Порой монета падает на ребро, и эти смертные,
  неподвластные случаю, сами куют свою судьбу, потому что имеют над нею больше власти,
  чем даже боги.'
