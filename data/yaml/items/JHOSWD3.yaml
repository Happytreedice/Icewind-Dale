description: 'Клинок из груди Икасарахт, черпающий силу из вод Лак Диннешир.

  Сила озера: Вблизи Лак Диннешир (в пределах драконьего перелёта) меч действует в
  полную силу: +10 к максимуму хитов владельца (учтено эффектом); вдали от озера бонус
  меча снижается с +5 до +1, а прибавка хитов пропадает (снимите эффект).

  Лечение тяжких ран (3/день): Действием вы касаетесь существа клинком плашмя: оно
  восстанавливает [[/heal 27]] хитов.

  Мощь Айхонена (1/день): Действием вы взываете к силе клинка: ваша Сила повышается
  на 3 на 1 час.

  Сопротивление холоду: Пока это оружие у вас в руках, вы имеете сопротивление урону
  холодом.

  Сопротивление огню: Пока это оружие у вас в руках, вы имеете сопротивление урону
  огнём.

  Этот некогда разбитый клинок принес погибель последнему матриарху белых драконов
  — Иказарахт. Он принадлежал Айонену, предку рыбака Джонена из Восточной Гавани.
  Почти сотню лет этот меч пролежал на дне озера, ожидая своего возвращения к продолжателю
  рода. Клинок, похоже, черпает энергию из самого озера Лек Диннешер. Пока его владелец
  находится в пределах расстояния полета дракона от озера (а это немало по меркам
  любой расы), меч является очень серьезным оружием.

  Дворф-кузнец Тиернон «успокоил» клинок — похоже, этот мастер когда-то его и изготовил.
  В результате пробудились некоторые силы меча, утраченные, когда им убили Иказарахт.'
