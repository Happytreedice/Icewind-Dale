description: 'Изначальное имя этого странного клинка сгинуло в мутных глубинах Моря
  Мечей. Выточенный из магически укреплённой кости сахуагина, он, как считается, служил
  куо-тоа в их причудливых ритуалах. Рукоять — из коралла, обтянутого кожей сахуагина.
  Одно время им владел Локхарт, видный вор-приключенец и контрабандист с Побережья
  Мечей. Он и дал клинку нынешнее имя.

  Точность: Оружие ближнего боя, бонус +2 к атаке и урону.

  Перст смерти: При попадании бросьте [[/r 1d100]]: при результате 1–2 клинок обрушивает
  на цель @UUID[Compendium.dnd5e.spells.Item.HPvZm8YJO91k6Qdg]{«Перст смерти»} — цель
  должна преуспеть в спасброске Телосложения [[/save ability=con]], иначе умирает;
  при успехе она получает [[/damage 2d8 necrotic]] урона некротической энергией.

  Настоящее название этого странного клинка утеряно в глубинах Моря Мечей. Полагают,
  что это оружие, изготовленное из магически укрепленной кости сахуагина, использовали
  в причудливых ритуалах куо-тоа. Рукоятка сделана из коралла и кожи сахуагина. Некоторое
  время им владел Локхарт, путешественник, вор и контрабандист с Побережья Меча. Именно
  он дал клинку его нынешнее имя.'
