description: 'Рукавицы королевского дома Трескела, передающие частицу мастерства принца.

  Оружейное мастерство: +1 к броскам рукопашной атаки оружием и +2 к его урону.

  Перчатки оружейного мастерства: Наследство Мастеров

  Многие молодые воины мечтают о таких перчатках. В свое время они принадлежали королевской
  семье Фрескеля. Вобрав в себя частицу легендарного мастерства принца, эти перчатки
  дают владельцу возможность мастерски обращаться с любым оружием ближнего боя. Однако
  большинство их предыдущих хозяев встретили в сражении свою смерть: перчатки придают
  уверенность опытного мастера, но не добавляют мудрости.'
