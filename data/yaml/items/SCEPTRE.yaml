description: 'Чёрно-красный скипетр банитского жреца, вселяющий ужас и покорность.

  Тирания: Харизма +1; вы иммунны к состоянию Испуган.

  Плащ ужаса (1/день): Действием вы источаете волну ужаса радиусом 10 футов на 3 раунда:
  не-нежить, начинающая ход в области, должна преуспеть в спасброске Мудрости [[/save
  ability=wis dc=15]], иначе в панике бежит от вас 2d8 раундов.

  Подчинение (1/день): Действием вы подчиняете существо в пределах 40 футов: спасбросок
  Мудрости [[/save ability=wis dc=17]], при провале цель Очарована и выполняет ваши
  приказы 15 раундов (повторяет спасбросок при получении урона).

  Этот скипетр, зачарованный образцовым жрецом Бэйна, повидал вместе с хозяином немало
  ужасных сражений. Аркендрос, служитель Бэйна, был коварен и зол, но обладал выдающимися
  умственными и физическими способностями. Нередко он собирал под своим началом отряды
  из молодых воинов, легко поддающихся внушению, плутов и разнообразных бандитов и
  нагонял страх на весь Вотердип. Встречая отпор, Аркендрос обращался к силам красно-черного
  скипетра, и его подручные бросались в бой. Харизматичного жреца в конце концов прикончил
  в сражении жрец Торма и его товарищи-паладины.'
