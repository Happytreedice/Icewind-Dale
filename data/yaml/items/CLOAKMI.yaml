description: 'Эльфийский плащ из шёлка и шерсти, хранящий тепло дружбы своего создателя.

  Защита: Пока плащ надет и настроен на вас, вы получаете +3 к КД и +2 ко всем спасброскам.

  Эта эльфийская накидка, сотканная из шерсти и шелка, принадлежала великому волшебнику
  из Мит Нантара по имени Митран Лепесток Света. Митра славился любовью к странствиям
  и благосклонным отношением к «Н''Тель-Квессир», или «не-народу», то есть неэльфийскому
  населению мира. Эта накидка и принесла ему гибель, потому что ее соткала и зачаровала
  его возлюбленная, темная эльфийка Раува Вринн. Покрой и расцветка, черная с темно-синим,
  были настолько не свойственны одеяниям эльфов поверхности, что у спутников волшебника
  возникли подозрения.

  В конце концов эльф Гаэдель, знакомый Митрана и безжалостный истребитель дроу, обнаружил
  в лесах Мит Нантара тайное убежище Раувы. Вместе с небольшой группой воинов он ворвался
  к ней в хижину и убил ее. Узнав об этом, Митран взбесился от ярости. Обезумевший
  маг бросился в охотничий домик Гаэделя и его братьев, перебил всех, а строение сровнял
  с землей. Немало членов семьи Гаэделя погибло в попытках отомстить волшебнику, но
  в конце концов Митран был убит. Накидку подобрал его близкий друг, дворф-воин Хаэл
  Бронзовое Озеро. Иначе лежать бы ей сейчас на дне Моря Упавших Звезд, которое несколько
  лет спустя поглотило гордый Мит Нантар.'
