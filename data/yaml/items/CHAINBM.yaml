description: 'Этот доспех был выкован в 1221 году ЛД кузнецом-дуэргаром для мстительного
  жреца Бэйна по имени Алерри из Западного Глубоководья. В ранние годы служения Алерри
  то и дело задирал и атаковал агентов Сунэ. На беду Алерри, последователи Огневласой
  Владычицы прибегли к чарам очарования, чтобы прекратить выходки бэйнита: очарованному
  Алерри приказывали выделывать всевозможные постыдные вещи на улицах Глубоководья.
  Спустя годы Алерри решил почтить своего бога ненависти, создав доспех, защищающий
  от чар очарования. Он воззвал к духам-прислужникам Бэйна, чтобы узнать материалы
  и обряды, потребные для его создания. Следуя наставлениям владыки, он убил тринадцать
  супружеских пар и вплёл их обручальные кольца в кайму кольчуги, затем убил тринадцать
  эльфов и омылся их кровью, тринадцать часов творя молитвы. Когда всё было кончено,
  доспех защищал его от магии сунитов и наполнял неукротимой ненавистью. Три года
  Алерри вёл крестовый поход против служителей Сунэ, Ллиры и Ханали Селанил, пока
  его резню не оборвали эльфийские лучники и жрецы Кореллона.

  Профиль защиты: +2 к КД против рубящего урона, -2 к КД против дробящего урона.

  Иммунитет к очарованию: Пока доспех надет, вы не можете стать Очарованным.

  Печать ненависти: Пока доспех надет, значение вашей Харизмы уменьшается на 2.

  Этот доспех изготовил в 1221 л.д. один мастер-дуэргар, работавший на жреца Бэйна
  по имени Алерри из Западного Уотердипа. Когда жреческая карьера Алерри только начиналась,
  он нередко провоцировал служителей Суны и бился с ними. К сожалению для него, последователи
  Огневолосой Госпожи смогли усмирить наглого бейнита с помощью магии. Зачаровав Алерри,
  они заставили его сделать на улицах Уотердипа немало постыдных вещей. Много лет
  спустя Алерри решил почтить своего бога ненависти и создать доспех, который защитит
  его от магии очарования. Призрачные помощники Бэйна рассказали ему, какие материалы
  и ритуалы нужны для такого доспеха. Следуя указаниям своего покровителя, он убил
  тринадцать семейных пар, а их обручальные кольца вплел в кольчугу. Затем он убил
  тринадцать эльфов и выкупался в их крови, вознося молитвы в течение тринадцати часов.
  Когда всё было завершено, его доспех получил способность защищать его от магии очарования
  и наполнил Аллери жгучей ненавистью. Три года он безжалостно истреблял служителей
  Суны, Ллиры и Ханали Целаниль. Конец убийствам был положен засадой эльфийских лучников
  и жрецов Кореллона Ларетиана на пути к северу от Уотердипа.'
