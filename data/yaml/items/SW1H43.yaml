description: 'Катана — слегка изогнутый меч с односторонней заточкой и остриём, срезанным
  подобно зубилу. Катана, пожалуй, один из лучших мечей, когда-либо созданных: этапы
  её изготовления — долгий тайный процесс, который скорее искусство, чем ремесло.
  Этот клинок — важная часть культуры Кара-Тура. Коснуться катаны самурая или взять
  её в руки — значит оскорбить его и навлечь его гнев. Чтобы таким клинком владел
  гайдзин, чужеземец, — редчайший случай: либо гайдзин — глубоко чтимый друг важного
  сановника, либо он убил самурая.

  Катана — это слегка изогнутый меч с односторонней заточкой и скошенным острием.
  Катана является, пожалуй, лучшим из когда-либо существовавших мечей, а ее создание
  — долгий, засекреченный процесс, скорее искусство, чем ремесло. Этот клинок — важный
  аспект культуры Кара-Тура. Коснуться или взять в руки катану самурая, значит оскорбить
  и разозлить его. Гайдзину, или чужестранцу, редко предоставляется возможность завладеть
  таким мечом. Такой гайдзин — либо очень хороший друг какого-нибудь важного министра,
  либо он просто убил самурая.

  Свойства катаны (PF2e): 1d6 рубящий (1 рука) / 1d10 рубящий (2 руки, Two-Hand d10).

  • Смертоносное d8 (Deadly d8): при критическом попадании добавляет дополнительную
  кость 1d8 урона.

  • Универсальное (Versatile P): при атаке можно наносить колющий урон вместо рубящего.

  • Критический эффект: цель становится Застигнутой врасплох (Off-Guard) до начала
  вашего следующего хода.'
