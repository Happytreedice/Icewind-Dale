description: 'Грубый лук с пыльным видом, созданный как орудие мести бывшим солдатом
  Джонаном из Сюзейла.

  Точность: Оружие дальнего боя, бонус +3 к атаке и урону.

  Меткость: Благодаря качеству изготовления это оружие даёт бонус +1 к броскам атаки.

  Этот грубо сработанный лук кажется пыльным. Изготовил его один кормирец, поселившийся
  в Срединных Западных землях Фаэруна. Джонан из Сузейла много лет был королевским
  солдатом и наконец вышел в отставку и возвратился домой, чтобы жениться на своей
  давней возлюбленной. Все годы, проведенные на службе, он хранил ей верность и копил
  деньги. Вместе с молодой женой они перебрались на запад, чтобы поселиться на неосвоенных
  землях. И вот, севернее Врат Балдура, к востоку от Леса Троллей они построили домик
  и завели небольшую ферму. Они не прожили там и пяти лет, как в этих землях появились
  разбойники. Они уничтожили все хозяйства вокруг дома Джонана и наконец добрались
  до него. Они убили его жену и ребенка, сожгли ферму дотла, а хозяина бросили, посчитав
  мертвым. Через несколько недель Джонан сделал этот лук и натер его пеплом своего
  дома и семьи. После этого от отправился мстить, убивая бандитов одного за другим
  и всех, кто был с ними связан. Мудрецы по сей день спорят, когда и как этот лук
  приобрел свои магические свойства, но в основном сходятся на том, что после смерти
  солдата его оружие благословил один из богов. Но вот какой из них, Тир, Хоар или
  Баал, решить никак не могут. Это зависит от того, как воспринимать действия Джонана:
  как справедливую кару, как месть ради мести или как жестокое убийство.'
