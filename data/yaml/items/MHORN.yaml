description: 'Чудесный предмет (инструмент барда), необычный

  Бонусным действием вы можете протрубить в рог, накладывая заклинание
  @UUID[Compendium.dnd5e.spells24.Item.phbsplBless00000]{Благословение}. Использовав это свойство,
  вы не можете применить его снова до следующего рассвета.

  Веселый Рожок принадлежал барду-полуэльфу Профии Медное Пламя. Она повсюду брала
  с собой этот маленький инструмент, и он, невзирая на скромные магические свойства,
  стал самым опытным путешественником из всех артефактов Фаэруна. Говорят, что вместе
  с Профией он прошел от Хребта Мира до дальних земель Ва, побывал и на стихийных
  планах, и в Элизиуме и Бааторе. Звуки рожка развлекали пашей Калимшана, умеряли
  пыл святых убийц в Захаре и ободряли моряков в Море Упавших Звезд. Профия потеряла
  Веселый Рожок в великой пустыне Анорока, и с тех пор о нем ничего не было слышно.'
