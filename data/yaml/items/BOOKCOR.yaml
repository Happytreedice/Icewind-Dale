description: 'Древние предания о Кореллоне Ларетиане

  Мастер Э. Л. Бойд

  ...легенды рассказывают о многих великих битвах между Кореллоном и Груумшем. И когда
  пролилась кровь Кореллона, смешалась она со слезами, что пролились из глаз Сеханайн.
  Из этой смеси крови и слез появились на свет дети Кореллона, Селдарин.

  В Кореллоне воплощено всё самое ценное, высокое и светлое, что есть в жизни эльфов.
  От тончайшего искусства и поэзии вплоть до жестокости войны и магических сил — во
  всех проявлениях могущества чтит его Дивный Народ, исключая лишь дроу. Недремлющим
  оком Кореллон следит за своими созданиями, и легенды говорят, что он сам ходит по
  землям эльфов, наблюдая за их жизнью и защищая.'
