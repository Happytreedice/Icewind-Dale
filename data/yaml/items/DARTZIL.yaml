description: 'Малый метательный снаряд чудака-волшебника; летит быстрее руки.

  Град дротиков: Совершая действие Атака, вы можете метнуть до пяти таких дротиков
  вместо одной атаки ими.

  Великий и эксцентричный волшебник Зильзанзер, хорошо известный благодаря Кольцу
  Горгоны, помимо этого делал мелкие зачарованные снаряды. Великолепные дротики Зильзанзера
  покупали у волшебника многие его коллеги. В отличие от многих других творений Зильзанзера,
  дротики работали именно так, как и было задумано. До своей безвременной гибели он
  успел изготовить довольно много таких дротиков.'
