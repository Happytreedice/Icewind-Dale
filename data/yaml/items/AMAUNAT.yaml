description: 'Древний полуторный меч из сияющей латуни, откликающийся пламенем на
  нежить.

  Солнечный луч (1/день): Действием вы высвобождаете сноп солнечного света: каждое
  существо в области радиусом 10 футов в пределах 100 футов должно преуспеть в спасброске
  Телосложения [[/save ability=con dc=15]], иначе оно Ослеплено до конца вашего следующего
  хода. Нежить в области получает [[/damage 8d6 fire]] (при успешном спасброске —
  половину).

  Пламя против нежити: При попадании по нежити меч наносит дополнительно [[/damage
  2d4 + 3 fire]] урона огнём.

  Пылающая кровь Белтина: При провале спасброска СЛ 14 при попадании кровь цели вспыхивает,
  как от заклинания «Пылающая кровь Белтина»: цель получает [[/damage 1d8 fire]] урона
  огнём в начале каждого своего хода, пока рана не будет перевязана или исцелена магией.

  Этот блестящий бронзовый меч необычайно стар: он появился на свет больше трех тысяч
  лет назад до начала Летоисчисления Долин. Нетерильский архимаг Пулдинус изготовил
  его в подарок другу-воину. Этот воин по имени Каламнин свято чтил Амонатора, сурового
  и безжалостного бога, сегодня почти позабытого мудрецами. Амонатор был покровителем
  закона и солнца. От своих последователей он требовал беспрекословного исполнения
  его воли. Всеми силами Каламнин в своих странствиях соблюдал законы Амонатора. Меч
  был утерян, когда воин погиб, побежденный десятками никадемонов. Волшебник, призвавший
  этих существ, забрал меч себе; в его семье он и хранился до самого падения Нетерила.'
