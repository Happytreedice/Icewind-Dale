description: 'Эти древние шлемы были когда-то обычны среди варваров-регедов, пришедших
  в земли, ныне известные как Долина Ледяного Ветра. Устройство доспеха просто: гладкий
  железный шлем с откидной личиной. Закончив основную работу, мастера чеканили на
  личине образ погибшего воина, а на лбу маски вырезали его имя и одно слово, описывающее
  его смерть. Затем шлем оставляли в погребальном костре павшего. Жрецы верили, что
  маска скроет страх мертвеца перед загробной жизнью, когда его будет судить Темпос.
  Через месяц шлемы особенно доблестных воинов жрецы забирали и в последующие годы
  славили их имена в ежедневных обрядах. По легенде, если Темпос находил воина истинно
  доблестным, шлем обретал силу делать носителя неподвластным страху. Этот шлем несёт
  древнее имя «Сиглеф» и слово «Секира».

  Защита: +1 к КД, невосприимчивость к страху и ужасу, защита от критических попаданий,
  но −2 к Харизме из-за жуткого вида.

  Такие древние шлемы носили регедские варвары, поселившиеся в местности, что сейчас
  зовется Долиной Ледяных Ветров. Конструкция довольно проста: обычный железный шлем
  и забрало на петлях. Когда шлем был готов, мастер гравировал на забрале лицо павшего
  воина, а на лбу маски — его имя и еще одно слово, причину смерти. Шлем оставляли
  в погребальном кургане павшего воина. Жрецы верили, что маска скроет страх покойного
  перед загробной жизнью, когда он предстанет перед Темпосом. Спустя месяц жрецы забирали
  шлемы самых доблестных воинов, которых славили затем в ежедневных ритуалах на протяжении
  нескольких лет. Легенда гласит: если Темпос решал, что воин проявил истинную доблесть,
  шлем приобретет силу, которая сделает надевшего его бесстрашным. На этом шлеме написано
  древнее имя «Сишглеф» и слово «топор».'
