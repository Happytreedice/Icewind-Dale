description: 'Этот могучий эликсир даёт выпившему 50% сопротивление всем видам магического
  урона. Эффект длится 3 боевых раунда (30 минут), что делает зелье скорее боевым.

  Стойкость: В течение короткого времени вы окружены незримым щитом, дающим +2 к спасброскам
  против магии.

  Сопротивление кислоте: Пока этот предмет надет, вы имеете сопротивление урону кислотой.

  Сопротивление холоду: Пока этот предмет надет, вы имеете сопротивление урону холодом.

  Сопротивление огню: Пока этот предмет надет, вы имеете сопротивление урону огнём.

  Сопротивление электричеству: Пока этот предмет надет, вы имеете сопротивление урону
  электричеством.

  Это весьма действенное зелье дает выпившему 50% сопротивляемость ко всем формам
  магического урона. Эффект длится 3 хода, так что это зелье больше подходит для боя.'
