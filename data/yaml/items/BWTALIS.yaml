description: 'Простое на вид ожерелье, связанное с королём-варваром Кресселаком. Несмотря
  на скромный облик, оно хранит могучую магию, дарующую носителю жизненную силу и
  природную стойкость к лютому холоду.

  Сопротивление: Пока талисман надет, вы получаете +1 к КД, +10 к максимуму хитов,
  +1 ко всем спасброскам и сопротивление урону холодом.

  Этот примитивный талисман — на первый взгляд просто плоский камень с изображением
  волчьей лапы. Несмотря на простой вид, Талисман Черного Волка наделен мощными силами.'
