description: 'Этот зачарованный болт потрескивает от сдержанной энергии бури. Поражая
  цель, он высвобождает разряд молнии, бьющий куда сильнее обычного наконечника.

  Разряд молнии: Поражённая цель получает дополнительно [[/damage 4d4 lightning]];
  успешный спасбросок Ловкости [[/save ability=dex]] уменьшает этот урон вдвое.

  Этот болт так и потрескивает от энергии, когда берешь его в руку. Он устремляется
  из арбалета к цели, оставляя за собой серный электрический запах. Поразив цель,
  болт трещит, выпуская заключенную в нём энергию внутрь раны.'
