description: 'Длинный лук похож на короткий, но его древко почти в рост лучника —
  обычно шесть — шесть с половиной футов. Он бьёт дальше и точнее короткого лука,
  хотя и медленнее. Этот экземпляр усилен магическими свойствами, придающими ему ауру
  совершенства.

  Точность: Оружие дальнего боя, бонус +2 к атаке и урону.

  Меткость: Благодаря качеству изготовления это оружие даёт бонус +1 к броскам атаки.

  Проворство: Пока лук у вас, вы получаете +1 к Ловкости.

  Длинный лук устроен так же, как короткий, с той лишь разницей, что в длину примерно
  равен росту лучника (от 6 до 6,5 футов). Его преимущества над коротким луком — большая
  дальность и точность стрельбы, хотя он немного медленнее. Этот лук усовершенствован
  с помощью магии.'
