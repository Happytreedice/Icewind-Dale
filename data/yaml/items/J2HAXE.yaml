description: 'Это могучее оружие состоит из древка длиной пять-шесть футов и тяжёлого
  лезвия. Секира двусторонняя, с лезвиями по обе стороны древка. Оружие это неповоротливо,
  но умелый воин способен наносить им удары чудовищной силы. Этой секирой владел Джорил
  Морозная Борода, вождь ледяных великанов. Оружие зачаровано несколькими благотворными
  заклинаниями.

  Точность: Оружие ближнего боя, бонус +3 к атаке и урону.

  Дар Джорила: Пока вы держите этот топор, ваше Телосложение увеличивается на 1, а
  Ловкость уменьшается на 1.

  Топор — мощное оружие, которое представляет собой тяжелое лезвие, закрепленное на
  рукояти длиной в пять-шесть футов. Этот топор двойной, с лезвиями по обе стороны
  древка. Это громоздкое оружие, но в руках умелого воина очень эффективное.

  Раньше этим топором владел Джорил Ледобрад, правитель морозных великанов. Оружие
  обладает некоторыми полезными волшебными свойствами.'
