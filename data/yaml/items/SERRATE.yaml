description: 'Источающее слабое синее сияние, это исполинское оружие — зазубренный
  двуручный меч из кости. Временами он бьёт с обжигающей силой холода, пронизывая
  жертву до костей.

  Точность: Оружие ближнего боя, бонус +3 к атаке и урону.

  Пронизывающий холод: При попадании клинок наносит дополнительно [[/damage 1d10 cold]],
  пронизывая жертву холодом до костей.

  Зазубренный двуручный меч, сделанный из кости. Это гигантское оружие окружено светлым
  голубым свечением ауры. Иногда от него исходит мощная волна холода, пробирающая
  до костей.'
