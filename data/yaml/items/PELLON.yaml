description: 'Пеллон Кей вошёл бы в историю лишь благодаря своей знаменитой лютне.

  Лютое очарование (1/день): Действием вы играете в сторону одного существа в пределах
  60 футов, способного вас слышать: оно должно преуспеть в спасброске Мудрости [[/save
  ability=wis]], иначе оно Очаровано вами на 1 минуту, впадает в неистовство и сражается
  на вашей стороне. Очарованное существо повторяет спасбросок всякий раз, когда получает
  урон.

  Пеллон Кей не был великим музыкантом и вошел в историю лишь благодаря своей лютне.
  Он родился в Сембии, вырос в музыкальной семье, однако никогда не относился к своей
  музыке серьезно. Кей повсюду заводил врагов из-за своих едких шуток и склонности
  к ссорам. Мудрецы говорят, что Милил неодобрительно взирал на проделки Пеллона,
  а вот Талос считал его забавным. Как-то раз аватар Талоса наблюдал, как Пеллон за
  один вечер подрался в таверне больше чем с двадцатью посетителями. Сие разрушительное
  выступление Талос решил наградить и прикоснулся к лютне, что валялась рядом с бесчувственным
  телом музыканта. После той ночи Пеллон обнаружил, что звуки его инструмента могут
  повергать других в состояние берсерка. Несколько недель он с восторгом стравливал
  моряков и наемников. В конце концов Пеллона Кея заткнул один мрачный воин, пристрелив
  его из арбалета раньше, чем тот успел подойти ближе и сыграть на лютне. Неизвестный
  воин выбросил инструмент в Море Упавших Звезд.'
