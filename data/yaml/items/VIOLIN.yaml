description: 'Известна и как «Скрипка Тэллоу»; имя Николая Тэллоу редко произносят
  среди музыкантов.

  Теневые чудовища: Раз в день владелец может действием сыграть на виоле, призвав
  [[/r 1d4]]{1d4} теней. Тени сражаются на стороне призывателя и рассеиваются через
  1 минуту.

  Этот инструмент также носит имя «Скрипка Таллоу», но этого названия музыканты стараются
  избегать: упоминать имя Николая Таллоу — плохая примета. Николай родился в семье
  галантерейщика, что жил в Васте, неподалеку от Верхнего Хаспура. Через эту местность
  проходят оживленные дороги, и Николаю довелось познакомиться со многими культурами.
  Среди путешественников, с которыми он общался, был Релев Узкая Речка, эльф-музыкант.
  Он-то и познакомил Николая со скрипкой и несколько лет, пока странствовал в тех
  местах, обучал юношу играть на ней. Релев понял, что Николай — невероятно одаренный
  ребенок, наделенный ловкостью пальцев, остротой ума и тягой к познанию. При этом
  эльф сознавал, что Николай необычайно горд и надменен. Невзирая на эти недостатки,
  Релев передал ему все свои знания.

  Когда Релева убила банда орков, Николай стал путешествовать и играть один. Но из
  всех своих странствий он непременно возвращался на свою горную родину. По всему
  Васту, Сембии и южному Лунному Морю шла слава о его необыкновенном таланте и страстной
  манере исполнения. Со временем слухи о юном гордом виртуозе дошли до калаунтского
  бандита по имени Тремор Гон. И вот Тремор со своей бандой, проходя через перевал
  Эльфийской Крови, зашли в таверну «Эльф в доспехах», где как раз в это время Николай
  обедал с отцом, и потребовали, чтобы молодой музыкант сыграл для них.

  Николай отказался играть для бандитов, обозвал их вонючими тупицами и попытался
  гордо удалиться. Тогда Тремор заявил, что он не хочет играть, потому что боится,
  что его вышвырнут из таверны за бездарное исполнение. Гордость Николая была задета,
  и музыкант ответил, что его талантливая игра способна даже мертвого поднять из могилы.
  Тремор тут же принял этот «вызов» — и вонзил нож в сердце отцу Николая. Несколько
  посетителей таверны бросились на помощь, но бандиты перебили их.

  Тремор стоял над телом убитого отца юноши и ухмылялся: «Ну что, скрипач, отвечай
  за свои слова!» Николай без единого слова достал скрипку и смычок и заиграл. То
  была прекраснейшая мелодия, подобной которой никто не слышал ни до, ни после. Всю
  свою страсть и пыл вложил он в свою игру. Очевидцы рассказывали, он играл, словно
  сумасшедший, проделывая с инструментом невозможное. Когда бешеная мелодия достигла
  кульминации, Тремор и его банда в ужасе увидели, как духи только что убитых ими
  поднялись из тел и с воплем бросились на своих убийц. Николай же продолжал играть.
  Танцуя, он шел по улицам и лугам, и каждый, кто был когда-либо похоронен в этих
  местах, будь то мужчина, женщина, дитя или зверь, поднимался из могилы и летел за
  ним. Наконец Николай и его мелодия скрылись в далекой долине, окутанные загадочным
  туманом, который пропал так же неожиданно, как и появился.

  Легенда говорит, что туманными ночами дух Николая приходит в родные места и играет
  на своей призрачной скрипке, а вокруг него в лунном свете танцуют мертвецы.'
