description: 'Этот магический символ эльфийской богини Сеханин Лунной Дуги вручали
  тем эльфам Длани Селдарин, кто разведывал окрестные земли. Носитель обретает ограниченную
  способность к божественной магии: он может находить ловушки и распознавать мировоззрение
  всех и всего вокруг.

  Использование: Действием и одним зарядом сотворяет «Обнаружение добра и зла», а
  также помогает находить ловушки. 5 зарядов.

  Воровская сноровка: Вы совершаете с преимуществом проверки на поиск и обезвреживание
  ловушек.

  Магический символ эльфийской богини Сеханайн Лунный Серп давали эльфам из Руки Селдарин,
  когда они отправлялись исследовать окрестные земли. Он дает доступ к магии прорицания,
  позволяя обнаруживать ловушки и узнавать направленность характера различных существ.'
