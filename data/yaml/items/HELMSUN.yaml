description: 'Венок из лавра и роз — дар церкви Сунэ жрицам Ханали Селанил в Длани
  Селдарин.

  Защита: +1 к КД и +1 к Харизме.

  Этот венок из роз и листьев лавра преподнесла церковь Суны жрицам Ханали Целаниль
  в Руке Селдарин. Служительницы богини любви и красоты, почитаемой людьми, встретили
  радушный прием в крепости, а верховная жрица Ханали Целаниль надевала венок каждый
  раз, когда люди посещали Руку. Когда орки завладели башней жрецов, они выкинули
  венок, посчитав его никчемным мусором.'
