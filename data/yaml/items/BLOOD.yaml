description: 'Кроваво-красные латы Кероса Красного, что многие годы сражался за Церковь
  Темпуса.

  Доспех +4.

  Профиль защиты: +3 к КД против рубящего урона.

  Кхерос Красный носил эти кроваво-красные латы все долгие годы, что сражался во имя
  церкви Темпуса. Он родился близ Калаунта в простой крестьянской семье и еще в юности
  подался в город, чтобы стать наемником. Набравшись опыта, Кхерос стал странствовать
  с разными группами искателей приключений. Со временем, несмотря на свои многочисленные
  победы, Кхерос стал чувствовать отвращение и ужас при виде крови.

  В конце концов его страх вырвался из-под контроля, лишив его рассудка. Жрецы Темпуса
  нашли огромного воина и взяли под свою защиту. Они надеялись, что смогут избавить
  его от страха. За несколько лет Кхерос изучил обычаи церкви Темпуса и в конце концов
  сам стал жрецом. Последним шагом на пути к преодолению страха было погружение в
  ванну, полную крови. Его удерживали в ванне, пока он чуть не задохнулся, но он выдержал
  испытание, не сопротивляясь и ни разу не попытавшись вырваться. Потом он заказал
  себе латы, напоминавшие об этом опыте.'
