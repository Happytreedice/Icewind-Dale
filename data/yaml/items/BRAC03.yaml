description: 'Зачарованные боевые наручи, окутывающие носителя плотным защитным полем.

  Защита: Пока вы носите эти наручи, не используя доспех и щит, ваш класс доспеха
  увеличивается на 4.

  Наручи — это толстые металлические или кожаные пластинки, которые тем или иным способом
  закрепляются на предплечьях. Основная их функция — защищать предплечья и запястья.
  Обычно на них накладывают чары, которые находят применение в бою, например, защищают
  владельца или увеличивают шанс попасть по врагу. Есть и исключения, но такие наручи
  встречаются чрезвычайно редко.'
