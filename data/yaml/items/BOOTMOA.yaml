description: 'Лоскутные сапоги из красной и чёрной кожи, сшитые культистами Моандера.

  Свобода от пут: Пока сапоги надеты, вы иммунны к заклинанию @UUID[Compendium.dnd5e.spells24.Item.phbsplEntangle00]{Опутывание}
  и подобным магическим эффектам, удерживающим вас растениями (состояние Опутанный
  от таких эффектов на вас не действует).

  Эти ботинки из кусочков черной и красной кожи изготовили последователи Моандера,
  древнего бога гнили и разложения. Приверженцы Приносящего Тьму нередко надевали
  эти сапоги, сражаясь с многочисленными врагами Моандера, в основном служителями
  богов природы. Наконец сапоги попали к Алдарре из Чаунти, а от нее — к ее другу,
  полуэльфу-следопыту Либерону Дюжине Деревьев.'
