description: 'Вырванная страница с единственной записью.

  Запись: «Я изучаю портал, пытаясь понять, как Хозяин изменил его. Если мне это удастся,
  мы наконец освободимся от его тирании. Единственные подсказки — одна из его слабоумных
  загадок: „Небеса вверху, Земля внизу; между ними — путь“.»

  На этой вырванной странице единственная запись:

  «Я давно исследую портал, пытаясь понять, как Господин изменил его. Если я это узнаю,
  мы наконец-то освободимся от его жестокой власти. У меня нет никаких подсказок,
  кроме его идиотских загадок:

  Вверху небеса, земля и море внизу

  Движется солнце, день превращая в ночь

  Со временами года меняется всё вокруг

  Камни, числом пять, пробуждают врата

  Открывается дорога домой

  Всё, что я могу из этого понять — что для активации устройства нужно пять камней.
  Каждый из них символизирует один из пяти аспектов: Небо, День, Землю, Море и Ночь.
  Нужно правильно расставить камни по местам, и портал откроется.

  Вроде бы всё просто. Это меня и беспокоит. Слишком просто. Это совсем не в духе
  Господина. Могу предположить, что эти камни, чем бы они ни были, нужно будет как-то
  изменить. Тогда строчка о временах года обретает смысл. Надо над этим еще подумать...»'
