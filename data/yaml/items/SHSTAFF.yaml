description: 'Сделан в золотой век дружбы между эльфами Длани Селдарин и дварфами
  Глубин Дорна. Этот посох вырезан и выточен с величайшим тщанием, а по всей длине
  покрыт эльфийскими рунами. Хотя большинство волшебников Длани избегали рукопашной,
  они носили этот посох как символ силы и единства.

  Точность: Оружие ближнего боя, бонус +3 к атаке и урону.

  Этот посох был создан в золотой век сотрудничества между эльфами Руки Селдарин и
  дворфами Пещер Дорна. Он чрезвычайно тщательно вырезан и обработан, а по всей длине
  его украшают эльфийские руны. Волшебники Руки обычно избегали ближнего боя, но владели
  этим посохом как символом их мощи и единения.'
