description: 'Этот короткий меч сработали искуснейшие оружейники-полурослики вместе
  с тремя жрецами Урогалана, Чёрного Пса. Жрецы бога мёртвых заказали и зачаровали
  меч для прославленного приключенца-полурослика Эриадона Дубодола, известного борьбой
  с осквернителями гробниц его народа. У меча тусклый ровный клинок с глубокой гравировкой
  на одной стороне: на торассе, в таблицах, перечислены все дни десятидневки, месяцы
  года, циклы луны, главные праздники полуросликов и годы жизни Эриадона. На другой
  стороне — лишь клеймо мастера, голова чёрного пса, и слова «МЕЧ ДНЕЙ». Потемневшее
  серебро в бороздках хранит слова и образы тёмными. После смерти Эриадона меч перешёл
  к странствующему жрецу Арворина Защитника, который, как считается, погиб в бою с
  гоблинами на Высокой Пустоши.

  Точность: Оружие ближнего боя, бонус +3 к атаке и урону.

  Власть над временем: Пока меч у вас, вы невосприимчивы к заклинаниям @UUID[Compendium.dnd5e.spells.Item.Szvk5FEVQW3uhJi5]{«Ускорение»}
  и @UUID[Compendium.dnd5e.spells.Item.yqUDoxk4x0NWG5Bz]{«Замедление»}.

  Замедляющий удар: При провале спасброска СЛ 14 поражённая цель замедлена (как заклинанием
  @UUID[Compendium.dnd5e.spells.Item.yqUDoxk4x0NWG5Bz]{«Замедление»}) на 1 минуту.

  Этот короткий меч создали искусные кузнецы-полурослики и три жреца Урогалана, Черного
  Пса. Жрецы бога мертвых заказали и заколдовали этот меч для известного путешественника-полурослика
  Эриадона Дубовой Лощины. Эриадон известен борьбой против тех, кто разорял гробницы
  его народа. На одной из сторон ровного тусклого клинка выгравированы несколько таблиц.
  В них на торасском наречии перечислены дни десятичной недели, месяцы года, лунные
  циклы, главные праздники и исторические даты полуросликов и знаменательные события
  жизни Эриадона. На другой стороне стоит лишь знак мастера, голова черного пса и
  слова «МЕЧ ДНЕЙ». Надписи и рисунки выполнены черненым серебром. После смерти Эриадона
  меч попал в руки к странствующему жрецу Арворин Заступницы, который, очевидно, погиб,
  сражаясь с гоблинами в Вышних Топях.'
