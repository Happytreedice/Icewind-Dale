description: 'В течение 1 часа вы невосприимчивы к состоянию «очарован» и не можете
  быть сбиты с толку.

  Защита от страха: Пока действует зелье, вы также невосприимчивы к состоянию «испуган».

  Это зелье позволяет сохранить ясность и стойкость при наступлении хаоса и безумия.
  Употребивший его персонаж ощущает безграничное спокойствие и четкость мыслей, благодаря
  чему становится неуязвим для таких вредных воздействий, как слабоумие, замешательство
  и очарование. Эффект сохраняется до конца действия зелья, если не будет развеян.'
