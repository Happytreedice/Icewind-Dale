description: 'Это местное вино, которое делают и пьют жители Истхэвена. Точный состав
  — загадка, но жидкость в бутылке слегка отдаёт рыбой.

  Этикетка сообщает, что в этой бутылке содержится «Марсемберское розовое, марочное»,
  вино с изысканным фруктово-пряным букетом и ароматом свежих цветов. Виноградники
  Марсембера славятся своим крепким виноградом, который приобретает уникальный аромат,
  пропитываясь соленым воздухом Моря Упавших Звезд.'
