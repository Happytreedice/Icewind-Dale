description: 'Служа лорду Гелдону Адари в Битве у Полых Холмов, необученный солдат-крестьянин
  по имени Каллин отважно бросился вперёд и, страшно рискуя жизнью, захватил важного
  вражеского волшебника. В награду за столь невероятную самоотверженную дерзость лорд
  Адари попросил союзника зачаровать для Каллина магическую алебарду. Солдат получил
  и небольшой надел земли, которым управлял как йомен до конца дней. В шестьдесят
  лет Каллин передал магическое оружие юному племяннику Вергарашу.

  Точность: Оружие ближнего боя, бонус +2 к атаке и урону.

  В Битве при Полых холмах отличился простой необученный солдат, крестьянин по имени
  Каллин. Он храбро сражался на стороне лорда Гельдона Адари и, рискуя собственной
  жизнью, победил и захватил в плен могущественного вражеского мага. За столь невероятную
  самоотверженность и отвагу лорд решил вознаградить Каллина и попросил одного из
  своих союзников зачаровать алебарду для храбреца. Еще он наделил солдата небольшим
  участком земли, которым Каллин владел на правах йомена до конца жизни. В шестьдесят
  он передал магическое оружие своему юному племяннику Вергарашу.'
