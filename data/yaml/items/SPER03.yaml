description: 'Могучее зачарованное копьё превосходной ковки.

  Проклятие: При каждой атаке копьё жалит и самого владельца: после каждого броска
  атаки копейщик получает [[/damage 3 piercing]]. Избавиться от копья можно только
  заклинанием @UUID[Compendium.dnd5e.spells.Item.XZhdgVK3cLoxNCQl]{«Снятие проклятия»}.

  Это проклятое оружие выглядит обычным магическим копьём, но в бою, когда владелец
  атакует врага, «Кусающее в спину» атакует и самого владельца: каждый замах ранит
  и цель, и копейщика. Копьё могуче — но стоит ли оно того? Избавиться от него можно
  лишь «Снятием проклятия».

  На это волшебное копье наложено проклятие — при каждой атаке оно наносит урон и
  противнику, и владельцу. Это очень мощное копье, но стоит спросить себя, стоит ли
  оно того. Единственный способ избавиться от проклятого копья (но не от проклятия)
  — это заклинание «Снять проклятие».'
