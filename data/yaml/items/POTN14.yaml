description: 'Это масло удваивает скорость передвижения и боевые возможности выпившего:
  скорость 9 становится 18, а тот, кто обычно атакует раз в раунд, атакует дважды.
  Время сотворения заклинаний, впрочем, не сокращается. Эффект длится 1 час.

  Скорость: В течение 1 часа ваша скорость увеличивается на 30 футов и вы получаете
  +2 к КД (ускорение). Атакуя оружием, вы можете совершить одну дополнительную атаку
  действием.

  Это масло помогает быстрее действовать в бою и передвигаться. Скорость передвижения
  удваивается, а пользователь получает одну дополнительную атаку за раунд. Так, скорость
  9 станет равной 18, а вместо 1 атаки за раунд персонаж сделает 2. Однако этот эффект
  не влияет на скорость чтения заклинаний. Действие длится 1 час.'
