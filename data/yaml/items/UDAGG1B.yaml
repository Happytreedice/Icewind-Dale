description: 'Фазовый кинжал. Его клинок мерцает и на миг становится полупрозрачным,
  будто проходя сквозь преграды.

  Фазирование: При попадании бросьте [[/r 1d20]]: при результате 1–3 цель смещается
  по фазе на 10 секунд и получает [[/damage 5 force]] урона силой в течение следующих
  двух раундов.

  У этого кинжала, как и у большинства других, заостренное лезвие, заточенное с обеих
  сторон. Также он обладает некоторыми магическими свойствами и поэтому более эффективен
  в бою.'
