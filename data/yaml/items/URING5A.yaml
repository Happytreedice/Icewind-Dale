description: 'Тёплое на ощупь кольцо, отводящее и удары, и заклинания.

  Великое сопротивление: +2 к КД, сопротивление дробящему урону и +1 к спасброскам
  от заклинаний.

  Кольцо — ювелирное изделие в виде небольшого ободка из драгоценного металла. Изредка
  встречаются кольца, на которые наложены чары, наделяющие их разнообразными магическими
  свойствами. Такие украшения очень высоко ценятся, особенно среди искателей приключений.
  Это кольцо почему-то теплое на ощупь.'
