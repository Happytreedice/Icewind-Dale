description: 'Такой амулет имеет форму изваянного жука и встречается почти исключительно
  в окрестностях Мулхоранда. Этот скарабей был создан жрицей Нефтиды по имени Ани
  Халуа: она пользовалась им в переговорах с местными торговцами и простым людом.
  Считается, что похожие скарабеи ходят по Королевствам; особенно их любят жрецы Вокин.

  Использование: Раз в день владелец может пробудить силу скарабея, обретая на время
  особое обаяние в общении с окружающими.

  Дружба: Раз в день вы можете Действием сотворить скарабеем заклинание «Дружба»:
  в течение 1 минуты вы совершаете с преимуществом проверки Харизмы против одного
  выбранного не враждебного существа; когда действие чар заканчивается, существо понимает,
  что на него повлияли магией.

  Такие резные амулеты в форме жучка обычно встречаются только в районе Малхоранда.
  Этот скарабей изготовила Ани Халуа, жрица Нефтиды. Она пользовалась им для общения
  с местными торговцами и простым народом. По слухам, в Королевствах известно несколько
  таких скарабеев. Особенно их ценят жрецы Ваукин.'
