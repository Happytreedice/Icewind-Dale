description: 'Известный также как «полуторный меч», бастард получил своё имя оттого,
  что находится на полпути между двуручным и длинным мечом. У бастарда обоюдоострый
  клинок и длинная рукоять, за которую при желании можно взяться обеими руками. Общая
  длина бастарда — от четырёх футов до четырёх футов десяти дюймов.

  Меткость: Благодаря качеству изготовления это оружие даёт бонус +1 к броскам атаки.

  Полуторный меч, или меч-бастард, называется так потому, что представляет собой нечто
  среднее между двуручным и длинным мечом. Это обоюдоострый меч с длинной ручкой,
  который при желании можно держать двумя руками. Общая длина меча — от четырех футов
  до четырех футов десяти дюймов.

  Свойства полуторного меча: 1d8 рубящий (1 рука) / 2d4 рубящий (2 руки, универсальное
  Versatile 2d4, минимальный урон 2). Критический эффект: цель становится Застигнутой
  врасплох (Off-Guard) до начала вашего следующего хода.'
