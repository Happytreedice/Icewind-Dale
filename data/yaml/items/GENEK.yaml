description: Я уже несколько дней подряд сижу в этом пустом склепе, а завтра утром
  вновь попробую пересечь усыпальницу. Дверь на свободу заперта, но мне известно,
  что ключ от нее находится в ящике, встроенном в одну из сторон монумента в кузне.
  Не знаю, повезло мне или же вмешались боги, но во время последней вылазки мне удалось
  не привлечь внимания этого жуткого лича, и я обнаружил этот тайник. Однако открыть
  его, по-видимому, можно лишь тогда, когда монумент в рабочем положении. Я не нашел
  никаких переключателей или рычагов, даже ничего похожего. Можно только предполагать,
  что за этим всем стоит лич, значит, пока он в усыпальнице, я не смогу найти ключ
  и не смогу убежать. В склепах я нашел мощные артефакты и заклинания, но даже если
  я каким-то чудом избавлюсь от лича, его амулет жизненной силы всё равно спрятан
  где-то здесь. Не уничтожив амулет, невозможно избавить мир от этого чудовища. Лич
  вернется, и что тогда будет со мной, я боюсь вообразить.
