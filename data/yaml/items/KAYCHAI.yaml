description: 'Лёгкая эльфийская кольчуга мастера оружия Селдаринской Длани.

  Защита: Кольчуга +3. Необычайно легка: её могут носить даже те, кто привык полагаться
  на ловкость, и она не мешает сотворению заклинаний.

  Ловкость: Пока доспех надет и настроен на вас, ваша Ловкость увеличивается на 1.

  Притупление ударов: +4 к КД против атак, наносящих дробящий урон.

  Шум металла: Как и любая кольчуга, доспех даёт помеху на проверки Ловкости (Скрытность).

  Этот доспех носила Кайлесса, оружейный мастер Руки Селдарин. Ее умение владеть луком
  превосходила лишь ее красота. Кайлесса посвятила жизнь тому, чтобы отточить боевое
  искусство каждого доверенного ей эльфа. Если в битве при Руке Селдарин и были герои,
  это Кайлесса. Своим блистательным примером отваги пред лицом неминуемой гибели она
  бесстрашно вела свои войска против полчищ орков и гоблинов. Даже после падения Руки
  Кайлесса сохранила верность своим людям и своему искусству. Ее последним желанием
  было погибнуть в славном бою.'
