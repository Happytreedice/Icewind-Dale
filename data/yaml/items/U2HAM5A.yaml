description: 'Как и другие боевые молоты, этот целиком сделан из стали: крушащий кости
  боёк насажен на восемнадцатидюймовую рукоять. Вдобавок он наделён несколькими магическими
  свойствами, делающими его более действенным в бою.

  Точность: Оружие ближнего боя, бонус +3 к атаке и урону.

  Сопротивление огню: Пока это оружие у вас в руках, вы имеете сопротивление урону
  огнём.

  Дополнительный урон: Наносит дополнительно [[/damage 2d3 fire]] при каждом попадании.

  Огненный шар: при попадании молот исторгает огненный шар: каждое существо в пределах
  30 футов от цели должно преуспеть в спасброске Ловкости [[/save ability=dex]], иначе
  получает [[/damage 6d6 fire]] урона огнём, а при успехе — половину этого урона.

  Боевые молоты обыкновенно изготавливают целиком из стали; этот молот — не исключение.
  На 18-дюймовой рукояти укреплен боек, которым можно дробить кости. Волшебные свойства
  этого молота весьма полезны в бою.'
