description: 'Бело-красный щит Троицы — Торма, Тира и Ильматера, — гроза нежити.

  Оберег от нежити (1/день): Действием вы поднимаете щит и являете святой знак: вся
  нежить в радиусе 10 футов должна преуспеть в спасброске Мудрости [[/save ability=wis
  dc=15]], иначе будет изгнана на 1 минуту (как «Изгнание нежити» жреца 5-го уровня).

  Множество паладинов центральных и северных областей Фаэруна носили этот щит, украшенный
  красной и белой эмалью. Артефакт посвящен Троице богов: Тиру, Торму и Ильматеру.
  Паладинам он отлично помогал в постоянных сражениях с нежитью. В отличие от жрецов,
  которые чаще всего прикрывают соратников с тыла, паладины практически всегда в первых
  рядах на поле битвы. Благодаря этому щиту они прибегают к защите святой магии, прежде
  чем вступить в ближний бой. Последним из паладинов, носивших этот щит, был Кардод,
  служитель Тира. Некромант Шанин наслал на него несколько десятков пожирателей. Нежить
  забила паладина до смерти, а артефакт некромант продал дружественному жрецу Миркула.'
