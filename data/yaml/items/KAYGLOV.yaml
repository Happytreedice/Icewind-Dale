description: 'Носила Кайлесса, мастер оружия Длани Селдарин.

  Защита: +1 к КД и +1 к Ловкости.

  Эти перчатки принадлежали Кайлессе, которая обучала эльфов Руки Селдарин воинскому
  искусству. Ее мастерство лучницы превосходила лишь ее красота. Кайлесса стремилась
  довести до совершенства боевые навыки своих подчиненных. И если были герои в битве
  за Руку Селдарин, Кайлесса — в их числе. Она являла собой ярчайший пример отваги
  перед лицом неминуемой гибели, бесстрашно ведя эльфов в бой против орды орков и
  гоблинов. Даже после падения Руки она осталась столь же преданной своему искусству
  и соратникам. Последним желанием Кайлессы было встретить смерть в славном бою.'
