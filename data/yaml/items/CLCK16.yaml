description: 'Это могущественное одеяние мага защищает от всех видов физических атак
  и одновременно повышает сопротивляемость магии и спасброски. По природе своих чар
  оно может быть надето только волшебниками нейтрального мировоззрения.

  Защита: Могущественное одеяние архимага защищает от любых форм физических атак и
  укрепляет волю и стойкость к магии: +5 к КД и +1 ко всем спасброскам. Носить его
  могут лишь волшебники нейтрального мировоззрения.

  Сопротивление магии: Магия частично обтекает этот предмет: носитель имеет сопротивление
  магии 5%.

  Мощные чары этой волшебной мантии улучшают сопротивление магии, спасброски и защиту
  от всех видов физического урона. Природа этих чар позволяет носить ее только нейтральным
  магам.'
