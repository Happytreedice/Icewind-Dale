description: 'Древние предания о Солоноре Теландире

  Мастер Э. Л. Бойд

  Эльфийский бог Солонор Теландира — покровитель охоты, стрельбы из лука и выживания
  в диких и суровых условиях. Мастерство стрельбы Великого Лучника не имеет равных
  среди богов, почитаемых в Королевствах. Солонор бережет целостность природы и следит
  за балансом между исследованными, освоенными землями и дикими просторами...

  ...Он учит Дивный Народ искусству скрываться в листве и пробираться по лесам и пущам,
  оставаясь незамеченным, мастерству стрельбы из лука и охоте. Почитатели Солонора
  — прежде всего эльфийские и полуэльфийские следопыты, охотники, лесники и воины.
  В частности, эльфы-охотники молятся ему о богатой добыче, а эльфийские воины просят
  его о помощи, оказавшись в ловушке во вражеской территории...'
