description: 'Арбалет — это лук, поперечно установленный на деревянном или металлическом
  ложе, называемом также ложем арбалета. Дуга обычно делается из ясеня или тиса. Арбалет
  стреляет болтами (их также называют стрелами арбалета). От дуги исходит слабое синее
  свечение.

  Точность: Оружие дальнего боя, бонус +4 к атаке и урону.

  Арбалетом называется лук, укрепленный на ложе — деревянной или железной ручке. Сам
  лук обычно делают из ясеня или тиса. Для стрельбы из арбалета применяют особые стрелы,
  которые называют болтами. Этот арбалет излучает слабый голубой свет.'
