description: 'Гладкий полированный шлем, дарующий громовой голос.

  Защита: +1 к КД, пока шлем надет.

  Крик (1/день): Действием вы издаёте оглушительный крик конусом 15 футов: каждое
  существо в области должно совершить спасбросок Телосложения [[/save ability=con
  dc=15]]. При провале оно получает [[/damage 4d6 thunder]] и Глохнет на 1 минуту,
  при успехе — половину урона без глухоты.

  Печально известный эксцентричный искатель приключений по имени Улли Шумный очень
  любил свой красивый шлем и всегда тщательно полировал его. Улли был номинальным
  главой Бронзовых вепрей, огромного отряда наемников. Подчиненные его были невнимательны,
  непочтительны и крикливы, и Улли, чтобы с ними управляться, заказал себе этот шлем.
  Громкие крики Улли досаждали многим, и в конце концов раздражительный жрец Милила
  вызвал его на смертельный поединок. Жрец забрал себе шлем убитого противника, но
  несколько лет спустя группа воров похитила артефакт у него из храма.'
