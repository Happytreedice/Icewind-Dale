description: 'Вблизи озера Лак Диннешир клинок пылает силой предков. Этот меч был
  вонзён в грудь Икасарахт, последней из белых драконих-матриархов, правивших Хребтом
  Мира; им владел Айхонен, далёкий предок Джхонена.

  Точность: Легендарный длинный меч, дающий бонус +5 к броскам атаки и урона. Требует
  настройки.

  Сопротивление холоду: Пока это оружие у вас в руках, вы имеете сопротивление урону
  холодом.

  Сопротивление огню: Пока это оружие у вас в руках, вы имеете сопротивление урону
  огнём.

  Сила озера: Пока вы находитесь в пределах полёта дракона от озера Лак Диннешир,
  максимум ваших хитов увеличен на 5.

  Этот некогда разбитый клинок принес погибель последнему матриарху белых драконов
  — Иказарахт. Он принадлежал Айонену, предку рыбака Джонена из Восточной Гавани.
  Почти сотню лет этот меч пролежал на дне озера, ожидая своего возвращения к продолжателю
  рода. Каким образом он был восстановлен, неизвестно, но теперь по одному лишь его
  виду можно сказать, что это серьезное оружие, способное помочь освободить Восточную
  Гавань от брата Поквелина.

  Клинок, похоже, черпает энергию из самого озера Лек Диннешер. Пока его владелец
  находится в пределах расстояния полета дракона от озера, меч является очень серьезным
  оружием.'
