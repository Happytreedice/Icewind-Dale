description: 'Это оружие проклятой души, обречённой скитаться по Фаэруну вдоль и поперёк
  за преступления против эльфов Миф Драннора. Денелл Харбанд был человеком, причастным
  к прокладке «Тропы Полутопора». По приказу командира, Халвана Тёмного, он рубился
  вперёд через эльфийские леса, невзирая на протесты и постоянные нападения. Когда
  эльфы наконец схватили его, он твёрдо заявил, что невиновен: он лишь выполнял приказы.
  Эльфийский совет наложил на Денелла Высший Гейс: пронести свою секиру от Побережья
  Мечей до восточных границ Фаэруна и от Великого Ледника до Луирэна. На это у Денелла
  ушло тридцать лет. Завершив путь, он был уже закалённым воином, побитым годами чужих
  дорог. По пути домой он проходил через Харроудейл и увидел деревянную статую Халвана
  Тёмного, гордо возвышавшуюся на маленькой площади. Одним ударом одной руки он всадил
  свою огромную секиру Халвану в лоб — и, не сбившись с шага, вернулся в свою хижину,
  где дожил дни нелюдимым фермером.

  Точность: Оружие ближнего боя, бонус +3 к атаке и урону.

  Стойкость: Пока оружие у вас, вы получаете +1 к Телосложению.

  Этот топор принадлежал проклятой душе, обреченной пройти весь Фаэрун вдоль и поперек
  за свои преступления против эльфов Мит Драннора. Денелл Харбанд был человеком, участвовавшим
  в создании «Пути Полутопора». По приказу своего командира Хальвана Темного он прорубал
  дорогу через эльфийские леса, невзирая на протесты эльфов и их ответные нападения.
  Когда эльфы наконец пленили его, Денелл убежденно отрицал свою вину, заявляя, что
  выполнял приказ. Эльфийский совет постановил, что воин может искупить свои преступления,
  и повелел ему исполнить Высший Обет. Денелл должен был пронести свой топор от Побережья
  Меча до восточных границ Фаэруна и от Великого Ледника до Луирена. Это заняло у
  воина три десятка лет. Путешествие сделало его опытным воином, закаленным годами
  странствий по чужим землям. По пути домой он оказался в Хэрроудейле и увидел, что
  на одной из городских площадей гордо возвышается деревянная статуя Хальвана Темного.
  Одной рукой он занес свой огромный топор и вогнал в лоб статуи. Затем, не останавливаясь,
  Денелл дошел до своей хижины, где и прожил остаток своих дней затворником, занимаясь
  земледелием.'
