description: "Пожелтелая страница запретной поэмы барда о битве у Штормовых Курганов.\n\
  Эта пожелтевшая страница выцвела и обтрепалась по краям, но она удивительно прочная\
  \ и напоминает по фактуре кожу. Текст написан на незнакомом вам языке, но когда\
  \ вы всматриваетесь в него, слова на странице начинают двигаться и меняться местами,\
  \ передавая в ваше сознание строки на всеобщем.\n...и пал третий из четырех Рыцарей-часовых,\n\
  уперев копье в землю, чтобы\nвстретить атаку Эгиргласса. Драконовы крылья\nбыли\
  \ изорваны, раны его были велики,\nно знал он, что победа за ним.\nОн устремился\
  \ на последнего воина,\nЭрриса, четвертого из Рыцарей-часовых. Более\nне было никого\
  \ на поле битвы, ибо Лорд\nМалурадек еще не явился на бой.\nЭррис бросился с топором\
  \ на дракона, но не успел\nудар нанести, и вот чудовище крепко схватило его,\nсклонилось\
  \ к рыцарю, чтоб откусить\nголову храбрецу.\nНо не знал Эгиргласс, насколько\nЭррис\
  \ силен. Вырываясь из лап \nдракона, Рыцарь шею ему разрубил\nмогучим своим топором,\
  \ лезвие метко всадив\nв щель между чешуями на горле твари,\nоставленную многими\
  \ ударами копий и мечей.\nГромко взывая к Хельму, он дважды ударил дракона\nза один\
  \ замах! Ибо направил топор он в обратную сторону, шею\nснова пробив, но лапы дракона\
  \ впились\nв тело рыцаря, и дважды раздался треск,\nгрому подобный. То тело героя\
  \ смяла хватка дракона...\n...и голова чудовища отделилась от шеи,\nкак срубленный\
  \ дуб, и рухнула наземь, подняв\nтучи песка по всему Кургану Бури.\nЗа гибель дракона\
  \ четверо Рыцарей-часовых отдали\nжизнь. Что еще можно сказать об этой доблестной\
  \ битве,\nзнает один лорду Малурадек. Он возвратился много часов\nспустя и хранил\
  \ молчание, не пролив ни слезинки\nпо своим павшим стражам, ибо трогали его душу\n\
  только золото и слава.\n«Прошлое — прах», — вот что сказал он, глядя на мертвых\n\
  Рыцарей-часовых, — «а путь впереди вымощен золотом»."
