description: "Пожелтелая страница запретной поэмы барда о битве у Штормовых Курганов.\n\
  Эта пожелтевшая страница выцвела и обтрепалась по краям, но она удивительно прочная\
  \ и напоминает по фактуре кожу. Текст написан на незнакомом вам языке, но когда\
  \ вы всматриваетесь в него, слова на странице начинают двигаться и меняться местами,\
  \ передавая в ваше сознание строки на всеобщем.\n...лишь Рыцаря-часового Жиля не\n\
  смутило неожиданное нападением Эгиргласса.\nПрикрывая отступление лорда Малурадека,\n\
  он не отступил перед мчащимся на него\nчудовищем. И вот, сохранив хладнокровие,\
  \ он\nострым глазом увидел, как иначе\nвзять верх над драконом.\nПрямо над ним висело\
  \ солнце,\nи, твердой рукой сжимая булаву, он дал\nдракону вцепиться когтями в его\
  \ короткий плащ,\nобнажая панцирь, сияющий на солнце.\nНе пролилось и капли крови,\
  \ так ловко он рассчитал\nскорость атаки дракона.\nОн повернулся, чтобы панцирь\
  \ его\nпоймал свет солнца, и вот\nпослал копья-лучи \nдракону в глаза. Непривычный\n\
  к яркому свету, зверь зажмурил глаза,\nзамедлился, ибо не видел вокруг ничего!\n\
  С тем же хладнокровием Жиль\nобрушил свою огромную палицу на\nчереп Эгиргласса и\
  \ пролил\nпервую кровь за день...\n[Конец отрывка]"
