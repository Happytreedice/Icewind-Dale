description: 'Золото-багровое одеяние отрекателя Делгама, заменяющее доспех.

  Арсенал: Ваш базовый КД равен 17, пока одеяние надето (несовместимо с доспехами);
  лёгкое снижение физического урона уже учтено.

  Сопротивление магии: Магия частично обтекает этот предмет: носитель имеет сопротивление
  магии 5%.

  В Королевствах известно несколько таких ценных малиново-золотых мантий, и все они
  были созданы магом-оградителем Дельгамом Многосторонним — он получил это прозвище
  из-за своего любимого выражения «с другой стороны...» Дельгам не стремился наделять
  предметы чарами, наносящими урон, или давать им какие-то иные силы. Вместо этого
  он, в соответствии с избранной им школой магии, сосредоточился исключительно на
  защитных свойствах артефактов. Мантии его работы пользовались невероятной популярностью:
  со всего мира к нему съезжались волшебники, чтобы заказать себе такие. Дельгам предпочел
  исчезнуть, нежели потакать желаниям толпы властолюбивых магов. Чудесные мантии —
  самое известное его наследие.'
