description: 'Этот боевой молот зачаровала церковь Торма, чтобы возвращать очарованных,
  сбившихся с пути бойцов под их истинные знамёна. В бою молот обычно держали верховные
  жрецы Торма, высматривая тех, кого магия могла склонить ударить по своим. Искупление
  было утеряно, когда последний державший его верховный жрец, Ардо Меллер, пал в Битве
  Чёрных Лугов в 1230 году ЛД. Считается, что оружие утащили с поля прислужники драконьего
  бога Тчаззара.

  Точность: Оружие ближнего боя, бонус +4 к атаке и урону.

  Снятие очарования: Существо, по которому попал этот молот, немедленно освобождается
  от всех эффектов очарования и магического подчинения, действующих на него.

  Жрецы Торма наложили заклятия на этот боевой молот, чтобы с его помощью возвращать
  в нормальное состояние воинов, подвергшихся действию очарования. Во время боя этот
  молот доверяли высшему жрецу, который внимательно следил, не заставили ли кого-то
  чары напасть на своих соратников. Последний жрец, который пользовался этим оружием,
  Ардо Меллер, был убит в сражении при Черных Лугах в 1230 л.д. После этого молот
  пропал; говорят, что его утащили с поля боя последователи драконьего бога Чаззара.'
