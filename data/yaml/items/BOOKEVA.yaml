description: '...и вот что из этого вышло. Орки и гоблины становятся сильнее с каждой
  победой. Откуда у них оружие Союза, по-прежнему загадка для всех, но в глубине души
  я уверена, что дворфы здесь ни при чём. Пока что нам удается сдерживать продвижение
  врага, но боюсь, что это ненадолго. Наши потери велики, и силы наши быстро тают.

  Переговоры с нашими бывшими союзниками окончены. Теперь мы враги. И как я ни люблю
  отца, я считаю, что это его вина. С тех самых пор, как мы увидели наше оружие в
  руках орды, отец совершенно потерял здравый смысл. Любые переговоры с нашими друзьями
  неизменно завершались обвинениями и взаимными обидами.

  Неужели никто больше не видит, что это приведет и нас, и дворфов к ужасной гибели?
  Отец не находит смысла в том, чтобы объединить усилия против общего врага, отбросив
  наши разногласия между собой. Я предложила ему отправиться в Пещеры Дорна и еще
  раз поговорить со старыми друзьями. Он в бешенстве набросился на меня и выгнал из
  зала с астролябией.

  Сейчас я собираюсь в путь — мне придется одной поехать в Пещеры Дорна. Сердце подсказывает
  мне, что это единственно верное решение. Вероятно, во мне больше отцовского упрямства,
  чем я предполагала.'
