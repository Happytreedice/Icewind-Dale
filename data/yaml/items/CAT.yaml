description: 'Похоже, это дохлый кот. Он отлично сохранился и выглядит так, будто
  спит. Будем надеяться, зверёк был мёртв ещё до того, как попал в сумку: живым существам
  в её магическом нутре приходится несладко.

  Очевидно, это дохлая кошка. Она так хорошо сохранилась, что кажется спящей. Остается
  надеяться, что животное положили в сумку уже мертвым — живые существа не очень ладят
  с магией внутреннего пространства таких сумок.'
