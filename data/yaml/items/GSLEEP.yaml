description: 'Этим оружием владел человек-следопыт Алтакс Гром. Алтакс ненавидел великанов,
  терзавших его родину, и с юных лет учился их истреблять. Поначалу он бился мечом
  и луком, но быстро решил, что против исполинских врагов это слишком медленно. Его
  друг-друид Эладан зачаровал для него этот молот. Слава оружия росла вместе с легендами
  об Алтаксе. И хотя после безвременной гибели Алтакса боевой молот сменил много рук,
  Сон Великана навсегда останется в памяти оружием того могучего воина.

  Точность: Оружие ближнего боя, бонус +3 к атаке и урону.

  Это оружие человека-следопыта Альтакса Грома. Он ненавидел великанов, опустошавших
  его родные края, и с малолетства учился бороться с ними. Сперва Альтакс сражался
  с великанами с помощью лука и меча, но скоро понял, что против огромных врагов нужно
  использовать другое оружие. Друид Эладан, его друг, зачаровал для него этот молот.
  Слава этого оружия росла вместе со славой Альтакса. Хотя после безвременной гибели
  Альтаса молот сменил множество владельцев, в памяти народа Сон Великана всегда останется
  оружием этого прославленного воителя.'
