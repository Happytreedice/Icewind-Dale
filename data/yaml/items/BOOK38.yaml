description: 'История дроу, Нисхождение:

  О жизни Илитиири, или эльфов Юга, до этого переломного момента в их истории известно
  очень немного. Уже тогда за необычный цвет кожи их называли темными эльфами. Населяли
  они джунгли и жаркие леса Юга. Гордые, воинственные и культурно развитые (мудрецы
  других эльфийских народов считают их культуру «упаднической»), Илитиири нападали
  на всех своих соседей, в том числе на других эльфов. Жестокие набеги и грабежи совершались
  по приказу военной знати и жрецов двух кровожадных божеств, Гаунадора и Лолт. Эльфы,
  люди, дворфы и представители других рас были вынуждены объединиться, чтобы дать
  отпор темным эльфам.

  Потерпев поражение в нескольких колоссальных магических битвах, темные эльфы скрылись
  в подземных убежищах, которые успели обнаружить ранее. Это событие получило название
  Нисхождения и положило конец обитания дроу на поверхности земли.'
