description: 'Панцирный щит, усиленный чарами Оррика Серого.

  Защита: Щит +3: пока вы держите его, вы получаете +5 к КД (2 за щит и 3 за зачарование);
  против дальнобойных атак оружием — дополнительно +1 к КД (нарративно).

  Этот щит изготовлен из экзоскелета гигантского жука. Твердый от природы, он был
  искусно обработан темными дворфами. Он похож внешне и по функциям на обычный башенный
  щит из дерева и металла, однако весит гораздо меньше. Оррик, волшебник из Кулдахара,
  наложил на него чары, позволяющие лучше отражать удары.'
