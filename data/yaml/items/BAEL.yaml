description: 'Создан для дикого наёмника Баэла Купера, чья история была короткой и
  жестокой.

  Точность: Оружие ближнего боя, бонус +3 к атаке и урону.

  Быстрое: Когда вы совершаете дополнительную атаку, можете совершить её не Бонусным
  действием, а частью действия Атака. Вы можете совершить эту дополнительную атаку
  только один раз за ход.

  История этого клинка, изготовленного для дикого наемника по имени Баэл Бондарь,
  короткая, но кровавая. Буйный и горячий Баэл родился в семье бондаря и сделал всё,
  что мог, лишь бы выбраться из родного городка Субара и попасть во Врата Балдура.
  Там он побывал и наемником, и головорезом, и охранником караванов, и вскоре заработал
  себе славу непредсказуемого и вспыльчивого человека. За первые шесть месяцев во
  Вратах Балдура он пять раз попадал под арест и, как говорят, чуть не убил как минимум
  четверых людей за то, что они не так на него посмотрели. Но со временем к Баэлу
  в его сомнительных похождениях присоединились несколько бандитов, впечатлившихся
  его «подвигами». В конце концов он собрал достаточно денег, чтобы заказать у волшебника
  мощное оружие. Клинок Баэла верно служил ему, пока этот низкий ублюдок не учинил
  насилие над молоденькой жрицей Эльдат. Местные служители Темпуса, узнав, что натворил
  Баэл, набросились на него на улице, избили дубинками и выбросили в море. Клинок
  они забрали в храм и затем продали с аукциона более достойному гражданину.'
