description: 'Гладкая жемчужина с мягким перламутровым блеском.

  Драгоценный самоцвет. Ценность: 100 зм.

  Жемчужина состоит из множества слоев арагонита, который медленно нарастает вокруг
  инородного тела, например, песчинки, попавшего в раковину устрицы или иного моллюска.
  Жемчуг отличается насыщенным и глубоким блеском. В Королевствах наиболее распространены
  белые жемчужины, но встречаются и редкие разновидности, например, радужные и черные.'
