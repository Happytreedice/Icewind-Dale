description: '«Кериш, Крег Морозобород мёртв, и его знак власти теперь у меня. Я,
  Джорил Морозобород, теперь среди шести избранных.»

  Кериш,

  Крег Ледобрад мертв, хоть и без твоей помощи, и символ власти, его значок, теперь
  у меня. Отныне я, Джорил Ледобрад, буду одним из шести избранных слуг господина!
  Когда я осуществлю свои планы, сам господин приблизит меня к себе. Не забывай об
  этом, червяк.

  Знай, твоя бесполезность не осталась незамеченной. Я сохранил тебе жизнь лишь потому,
  что ты не донес на меня господину. В нужный момент я *сам* расскажу ему, что занял
  трон отца. До тех пор молчи, или расстанешься с жизнью. Никакие стены не укроют
  тебя от моего гнева. Если ты меня предашь, я обрушу их на тебя и раздавлю твое жалкое
  тело!

  Джорил'
