description: 'Моргенштерн — это деревянное древко, увенчанное металлической головкой
  в шипастой железной оболочке. Общая длина моргенштерна — около четырёх футов. У
  некоторых головка круглая, овальная или цилиндрическая, усаженная шипами. Из головки
  большинства моргенштернов, независимо от устройства, выступает длинное остриё для
  колющих ударов.

  Меткость: Благодаря качеству изготовления это оружие даёт бонус +1 к броскам атаки.

  Моргенштерн, или утренняя звезда, состоит из деревянной рукояти и металлического
  навершия с шипами. Общая длина оружия — около 4 футов. Навершие может быть круглым,
  овальным или цилиндрическим, но оно всегда снабжено шипами и длинной иглой для нанесения
  колющих ударов.'
