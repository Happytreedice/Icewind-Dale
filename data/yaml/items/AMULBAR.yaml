description: 'Амулет калимпортской работы, окружающий владельца каменной кожей и малым
  куполом неуязвимости.

  Каменная кожа и купол (заряды): Тратя один заряд, вы накладываете на себя «Каменную
  кожу» (защита от немагического урона) и малый купол неуязвимости, не пропускающий
  заклинания 3-го круга и ниже (купол держится 8 раундов). (@UUID[Compendium.dnd5e.spells24.Item.phbsplStoneskin0])

  Этот могущественный амулет был создан магом-харизматиком Селемоном из Калимпорта
  в 727 л.д. Он успел создать на заказ десять таких амулетов, но затем завистливые
  соперники убили его и попытались повторить процесс. Они оказались менее талантливыми,
  как Селемон, и в результате несчастного случая уничтожили лабораторию и сами погибли.
  Формула была также уничтожена. Этим амулетом владел эльфийский воин-маг Пилан Ливнебриз.
  Амулет был утерян после того, как его убили великаны где-то на Хребте Мира около
  840 л.д.'
