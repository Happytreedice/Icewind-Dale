description: 'Клинок этого кинжала окутан негаснущим магическим пламенем, что вспыхивает
  ярче в миг удара.

  Дополнительный урон: Зачарованный кинжал, дающий бонус +1 к броскам атаки и урона.
  При каждом попадании цель получает дополнительно [[/damage 1d4 fire]] урона огнём.

  Меткость: Благодаря качеству изготовления это оружие даёт бонус +1 к броскам атаки.

  У этого кинжала, как и у большинства других, заостренное лезвие, заточенное с обеих
  сторон. Также он обладает некоторыми магическими свойствами и поэтому более эффективен
  в бою.'
