description: 'Некоторое время вы действуете с особой ловкостью вора, лучше вскрывая
  замки и очищая карманы.

  Воровская сноровка: Вы совершаете с преимуществом проверки Ловкости (Ловкость рук)
  и проверки на взлом замков (воровские инструменты).

  Это зелье на время превращает выпившего в первоклассного вора, значительно улучшая
  его навыки воровства и взлома. Зелье действует 3 часа, а использовать его могут
  только воры и барды.'
