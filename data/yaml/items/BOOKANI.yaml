description: 'Выдержка...

  «Один из первых шагов на пути к гармонии с животными — это научиться уважать наши
  переменчивые взаимоотношения с ними. Многие считают людей и полулюдей высшими созданиями
  по сравнению с животными. Однако, как уже отмечалось ранее, критерий „высшего“ крайне
  субъективен. По этой причине мы должны рассматривать наши взаимоотношения с дикими
  животными на глубоко личном уровне. Уважайте их, но и не забывайте, что хищник остается
  хищником, как бы вы ни уважали его территорию».'
