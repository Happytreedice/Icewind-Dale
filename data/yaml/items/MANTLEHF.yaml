magical_effects:
- name: Мантия адского горнила [Mantle of Hell's Furnace]
  changes:
  - key: system.traits.dr.value
    mode: 2
    value: fire
description: 'Необычайно яркое одеяние, Мантия Адского Горнила соткана из бород огненных
  азеров. Пятнадцать лет её носил верховный жрец Коссута по имени Уллабем, пока не
  пал в бою с жрицей Истишии. Когда жрица попыталась уничтожить мантию, союзники-ифриты
  Уллабема выследили и убили её. Один из ифритов хранил плащ, пока его не потребовал
  хитрый вор, вызвавший джинна из зачарованного бруска сандала. Считается, что плащ
  хранит свои силы лишь определённое число применений; когда предел достигнут, плащ
  призывается обратно на Элементальный План Огня.

  Использование: Действием и одним зарядом сотворяет @UUID[Compendium.dnd5e.spells.Item.5SuJewoa1CRWaj1F]{«Пылающие
  руки»}. 3 заряда, восстанавливаются на рассвете.

  Опаляющий луч Аганназара: Действием, потратив 1 заряд, вы выпускаете из ладони струю
  пламени линией 60 футов: каждое существо на линии получает [[/damage 3d6 fire]]
  урона огнём, а при успешном спасброске Ловкости [[/save ability=dex]] — вдвое меньше.

  Очарование родни огня: Действием, потратив 1 заряд, вы пытаетесь очаровать существо
  из родни элементалей огня (саламандру, огненного мефита и подобных): при провале
  спасброска Мудрости [[/save ability=wis]] цель очарована вами на 10 минут.

  Яркая мантия адской печи была изготовлена из бород пламенных азеров. Верховный жрец
  Коссута по имени Уллабем носил ее в течение пятнадцати лет, пока не погиб в схватке
  с жрицей Ишитии. Когда она попыталась уничтожить мантию, ифриты, состоявшие в союзе
  с Уллабемом, выследили ее и убили. Один из ифритов сохранил артефакт. Затем его
  получил один хитроумный вор, вызвав джинна из магического куска сандалового дерева.
  Говорят, что мантию можно использовать лишь определенное число раз. После этого
  она возвратится на стихийный план огня.'
