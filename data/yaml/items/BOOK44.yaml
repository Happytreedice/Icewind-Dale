description: 'История Севера — Войны Короны:

  Люди группами эмигрировали с Сияющего Моря на Побережье Меча. Они стали мореплавателями
  и направились через море к Муншею, Руатиму и северным островам. Эльфов поглотили
  непрекращающиеся междоусобицы, а оставшиеся от их войн руины занимали люди или орки.
  Возможно самым большим несчастьем для Светлого Народа была Темная Беда, убийственная
  магия, которая приняла форму темного горящего облака. Оно поглотило королевство
  Миеритар, а когда рассеялось несколько месяцев спустя, ни одного эльфа, ни одного
  дерева не осталось; только большое, отвратительное болото — Вышняя Топь.

  Не всё было так мрачно для эльфов. Хотя они и вынуждены были отступать перед превосходящими
  силами орков и людей-варваров, мощь Эверески и Эльфийского двора возрастала. Эльфы
  договорились с дворфами, дружелюбно настроенными людьми и другими эльфами о союзе
  для совместного отпора оркам, людям-мародерам и наплыву чудовищ (огров, багбиаров,
  троллей, гоблинов, гноллей и других нечеловекоподобных существ), ведомых великанами.
  Удивительно, но в трех местах они добились блестящих успехов — в Падшем Королевстве,
  Серебристой Луне и Мит Дранноре.

  На востоке небольшие рыболовецкие деревушки людей постепенно вырастали в города,
  которые вскоре объединились в нацию Нетерил. Мудрецы говорят, что объединение произошло
  благодаря могущественному магу-человеку, который разыскал книгу великой магии, пережившую
  Дни Грома — книгу, которую легенды называют Нижними Свитками. Под управлением этого
  безымянного мага и его подручных мощь и слава Нетерила росли, это был первый и самый
  мощный оплот людей на Севере. Говорят, обнаружение этой книги стало рождением людской
  магии, потому что до этого у людей были только шаманы и колдуны-целители. Три тысячи
  лет процветал Нетерил на Севере, но даже прославленные маги не смогли остановить
  его погибель.'
