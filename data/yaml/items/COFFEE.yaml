description: 'Этот тёмный напиток назван в честь купцов из Бердуска, которые его и
  придумали. Бердускские купцы вечно спешили заключить очередную сделку, и усталость
  и потребность в сне им только мешали. Выпитое варево прогоняет усталость и изнеможение,
  позволяя продолжать начатое.

  Исцеление: Крепкое тёмное варево из Бердуска. Выпивая это зелье, вы восстанавливаете
  [[/heal 2d4+2]] хитов.

  Это темное зелье названо в честь торговцев из Бердуска, которые его и придумали.
  Бердусканские торговцы всё время спешили разобраться с многочисленными делами, но
  им мешали усталость и необходимость отдыхать. Этот напиток снимает усталость, выпив
  его, можно продолжать свои дела.'
