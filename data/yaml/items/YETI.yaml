description: 'Шкура йети — плотный белый мех горного хищника. Ценится скорняками и
  торговцами. Ценность: 100 зм.

  Эти толстые шкуры ценятся за исключительную прочность и тепло. В Десяти Городах
  за них хорошо платят, потому что мало кто осмеливается охотиться на йети на их родине.
  У некоторых варваров Регхеда охота на йети — важнейший ритуал посвящения мальчика
  в мужчины.'
