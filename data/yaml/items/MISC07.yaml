description: 'Золото — основа денежного обращения; по всем Королевствам такие монеты
  зовут «золотыми львами», хотя лишь на кормирских монетах действительно отчеканен
  лев (узоры сембийских золотых меняются из года в год, но всегда сохраняют пятиугольную
  форму). На юге чаще всего ходит амнский дантер, но есть и другие золотые монеты
  — из Тетира и Тэя, а также частной чеканки (в том числе некоторых отрядов приключенцев).

  Золотой — стандартная валюта, которую в Королевствах обычно называют золотым львом,
  хотя это животное изображается только на монетах кормирской чеканки (а в Сембии,
  к примеру, ежегодно придумывают новые рисунки, зато монеты неизменно остаются пятиугольными).
  В южных землях широкое хождение получили дантеры Амна, наряду с ними распространены
  тетирские и тэйские монеты, а также золотые, отчеканенные частными монетными дворами
  (и отдельными отрядами искателей приключений).'
