description: 'Поношенные кожаные сапоги, шаг в которых не издаёт ни звука.

  Бесшумный шаг: Вы совершаете с преимуществом проверки Ловкости (Скрытность), связанные
  с бесшумным передвижением.

  Эти поношенные кожаные сапоги принадлежали Ренни Кулаку, разбойнику и убийце по
  совместительству. В прошлом фокусник-эскапист, Ренни часто говорил другим, что готов
  убить их в любой момент, нужна только причина и «тихие сапоги». Затем он задирал
  ногу, демонстрируя сапог, и заявлял: «Я уже на полпути. Не доводи меня». Эту привычку
  он бросил после того, как один сообразительный дворф врезал ему булавой по причинному
  месту. Пока Ренни катался по земле, дворф стащил с него «тихие сапоги» и быстренько
  убрался из города.'
