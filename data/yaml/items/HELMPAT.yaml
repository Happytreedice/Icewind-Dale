description: 'Добротный боевой шлем, зачарованный на защиту.

  Защита: Пока шлем надет, вы получаете +2 к КД.

  Защита головы: Пока шлем надет, любое критическое попадание по вам становится обычным
  попаданием.

  Этот шлем принадлежал воину-дворфу Данелю Среброхладу, королю и мученику павшего
  города-государства дворфов Среброскала. Подвиги Данеля не столь славятся, как деяния
  иных героев-дворфов, но это, возможно, только потому, что его королевство пало вместе
  с ним. Более тысячи лет назад жизни дворфов уносила позабытая ныне «Война Свернувшейся
  Крови». Полтора десятка лет сражался в ней народ Среброскала с троллями и великанами.
  Ни разу Данель не попытался бежать из королевства, попросить помощи у соседей или
  бросить своих подданных. Пусть многие из его дворфов не последовали благородному
  примеру короля и покинули родину, Данель до конца оставался в Среброскале. Перед
  самым последним сражением этой жуткой войны король выступил перед своим народом
  и сказал: «Когда не будете вы больше видеть перья на моем шлеме, докажите врагу,
  что мы не сгибаемся, будто золото, а ломаемся, как железо».

  Начался бой, Данель тут же бросился на передовую и попал в когти дюжины троллей.
  Как только исчезли из виду перья на его шлеме, все оставшиеся жители города, мужчины,
  женщины и дети, выбежали из укрепленных пещер и принялись убивать великанов и троллей.
  Бочки горящего масла взрывались во дворце Данеля и по всему городу; в пожарах погибло
  не меньше защитников Среброскала, чем врагов. В конце концов чудовища одержали пиррову
  победу. Город сгорел дотла: им не досталось ни сокровищ, ни рабов, ни пищи. В ту
  зиму немало троллей умерло от голода, а выжившие стали пожирать союзников-великанов,
  и так эта могучая армия встретила свой конец.'
