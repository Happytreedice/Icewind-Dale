description: 'Выдержка...

  «...мы, последователи Эльдат, верим, что жить честно можно лишь тогда, когда противишься
  искушению нанести удар в гневе, когда всё против нас. Насилие происходит от страдания
  и потому может принести лишь еще большие страдания. Некоторые, оспаривая нашу позицию,
  приводят в пример природу, обосновывая естественность насилия существованием бурь
  и землетрясений.

  Однако этот довод легко опровергнуть. Природа есть дар богов, но она является независимой
  системой. Природе не присуще стремление к насилию — им могут обладать лишь мыслящие
  существа. Явления природы могут быть жестоки, но это не делает жестокой саму природу.
  Природа — это всего лишь природа...»'
