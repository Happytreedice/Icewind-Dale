description: 'Доспех из метеоритного железа, выкованный во Время Сотрудничества дворфов
  и эльфов.

  Защита: Кольчуга жизни: доспех +3 к КД, +10 к максимуму хитов, а носитель медленно
  восстанавливает здоровье.

  Профиль защиты: +2 к КД против рубящего урона, -2 к КД против дробящего урона.

  Восстановление: Пока доспех надет, вы восстанавливаете 1 хит в минуту (если у вас
  больше 0 хитов).

  Этот доспех из метеоритного железа изготовили кузнецы-эльфы и дворфы во Времена
  Сотрудничества. Зачаровали его верховный жрец Морадина и верховный жрец Лабеласа
  Энорета. К сожалению, эту кольчугу ни разу не надел воин — ни дворф, ни эльф. Когда
  разгорелся конфликт между Рукой Селдарин и Пещерами Дорна, дворфы заперли доспех
  в сокровищнице, отказавшись пользоваться тем, к чему приложили руку эльфы.'
