description: 'Освящённое жрецами Малара копьё для Высоких Охот; последним им владел
  Старый Охотник Веллин.

  Дополнительный урон: Копьё белого пепла, дающее бонус +3 к броскам атаки и урона.
  При каждом попадании цель получает дополнительно [[/damage 1d6 fire]] урона огнём.

  Сопротивление огню: Пока это оружие у вас в руках, вы имеете сопротивление урону
  огнём.

  Созданное жрецами Малара сотни лет назад, это копье использовалось в Высокой Охоте
  — части их кровавого ритуала. Последним оно побывало в руках Старого Охотника Веллина,
  который погиб, глупо погнавшись за дриадами близ Клоуквуда. Это оружие сделано из
  целого куска ясеня и завершается вычурным наконечником.'
