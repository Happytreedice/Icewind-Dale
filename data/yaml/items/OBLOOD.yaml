description: 'Широкий пояс из дублёной огрской шкуры с пятью склянками чёрной крови
  огров.

  Регенерация: В начале каждого своего хода вы восстанавливаете 1 хит (если у вас
  не 0 хитов).

  Призыв огров (1/день): Действием вы призываете 5 огров, послушных вам, на 17 раундов.
  Огры появляются в свободном пространстве в пределах 20 футов.

  Волшебник Калдинар Коварный славился своим хитроумием и подозрительностью. Он изготовил
  несколько защитных артефактов, которыми в случае угрозы можно было быстро воспользоваться.
  На этом широком ремне из дубленой огровой кожи закреплены пять стеклянных флаконов
  с черной кровью огра. Он нередко приходил на помощь Калдинару в его приключениях.
  Когда волшебник умер, его практичные друзья продали ремень с аукциона.'
