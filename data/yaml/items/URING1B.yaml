description: 'Кольцо — небольшой ободок из драгоценного металла, носимый как украшение.
  На некоторые редкие кольца наложены чары, дарующие различные магические способности.
  Такие кольца высоко ценятся, особенно людьми приключенческого ремесла. По непонятной
  причине это кольцо тёплое на ощупь.

  Сопротивление: Малое кольцо сопротивления. Пока кольцо надето и настроено на вас,
  вы получаете бонус +2 ко всем спасброскам (только к спасброскам).

  Малое сопротивление: Вы получаете бонус +2 к спасброскам, вызванным эффектами типа
  «Заклинание».

  Кольцо — ювелирное изделие в виде небольшого ободка из драгоценного металла. Изредка
  встречаются кольца, на которые наложены чары, наделяющие их разнообразными магическими
  свойствами. Такие украшения очень высоко ценятся, особенно среди искателей приключений.
  Это кольцо почему-то теплое на ощупь.'
