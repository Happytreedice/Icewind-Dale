description: 'Некогда жезл принадлежал полуэльфу-плуту и магу Иллепу Бдительному из
  Míth Drannor, что находил им ловушки и западни.

  Использование: Жезл, выявляющий ближайшие ловушки. Использование тратит действие
  и один заряд. Проверка обнаружения — [[/check ability=int skill=inv]] или [[/check
  ability=wis skill=prc]].

  Воровская сноровка: Вы совершаете с преимуществом проверки на поиск и обезвреживание
  ловушек.

  Этот жезл когда-то принадлежал полуэльфу Иллепу Наблюдательному, магу и вору. Иллеп,
  уроженец Мит Драннора, пользовался тонким жезлом из черного дерева, чтобы обнаруживать
  различные ловушки, которые нередко встречались ему во время ограблений. Иллеп многим
  нравился, но однажды в таверне его нахальное поведение оскорбило воина-человека
  по имени Браммель. Несмотря на умение Иллепа обращаться с кинжалами, ловкий вор
  немногое мог противопоставить секире Браммеля и получил рану, рассекшую ему грудь
  и шею. Браммель был арестован, а жезл должен был возвратиться в Мит Драннор, к семье
  Иллепа. Но маленький караван, который перевозил жезл, разграбили разбойники-люди,
  и артефакт надолго затерялся.'
