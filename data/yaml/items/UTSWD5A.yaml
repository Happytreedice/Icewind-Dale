description: 'Двуручный меч — потомок длинного меча. Оружейники всегда искали способы
  улучшить существующее оружие. Пытаясь усовершенствовать длинный меч, они удлинили
  клинок. В конце концов пришлось удлинить и рукоять, и для правильного замаха стали
  нужны обе руки. Главное предназначение двуручных мечей — рубить конных рыцарей и
  разбивать пикейные построения. Этот экземпляр справляется со своей задачей особенно
  хорошо, ибо зачарован несколькими магическими свойствами.

  Точность: Оружие ближнего боя, бонус +4 к атаке и урону.

  Дополнительный урон: Наносит дополнительно [[/damage 1d6 lightning]] при каждом
  попадании.

  Оглушающий удар: поражённая цель должна преуспеть в спасброске Телосложения [[/save
  ability=con]], иначе она Ошеломлена до конца своего следующего хода.

  Двуручный меч — усиленный вариант длинного меча. Оружейники всегда искали возможность
  улучшить существующее оружие. Улучшая длинный меч, лезвие еще более удлинили. Пришлось
  увеличить и рукоятку, и для обращения с мечом теперь требовались две руки. Изначально
  двуручные мечи применялись в бою против конных рыцарей и для разбивания строя копьеносцев.
  Этот меч особенно эффективен, так как зачарован и обладает некоторыми магическими
  свойствами.'
