description: 'Тёплый камень янтарно-золотистого оттенка, будто хранящий в себе солнечный
  свет.

  Полудрагоценный самоцвет. Ценность: 12 зм.

  Солнечный камень — это разновидность полевого шпата и близкий родственник лунного
  камня. Более правильно называть его олигоклазом. Солнечный камень бесцветный или
  зеленоватый, имеет фасетчатую огранку, хотя шире распространена более мягкая форма,
  кабошон. Так обрабатывают камни с микроскопическими вкраплениями кристаллов ярко-красного
  или оранжевого цвета, симметрично расположенных на практически бесцветном фоне,
  что придает всему кристаллу насыщенный золотистый или красновато-коричневый цвет.'
