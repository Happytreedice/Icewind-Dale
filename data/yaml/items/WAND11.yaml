description: 'Использование: Этот жезл обрушивает с неба столп пламени на выбранную
  цель. Пламя наносит цели [[/damage 6d8min2 fire]]{6d8 урона огнём} (единицы считаются
  двойками); при успешном спасброске от жезлов — половину. Заряды жезла ограничены;
  когда они кончатся, жезл рассыплется.

  Использование: Действием и одним зарядом сотворяет заклинание «Указующая стрела»,
  обрушивая на цель луч небесного света.

  Этот жезл призывает на цель столб огня с небес. Огонь наносит 6d8 урона (выпавшие
  единицы принимаются за двойки), но если цель делает успешный спасбросок против жезла,
  то получит только половину урона. В жезле ограниченное число зарядов; когда они
  кончатся, жезл самоуничтожится.'
