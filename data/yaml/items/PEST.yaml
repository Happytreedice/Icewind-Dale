description: 'Ржавый моргенштерн жреца Талоны с зубами бешеных медведей вместо шипов.

  Чумной удар: Поражённая цель должна преуспеть в спасброске Телосложения [[/save
  ability=con dc=15]], иначе заболевает: в начале каждого её хода она получает [[/damage
  1d4 poison]], пока болезнь не исцелена.

  Невосприимчивость: Владелец иммунен к болезням.

  Смертоносную Зарю, малопривлекательное оружие, запачканное и разъеденное ржавчиной,
  создал жрец Талоны по имени Тамберлин. Этот моргенштерн состоит из ручки, оплетенной
  человеческими волосами, прочного дубового древка и ржавой железной головки, усеянной
  вместо шипов зубами бешеных медведей. Обыкновенно только жрецы Талоны берут в руки
  это оружие, потому что один его вид уже пугает простых людей.'
