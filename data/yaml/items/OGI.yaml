description: 'Это одеяние сшито из прочной ткани и выкрашено в тёмно-синий — любимый
  цвет его гордого владельца, архимага Оги-Люка. Сембиец по рождению, Оги-Люк был
  человеком могучим — крепким телом не менее, чем умом. Но ему мало было просто силы:
  он хотел быть исключительно сильным. Когда он надевал это одеяние, гордецы расступались,
  а хвастуны прикусывали языки. При всей гордости и мощи Оги-Люк не смог одолеть красного
  волшебника-ограждателя Неска Вхалтима. Неск забрал одеяние как трофей. Позже его
  украл и продал дерзкий плут.

  Защита: +2 к Телосложению, Сила становится равной 19 (если не была выше) и +2 к
  КД. Полезно для боевых магов.

  Эта мантия сшита из прочной материи и выкрашена в темно-синий, любимый цвет архимага
  Оги-Люка, который гордо носил ее. Он родился в Сембии и отличался физической силой,
  не уступавшей мощи его интеллекта. Но Оги-Люк хотел быть не просто сильным. Он мечтал
  об исключительной силе. Когда он облачался в эту мантию, гордецы отступали, а хвастуны
  прикусывали языки. Но гордость и доблесть не помогли Оги-Люку взять верх над магом-оградителем
  Неском Валтимом, одним из Алых Магов Тэя. Неск забрал себе мантию в качестве трофея,
  но впоследствии ее стащил и продал ловкий вор.'
