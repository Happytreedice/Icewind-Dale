description: 'Принадлежало Кайлессе из Длани Селдарин.

  Защита: Кольцо Кайлессы даёт носителю +1 к КД.

  Воровская сноровка: Вы совершаете с преимуществом проверки Ловкости (Скрытность).

  Это кольцо принадлежало Кайлессе из Руки Селдарин. Ее умение владеть луком превосходила
  лишь ее красота. Кайлесса посвятила жизнь тому, чтобы отточить боевое искусство
  каждого доверенного ей эльфа. Если в битве при Руке Селдарин и были герои, это Кайлесса.
  Своим блистательным примером отваги пред лицом неминуемой гибели она бесстрашно
  вела свои войска против полчищ орков и гоблинов. Даже после падения Руки Кайлесса
  сохранила верность своим людям и своему искусству. Ее последним желанием было погибнуть
  в славном бою.'
