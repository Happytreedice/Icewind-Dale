description: 'Этот молот — побочный плод розыгрыша гнома-изобретателя. Предприимчивый
  малый создал особый сплав, способный держать изрядный электрический заряд, хитро
  вплёл нити этого сплава в свои рабочие кожаные перчатки и встречал гостей с уморительно
  шокирующими результатами. Пока не пожал руку проходившему мимо дварфийскому оружейнику.
  Говорят, разряд был так силён, что у бедняги вспыхнула борода. В обмен на жизнь
  гном-изобретатель выдал секрет сплава дварфийскому оружейнику, который теперь безбедно
  живёт, куя из него разнообразное оружие.

  Точность: Оружие ближнего боя, бонус +2 к атаке и урону.

  Этот молот обязан своим появлением на свет гному-изобретателю и его розыгрышу. Очевидно,
  изобретателю удалось создать особый сплав, который накапливал мощный электрический
  заряд. Нити этого сплава он догадался вставить в свои кожаные защитные перчатки
  и в них пожимал руки гостям — с веселыми и шокирующими последствиями. Но как-то
  раз гном поздоровался таким образом с заезжим дворфом-оружейником. Говорят, того
  так ударило током, что у бедного гостя загорелась борода. Спасаясь от справедливой
  кары, изобретатель раскрыл оружейнику тайну своего сплава, и дворф теперь безбедно
  живет, изготавливая из него разнообразное оружие.'
