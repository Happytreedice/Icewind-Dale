description: 'Великий памятник сегодня завершен, и он поистине чудесен. Теперь растают
  последние сомнения в моем значении для Пещер Дорна! Некоторые из нас добиваются
  славы и процветания для нашего дома, путешествуя под землей и по поверхности, но
  я не из таких. Конечно, если появится угроза для моего народа, я не колеблясь возьму
  в руки верный топор, но до тех пор от меня гораздо больше пользы, когда я делаю
  оружие, а не ношу его.

  В честь нашего нового чуда я изготовил особый клинок, который помещу, в числе других
  изделий, в хранилище монумента. Если придет день, когда наш дом будет оборонять
  один-единственный воин, оставшийся в живых, то с этим достойным оружием он будет
  биться за десятерых. Надеюсь, что никогда эта секира не обретет хозяина, но если
  всё же придет такое время, пусть она служит ему верой и правдой.'
