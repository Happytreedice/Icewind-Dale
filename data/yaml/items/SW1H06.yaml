description: 'Жертвенный клинок жриц Шар, впитавший столетия ненависти.

  Варскона

  Такие клинки долгое время использовали жрецы Шар для жертвоприношений и обрядов
  во время «Пира Луны». Легенды рассказывают, когда владелица этого меча умерла, ее
  тело мумифицировали, а оружие вложили ей в грудь как знак власти. По прошествии
  нескольких месяцев — это был первый этап давно утраченного ритуала — ее тело должны
  были извлечь из могилы, чтобы жрица могла возродиться в иной форме. Однако в религиозных
  войнах погибли те немногие, кто помнил о ней, и место упокоения владелицы меча стало
  ее тюрьмой. Покинутая всеми, она сходила с ума от ярости. Гробницу впоследствии
  всё-таки отыскали, но там не было и следа жрицы. Кто-то говорит, что ее ярость была
  столь велика, что жрица слилась воедино со своим мечом. Как бы то ни было, проведя
  столько лет в атмосфере постоянной ненависти, меч получил собственную силу и стал
  чрезвычайно опасным в бою.'
