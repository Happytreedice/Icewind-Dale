description: 'Средний щит носят так же, как малый, но, в отличие от малого, его вес
  не позволяет использовать щитовую руку ни для чего, кроме удержания щита. Средние
  щиты обычно металлические, от трёх до четырёх футов в поперечнике, и бывают любой
  формы — круглые, квадратные, в виде расправленных крыльев дракона. Типичный средневековый
  щит напоминает треугольник остриём вниз.

  Защита: Магический щит, дающий бонус +1 к КД сверх обычного щита.

  Средний щит носят таким же образом, что и малый, однако его вес не позволяет держать
  что-то еще в руке, занятой щитом. Средние щиты обычно сделаны из металла, достигают
  трех-четырех футов в диаметре и могут иметь самую разную форму — от круглой и квадратной
  до формы распростертого крыла дракона. Типичный средневековый щит — треугольник,
  направленный вниз одной вершиной.'
