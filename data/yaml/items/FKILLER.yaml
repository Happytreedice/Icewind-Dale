description: 'Эта неприметная секира была зачарована самим неверием её владельца —
  воина Эриона Скептика, отрицавшего существование богов.

  Точность: Оружие ближнего боя, бонус +2 к атаке и урону.

  Сопротивление магии: Пока секира у вас в руке, вы получаете бонус +1 к спасброскам
  от заклинаний и других магических эффектов.

  Развеивание: При провале спасброска СЛ 14 попадание секирой развеивает действующие
  на цель магические эффекты, как заклинание @UUID[Compendium.dnd5e.spells.Item.15Fa6q1nH27XfbR8]{«Рассеивание
  магии»}.

  История этого боевого топора, вроде бы ничем не примечательного, коротка, но интересна.
  Философы магии утверждают, что Убийца Веры приобрел свои магические свойства благодаря
  неверию владельца, воина Эриона Скептика. Нечасто можно встретить в Фаэруне человека,
  который отрицает богов и святую магию, однако Эрион был именно таков. Он стремился
  доказать, что все жрецы являются шарлатанами, а жреческая магия — только разновидностью
  обычной. Мудрецы полагают, что столь жесткая позиция Эриона породила в его оружии
  магические силы. Жрецы Селуны в Западных Вратах конфисковали топор, когда были вынуждены
  убить Эриона в порядке самообороны. Говорят, что Эрион — один из неверующих, ставших
  кирпичами в Костяном дворце Миркула.'
