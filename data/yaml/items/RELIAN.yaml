description: 'Кинжал полурослика Кета Тихого Пруда, о ста спасениях которого барды
  сложили песнь «Сто жизней Кета Смышлёного».

  Точность: Оружие ближнего боя, бонус +4 к атаке и урону.

  Воин-полурослик Кет Тихий Омут прославился прямотой и хладнокровием. Барды рассказывают
  обо всех ситуациях, когда ему чудом удалось избежать гибели, в длинной и простой
  песне под названием «Сто жизней Кета-ловкача». Широко известны было и его оружие:
  короткий меч Кровавый Жнец и кинжал Надежность. Говорят, что кинжал Кет всегда держал
  при себе, никому не доверяя его. Однажды его даже выгнали с приема при дворе в Кормире,
  потому что он упорно отказывался снять с пояса обнаженный кинжал. Когда Кет умер,
  его огромное семейство решило поднести Надежность в дар церкви Арворин. Впоследствии
  жрецы вручили кинжал молодому и многообещающему воину-полурослику. Он встретил свою
  смерть, когда согласился оставить кинжал у входа в лагерь, мирный на вид. На самом
  деле это был лагерь банды разбойников, и они тут же прикончили беднягу полурослика.'
