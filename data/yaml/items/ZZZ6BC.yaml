description: 'Жрецы Латандера создали это оружие для борьбы с полчищами нежити, которую
  миркулиты плодили по всему Фаэруну. Массивный клинок часто переходил из рук в руки
  — он был нужен то в одних краях, то в других. Где-то по пути зазубренный меч попал
  в руки солдата Зентилара, который, что неудивительно, не пожелал вернуть его церкви
  Латандера. Безымянный солдат защищался этим клинком от соперничающих жрецов Бэйна
  и волшебников Зентарима, пока не пал в бою от рук трёх волшебников. Через месяц
  после его смерти те продали оружие тому, кто больше заплатил.

  Точность: Оружие ближнего боя, бонус+1к атаке и урону.

  Усиление: Против скелетов-нежити бонус усилен до +3.

  Жрецы Латандера создали это оружие, чтобы сражаться с ордами нежити, поднятой жрецами
  Миркула. В разных местах и в разное время использовали этот массивный клинок; он
  сменил немало владельцев. Однажды меч оказался у жентильского солдата, который не
  пожелал вернуть его в церковь Латандера, что неудивительно. Безымянный и безызвестный
  солдат с помощью этого клинка оборонялся от жрецов Бэйна и магов Жентарима, но погиб
  в сражении с триадой волшебников. Спустя месяц после его смерти они продали меч
  на торгах.'
