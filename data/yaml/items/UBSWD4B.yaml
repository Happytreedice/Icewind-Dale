description: 'Помимо превосходной работы мастера, по всей поверхности видны выгравированные
  крошечные руны силы. Очевидно, что на создание этой вещи ушло немало времени и труда,
  и, хотя это заметно не сразу, от рун исходит слабое синее свечение.

  Точность: Оружие ближнего боя, бонус+3к атаке и урону.

  Фазирование: При провале спасброска СЛ 14 поражённая цель частично выпадает из фазы
  примерно на 10 секунд и за это время получает в общей сложности [[/damage 20 force]]
  урона силовым полем.

  Этот меч не только великолепно сделан — он украшен крохотными рунами силы по всей
  поверхности. Даже трудно представить, сколько времени и труда ушло на изготовление
  такой вещи. От рун исходит слабое голубое свечение.

  Свойства полуторного меча: 1d8 рубящий (1 рука) / 2d4 рубящий (2 руки, универсальное
  Versatile 2d4, минимальный урон 2). Критический эффект: цель становится Застигнутой
  врасплох (Off-Guard) до начала вашего следующего хода.'
