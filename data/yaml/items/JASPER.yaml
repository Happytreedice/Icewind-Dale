description: 'Стальное кольцо с кварцем, созданное кормирским боевым магом Джаспером
  Серебряной Кровью.

  Кольцо электрического прикосновения Джаспера. Действием вы можете сотворять заговор
  «Электрический захват» (без ограничения по числу применений).

  Это крупное и тяжелое стальное кольцо с кварцем изготовил для себя кормирский боевой
  маг Джаспер Серебряная Кровь. Суровый крепкий мужик, Джаспер гораздо больше походил
  на простого работягу, чем на волшебника, и его это более чем устраивало. Этим кольцом
  он утихомиривал слишком грубых и наглых солдат, когда был уверен, что заклинание
  не убьет их. В истории он остался как один из самых строгих командиров Пурпурных
  Драконов.'
