  Оррика +3}.

  Этот щит изготовлен из экзоскелета гигантского жука. Твердый от природы, он был
  искусно обработан темными дворфами. Он похож внешне и по функциям на башенный щит
  из дерева и металла, однако весит гораздо меньше.'
