description: 'Суровый трактирщик из Вестгейта по прозвищу Праведный Тэд заказал это
  оружие, чтобы управляться с самыми буйными посетителями. Обычно Тэд стучал дубинкой
  по стойке, когда дело выходило из-под контроля, но частенько ему приходилось и самому
  ввязываться в драку, чтобы восстановить «порядок». Говорят, он огрел по голове столько
  воров, что ни один заметный преступник Вестгейта не мог честно сказать, будто не
  отведал жала Миротворца. Один из них, головорез по имени Хеллпин, затаил обиду за
  побои. Туманной ночью Хеллпин спустил на Праведного Тэда своих псов. Тэд успел убить
  больше половины свор, прежде чем его одолели и прикончили. Дубинку Хеллпин держал
  в своём логове как трофей — в назидание тем, кто вздумает перейти ему дорогу.

  Точность: Оружие ближнего боя, бонус +3 к атаке и урону.

  Праведный Тэд, крутой бармен из Западных Врат, заказал это оружие для защиты от
  разбушевавшихся клиентов. Обычно Тэду было достаточно постучать дубиной по барной
  стойке, чтобы утихомирить посетителей, но нередко он и сам вступал в драку, восстанавливая
  «порядок». Говорят, по голове от Тэда получило столько народу, что в Западных Вратах
  ни один преступник не мог без зазрения совести сказать, что ни разу не испытал на
  себе тяжесть Миротворца. Один такой парень, бандит по прозванию Адская Кегля, обиделся
  на бармена за побои и как-то ночью натравил на него свою свору собак. Тэд успел
  уложить больше половины, пока они до него добрались. Адская Кегля сохранил дубину
  как трофей и предостережение всем, кто осмелится идти против него.'
