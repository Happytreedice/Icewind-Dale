description: 'Самоцвет. Ценность: 15 зм.

  Рысий глаз — особая разновидность полевого шпата, или лабрадорита. Камни класса
  лабрадоритов имеют окраску от дымчато-серой до темно-серой и отличаются цветной
  «искрой», яркими блестящими вкраплениями. Обыкновенно «искра» синяя или голубая,
  хотя встречаются и другие цвета. Рысьим глазом в Королевствах называют лабрадориты
  с зеленой «искрой».'
