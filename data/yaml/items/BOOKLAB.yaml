description: 'Древние предания о Лабеласе Энорете

  Мастер Э. Л. Бойд

  Лабелас Энорет — эльфийский бог долголетия и времени. Когда был создан Дивный Народ,
  Лабелас даровал им долгую жизнь и сделал так, чтобы время не оставляло свой след
  на их внешности. Податель Жизни вместе с Сеханин наблюдает за эльфами, что переживают
  рождение и гибель королевств смертных. Лабелас отмеряет жизни Дивного Народа и,
  когда приходит срок, открывает им путь в Арвандор. Также он следит за течением времени
  и препятствует тем, кто пытается изменить ход истории, — потому его еще называют
  Владыкой Бесконечности. Лабелас дарует знания и мудрость и юным, и старым, и, несмотря
  на то, что он очень редко вмешивается в дела смертных, его глубоко чтут и славят.
  Подателю Жизни ведомо прошлое и будущее каждого эльфа, феи и лесного создания. Лабеласа
  почитают мудрецы, историки, философы, библиотекари и все, кто измеряет перемены,
  приносимые ходом времени.'
