description: 'Принадлежал Кайлессе, мастеру оружия Длани Селдарин, чья меткость уступала
  лишь её красоте.

  Точность: Оружие дальнего боя, бонус +3 к атаке и урону.

  Дар Кайлессы: Пока вы держите этот лук, ваша Ловкость увеличивается на 1.

  Этот лук принадлежал Кайлессе, которая обучала эльфов Руки Селдарин воинскому искусству.
  Ее мастерство лучницы превосходила лишь ее красота. Кайлесса стремилась довести
  до совершенства боевые навыки своих подчиненных. И если были герои в битве за Руку
  Селдарин, Кайлесса — в их числе. Она являла собой ярчайший пример отваги перед лицом
  неминуемой гибели, бесстрашно ведя эльфов в бой против орды орков и гоблинов. Даже
  после падения Руки она осталась столь же преданной своему искусству и соратникам.
  Последним желанием Кайлессы было встретить смерть в славном бою.'
