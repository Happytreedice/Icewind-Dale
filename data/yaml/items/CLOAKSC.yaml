description: 'Плащ, струящийся всеми цветами радуги и слепящий врагов.

  Переливы: +3 к КД; плащ совместим с любыми другими защитными зачарованиями.

  Тайна происхождения этого плаща скрыта в тумане времен. Некоторое время он принадлежал
  Дросусу, уотердипскому волшебнику немалой силы. Дросус стал жертвой необычайно огромной
  стаи зимних волков, когда в одиночку бродил по Хребту Мира; для защиты от холода
  он надел другой, более тяжелый плащ...

  На первый взгляд плащ кажется ослепительно белым. На самом деле в нём тысячи оттенков,
  которые играют и переливаются при любом свете. Этот взрыв искрящихся цветов отвлекает
  и частично ослепляет любого, кто смотрит прямо на владельца плаща.'
