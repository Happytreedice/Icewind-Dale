description: 'Кольцо теней. Пока надето, вы получаете +2 к проверкам Скрытности, и
  вас нельзя обнаружить магическими средствами.

  Воровская сноровка: Вы совершаете с преимуществом проверки Ловкости (Скрытность).

  Это простое серебряное колечко создали жрецы Маска, чтобы помочь самым щедрым своим
  почитателям. Воры одалживали у них это кольцо, а взамен жертвовали часть награбленного
  храму Маска. Однажды неблагодарный вор Дженник сбежал вместе с кольцом — так жрецы
  лишились ценного артефакта. Они отправили убийц на поиски дерзкого вора, но безрезультатно.
  Говорят, Дженник отошел от своих дел и тихо и мирно зажил в Уотердипе.'
