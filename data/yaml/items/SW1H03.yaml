description: 'С виду обычный клинок, теплеющий в присутствии перевёртышей.

  Против оборотней: Против существ-перевёртышей (оборотни и подобные им) бонус меча
  возрастает с +1 до +3 (дополнительный урон учитывается свойством «Истребитель»;
  примените модификатор атаки вручную).

  Полуторный меч +1, +3 против меняющих облик: Кондар

  На первый взгляд в этом мече нет ничего особенного. Однако в присутствии существа,
  которое может изменять свой облик, в мече просыпается сила, и его клинок теплеет.
  Назван он по имени первого владельца, чья печальная история, полная предательств
  и обмана, почти позабыта. Говорят, этот клинок очень дорого обошелся Кондару, но
  с его помощью он разоблачил тех, кто собирался предать его. Но никто уже не помнит,
  кем были его враги и какое зло они совершили.

  Свойства полуторного меча: 1d8 рубящий (1 рука) / 2d4 рубящий (2 руки, универсальное
  Versatile 2d4, минимальный урон 2). Критический эффект: цель становится Застигнутой
  врасплох (Off-Guard) до начала вашего следующего хода.'
