description: 'В течение 1 часа ваш Интеллект становится равным 19 (если не был выше),
  усиливая арканную мощь.

  Воровская сноровка: Вы совершаете с преимуществом проверки Ловкости (Скрытность)
  и проверки Ловкости (Ловкость рук) и проверки на взлом замков (воровские инструменты)
  и проверки на поиск и обезвреживание ловушек.

  Этот эликсир действует подобно зелью героизма, временно улучшая некоторые параметры
  персонажа, зависящие от уровня. В отличие от зелья героизма, его могут пить представители
  любого класса. Действие эликсира распространяется на пункты здоровья, THAC0 и воровские
  навыки (кроме удара в спину) и затрагивает базовые значения — остальные модификаторы
  применяются после.'
