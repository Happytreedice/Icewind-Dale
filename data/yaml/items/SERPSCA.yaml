description: 'Изготовление этого полезного масла весьма опасно: нужно добыть яд пяти
  живых офидианов и снять с каждого по двадцать с лишним чешуй. Чешуи месяц вымачивают
  в смеси яда, молотого мака и множества других странных снадобий, затем обжигают
  и вываливают в другой смеси масел и порошков, пока она не станет густой, как масло
  сливочное. Затем на смесь накладывают ряд заклинаний, дающих маслу полную силу.
  При использовании кожа цели становится жёсткой, зелёной и чешуйчатой. Масло чрезвычайно
  полезно, но, чтобы как следует натереть им тело, нужен целый раунд.

  Защита: В течение 1 часа ваша кожа покрывается прочной чешуёй, давая +2 к КД.

  Изготовление этого полезного масла очень опасно — для этого нужно взять яд у пяти
  живых змей и не меньше двадцати чешуек у каждой. Чешую на месяц замачивают в смеси
  ядов, молотого мака и других компонентов. После этого чешуйки сжигают, добавляют
  их в другую смесь масел и порошков и доводят ее до консистенции сливочного масла.
  Затем, чтобы придать маслу полную силу, над смесью читают разнообразные заклинания.
  Кожа, намазанная таким маслом, становится крепкой, зеленой и чешуйчатой. Хотя это
  средство очень эффективно, на то, чтобы нанести его на тело, уходит целый раунд.'
