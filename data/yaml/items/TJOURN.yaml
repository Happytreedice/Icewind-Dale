description: 'Книга с записями и преданиями. Может содержать полезные сведения для
  тех, кто её прочтёт.

  Вечер девятнадцатый

  Эта часть Пещер преподнесла мне несколько приятных сюрпризов. Благодаря защитным
  приспособлениям древних дворфов я могу работать в уединении, а еще я научился подчинять
  себе их духов и забирать их знания. Скоро я совершу последний переход, и мое возвышение
  не даст никому выступить против моей власти над этими местами. Мои новые слуги не
  смогут обрести покой, пока мои мысли заполняют то, что осталось от их сознания.

  Утро двадцать третье

  Сегодня со мной произошло нечто интересное. Мне наконец удалось отпереть вход в
  склеп Джамота, но, едва войдя туда, я вдруг почувствовал ужасную усталость. Сначала
  я подумал, что случайно активировал какую-нибудь ловушку, но отмел это предположение,
  когда исследовал склеп позже. Возникало такое чувство, будто бы сама жизнь покидает
  мое тело, а сознание теряет силу. Необходимо внимательно изучить это помещение,
  но соблюдать предельную осторожность. У меня ощущение, что там находится что-то,
  что может помешать мне завладеть эти залы.

  Утро двадцать шестое

  Я прекратил попытки открыть дверь к Зубу Змия. Я рассчитывал найти там некоторые
  предметы, необходимые для ритуала перехода, но, похоже, без ключа дверь никак не
  открыть. Кое-что почитав здесь, я могу предположить, что ключ спрятан возле какого-то
  древнего памятника или в нём самом, но это за пределами усыпальницы, и кузня сейчас
  в таком состоянии, что разыскивать его не представляется возможным. Боюсь, из-за
  отсутствия некоторых вещей я в результате процесса окажусь слабее, чем планировал,
  но придется обойтись тем, что есть.'
