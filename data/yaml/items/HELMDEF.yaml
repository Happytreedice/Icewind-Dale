description: 'Этот шлем четыреста лет носили полурослики и гномы маленькой, почти
  никому не ведомой общины под названием Пастушья Долина. Каждый рассвет капитан Ночного
  Дозора передавал шлем капитану Дневного, каждый закат капитан Дневного возвращал
  его обратно. Так продолжалось без сбоев, пока Фелдон Ток, капитан Ночного Дозора,
  не решил обменять шлем на другой. Шлем, вероятно, ещё долго пылился бы в «Лавке
  диковин» Гиблинга Армстронга, если бы скучающий дварф не купил его и не поставил
  на каминную полку в далёких землях.

  Защита: Шлем верного защитника даёт +3 к КД и невосприимчивость к усталости и магическому
  сну. Носить могут лишь гномы и полурослики.

  Защита от критических попаданий: Пока шлем надет, любое критическое попадание по
  вам становится обычным попаданием.

  Этот шлем четыре сотни лет носили полурослики и дворфы Пастушьей Долины, маленького
  малоизвестного поселения. По утрам капитан Ночной стражи передавал шлем капитану
  Дневной стражи. По вечерам капитан Дневной стражи передавал шлем капитану Ночной
  стражи. Так непрерывно продолжалось много лет, пока Фельдон Ток, капитан Ночной
  стражи, не обменял шлем на другой. Наверняка он и теперь пылился бы на полке в лавочке
  «Странное обмундирование» Гиблинга Армстронга, если бы один чужеземный дворф не
  приобрел его со скуки в качестве сувенира.'
