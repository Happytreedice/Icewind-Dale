description: 'Этот тяжёлый плащ некогда принадлежал гному-воину Глимгламу — редкому
  герою своего народа, что истреблял великанов и гоблинов на гномьих землях.

  Защита: Пока плащ надет и настроен на вас, вы получаете бонус +1 к КД и спасброскам.

  Раньше эту тяжелую накидку носил воин-гном по имени Глимглам, один из немногочисленных
  героев своего народа. Глимглам очищал земли гномов от великанов и гоблинов, уничтожая
  их на месте. Эту накидку сделала его жена Энетта, а зачаровала церковь Гарла Златоблеска.
  Когда Глимглам пал от руки короля огненных великанов, Энетта вышила на груди накидки
  алое сердце; в ней воина и похоронили. Спустя двадцать лет несколько воров-людей
  разграбили могилу и утащили накидку. Впоследствии воры отдали накидку ограм в обмен
  на вино и право прохода через самый опасный участок Вышней Топи.'
