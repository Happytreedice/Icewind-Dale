description: 'Густая перегонка желёз полярных червей; смертельно опасное тепло.

  Выпить экстракт: Выпив экстракт, вы получаете иммунитет к урону холодом на 1 час,
  но должны преуспеть в спасброске Телосложения [[/save ability=con dc=17]], иначе
  получите [[/damage 8d6 fire]] внутреннего жара.

  Эту густую жидкость получают из желез мертвых полярных червей. Это вещество помогает
  огромным существам сохранять тепло на диком севере. Пить эту жидкость непосредственно
  из тела существа смертельно опасно. После многоступенчатой алхимической очистки
  вещество можно употреблять, но оно всё же сохраняет часть своих смертоносных свойств.'
