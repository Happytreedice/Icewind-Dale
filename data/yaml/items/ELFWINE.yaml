description: 'Эта бутыль эльфийского вина обладает и свойствами зелья лечения. На
  одном из эльфийских празднеств жрецы Длани Селдарин в тот день перебрали и случайно
  влили бочку эльфийского вина в смесь, предназначенную для зелий лечения.

