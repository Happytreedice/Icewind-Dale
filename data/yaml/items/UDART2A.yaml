description: 'Дротик — небольшое, легко скрываемое метательное оружие: его бросают
  рукой, а не выпускают из лука или иного метательного приспособления.

  Меткость: Благодаря качеству изготовления это оружие даёт бонус +2 к броскам атаки.

  Неистовство: При провале спасброска СЛ 11 метнувший дротик впадает в неистовство
  до конца своего следующего хода: он обязан атаковать ближайшее к нему существо,
  будь то друг или враг.

  Дротик — метательный снаряд небольшого размера, который легко спрятать. Его не выпускают
  из лука или другого оружия, а метают прямо рукой.'
