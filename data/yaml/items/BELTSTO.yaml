description: 'Добротный дорожный пояс искусной работы.

  Проклятие: Стоит надеть пояс, как снять его без «Снятия проклятия» уже не выходит,
  а сам он тянет носителя ко дну, как камень.

  Каменная слабость: Пока пояс надет, значение Силы носителя становится равным 6,
  если оно не ниже.

  Этот проклятый предмет создал злой колдун Валом из Пещер. Он нередко отправлял одиноких
  наемников на поиски компонентов для его волшебных предметов. Когда несчастный всходил
  на борт «Темного рысака», плавучей лаборатории Валома, колдун в награду за службу
  вручал ему этот ремень. Стоило жертве примерить его, как Валом спихивал ее за борт,
  где она тут же тонула. Удаче колдуна пришел конец, когда он столкнул в Море Упавших
  Звезд Херреда из Прокампура. У Херреда был при себе шлем подводного действия и зелье,
  позволявшее дышать под водой. Когда гигантская фигура Херреда, покрытая водорослями,
  появилась рядом с доками, где был пришвартован корабль Валома, местный жрец Тира
  тут же бросился на помощь воину и избавил его от проклятого предмета. Узнав, что
  совершил колдун, жрец Тира и три паладина собрались захватить его. В сражении Валом
  убил двоих паладинов, но и сам лишился жизни. Ремень потом, кажется, продали странствующему
  коллекционеру, который собирал проклятые артефакты.'
