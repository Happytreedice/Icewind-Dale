description: 'Бронзовые наручи, дарующие магу сокрушительный Крик.

  Крик (1/день): Действием вы издаёте оглушительный крик конусом 15 футов: каждое
  существо в области должно совершить спасбросок Телосложения [[/save ability=con
  dc=15]]. При провале оно получает [[/damage 4d6 thunder]] и Глохнет на 1 минуту,
  при успехе — половину урона без глухоты.

  Великий крик (1/день): Как «Крик», но урон [[/damage 4d12 thunder]], а существа
  с 5 и менее Костями Хитов при провале падают до 0 хитов. После использования вы
  получаете [[/damage 2d4]] урона психической отдачей и должны преуспеть в спасброске
  Телосложения [[/save ability=con dc=13]], иначе потеряете сознание на 1 минуту.
  При выпадении «1» на к20 наручи взрываются: [[/damage 4d10 fire]] владельцу.

  Наручи взрыва, артефакт опасный даже для опытного и сильного волшебника, изготовил
  могущественный маг-воплотитель, имя которого история не сохранила. В Фаэруне известно
  несколько пар таких наручей, но с каждым годом из-за печальных случайностей их остается
  всё меньше.'
