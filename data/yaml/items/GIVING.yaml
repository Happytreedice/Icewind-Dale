description: 'Чёрно-серебряный моргенштерн кормирского некроманта Дамета Бледного;
  невзрачность скрывает страшную силу.

  Точность: Оружие ближнего боя, бонус +3 к атаке и урону.

  Дарующий удар: При провале спасброска СЛ 14 при попадании оружие делится отнятой
  силой: вы восстанавливаете [[/heal 1d8]] хитов, а ваша Сила увеличивается на 1 на
  5 раундов.

  Этот черно-серебряный моргенштерн изготовил кормирский некромант Дамет Бледный.
  Оружие выглядит зловеще, а под простой, ничем не украшенной поверхностью скрываются
  ужасные силы. Моргенштерн был продан жрецу Миркула, который нашел ему превосходное
  применение в схватках с искателями приключений. Однако жреца в конце концов победил
  паладин Латандера и забрал у него волшебное оружие. История моргенштерна оборвалась
  в 1190 л.д., когда великаны разграбили горный храм, в котором он хранился.'
