description: 'Строгий шлем, ограждающий разум от чужой воли.

  Ясный разум: Пока шлем надет, вы иммунны к состоянию Очарованный.

  Защита головы: Пока шлем надет, любое критическое попадание по вам становится обычным
  попаданием.

  Как явствует из названия, шлем защиты от очарования ограждает своего владельца от
  любых попыток магического воздействия на его эмоции. Высококвалифицированным наемникам
  их организации часто выдают такие шлемы в качестве меры предосторожности, дабы на
  выполнение ими своих задач не повлияло никакое постороннее вмешательство.'
