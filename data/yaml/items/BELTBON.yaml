description: 'Тяжёлый кожаный пояс жрецов Миркула, окованный пластинами с человеческими
  костями.

  Круг костей (1/день): Действием вы заставляете костяные осколки вихрем кружить вокруг
  вас на протяжении 3 раундов: каждое существо в пределах 5 футов получает [[/damage
  1d6 bludgeoning & 1d6 slashing]] в начале своего хода, но вы не можете перемещаться,
  пока действует эффект.

  Восстание мёртвых (1/день): Сотворяет заклинание @UUID[Compendium.dnd5e.spells24.Item.phbsplAnimateDea]
  без траты ячейки.

  Этот жуткий артефакт создали жрецы Миркула, бога мертвецов. Тяжелый кожаный пояс
  покрывают металлические пластины и кольца, на которых закреплены человеческие кости.
  Изначально владельцем его был безжалостный воин по имени Гордый Кетт. Бесстрашно
  скакал он на боевом коне по полям сражений, сокрушая всех врагов на своем пути.
  В тех редких случаях, когда он оказывался окружен, пояс приходился очень кстати.
  К несчастью для Кетта, враги догадались использовать против него длинные копья и
  древковое оружие. Пояс похоронили вместе с Кеттом. Через некоторое время могила,
  естественно, была разграблена. Один из воров продал пояс Кетта магу из Урламспира.
  Этот волшебник, которого звали Исанан, немало пользовался чудесным предметом в своих
  путешествиях. Отойдя от дел, он продал артефакт жрецу Миркула по имени Бен-Карад.
  Говорят, что Бен-Карада убили где-то в стоках города Уотердипа.'
