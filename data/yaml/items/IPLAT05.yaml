description: 'Полный латный доспех — лучшее, что может купить воин, и по виду, и по
  защите. Идеально подогнанные, сцепленные друг с другом пластины поставлены под особым
  углом, чтобы отражать стрелы и удары, а весь доспех заботливо украшен богатой гравировкой
  и чеканкой. С его магическими чарами этот полный латный доспех идеален для воинов.

  Профиль защиты: +4 к КД против рубящего урона, +3 к КД против колющего урона, +3
  к КД против урона от снарядов.

  Полный латный доспех — это лучшее из всего, что может купить воин, как по внешнему
  виду, так и по защитным качествам. Великолепно подогнанные перекрывающиеся стальные
  пластины выгнуты так, чтобы лучше отражать стрелы и удары, а весь доспех искусно
  украшен гравировкой и чеканкой. Кроме того, доспех зачарован, что делает его просто
  идеальным для воина.'
