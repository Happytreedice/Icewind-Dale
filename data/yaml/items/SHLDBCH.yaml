description: 'Щит представителей Умберли, Стервозной Королевы, для визитов ко двору
  Иштишии на Стихийном плане Воды.

  Щит +2.

  Благоволение вод: Водные элементали не замечают носителя этого щита и не нападают
  на него, пока он первым не причинит им вред.

  Посланники Амберли, так называемой Королевы-Стервы, продемонстрировали этот щит
  при дворе Иштишии во время визита на Стихийный План Воды. Он не раз помогал своим
  владельцам. Послы Королевы Моря не злоупотребляли полезными свойствами щита, но
  по вине одного неосторожного жреца он всё-таки был утрачен. В легендах говорится,
  что Херрен, жрец Амберли, при помощи волшебных свойств этого предмета уничтожил
  немало элементалей, пока Повелитель Воды Иштишия не перебросил жреца на Стихийный
  Полуплан Льда, где тот и замерз до смерти. С тех пор щит, вероятно, путешествовал
  по разным планам, пока недавно вновь не объявился в Фаэруне.'
