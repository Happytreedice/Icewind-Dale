description: 'Выдержка...

  «...наша принципиальная позиция состоит в том, чтобы отвергать подобное. Фундаментальные
  верования церквей ярости неприемлемы для нас. Боги Ярости поощряют в своих последователях
  всё эгоистичное, жестокое и разрушительное. Малариты, бессмысленно истребляя животных,
  думают только о том, как утвердить свое недолговечное превосходство. Аурилиты уничтожают
  тепло жизни везде, где только могут, и получают удовольствие от замораживания всего,
  что может замерзнуть. Священники Талоса предаются разрушению ради разрушения и собственного
  удовольствия. Братья и сестры из церкви Амберли устраивают штормы лишь для того,
  чтобы запугать путешественников и рыбаков и заставить преклониться перед их богиней.
  Разумеется, мы, последователи Эльдат, не можем не осуждать эти обычаи, но мы не
  можем и не задаваться еще одним важным вопросом. Какой жизни после смерти ждут эти
  самовлюбленные жрецы во владениях своих самовлюбленных богов?»'
