description: 'Лёгкий золочёный щит, отмеченный монетой Воукин — богини торговли.

  Защита: Щит +2: пока вы держите его, вы получаете +4 к КД (2 за щит и 2 за зачарование);
  против дальнобойных атак оружием — дополнительно +2 к КД (нарративно).

  В разных уголках Фаэруна можно найти такие щиты в храмах Ваукин. Церковь продает
  эти щиты искателям приключений. Чтобы пользоваться силами щита, владелец обязуется
  носить его, ничем не закрывая его лицевую сторону и не изменяя ее. Если это условие
  будет нарушено, щит утратит свои волшебные свойства. И вот десятки искателей приключений
  странствуют по миру с золотым ликом Ваукин на руке.'
