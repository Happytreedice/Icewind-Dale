description: 'Как и большинство обычных кинжалов, этот кинжал имеет заострённый обоюдоострый
  клинок. Кроме того, он наделён магическими свойствами, которые сделали его ещё полезнее.

  Точность: Оружие ближнего боя, бонус +3 к атаке и урону.

  Сопротивление огню: Пока это оружие у вас в руках, вы имеете сопротивление урону
  огнём.

  Запас заклинаний: Пока кинжал у вас, вы можете сотворить по одному дополнительному
  заклинанию волшебника 1-го, 2-го и 3-го уровня между Длинными отдыхами, как если
  бы у вас была одна дополнительная ячейка каждого из этих уровней.

  У этого кинжала, как и у большинства других, заостренное лезвие, заточенное с обеих
  сторон. Также он обладает некоторыми магическими свойствами и поэтому более эффективен
  в бою.'
