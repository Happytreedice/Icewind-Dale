description: 'Сшиты вручную талантливыми эльфийскими мастерами из лучших кож и мехов;
  обычны среди народа Длани Селдарин.

  Защита от холода: Пока сапоги надеты, вы получаете сопротивление урону холодом.

  Эти сапоги сшиты из самых лучших кожи и меха, какие только можно найти в этих землях.
  Талантливые эльфийские мастера изготавливали их вручную. В Руке Селдарин многие
  носили такую обувь, не пренебрегали ей и иноземные гости, так как эти необычайно
  теплые сапоги защищают от жестоких холодов Севера.'
