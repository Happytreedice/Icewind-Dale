description: 'Сапоги, отводящие молнии в землю, — след божьего гнева над Звёздным
  Шпилем.

  Заземление: Вы получаете сопротивление урону электричеством.

  Сапоги заземления: Дар Талоса

  Много, много лет назад обитатели Твердыни на полуострове Звездного Шпиля прогневали
  Талоса, убив его любимого Буревестника. Талос пообещал, что разрушит город землетрясениями,
  отрежет его от мира высокими волнами, а жителей уничтожит бурями и грозами. И еще
  он пожаловал городу пару сапог, чтобы один-единственный человек смог выжить и сохранить
  эту историю для остального мира. Позже искатели сокровищ, бродя по развалинам города,
  наткнулись на безумного старика; разрушение, которое он видел, лишило его рассудка.
  Сапоги, что были на нем, донесли до самых отдаленных краев рассказ о городе, стертом
  с лица земли яростью бога.'
