description: 'Оружие, выкованное жестокой чародейкой Редани, почитавшей Бешабу, госпожу
  невезения.

  Точность: Оружие ближнего боя, бонус +3 к атаке и урону.

  Сглаз: поражённую цель постигает невезение: на 1 минуту она совершает броски атаки,
  проверки характеристик и спасброски с помехой.

  Это жуткое оружие изготовила одна волшебница, жестокая красавица, которая почитала
  богиню неудачи Бешабу. Ее звали Редани, и свои чары она мастерски использовала и
  на предметах, и на мужчинах. Любовь Черной Бесс она всякий раз передавала очередному
  фавориту. Втайне от любовников Редани размещала на булаве одно из колец готовности,
  а второе приберегала до нужного момента. Устав от фаворита, как это всегда происходило,
  она вручала кольцо новому любовнику и отправляла его расправиться с предшественником.
  Стоило новому фавориту воззвать к силам кольца, и волшебная булава оказывалась у
  него в руке.

  Но однажды Редани не повезло — она ошиблась в выборе мужчины. Гурал из Чессенты,
  тайный жрец Хоара, вознамерился отомстить за человека, череп которого подобрал у
  дороги. К несчастью для Редани, месть жрецов Хоара за мертвых не знает границ: Гурал
  возродил в качестве нежити всех убитых любовников волшебницы, и они разорвали ее
  на части.'
