description: 'Окованная булава-жезл, крушащая големов и исчадий иных планов.

  Сокрушитель: Против существ с иных планов жезл при провале спасброска СЛ 14 наносит
  дополнительно [[/damage 8d3 bludgeoning]].

  Гроза големов: Против големов жезл наносит дополнительно [[/damage 1d8+3 bludgeoning]]
  урона; при провале спасброска СЛ 14 такой удар полностью уничтожает голема.

  Карающие скипетры встречаются крайне редко, но против некоторых врагов они просто
  незаменимы. Последним владельцем этого скипетра был Дебиан из Урламспира, жрец Гонда.
  Этот эксцентричный искатель приключений поставил перед собой задачу исследовать
  все виды големов, известных в Королевствах. Нередко создатели големов, раздраженные
  его чрезмерным любопытством, посылали свои творения расправиться с ним. Обычно Дебиан
  выбирался из таких переделок практически невредимым. К сожалению, с логовом Механика
  ему не так повезло. Механиком прозвали весьма оригинального лича, который занимался
  созданием големов и других оживленных механизмов. Целая лаборатория железных големов
  стала для Дебиана непреодолимым препятствием.'
