description: 'В этом стеклянном горшочке — дорогая смесь масла и других веществ. Подожжённая,
  она несколько секунд горит очень жарким пламенем. Пользоваться горючим маслом непросто:
  на правильный бросок уходит немало времени. Приключенцы часто носят масло с собой
  на случай злополучной встречи с троллями.

  Дополнительный урон: Метнув этот сосуд (действие, 20 футов), вы наносите цели [[/damage
  2d6 fire]] урона огнём (спасбросок Ловкости уменьшает урон вдвое).

  Область поражения: Пламя охватывает область радиусом 5 футов от точки попадания:
  спасбросок Ловкости и урон относятся ко всем существам в этой области.

  В этой стеклянной емкости дорогостоящая смесь масла и других веществ. Если ее поджечь,
  она за несколько секунд сгорает при очень высокой температуре. Горящее масло порой
  довольно трудно использовать, потому что его не всегда удается удачно бросить. Многие
  искатели приключений держат при себе такую смесь на случай встречи с троллями.'
