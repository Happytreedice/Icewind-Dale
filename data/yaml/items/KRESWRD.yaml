description: 'Этим мечом некогда владел Кресселак, король варваров, покорявший с ним
  северные земли. Как он раздобыл это оружие, неизвестно. Большинство учёных полагают,
  что Кресселак просто нашёл его в одном из своих походов. Впрочем, ходят упорные
  слухи, будто меч был создан неким могущественным волшебником по заказу самого Кресселака.
  Правды уже не узнать.

  Точность: Оружие ближнего боя, бонус +1 к атаке и урону.

  Сопротивление холоду: Пока это оружие у вас в руках, вы имеете сопротивление урону
  холодом.

  Когда-то с этим мечом в руках король варваров Кресселак завоевывал северные земли.
  Но никто не знает точно, откуда он взял это оружие. В основном ученые сходятся во
  мнении, что Кресселак просто нашел его в одном из походов. Но упорно ходят слухи,
  будто варвар заказал меч у какого-то великого волшебника. Вряд ли когда-нибудь станет
  известна правда.'
