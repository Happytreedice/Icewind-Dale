description: 'Мягкие сапоги королевских лазутчиков, заглушающие каждый шаг.

  Бесшумная поступь: Вы получаете бонус +3 к проверкам Ловкости (Скрытность).

  Воровская сноровка: Вы совершаете с преимуществом проверки Ловкости (Скрытность).

  Сапоги скрытности: Стертый Шепот

  Много лет назад жил король по имени Райгерд. Прославился он своими шпионами, столь
  ловкими, что ни один закоулок не укрывался от их глаз; они составляли подробные
  карты замков и целых городов. Но команда шпионов в конце концов прекратила свое
  существование (не обошлось без предательства), а их инструменты и магические предметы
  рассеяны теперь по всему миру и вряд ли когда-то снова соберутся в руках одного
  отряда.'
