description: 'Книга об истории Луирена, земли полуросликов.

  История Луирена, Земли Полуросликов:

  Луиренские полурослики утверждают, что именно их земля — историческая родина всей
  их расы. Может, другие полурослики с этим и не согласятся, но можно с уверенностью
  утверждать, что Луирен основан сотни, может быть, даже тысячи лет назад.

  История Луирена — это история завоеваний. На протяжении веков земли полуросликов
  захватывали варвары, населявшие Дамбрат, армии королевства Истганд, а однажды —
  даже чудовища Белдорна. Но всякий раз завоеватели, недооценив маленьких полуросликов,
  терпели поражение. Озорной и пакостный характер маленького народца тоже весьма способствовал
  прекращению оккупации.

  В настоящее время Луирен переживает небывалую пору процветания. Полурослики пользуются
  всеми преимуществами, которые дают отношения с Дурпаром — их главным покупателем
  и конкурентом. Благодаря тесным связям с Дурпаром Луирен обеспечил себе защиту от
  новых вторжений из Дамбрата. Теперь правителям Дамбрата известно, что попытка агрессии
  на восток вызовет вмешательство не только Дурпара, но и Вара и Истганда. Потому
  это воинственное государство не посягает более на Луирен.'
