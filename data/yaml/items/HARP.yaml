description: 'Арфа святой Сефики Ордулинской, чья музыка исцеляет страждущих.

  Чудо Сефики (1/день): Действием вы касаетесь струн: каждое дружественное существо
  в пределах 30 футов, слышащее музыку, восстанавливает [[/heal 6d8 + 10]] хитов.

  Этот инструмент принадлежал Сефике из Ордулина, которую церковь Ильматера впоследствии
  канонизировала. Бард Сефика не поклонялась богу песни Милилу — она поставила свое
  искусство на службу страдающим последователям Ильматера. Когда она путешествовала
  вместе с группой пилигримов Ильматера, на них напали разбойники. Многие пилигримы
  были убиты или тяжело ранены, но когда Сефика попыталась облегчить их страдания,
  разбойники перерезали струны на ее арфе. Когда злодеи скрылись, Сефика обратилась
  к Ильматеру с молитвой о помощи в трудный час. Молясь с закрытыми глазами, она прикоснулась
  к струнам инструмента, и чудесным образом из арфы полилась музыка, исцелив всех,
  кто ее услышал. На следующий день разбойники появились вновь и убили Сефику за то,
  что она излечила пилигримов. Но память о совершенном ею чуде осталась жить благодаря
  спутникам барда. Община пилигримов подала прошение о том, чтобы Сефику причислили
  к лику святых Ильматера. Его удовлетворили в 1218 л.д.

  На ней может играть лишь исключительно добродетельный, мудрый и талантливый бард.'
