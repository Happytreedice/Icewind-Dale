description: 'Особая версия прославленной эльфийской кольчуги, дававшая защиту и от
  суровой погоды, — из золотого века союза Длани Селдарин и дворфов Дорнова Оплота.

  Доспех +3.

  Профиль защиты: +2 к КД против рубящего урона, -2 к КД против дробящего урона.

  Сопротивление холоду: Пока этот предмет надет, вы имеете сопротивление урону холодом.

  Колдовство в доспехе: Кольчуга не мешает творить заклинания: вы можете накладывать
  заклинания, нося этот доспех, и считаетесь владеющим им, даже если у вас нет владения
  соответствующими доспехами.

  В золотой век сотрудничества между эльфами из Руки Селдарин и дворфами Пещер Дорна
  создавались особые эльфийские кольчуги, защищающие от суровых условий севера.'
