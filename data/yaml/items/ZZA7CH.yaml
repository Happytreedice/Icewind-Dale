description: 'Молот Конлана: Близнец Наковальни. Этот с виду обычный рабочий молот
  наделён особыми чарами, усиливающими его способность придавать форму металлу — особенно
  обработанной руде, из которой маги создают железных големов. Задуманный как инструмент
  для создания таких стражей, он столь же хорош и для их разрушения, если возникнет
  нужда.

  Точность: Боевой молот, дающий бонус +1 к броскам атаки и урона. Против железных
  големов бонус возрастает до +4.

  Истребитель големов: Против железных големов (тип «конструкт») молот наносит дополнительный
  урон (свойство «Истребитель»); бонус атаки — активность «Против железных големов».

  Молот Конлана: Близнец Наковальни

  Этот кузнечный молот кажется обычным, но он усилен особыми чарами, которые позволяют
  лучше ковать металлы, в особенности очищенную руду, из которой волшебники изготавливают
  железных големов. Изначально молот предназначался именно для создания таких охранников,
  но он очень хорошо подойдет и для их разрушения, если возникнет такая необходимость.'
