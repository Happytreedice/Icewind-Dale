description: 'Посох Эрона Удручённого — пессимистичного мага, помешанного на магических
  дуэлях.

  Точность: Оружие ближнего боя, бонус +3 к атаке и урону.

  Волшебник Эрон Потрясенный был редкостным пессимистом, страстно любившим магические
  дуэли. Он был убежден, что единственный путь к совершенству в Искусстве — это постоянное
  испытание своих сил в борьбе с другими магами. Кроме того он был убежден, что все
  воры и наемные убийцы на свете охотятся за его богатствами. Чтобы не вызывать ни
  у кого подозрений, Эрон носил одежды паломника и ходил с простым дорожным посохом
  из вяза. На самом деле посох был зачарован для большей эффективности в бою, но этот
  факт волшебник не афишировал.'
