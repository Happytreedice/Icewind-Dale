description: 'Меч, созданный с единственной целью — уничтожать зло.

  Точность: Оружие ближнего боя, бонус+4к атаке и урону.

  Усиление: Против злых существ бонус усилен до +6.

  Твёрдость духа: Пока меч у вас в руке, вы не можете быть испуганы, а магия страха
  и очарования (плащ страха, ужас, скорбный вой, символ безнадёжности, порабощающие
  чары) на вас не действует.

  Этот меч создали для одной задачи: разить зло. Хотя Бледная Справедливость — мощное
  оружие, у него скромное происхождение. Ренолд, преданный почитатель бога Тира, выковал
  простой меч. Впрочем, не совсем простой — Ренолд тридцать лет совершенствовал свое
  мастерство обработки металла, чтобы изготовить почти безупречное оружие. Закончив
  работу, он пожертвовал меч церкви Тира. Принявший его жрец возложил простой, ничем
  не украшенный клинок на алтарь в монастыре и попросил других братьев вместе с ним
  помолиться Тиру, чтобы бог даровал мечу святые силы. Братья никогда не прикасались
  к этому оружию и даже не говорили о нём. Прошло десять лет, все остальные братья
  успели разувериться в том, что меч когда-либо обретет волшебные силы, но первый
  жрец, Идан, продолжал тихо молиться об этом. И еще двадцать лет бог не подавал своим
  почитателям никакого знака, что клинок благословлен. Жрецы Хельма, посетившие храм
  с визитом, принялись шутить над слепой верой Идана в меч. И тогда вдруг Идан поднялся,
  подошел к алтарю и осторожно взял клинок, покрытый пылью.

  Жрец Хельма поинтересовался, пришел ли Идан в себя. Идан ответствовал, что пришел,
  ибо понял, что все эти годы ожидал от Тира не того знака, что следовало. Он объявил,
  что бог давным-давно ответил на его молитвы.

  Жрец Хельма рассмеялся, услышав это, и приказал своему телохранителю обнажить меч.
  Последователь Хельма достал свое великолепное оружие. Гарда его была позолочена
  и инкрустирована жемчугом, пята украшена превосходными рубинами, а сам клинок покрывали
  руны. Жрец Хельма рассмеялся вновь и сказал: «Вот это — поистине меч, благословленный
  богами. Твое же оружие выглядит как простой солдатский меч. Оно бледнеет в сравнении
  с нашим».

  Идан спокойно взял клинок, еще лишенный рукояти, за основание и ударил по мечу телохранителя.
  Жрец Хельма перестал смеяться, увидев, как сломалось оружие его спутника, и умолк,
  потрясенный. Идан же опустил клинок и заговорил.

  «Справедливость всегда бледна по сравнению с тщеславием и показной силой. Я ждал,
  что Тир явит свое благословение пылающим пламенем и молниями. Но нужно было вспомнить,
  как мне передали этот меч. В милосердии и смирении. Справедливость доступна любому,
  и бедному, и богатому, и образованному, и невежественному. Ей место и на крестьянском
  поле, и на поле битвы».

  Идан отнес клинок местному оружейнику, и тот снабдил его деревянной рукоятью, обтянутой
  кожей. Затем жрец передал меч молодому паладину и завещал ему всегда помнить о том,
  сколько доброты и милосердия заложено в людях.'
