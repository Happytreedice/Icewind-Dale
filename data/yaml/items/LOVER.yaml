description: 'Метательный кинжал с рубиновым сердцем, возвращающийся в руку.

  Полуэльф-вор по имени Фелль Вереск завоевал себе дурную славу в Уотердипе. Его победы,
  любовные и плутовские, были столь многочисленны, что ни один бард не смог бы запомнить
  все. Он всегда носил при себе кинжал, украшенный рубиновым сердечком, который мечтала
  присвоить небольшая группа его соперников. В конце концов Фелль был убит рукой обольстительницы,
  столь ловко скрывавшей свои замыслы, что их не разгадал даже внимательный полуэльф.
  Эта женщина, Преспера из Орлумбора, продала кинжал за внушительную сумму и бесследно
  исчезла.'
