description: "Воинский устав Руки Селдарин\nКайлесса\nУстав\nСмерть всем, кто противостоит\
  \ нашему делу\n Бой — испытание превыше всех\n Принеси славу Руке Селдарин\n-----------------------------------------------------------------------------\n\
  Поступая ко мне в обучение, каждый будет тренироваться по следующей схеме:\nВы выучите\
  \ все аспекты владения всеми видами оружия ближнего боя, что я вам представлю. Вы\
  \ исследуете сильные и слабые стороны каждого вида оружия и научитесь эффективно\
  \ использовать его.\nВы овладеете мастерством лучника. В этом вам помогут терпение,\
  \ дисциплина и собранность. Лишь тогда вы научитесь поражать любую цель, невзирая\
  \ на ее сложность.\nСтав воином на службе Руки Селдарин, вы обязаны всегда вести\
  \ себя достойно эльфа. Неподчинение недопустимо.\n-----------------------------------------------------------------------------\n\
  Моя клятва\nВаши навыки и умения будут знаком преданности Руке Селдарин и своему\
  \ долгу.\nЯ клянусь совершенствовать ваши способности, физические и умственные,\
  \ дабы послужили они к вящей славе наших братьев и сестер.\nВо имя Руки Селдарин,\n\
  Кайлесса"
