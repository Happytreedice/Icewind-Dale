description: 'Крепчайшие сапоги великого ходока, гремящие с каждым шагом.

  Топот: Топнув, вы сотрясаете землю в радиусе 10 футов: каждое существо, кроме вас,
  должно преуспеть в спасброске Силы [[/save ability=str dc=13]], иначе Сбито с ног.
  Скрытно передвигаться в сапогах невозможно: помеха на проверки Ловкости (Скрытность).

  Эти необычайно крепкие сапоги носил фентийский исследователь Бордил Дальноход по
  прозвищу Топтун. По всему побережью Лунного Моря славились его состязания в ходьбе.
  Бордил и его товарищи-исследователи выбирали на карте Фаэруна точку назначения.
  Затем участники соревнования должны были дойти туда самым коротким путем. Бордил
  намного чаще побеждал в таких соревнованиях, чем проигрывал. Говорили, что у него
  очень тяжелые шаги, — за это он и получил свое прозвище. Бордил погиб под оползнем
  и был похоронен в глуши. Спустя несколько лет после его смерти пошли слухи, будто
  сапоги исследователя были зачарованы, потому его приближение и возвещали всякий
  раз громкие шаги. Слухи и легенды разрослись до того, что волшебные сапоги якобы
  могли обрушивать здания. Через десять лет после смерти Бордила воры разграбили его
  могилу и обнаружили, что сапоги действительно обладают этим свойством, потому что
  в это поверило множество людей.'
