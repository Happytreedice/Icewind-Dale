description: 'Странный камень вождя гоблинов Герака, шепчущий на гоблинском.

  Мудрость Герака: Интеллект +1, пока камень Йоун кружит у вашей головы.

  Множество историй повествуют о том, как Вождь Герак стал управлять племенем гоблинов
  Вертглюг. Некоторые из них выделяют его превосходный талант стратега, ведь вождь
  мог прокормить свое племя в течение нескольких недель после одного удачного набега,
  в то время как другие говорят о неких секретах, которыми обладал этот гоблин. Правда
  же оказалась интереснее вымысла — Герак повсюду носил странного вида камень, который
  появился у него загадочным образом. Однажды вождь ушел в неизвестном направлении,
  а вернувшись, принес его с собой. Каждый, кто возьмет в руки этот камень, сможет
  услышать те же голоса, что слышал Герак, звучащие из глубины веков. Конечно, они
  говорят на языке гоблинов, что затрудняет понимание, но, тем не менее, камень дарует
  свои тайные знания любому, кто им владеет.'
