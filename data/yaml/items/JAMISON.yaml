description: 'Праща гномьего героя, гроза огров и гоблинов Зелёных Холмов.

  Великий герой гномов Харл Джеймисон при помощи этой пращи не раз побеждал огров
  и гоблинов, которые заполонили его родину. Джеймисон был предводителем прославленной
  группы гномов-искателей приключений, которые называли себя Сыновьями Зеленых Холмов.
  Сыновья — герои для большинства гномов и увековечены во множестве народных песен
  и легенд. Пращу Джеймисона похоронили вместе с ним, когда он скончался от старости
  в 845 л.д. Вероятно, через некоторое время, около 890 л.д., его могилу разграбили
  люди-воры.'
