description: 'Тёмно-бурый капюшон, созданный гномом-вором и иллюзионистом Брейном
  Каштаном.

  Капюшон плута. Пока он надет, носителя нельзя поразить критическим попаданием —
  тень капюшона скрадывает уязвимые места.

  Воровская сноровка: Вы совершаете с преимуществом проверки Ловкости (Скрытность).

  Защита: Пока капюшон надет, вы получаете бонус +2 к КД.

  Слепота: Раз в день вы можете Действием выбрать существо, которое видите: оно должно
  преуспеть в спасброске Телосложения [[/save ability=con]], иначе становится Ослеплённым
  на 8 часов или пока эффект не будет снят магией.

  Разноцветные брызги: Раз в день вы можете Действием выпустить из капюшона сноп мерцающих
  красок конусом 15 футов. Каждое существо в области должно преуспеть в спасброске
  Телосложения [[/save ability=con]], иначе оно Ослеплено до конца вашего следующего
  хода; особенно могучие существа стряхивают эффект почти мгновенно.

  Этот темно-коричневый головной убор закрывает голову и плечи, как капюшон. Его изготовил
  гном Брин Каштан, вор и иллюзионист. Капюшон несколько лет сопровождал его в приключениях,
  пока давняя спутница жизни не убедила Брина осесть. Тогда он подарил головной убор
  своему племяннику Чирчету, который отдал артефакт в обмен на большой земельный участок.'
