description: 'Название дал первый владелец, любивший вонзать клинок в спины врагов;
  длинный стилет создан пробивать доспех. Им пользовался убийца Беледор из Калимпорта.

  Точность: Оружие ближнего боя, бонус +1 к атаке и урону.

  Меткость: Благодаря качеству изготовления это оружие даёт бонус +4 к броскам атаки.

  Свое странное имя это оружие получило из-за обычая своего первого хозяина наносить
  врагам удары в спину. Длинное лезвие типа стилета специально разработано, чтобы
  пробивать броню. Наемный убийца Беледор из Калимпорта поразил этим клинком десятки
  людей, прежде чем его отравил подкупленный слуга.'
