- name: Благословлённый шлем Латандера
  changes:
  - key: system.attributes.ac.bonus
    mode: 2
    value: '+2'
description: 'У этого искусно сработанного шлема короткая история. Жрица Латандера
  Ираэни из Сюзейла заказала его для защитника своей церкви, воина Бэлдана Миллера.
  Шлем служил Бэлдану часто: на Ираэни то и дело нападали приспешники Миркула. Прослужив
  Латандеру двадцать лет, Ираэни сложила сан, а следом и Бэлдан; вскоре они поженились.
  Шлем Бэлдан отдал странствующему паладину Латандера, который, как считается, погиб
  в бою с личом близ Битвы Костей.

  Использование: Благословлённый шлем Латандера даёт +2 к КД и позволяет несколько
  раз в день сотворять восстанавливающие заклинания.

  Защита от критических попаданий: Пока шлем надет, любое критическое попадание по
  вам становится обычным попаданием.

  Умеренное исцеление ран: (1/день) Действием вы касаетесь одного существа и восстанавливаете
  ему [[/heal 11]] хитов.

  Нейтрализация яда: (1/день) Действием вы касаетесь одного существа: с него снимается
  состояние Отравлен, действующие на него яды нейтрализуются, и оно восстанавливает
  [[/heal 10]] хитов.

  Снятие паралича: (1/день) Действием вы снимаете паралич со всех союзников в пределах
  15 футов от выбранной точки в поле вашего зрения.

  История этого искусно сделанного шлема не так уж длинна. Его изготовили по заказу
  Ираэни из Сузейла, жрицы Латандера, а предназначался он для защитника этой церкви,
  воина Белдана Миллера. Шлем нередко находил себе применение, так как Ираэни постоянно
  докучали последователи Миркула. Двадцать лет прослужив Латандеру, Ираэни решила
  удалиться на покой. Так же поступил и Белдан. Через некоторое время они поженились.
  Белдан подарил шлем странствующему паладину Латандера, который, вероятно, пал в
  сражении с личем неподалеку от места Битвы Костей.'
