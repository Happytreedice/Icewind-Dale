description: 'Религия в Руке Селдарин

  Денаини

  ...день за днем эльфы Руки усердно трудились, чтобы укрепить и поддержать Союз.
  Однако в преданности своему делу они не забывали и о поклонении богам. В башне Солонора
  устроили святилище, где эльфы могли уделить немного времени молитвам и ритуалам.

  В конце этажа находится прекрасный цветник. Эльф аккуратно срывает цветок, опускает
  его в купель у статуи божества, к которому хочет обратиться, и посвящает молитве
  столько времени, сколько позволяет работа.'
