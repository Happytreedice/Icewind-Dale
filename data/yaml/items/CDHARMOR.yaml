description: 'Шкурный доспех из плотной шкуры йети; тяжёл и негибок, но ценится в
  холодных краях.

  Доспех +1.

  Шумный: Пока вы носите этот предмет, вы совершаете с помехой проверки Ловкости (Скрытность).

  Профиль защиты: -2 к КД против колющего урона, -2 к КД против урона от снарядов.

  Сопротивление холоду: Пока этот предмет надет, вы имеете сопротивление урону холодом.

  Уязвимость к огню: Пока этот предмет надет, вы имеете уязвимость к урону огнём.

  Такие доспехи изготавливают из толстой шкуры крупного животного (в этом случае йети)
  или сшивают в несколько слоев кожу обычных животных, коров, например. В развитых
  человеческих культурах эти громоздкие, негибкие и тяжелые доспехи уже вышли из употребления,
  но по-прежнему распространены в варварских племенах, населяющих темные леса и туманные
  джунгли по всему миру. Доспех из шкуры защищает лучше, чем обыкновенный кожаный,
  однако ради этого приходится мириться с отвратительным запахом и жалким внешним
  видом. Такую броню могут носить воры, но она сильно мешает им применять особые навыки.

  Эта броня сделана Конланом и зачарована Орриком. Оррик не смог избавить броню от
  врожденной слабости против огня, но она дает естественную защиту от холода.'
