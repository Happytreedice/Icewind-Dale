description: 'Пока перчатки надеты, ваша Сила становится равной 19 (если не была выше).

  Защита: Пока рукавицы надеты, вы получаете бонус +1 к КД и +1 ко всем спасброскам.

  Эти изящные стальные перчатки изготовил эльфийский кузнец Идриал Лист Ясеня, а зачаровал
  его брат Белдан. Они подарили эти перчатки своему двоюродному брату Галейну, когда
  он единственный возвратился живым из неудачного похода на древнего зеленого дракона,
  который жил в лесах на месте теперешнего Амна. Три эльфа поклялись в течение десяти
  лет отомстить за свою родню. Приключения братьев увековечены Мерадором Уотердипским
  в цикле эпических баллад «Три мстителя». Каждая из шестнадцати песен, от «Баллады
  о короле гоблинов» до «Баллады о зеленой ночи», повествует об одном из подвигов
  трех эльфов. К сожалению, история перчаток Галейна оканчивается с последними тактами
  «Баллады о зеленой ночи», и дальнейшая их судьба покрыта мраком тайны.'
