description: 'Теория мифала

  Шенд и Мелка

  ...За исключением Высших Магов, никому, как бы ни был он сведущ в древних познаниях
  эльфов и новейших теоретических разработках в области магии, достоверно не известна
  природа мифала. Многие сходятся в том, что мифал обладает жизнью и представляет
  собой огромную сеть магической энергии, сплетенную при помощи волшебства и жизненной
  силы волшебников. Вероятно, мифал поддерживает свое существование за счет естественных
  процессов в природе (ветер, течение реки, изменение температуры под действием солнца
  и так далее) на территории, охваченной им и окружающей его. Учитывая, как связаны
  мифалы с Фэйруном и самим понятием жизненной силы, вряд ли можно отнести их к обыкновенному
  волшебству, что бы ни утверждалось в прошлом. Очевидно, магия мифалов восходит непосредственно
  к Узору, истоку всей магии Торила...'
