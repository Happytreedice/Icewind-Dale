description: 'Тяжёлый уродливый шлем орочьей работы, обостряющий разум владельца.

  Мыслитель: +1 к КД; Интеллект +2, но Харизма −2 (шлем уродлив и тяжёл: орочья работа).

  Защита разума: Шлем защищает от критических попаданий: критическое попадание по
  вам становится обычным.

  Этот редкий шлем обязан своим существованием одному орку, воителю и магу.

  Удивительная история Чотога началась, когда его деревня была случайно уничтожена
  в сражении между двумя группировками волшебников. Один из победителей, маг-чародей
  Шанделлон, почувствовал муки совести, когда увидел пострадавшую деревню, и, чтобы
  искупить вину, забрал с собой единственного выжившего и воспитал юного орка, как
  родного сына.

  Под руководством Шанделлона Чотог начал осваивать магию, несмотря на свое происхождение.
  Однако Чотогу приходилось прикладывать намного больше усилий, чем людям, учившимся
  у Шанделлона, а добивался он меньшего. Орком овладела зависть, и он заперся у себя
  в комнате на несколько дней, без отдыха работая над предметом, который позволил
  бы ему превзойти других учеников.

  Плодом его трудов стал шлем, довольно уродливый, но с поразительным свойством значительно
  увеличивать интеллект владельца. Чотог немедленно надел свое сокровище. Однако вскоре
  он обнаружил, что невежество — лучший дар для завистливого орка, чье существование
  настолько жалко. Шанделлон нашел обуглившиеся останки своего приемного сына, все
  в шлеме, теперь почерневшем, рядом с короткой запиской: «Некоторые идеи лучше оставлять
  без воплощения».

  Думатель Чотога повышает интеллект владельца на 2 и дает бонус +1 к классу защиты.
  Однако этот шлем орочьей модели и потому тяжел и некрасив. Таким образом, он понижает
  харизму на 2, а для его ношения требуется сила не ниже 17.'
