description: 'В течение 1 часа ваша Мудрость становится равной 19 (если не была выше),
  обостряя внимание к деталям.

  Воровская сноровка: Вы совершаете с преимуществом проверки Ловкости (Скрытность)
  и проверки Ловкости (Ловкость рук) и проверки на взлом замков (воровские инструменты)
  и проверки на поиск и обезвреживание ловушек.

  Это зелье обостряет ощущения выпившего, помогая ему лучше справляться с тонкой работой.
  Его эффект благотворно сказывается на использовании воровских навыков.'
