description: 'Осколок чёрного льда в оплётке, сбивающий с толку взгляд нападающих.

  Обман взора: +2 к КД и +1 к спасброскам от заклинаний, пока амулет надет.

  Размытие (1/день): Сотворяет заклинание @UUID[Compendium.dnd5e.spells24.Item.phbsplBlur000000]
  без траты ячейки.

  Отражения (1/день): Сотворяет заклинание @UUID[Compendium.dnd5e.spells24.Item.phbsplMirrorImag]
  без траты ячейки.

  Тиернон обмотал и закрепил шнур вокруг зеркала, и теперь его можно носить на шее.
  Зеркало из черного льда в этом виде сохраняет свои свойства, но стало гораздо легче,
  а отражения в нём теперь кажутся более четкими и в то же время размытыми.

  Волшебные свойства зеркала из черного льда позволяют ему искажать зрение врага.
  Если просто носить этот амулет, он помогает своему владельцу защищаться от атак,
  заставляя противника промахиваться. Если же сконцентрироваться на зеркале, то можно
  изменить свой облик в глазах окружающих, либо разделив его на несколько идентичных,
  чтобы запутать противника, либо исказив очертания своего тела, чтобы по нему было
  сложнее попасть. К этим силам можно обратиться только ограниченное число раз, но
  пассивная защита сохранится и тогда, когда заряды «Размытия» и «Зеркального образа»
  закончатся.'
