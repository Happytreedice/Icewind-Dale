description: "Сайто Кагидзу, или «Кот Востока», как звали его воры Аткатлы, привёз\
  \ с собой в Фаэрун несколько таких мечей ниндзя. Они были из его личного собрания\
  \ — ниндзято, которые он либо «коллекционировал» у соперников, либо создавал сам.\
  \ После его смерти его любовница раздарила мечи другим своим возлюбленным — все\
  \ они и сами были могущественными ворами.\nТочность: Оружие ближнего боя, бонус\
  \ +1 к атаке и урону.\nSaito Kagizu, or \"Cat of the East\" as the thieves of Athkatla\
  \ called him, brought several of these ninja swords with him when he arrived in\
  \ Faerûn. They were part of his personal collection, ninjatō that he either \"collected\"\
  \ from rivals or designed himself. When he died, his mistress gave away the swords\
  \ to her other lovers, all of them powerful thieves in their own right.\nSTATISTICS:\n\
  THAC0: +1\nDamage: 1d8+1 (slashing)\nSpeed Factor: 3\nProficiency Type: Scimitar/Wakizashi/Ninjatō\n\
  Type: One-handed\nRequires:\n 6 Strength\nWeight: 4\nСвойства ниндзято (PF2e): 1d6\
  \ рубящий, фехтовальное (Finesse), лёгкое (Light).\n• Быстрое (Agile / Nick): атака\
  \ второй рукой в рамках действия Атака.\n• Удар в спину (Backstabber): +1 точечного\
  \ урона (+2 для оружия +3..+5) по целям в состоянии Off-Guard.\n• Скрытное ношение\
  \ (Concealable): преимущество на проверки скрытности при спрятывании оружия в одежде."
