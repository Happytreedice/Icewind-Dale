description: 'Посох мага-наёмника, призывающий стихийных слуг.

  Призыв огненного элементаля (1/день): Действием вы призываете огненного элементаля
  в свободное пространство в пределах 20 футов. Элементаль дружественен вам и подчиняется
  вашим устным командам; он исчезает через 1 час или при падении до 0 хитов.

  Призыв водяного элементаля (1/день): Действием вы призываете водяного элементаля
  в свободное пространство в пределах 20 футов. Элементаль дружественен вам и подчиняется
  вашим устным командам; он исчезает через 1 час или при падении до 0 хитов.

  Этот посох изготовил волшебник Куост Курион, маг-наемник. В бою он предпочитал призывать
  союзников, которые помогали ему расправиться с врагом. Но зачастую его запас заклинаний
  оказывался на исходе как раз тогда, когда они были больше всего нужны. Куост потратил
  семь лет и огромную сумму на то, чтобы создать этот посох. Волшебное оружие обеспечивало
  ему победу за победой, пока он не вступил в схватку с магом-оградителем, который
  был готов к нападению призванных монстров. Куост был убит в сражении с ним в 1063
  л.д., а посох забрал себе победитель, Бальдер Ренолд.'
