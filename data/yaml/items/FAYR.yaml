description: 'Оружие роты Чёрной Змеи, известной под Уотердипом детально проработанной
  тактикой боя.

  Точность: Оружие ближнего боя, бонус +3 к атаке и урону.

  Отряд Черной Змеи был хорошо известен в Уотердипе и его окрестностях в первой половине
  13 столетия л.д. Эту команду наемников отличала высокая организованность и проработанная
  тактика сражения. Выступая против особенно мощного врага, они отправляли вперед
  двух дворфов и двух полуросликов, чтобы окружить цель. Люди и эльфы в это время
  обстреливали противника и били алебардами из задних рядов. Эта алебарда принадлежала
  Бедвину Фэйру, одному из лучших алебардщиков отряда. Тактика Черной Змеи не оправдала
  себя в 1252 году, когда против отряда выступила другая команда наемников, которые
  оказались более успешными тактиками. После той схватки уцелели только Фэйр и один
  из полуросликов, Пеп Зеленый Луг. Фэйр и Пеп решили, что Тимора подает им знак.
  Тогда они распродали свое снаряжение и открыли в Уотердипе прибыльную антикварную
  лавку.'
