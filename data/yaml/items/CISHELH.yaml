description: 'Чёрная сфера с пламенем внутри — око чудовища, опалённое богом огня.

  Кровь огня: Ваши заклинания, наносящие урон огнём, наносят дополнительный урон,
  равный вашему Бонусу владения; сотворение заклинаний ощутимо ускоряется (нарративно).

  Бог огня Коссут нечасто появляется в Забытых Королевствах в материальном воплощении.
  В этих редких случаях он приносит с собой разрушение. Однажды в 801 л.д. его призвало
  большое собрание верных последователей. Без помощи бога им никак не удавалось одолеть
  гигантского осьминога, напавшего на прибрежный храм. Коссут явился в огромном столбе
  огня и сразился со сверхъестественным чудовищем. Он победил, но был ранен, и часть
  божественной сущности Коссута попала на осьминога. Божественный огонь пробежал по
  телу чудовища и собрался в одном из глаз, превратив его в загадочный черный шар,
  пылающий изнутри.'
