description: 'Тяжёлое белоснежное одеяние — дар сестры Каллианы; прежде принадлежало
  раскаявшемуся злому чародею.

  Защита: +5 к КД и +15 к максимуму хитов, но −2 к Ловкости из-за сковывающей боли.
  Тот, кто ранит носителя в ближнем бою, сам испытывает жгучую вспышку боли.

  Символ боли: Пока одеяние надето, носителя непрерывно терзает боль, словно тело
  пронзают шипы: вы получаете штраф −4 к броскам атаки и −2 к КД (снижение Ловкости
  уже учтено отдельно).

  Эту тяжелую мантию сестра Каллиана подарила вам за спасение души Гласа Дурдель Анаты.
  Изначально ее носил раскаявшийся злой колдун, который ради своих черных целей уничтожил
  целую деревню. Мантия бела как снег и кажется мягкой и легкой.'
