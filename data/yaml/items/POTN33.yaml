description: 'Этот могучий эликсир дарует выпившему иммунитет ко всем заклинаниям
  до 5 уровня включительно. Одновременно с выпившего снимаются все эффекты заклинаний
  5 уровня и ниже. Эффект длится лишь 5 раундов, так что нужен точный расчёт.

  Стойкость: В течение короткого времени вы получаете преимущество на спасброски против
  заклинаний и магических эффектов.

  Это весьма действенное зелье делает выпившего его неуязвимым для всех заклинаний
  до 5-го уровня включительно. При этом с персонажа снимается действие всех заклинаний
  не выше 5-го уровня. Действие продолжается всего 5 раундов, так что нужно верно
  рассчитать время.'
