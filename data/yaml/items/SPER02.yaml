description: 'Древнее оружие, доведённое чарами до совершенства.

  Копья относятся к самым древним видам оружия, известным еще в первобытные времена,
  когда копье представляло собой деревянный посох или палку с заостренным концом.
  С развитием обработки металла наконечники стали изготавливать из железа и стали.
  Затем мастера-оружейники начали придумывать новые варианты наконечников, лучше приспособленные
  для конкретных задач, — так появились различные виды древкового оружия. Это копье
  несколько отличается от других, поскольку оно наделено магическими свойствами.'
