description: 'О певцах клинка

  Маккомб и Прайор

  Это элитное подразделение эльфийских воинов-магов. Посвятив жизнь защите своего
  народа, многие певцы клинка возвращаются в Фаэрун, чтобы помогать эльфам, которые
  не успели присоединиться к Исходу или решили остаться.

  Певцы клинка — выдающиеся знатоки оружейного мастерства и магических искусств. На
  Эвермите они организованы в небольшие воинские кланы, каждый из которых специализируется
  на своем виде оружия. Они еще больше привержены древним обычаям и манере одеваться,
  чем остальные серебряные эльфы. Певцы клинка часто украшают тело татуировками старинных
  рун и символов; их оружие и доспехи — настоящие шедевры древних мастеров.'
