description: 'Жезл, извергающий огненные шары и струи пламени.

  Огненный шар (1 заряд): Действием и одним зарядом вы выпускаете огненный шар в точку
  в пределах 150 футов: каждое существо в радиусе 20 футов совершает спасбросок Ловкости
  [[/save ability=dex dc=15]], получая [[/damage 6d6min2 fire]] при провале или половину
  при успехе.

  Опаляющий луч (1 заряд): Действием и одним зарядом вы выпускаете столб пламени в
  существо в пределах 40 футов: спасбросок Ловкости [[/save ability=dex dc=15]], урон
  [[/damage 6d6 + 6 fire]] при провале или половина при успехе.

  Из жезла вылетает гигантский горящий шар, который устремляется в указанную точку
  и взрывается в ней, как в заклинании «Огненный шар». Взрыв наносит 6d6 единиц урона,
  при этом все выпавшие единицы считаются за двойки. При успешном спасброске против
  жезла пострадавшие получают только половину урона. Есть второй вариант использования
  жезла, он напоминает действие заклинания «Пекло Аганназара»: в цель бьет огненная
  струя, которая наносит 6d6+6 урона (половину при успешном спасброске против жезла).'
