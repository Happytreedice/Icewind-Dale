description: 'Выдержка...

  «Безошибочно опознать большого раика можно по типичной изогнутой челюсти и бело-голубым
  отметинам на плавниках. Размеры больших раиков сравнимы с человеческими, эти рыбы
  способны оказать серьезное сопротивление рыбакам. В отличие от малых раиков, большие
  раики очень агрессивно отстаивают свою территорию и сражаются до победного конца.
  Известны случаи, когда они нападали на рыб, втрое превышающих их по размеру. Один
  рыбак из Силгонта заявлял даже, что видел, как большой раик вышел победителем из
  схватки с Крапчатым осьминогом Сиди...»'
