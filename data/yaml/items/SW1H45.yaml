description: 'Этим оружием изначально владела молодая офицерша, охранявшая дипломатическую
  миссию из Кара-Тура. Когда на караван посольства напала шайка налётчиков юань-ти,
  большинство стражей полегло в первые же мгновения — уцелела лишь одна повозка и
  защищавшая её молодая женщина. Волна за волной юань-ти бросались на офицершу, и
  волна за волной падали под скоростью и яростью её стали. Наконец вожак налётчиков
  сам сошёлся с ней в бою и, хоть в итоге и одолел её, был поражён её мастерством.
  Катану подобрали, и позже её зачаровал верховный жрец Ссета. Некогда изящный клинок
  осквернён тёмной магией и теперь направляет руку владельца, чтобы наносить врагам
  тягчайшие раны.

  Точность: Оружие ближнего боя, бонус +2 к атаке и урону.

  Расширенный критический удар: Атаки этим оружием совершают критическое попадание
  при выпадении 19 или 20 на d20.

  Проклятие: Когда вы совершаете критическое попадание этим оружием, цель и враждебные
  вам существа в пределах 15 футов от неё оказываются прокляты: они получают штраф
  −1 к броскам атаки и спасброскам на 1 минуту.

  Это оружие изначально принадлежало девушке-офицеру, охранявшей дипломатического
  представителя из Кара-Тура. Когда караван дипломата попал в засаду небольшого отряда
  мародеров юань-ти, большинство охранников погибли в этом неожиданном нападении.
  Выжила лишь та девушка, защищавшая один из обозов. Волна за волной обрушивались
  юань-ти, но никак не могли совладать с ее яростью и столь же стремительно погибали
  от стального клинка. Наконец, лидер мародеров напал на молодую воительницу, и, не
  смотря на то, что победил в сражении, он поразился ее мастерством. Катана, которую
  девушка носила с собой, позднее восстановил и зачаровал первосвященник Ссета. Он
  наделил некогда изящный клинок свойствами темной магии и теперь тот наносит своим
  жертвам тяжкие раны.'
