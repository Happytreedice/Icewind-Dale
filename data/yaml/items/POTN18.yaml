description: 'Некоторое время вы поглощаете часть направленной на вас магии.

  Сопротивление электричеству: Пока этот предмет надет, вы имеете сопротивление урону
  электричеством.

  Как и следует из названия, это зелье дает персонажу способность поглощать внешние
  атаки. Все удары дробящим оружием смягчаются, и лишь самые мощные из них смогут
  пробить защиту. Кроме того, зелье дает полный иммунитет к электричеству на 2 часа.'
