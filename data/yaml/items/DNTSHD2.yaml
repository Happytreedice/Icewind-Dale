description: 'Пробуждённый Тирноном щит, тихо гудящий в руке.

  Оплот (1/день): Бонусным действием вы укрепляете щит на 17 раундов: +2 к КД сверх
  обычного бонуса щита.

  Неослабная стойкость (1/день): Действием вы касаетесь существа: с него снимается
  истощение первой степени и усталость.

  Физическая стойкость: Пока щит у вас в руках, вы получаете сопротивление дробящему,
  колющему и рубящему урону.

  Похоже, Тиернон восстановил чары на этом щите, которые «впали в спячку» (вероятно,
  когда по нему ударил кулак великана). Мастер обвел руны по краям и заново нарисовал
  в центре символ Мятого Шлема. Теперь щит сверкает ярче, чем прежде, меньше весит
  и немного подрагивает в руке, будто что-нибудь напевает про себя.'
