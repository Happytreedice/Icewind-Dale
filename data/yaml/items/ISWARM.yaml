description: 'Работа дворфийского кузнеца Карадора и эльфийского зачарователя Эламета
  Пятидревного во Время Сотрудничества.

  Доспех +2.

  Профиль защиты: +3 к КД против рубящего урона.

  Сопротивление кислоте: Пока этот предмет надет, вы имеете сопротивление урону кислотой.

  Сопротивление холоду: Пока этот предмет надет, вы имеете сопротивление урону холодом.

  Сопротивление огню: Пока этот предмет надет, вы имеете сопротивление урону огнём.

  Сопротивление электричеству: Пока этот предмет надет, вы имеете сопротивление урону
  электричеством.

  Харизма: Пока доспех надет, ваша Харизма увеличивается на 1 (максимум 20).

  Этот доспех изготовили дворф-кузнец Карадор и эльфийский маг Эламет из Пяти Деревьев.
  Много чудесных вещей увидели свет во времена союза между Рукой Селдарин и Пещерами
  Дорна. Одной их них был этот доспех. Чрезвычайно легкая и красивая, эта броня принадлежала
  эльфийской военачальнице из Отрезанной Руки, поэтому орки не забрали ее, когда разграбили
  башни. Впоследствии доспех украла из Руки Дева Ильмадия.'
