description: 'Копьё философа-мага, скользящее по незримым потокам силы.

  Разряд силы: попадание высвобождает копьё разрушения: цель получает [[/damage 5d4
  + 30 force]], спасбросок Телосложения [[/save ability=con dc=15]] — половина.

  Это оружие создал Гиддеон Верующий, маг и философ. Он утверждал, что по всему миру
  проходят естественные энергетические «линии». Чтобы воспользоваться энергией таких
  линий, волшебнику просто нужно понять, как они устроены. Гиддеон считал, что любой
  маг, определив направление энергетического потока, теоретически способен черпать
  из него силу через заклинания или «фокусирующее устройство». В 1010 л.д. лабораторию
  Гиддеона разрушил колоссальный взрыв, и это копье было одним из немногих уцелевших
  предметов. Оно само настраивается на энергетические линии, направляясь к цели. Иногда
  копье подключается к линии скрытой силы и вызывает взрыв невероятной мощности.'
