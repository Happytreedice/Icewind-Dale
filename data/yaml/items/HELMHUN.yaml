description: 'Добротный боевой шлем, зачарованный на защиту.

  Защита: Пока шлем надет, вы получаете +2 к КД.

  Защита головы: Пока шлем надет, любое критическое попадание по вам становится обычным
  попаданием.

  Этот шлем принадлежал великому эльфийскому охотнику по имени Иллиан Тень Ивы. Группа
  полуросликов изготовила его в благодарность за то, что Иллиан избавился от злобного
  жреца Малара и его кровожадных зверей, которые угрожали поселениям маленького народца.
  Шлем верно служил охотнику, пока он в день эльфийского праздника Синнелос''Кор не
  погнался за крупным оленем. Животное прыгнуло в заросли кустарников и лиан, за ним
  последовал и Иллиан, но тут огромные рога шлема запутались в ветвях, и охотник сломал
  себе шею.'
