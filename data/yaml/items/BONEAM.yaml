description: 'Талисманы, ценимые некромантами; создаются из кости убитого вампира.

  Костяной талисман. Заключённая в нём фейская магия позволяет носителю вытягивать
  жизненную силу из любого живого существа при касании.

  Вампирское касание: (1/день) Действием вы совершаете рукопашную атаку заклинанием
  по существу в пределах досягаемости. При попадании цель получает [[/damage 3d6 necrotic]],
  а вы восстанавливаете количество хитов, равное половине нанесённого урона некротической
  энергией.

  Этот талисман сделан из кости убитого вампира. Такие талисманы высоко ценят некроманты.
  Кость обычно вставляют в кольцо или ожерелье, получая артефакт, который позволяет
  одним прикосновением забирать жизненные силы у любого живого существа.'
