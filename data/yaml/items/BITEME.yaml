description: 'Это копьё принадлежало Керишу, надсмотрщику в залах Зуба Змея. Древко
  из тёмного дерева увенчано наконечником, зачарованным на могучие +3: им Кериш держал
  в страхе рабов и врагов, пока Глубины Дорна не пали.

  Точность: Оружие ближнего боя, бонус +3 к атаке и урону.

  Сопротивление огню: Пока это оружие у вас в руках, вы имеете сопротивление урону
  огнём.

  Ледяное жало: При попадании копьё наносит дополнительно [[/damage 1d6 cold]].

  У этого копья странная конструкция: древко сделано из неизвестного материала и прозрачно,
  словно хрусталь, а наконечник напоминает сосульку и окружен ледяной аурой. Всё оружие
  окружает легкий туман ледяных кристалликов.'
