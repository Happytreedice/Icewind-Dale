description: 'Цеп — это прочная деревянная рукоять, к которой крепится железный стержень,
  деревянный стержень с шипами или шипастый железный шар. Рукоять и било соединены
  шарниром или цепью. Изначально это орудие использовали для обмолота зерна. Этот
  цеп усилен магией: на каждой его поверхности светятся руны.

  Точность: Оружие ближнего боя, бонус +2 к атаке и урону.

  Оглушение: удар оглушает: цель должна преуспеть в спасброске Телосложения [[/save
  ability=con]], иначе станет Ошеломлённой до конца своего следующего хода.

  Цеп — это железный прут, деревянный брус с шипами или металлический шипованный шар,
  прикрепленный к массивной деревянной рукояти с помощью цепи или петли. Первоначально
  цеп был орудием для молотьбы зерна. Этот цеп зачарован. По всей его поверхности
  поблескивают руны.'
