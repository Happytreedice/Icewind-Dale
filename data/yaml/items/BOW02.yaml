description: 'Составные луки — это длинные или короткие луки, чьё древко сделано из
  нескольких разных материалов. Это придаёт большую упругость и, значит, большую дальность.
  Их создали позже обычного длинного лука.

  Точность: Оружие дальнего боя, бонус +1 к атаке и урону.

  Меткость: Благодаря качеству изготовления это оружие даёт бонус +1 к броскам атаки.

  Составные луки бывают длинными и короткими. Их отличает древко, изготовленное из
  нескольких разных материалов — это повышает гибкость, а соответственно, и дальность
  стрельбы. Это следующий этап развития длинного лука.'
