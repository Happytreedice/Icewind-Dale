description: 'Реликвия святого святилища Звёздного Мавзолея в Миф Глаураке, этот пояс
  благословил аватар Лабеласа Энорета, эльфийского бога времени и долголетия. Верховный
  жрец Лабеласа носил его и в повседневных делах, и в бою. Сплетённый из чередующихся
  полос бронзы и золота, изящный пояс был сокровищем и без магических свойств. Когда
  орки разорили Миф Глаурак, этот пояс стал одной из самых заметных потерь.

  Иммунитет: Пояс Лабеласа даёт постоянную свободу перемещения (иммунитет к состояниям
  «опутан» и «парализован»); раз в день позволяет ускорить носителя.

  Ускорение: Раз в день вы можете действием наложить на себя эффект заклинания @UUID[Compendium.dnd5e.spells.Item.Szvk5FEVQW3uhJi5]{«Ускорение»}
  на 1 минуту (концентрация не требуется). Способность восстанавливается после Длинного
  отдыха.

  Этот ремень — один из немногих сохранившихся артефактов Мавзолея Звезд, святилища
  в Мит Глаураке. Его благословила аватара Лабеласа Энорета, эльфийского бога времени
  и долголетия. Верховный жрец Лабеласа надевал этот ремень и в обычные дни, и перед
  сражением. Он состоит из чередующихся полос бронзы и золота и весьма ценен даже
  без учета его магических свойств. Чудесный ремень был одним из самых драгоценных
  предметов, похищенных орками при разграблении Мит Глаурака.'
