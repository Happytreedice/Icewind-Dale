description: 'Ним заказал этот кинжал вместе с девятнадцатью такими же, когда принёс
  связку рогов единорога — аликорнов — могущественному тёмному эльфу-зачарователю
  в Мензоберранзане. У тёмно-синего клинка нет гарды, зато навершие — большой серебряный
  череп. Рукоять обтянута выкрашенной в чёрное кожей иллитида, а в глазницы черепа
  вставлены маленькие сапфиры.

  Точность: Оружие ближнего боя, бонус +2 к атаке и урону.

  Ним заказал два десятка таких кинжалов, когда принес целую связку рогов единорога,
  аликорнов, могущественному темному эльфу-чародею из Мензоберранзана. У темно-синего
  клинка нет эфеса, зато рукоять, оплетенная кожей иллитида, окрашенной в черный,
  завершается большим серебряным черепом с двумя маленькими сапфирами вместо глаз.'
