description: '«Ловушка убила меня, но так даже лучше. Я чувствовал зло внутри себя
  с той минуты, как вошёл в эту гробницу.»

  В этой ловушке мне суждено умереть, но мне всё равно. Я почувствовал в себе зло
  с той секунды, как ступил в эту гробницу. Я уже не отвечаю за свои действия, мой
  разум в смятении, воля подавлена. Возможно, другим удастся понять, что здесь творится,
  прежде чем их постигнет моя судьба.

  Я обнаружил еще один проход, через дыру в тюремной камере над этой комнатой. Но
  там, куда он ведет, этих мерзких орогов еще больше, чем тут, и вдобавок бродит какая-то
  огромная уродливая тварь. Готов поклясться, что она со мной говорила. Вероятно,
  уже тогда зло гнездилось в моем сознании.'
