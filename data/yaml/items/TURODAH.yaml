description: 'Выкованный в 1021 году ЛД для воина Макаэля Сухопарого, Туродахель имеет
  кровавую военную историю. Макаэль был наёмником, продававшим услуги всякому, кто
  платил. Слывший хитрым и расчётливым, Макаэль больше трёх десятилетий осмотрительно
  применял своё мастерство и силу Туродахеля. Лишь после того, как Макаэль умер от
  магической болезни, о нём начали складываться легенды. Нынешние мудрецы полагают,
  что за годы Макаэль убил этим мечом более пятисот человек. Все знали, что Макаэль
  не отличался ни силой, ни выносливостью, — потому и решили, что его деяния стали
  возможны благодаря силе меча. Могилу Макаэля разграбили через несколько лет после
  погребения.

  Точность: Оружие ближнего боя, бонус +2 к атаке и урону.

  Сила осмотрительности: Пока Туродахель у вас, ваш Интеллект повышается на 1 (максимум
  20).

  Меч Туродаэль, созданный в 1021 л.д. для война Макаэля Тощего, оставил кровавый
  след в истории. Макаэль был наемником, который служил любому, кто предлагал достаточную
  плату. Он прославился хитростью и находчивостью и больше тридцати лет ловко применял
  свои навыки и свой меч. После того, как Макаэл умер от магической болезни, о нем
  начали рассказывать легенды. Сейчас утверждают, что за эти годы он убил более пяти
  сотен человек. Однако было широко известно, что Макаэль не отличался особенной силой
  или выносливостью, и поэтому появились предположения, что все дело в мече. Не прошло
  и нескольких лет после похорон Макаэля, как его могила была разграблена.

  Следующие несколько десятилетий ознаменовались бесчисленными заговорами и убийствами
  — воины и воры от Лунного моря до Долин желали заполучить легендарный меч. Один
  из жрецов Бэйна, заинтересовавшись силами меча, выкрал череп Макаэля и призвал его
  дух. В ответ на вопрос о волшебных свойствах оружия дух произнес одно-единственное
  слово — «туродаэль». Жрец несколько месяцев копался в книгах и наконец обнаружил
  это слово в одном из нетерильских словарей. Приблизительно оно переводится как «могущество
  благоразумия».'
