description: 'Пока застёжка носится на шее, она немного повышает стойкость владельца
  к колющему, рубящему и стрелковому урону. Продавалась Орриком Седым в его башне.

  Это небольшой талисман служил застежкой на плаще невероятно живучего воина по имени
  Брон Болон. Не менее десяти раз в жизни Брона признавали погибшим, когда он впутывался
  в очередную жуткую ситуацию. Однажды враги расстреляли его из арбалетов, привязали
  к ногам свинцовые гири и столкнули в океан — а через месяц Брон прикончил их в таверне
  в четырехстах милях оттуда. В другой раз спутники Брона струсили и бросили его одного
  в дикой местности, когда на них напала стая лютых волков. Две недели спустя Брон
  приковылял к лагерю, облаченный в волчьи шкуры. Правдивы все эти истории или нет,
  но говорят, что свою смерть он нашел в горах Хребта Мира, сражаясь с полярными червями.'
