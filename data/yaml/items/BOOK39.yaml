description: 'История дроу, Темные войны:

  Нисхождение не изменило воинственную натуру дроу. Только опомнившись от поражения
  на поверхности, они тут же принялись воевать с подземными жителями, чтобы завладеть
  территориями Андердарка. Сначала они похитили и захватили немало волшебных предметов
  дворфов и использовали их против самих дворфов. Так возникла вражда между двумя
  расами, не прекратившаяся до сих пор.

  Затем дроу стали бороться за власть в новом королевстве уже друг с другом — воины
  с воинами, жрецы со жрицами. Эта всеобщая война завершилась в огне магических взрывов,
  которые обрушили великий Бэринден, самую большую из захваченных пещер дворфов. Потолок
  полностью осыпался, похоронив под обломками немалое число дроу и руины городов дворфов.
  Бывшая пещера, теперь открытая небу, стала называться Большим Разломом. Знатные
  дроу, которым удалось выжить, собрали уцелевших эльфов, рабов и остатки имущества
  и разбрелись по Андердарку в поисках нового пристанища. Это время Раздробленности,
  как его назвали впоследствии, породило множество обособленных конкурирующих городов,
  в которых большинство дроу и живет теперь.'
