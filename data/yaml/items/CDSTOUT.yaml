description: 'Этот малый щит был создан как дар вождя клана Боевого Молота одному
  из доверенных слуг — Вурдару Крепкопиву, что защищал семью вождя.

  Магический малый щит. КД, обеспечиваемый этим щитом, увеличивается до +3 (вместо
  обычного +2).

  Без защиты от снарядов: Бонус этого щита к КД не действует против дальнобойных атак.

  Этот малый щит сделали в подарок одному из верных слуг вождя клана Боевых Молотов.
  Этот слуга, Вурдар Крепкий Эль, спас семью вождя от йети. Он гордо носил этот щит
  десять лет, пока не погиб на Хребте Мира от лап орков. Его самопожертвование позволило
  спастись важным членам клана Боевых Молотов.

  После объединения этого щита с символом клана Боевых Молотов, его свойства улучшились.'
