description: 'Создана душевнобольным бардом Оуэйном Пайпером, почитателем Аурил.

  Конус холода: Раз в день действием, протрубив в рог, владелец сотворяет @UUID[Compendium.dnd5e.spells.Item.RpKjTlYASrfqUPVA]{«Конус
  холода»}: каждое существо в 60-футовом конусе должно совершить спасбросок Телосложения
  [[/save ability=con]], получая [[/damage 8d8 cold]] урона холодом при провале или
  вдвое меньше при успехе.

  Колыбельную Овейна сделал бард Овейн Дудочник, последователь Аурил. Он родился в
  Серебристой Луне и страстно любил холод своих родных краев. В долгих путешествиях
  по Лунному морю Овейн повстречал мага по имени Пелэм Болотный. Они подружились и
  общались более десяти лет. За небольшое вознаграждение Пелэм наложил чары на инструмент
  барда. Овейн редко пользовался этим гобоем в сражениях. Обычно он начинал играть
  на нём, увидев на каком-нибудь озере поздних перелетных гусей. Звуки Колыбельной
  Овейна казались птицам голосом их сородичей, летящих зимовать на юг. Гуси снимались
  с места, и бард своей замораживал их в полете, оставляя умирать.'
