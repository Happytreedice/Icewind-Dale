description: 'Маленький стальной кинжал с рукоятью из тенекронного дерева. Некогда
  Яблокоруб принадлежал полурослику-вору Пеливену Редграссу — доброму, но угрюмому
  малому, который почти не пускал клинок в дело, предпочитая чистить им яблоки. Оттого
  товарищи и прозвали кинжал «Яблокорубом».

  Точность: Зачарованный кинжал +1 со свойствами обычного кинжала +1: бонус +1 к броскам
  атаки и урона.

  Владельцем этого маленького стального кинжала с темной рукоятью когда-то был вор-полурослик
  по имени Пеливен Краснотрав. Добродушный, но замкнутый, он больше всего любил сидеть
  в большом кресле-качалке, которое брал с собой даже в дорогу. Перед каждым серьезным
  приключением он подолгу просиживал в своем кресле и ел яблоки, очищая их этим кинжалом.
  Этот клинок столь редко использовался в сражениях, что приятели полурослика прозвали
  его «Погибель Яблок».'
