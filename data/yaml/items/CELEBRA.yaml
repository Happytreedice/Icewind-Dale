description: 'Прекрасный топор работы мастера Бриата Среброрукого, преданного почитателя
  Морадина.

  Точность: Оружие ближнего боя, бонус +4 к атаке и урону.

  Этот прекрасный топор был тщательно сработан Бриатом Среброруким, искусным ремесленником
  и преданным последователем Морадина. Бриат выковал это оружие в честь создания великого
  памятника своему богу, отцу расы дворфов. Мастер поместил его в статую на случай,
  если топор понадобится в будущем какому-нибудь герою для освобождения Пещер Дорна.'
