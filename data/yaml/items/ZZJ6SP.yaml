description: 'Оружие, которым когда-то владела убитая горем верховная жрица Лунной
  Девы, Обет Селунэ имеет короткую и печальную историю. Фасса Скорбная (как её зовут
  теперь) возглавляла отряд селунитов-приключенцев, посвятивших себя истреблению нежити,
  где бы та ни встретилась. Поначалу отряду сопутствовал успех, потерь почти не было.
  Но удача Тиморы не могла быть с ними вечно.

  Точность: Оружие ближнего боя, бонус+1к атаке и урону.

  Усиление: Против призрачной нежити бонус усилен до +3.

  Никогда не забывай: Скорбь Фассы въелась в оружие: при каждом попадании этой булавой
  бросьте [[/r 1d100]]. При результате 1 или 2 владельца охватывает паника: на 1 минуту
  он получает состояние Испуган и в свой ход обязан перемещаться прочь от опасности.

  У Клятвы Селуны короткая и печальная история. Когда-то она принадлежала верховной
  жрице Лунной Девы, искательнице приключений по имени Фасса Меланхолия (так ее теперь
  называют). Она и ее компаньоны почитали Селуну и отважно истребляли нежить, где
  бы ее ни встретили. Поначалу им везло, однако удача Тиморы не могла быть с ними
  вечно.

  В 1156 году Фасса и ее группа направились в Усыпальницу Сумерек. По слухам, в усыпальнице
  была «дыра» на план негативной материи, но отряд даже не мог предположить, сколько
  нежити там обнаружит. Вперемежку с почти безобидными полтергейстами и видениями
  там обитали могущественные призраки и фантомы. Спустя несколько минут, практически
  все спутники Фассы потеряли свою жизненную энергию. Фасса и остатки ее группы скрылись
  и попытались разработать план атаки. Вернувшись следующей ночью, они увидели своих
  бывших соратников превращенными в рабов-призраков, подчиненных призраку-хозяину.
  Фасса и ее немногочисленные товарищи смогли уничтожить призрака-хозяина и заодно
  избавить своих погибших друзей от вечных мук. В конце концов в живых осталась одна
  Фасса.

  Она возвратилась в храм и долго молилась Селуне о том, чтобы никогда не забывать
  эту кошмарную ночь. Богиня ответила на ее мольбы — в следующее полнолуние на ее
  постели появилась призрачная бело-голубая булава. На рукояти были вырезаны два слова:
  «помни вечно».

  Затем Фасса несколько лет фанатично истребляла нежить. В тридцать три года она разочаровалась,
  ожесточилась и решила все бросить. В полнолуние перед лицом высших жрецов она отреклась
  от своей веры, а несколько часов спустя бросилась в Лунное море с высокой скалы.
  Булаву, найденную в ее спальне, стали хранить в храме. Много лет спустя новый верховный
  жрец принял решение, что это оружие, несущее в себе тяжелую память, должно быть
  брошено в море. На этом заканчивается история булавы.'
