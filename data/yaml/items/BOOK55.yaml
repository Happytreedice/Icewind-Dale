description: 'Книга о священной реке — Источнике Жизни и колыбели плодородия.

  История Реки Единорога:

  Барды и мудрецы рассказывают, что Река Единорога берет свое начало в самой Купели
  Жизни и несет плодородие всему миру. Легенды гласят, что все населяющие Торил расы
  вышли из лона Чаунти у истока этой реки и затем спустились по течению во внешний
  мир. Кто-то считает, что у купели сидит дочь самой Чаунти, принимая новорожденные
  народы и отправляя их в мир, другие верят, что повитухой у Чаунти служит Шиалла.

  Как бы ни обстояло дело, эльфы, корреды и полурослики соглашаются в том, что Река
  Единорога священна для всего живого и невероятно чиста. Потому у этих трех рас царит
  строгий запрет на долгие плавания вверх по течению реки — если священный поток будет
  загрязнен, на Ториле больше не сможет родиться никакой новый народ.'
