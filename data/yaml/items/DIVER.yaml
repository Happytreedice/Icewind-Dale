description: 'Чароклинок Нарадон из Теска был известен умением быстро и решительно
  расправляться с вражескими магами, даже уступая числом. Этой славой он был обязан
  трём вещам: зельям скорости, сапогам скорости и своему верному короткому мечу —
  Ныряльщику-в-Чары. В отличие от многих магических клинков, у Ныряльщика-в-Чары нет
  тёмной кровавой истории. Нарадон оставил приключения в тридцать два года, а пристрастие
  к зельям скорости настигло его четыре года спустя, когда он умер от старости. Его
  единственный наследник не желал приключений и через несколько лет после смерти отца
  продал меч известному воры-домушнику. Меч можно узнать по зимородку, оттиснутому
  на пяте клинка.

  Точность: Оружие ближнего боя, бонус +2 к атаке и урону.

  Обережные чары: Вы получаете бонус +1 к спасброскам, вызванным эффектами типа «Заклинание».

  Срыв чар: Клинок ныряет сквозь защитные чары: при провале спасброска СЛ 14 попадание
  лишает цель способности сотворять заклинания в течение 2 раундов.

  Наемник Нарадон из Феска был известен тем, что с легкостью побеждал вражеских магов,
  даже если они нападали не поодиночке. Достичь такой славы ему помогли три предмета:
  зелья скорости, сапоги скорости и Поглотитель Заклятий, его верный короткий меч.
  История этого меча, в отличие от другого волшебного оружия, вовсе не была мрачной
  и кровавой. Нарадон бросил путешествовать в 32 года. Через четыре года он умер от
  старости — сказалось пристрастие к зелью скорости. Его единственный наследник не
  стал искателем приключений и спустя несколько лет после смерти отца продал меч одному
  известному взломщику. Поглотитель Заклятий легко узнать по изображению зимородка.'
