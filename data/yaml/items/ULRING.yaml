description: 'Золотое кольцо с чёрным опалом и нетерильской надписью о вечных жизни
  и смерти.

  Выучка академии: +1 к спасброскам от заклинаний.

  Малое вытягивание Ларлоха (3/день): Действием вы тянете жизнь из существа в пределах
  50 футов: цель получает [[/damage 1d4 necrotic]], а вы восстанавливаете столько
  же хитов.

  Ужас (3/день): Действием вы сеете ужас в радиусе 15 футов в пределах 40 футов: каждое
  существо в области должно преуспеть в спасброске Мудрости [[/save ability=wis dc=15]],
  иначе Испугано на 1 минуту (повторяет спасбросок в конце каждого своего хода).

  Вампирское прикосновение (3/день): Сотворяет заклинание @UUID[Compendium.dnd5e.spells24.Item.phbsplVampiricTo]
  без траты ячейки.

  На массивном золотом кольце с черным опалом выгравирована надпись на нетерильском:
  «ГОТТА И ЭТАН МЕДР — ЭТАКК» («ЖИЗНЬ И СМЕРТЬ НАВЕК — НЕКРОМАНТИЯ»). Сбоку стоит
  дата, «1072 л.д.».

  Академия Улькастера находилась неподалеку от города Берегост на Побережье Меча.
  Там волшебники изучали и практиковали магию. Со временем эта школа обрела огромную
  власть, и тогда группа магов напала на академию и оставила от нее лишь развалины.
  Большую часть учеников и преподавателей перебили, а что случилось с самим Улькастером,
  неизвестно до сих пор. Немногочисленные учителя, которым удалось сбежать, стали
  давать частные уроки и дарили волшебные кольца своим ученикам, сохраняя традицию
  академии.'
