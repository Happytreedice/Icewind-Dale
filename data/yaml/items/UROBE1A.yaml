magical_effects:
- name: Одеяние Енфусинг [Robe of Enfusing]
  changes:
  - key: system.attributes.ac.bonus
    mode: 2
    value: '+2'
description: 'Со времён Нетерила маги научились наделять самыми разными магическими
  свойствами обыденные вещи вокруг себя. Излюбленный предмет для таких чар — обычное
  одеяние: лёгкое, недорогое и хорошо держащее чары, оно идеально подходит магу. Впрочем,
  из-за магической природы носить такие зачарованные одеяния могут лишь маги — чистые,
  двойного или множественного класса.

  Защита: Одеяние вливания даёт носителю бонус +2 к КД и хранит крупицу арканной силы,
  помогая заклинателю.

  Сопротивление магии: Чары одеяния слегка отклоняют враждебную магию: вы получаете
  бонус +1 к спасброскам против заклинаний.

  Знания: Одеяние обостряет память о преданиях: вы увереннее опознаёте магические
  вещи и вспоминаете сведения о них при проверках Интеллекта (Магия) и Интеллекта
  (История).

  Вливание: Пока одеяние надето, вы можете один раз сотворить известное или подготовленное
  вами заклинание волшебника 1-го уровня, не тратя ячейку заклинаний. Свойство восстанавливается
  после Длинного отдыха.

  Еще со времен Нетерила маги учились придавать разнообразные магические свойства
  предметам своего обихода. Самым частым объектом для наложения заклинаний становилась
  простая мантия. Она мало весит, недорого стоит и прекрасно удерживает в себе чары,
  потому это отличное снаряжение для волшебника. Но поскольку происхождение и природа
  таких предметов тесно связаны с магией, и носить их могут только маги (одиночный,
  двойной либо мультикласс).'
