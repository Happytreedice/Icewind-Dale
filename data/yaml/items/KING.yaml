description: 'Бело-синий доспех из шкуры сильнейшего полярного червя Долины.

  Шкура Зимнего Короля: Сопротивление урону огнём и холодом, пока доспех надет.

  Профиль защиты: -0 к КД против рубящего урона.

  Этот доспех сделан из шкуры Зимнего короля — так жители Долины Ледяных Ветров прозвали
  самого крупного и сильного из полярных червей. Эта шкура необычайно толстая и крепкая,
  но при этом удивительно легкая. Ее отличает своеобразная расцветка, белая с голубым.'
