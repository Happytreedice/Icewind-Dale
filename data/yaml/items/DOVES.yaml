description: 'Булава с головой слоновой кости в виде трёх голубок — наследие Ильматера.

  Гроза нежити: Нежить с 4 и менее Костями Хитов, поражённая булавой, должна преуспеть
  в спасброске Мудрости [[/save ability=wis dc=15]], иначе будет уничтожена; против
  исчадий иных планов булава при провале спасброска СЛ 15 наносит двойной урон.

  Двойной урон: Против нежити и существ с Внешних Планов булава наносит удвоенный
  урон оружием.

  Три Белых Голубя — весьма необычная булава, созданная в 850 л.д. жрецом Ильматера
  по имени Алледек. Двадцать лет он с оружием в руках служил своей церкви и под конец
  жизни решил, что должен оставить ей вещественное наследие. В итоге он изготовил
  эту булаву с головкой из слоновой кости. Древко у нее из стали, покрытой черной
  эмалью, а рукоять искусно вырезана из слоновой кости. Головка и рукоять закреплены
  золотыми обручами. Самая необычная часть булавы — это ее навершие. Оно вырезано
  из чистой слоновой кости и изображает трех белых голубей, обращенных к центру оружия.
  Распростертые крылья образуют фланцы булавы.

  Спустя три года после завершения работы над булавой Алледек скончался во сне. Оружие
  вручили странствующему бойцу на службе у церкви Ильматера. Он затем передал булаву
  Реккену Отважному, жрецу Ильматера. Реккен потерял оружие, сражаясь у Тролльего
  Леса с могущественным вампиром. Он всё-таки одолел чудовище, но булаву так и не
  нашел.'
