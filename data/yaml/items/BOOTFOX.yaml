description: 'Кричаще-яркие красно-зелёные сапоги, лёгкие на ногу.

  Лисья прыть: Пока сапоги надеты, вы получаете +1 к КД, а ваша скорость ходьбы увеличивается
  на 10 футов.

  Эти сапоги кричащей красно-зеленой расцветки принадлежали вору Эльфаму из Перривайна.
  Этот выдающийся карманник испытывал свою удачу, поддразнивая своих жертв сразу после
  кражи. Дважды попавшись, Эльфам заказал себе эти сапоги. Разумеется, нахальный воришка
  всё-таки нашел свою смерть раньше времени, когда ограбил Зейна Моробдела, Алого
  Мага Тэя, знаменитого своим отвратительным характером. Эльфам стащил с пояса у мага
  кошелек с драгоценными камнями и заплясал в толпе, крикнув: «Добеги-ка за мной до
  Приадора, лысик! Ха-ха!» Зейн, сдерживая ярость, тут же призвал четырех невидимых
  ловчих и велел им «убить идиота в красно-зеленых сапогах».'
