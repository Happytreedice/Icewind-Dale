description: 'Это зелье дарует выпившему магическую стойкость ко всем видам огня:
  любой урон от огненных эффектов снижается ещё на 50% — сверх любых прочих сопротивлений.
  Эффект длится 2 часа или до развеивания.

  Сопротивление: В течение 1 часа вы получаете сопротивление урону огнём.

  Это зелье наделяет выпившего магической сопротивляемостью огню всех видов. Весь
  урон от огня уменьшается еще на 50% (в дополнение к имеющемуся у персонажа сопротивлению
  огню). Зелье действует 2 часа, если эффект не будет развеян.'
