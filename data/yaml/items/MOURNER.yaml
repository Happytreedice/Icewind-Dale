description: 'Чёрный кара-турский доспех клана Байка со знаком цветущей сливы.

  Стойкость скорби: +25 к максимуму хитов и сопротивление урону от дальнобойных атак
  (колющий), пока доспех надет.

  Отрешённость: Носитель не чувствует боли и не знает, сколько у него хитов (Ведущий
  скрывает от игрока текущие хиты); скрытность и воровские навыки затруднены: помеха
  на проверки Ловкости (Скрытность и Ловкость рук).

  Это уникальный экзотический доспех был создан для самурая клана Баика из Кара-Тура.
  Доспех изготовлен из тонкой и жесткой кожи, выкрашен в черный цвет и украшен изображением
  цветка сливы, символа клана Баика. Его надевали в бой лишь однажды, когда Баика
  Химуро вел безнадежное сражение с вражескими самураями, атаковавшими его родовое
  имение. Говорят, вражеский клан завладел доспехом, а потом обменял его на осадные
  машины.'
