description: 'Эта шахматная фигура — чёрный конь, вырезанный из эбенового дерева.
  Одна из множества утерянных фигур легендарных шахматных наборов Нири Алуда. Нири
  Алуд был призывателем из Тетира и страстным шахматистом. В свои бесчисленные странствия
  он часто брал шахматы. Ему хотелось призывать союзников в мгновение ока, не выдавая
  своих намерений, — потому он создал множество наборов разных цветов, призывавших
  сооружённых, подобных големам автоматонов ему на подмогу. Почти все наборы Нири
  Алуда пропали, когда на него напали пустынные разбойники в Калимшане. Разбойники,
  невежественные в магии, дали большинству наборов сгинуть в песках. Захваченные же
  наборы вскоре разрознили: фигуры разошлись торговлей и воровством на сотни миль.
  Охотники за сокровищами ищут их по сей день.

  Призыв чёрного коня: Действием вы активируете фигуру: в свободном пространстве рядом
  с вами появляется чёрный рыцарь — подобный голему автоматон-воин, который немедленно
  атакует ближайшего врага. Вы не можете отдавать ему команды и никак им не управляете.
  Рыцарь исчезает через 3 минуты или когда его хиты опускаются до 0 (статистику определяет
  Ведущий, за образец подойдёт ветеран).

  Это шахматная фигура — черный конь, вырезанный из эбенового дерева. Она была частью
  одного из прославленных шахматных наборов Нири Алуда. Нири Алуд был магом-призывателем
  из Тетира и страстным шахматистом. Он нередко брал с собой в многочисленные путешествия
  дорожные шахматные наборы. Ему хотелось иметь возможность быстро призывать помощников,
  не выдавая сразу своего намерения. Поэтому маг изготовил множество шахматных наборов
  разного цвета, с помощью которых призывал себе механических союзников наподобие
  големов. Практически все шахматы Нири Алуда пропали, когда на него напали калимшанские
  пустынные разбойники. Ничего не смыслившие в магии, они рассыпали большую часть
  в песках, взяв лишь несколько наборов. Разрозненные фигуры разошлись на сотни миль
  от Калимшана, их продают, покупают, крадут и теряют. Искатели сокровищ по сей день
  пытаются их заполучить.'
