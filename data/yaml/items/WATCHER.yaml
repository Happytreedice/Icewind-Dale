description: 'Тёмное одеяние дроу-прорицателя, плотное, как латная сталь.

  Защита: Пока вы носите одеяние и не носите доспехов, вы получаете +5 к КД.

  Стойкость к чарам: +2 к спасброскам против заклинаний.

  Сопротивление магии: Преимущество на спасброски против магических эффектов.

  Незримость для чар: Вас невозможно обнаружить магией прорицания, заклинанием Обнаружение
  невидимости или магическим наблюдением; взгляд амбер-халка не действует на вас.

  Мантию наблюдателя изготовили для одного волшебника-дроу и Рилувена. У темных эльфов
  она считается знаком огромной силы и власти; обычно ее получает самый талантливый
  прорицатель в Рилувенской академии волшебства. Эта мантия досталась Малавону, когда
  он был еще в хороших отношениях с родным городом.'
