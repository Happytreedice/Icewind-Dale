description: 'Рог создал Беогин, почитаемый бард ныне сгинувшего регедского племени
  варваров; вождь наказал трубить в рог лишь в смертельной опасности. Слишком гордый,
  чтобы звать соплеменников на помощь, Беогин пал в бою, спрятав рог под плащом.

  Использование: Раз в день владелец может протрубить в рог, призывая на свою сторону
  2–4 берсерков, которые сражаются короткое время, после чего исчезают.

  Этот рог изготовил уважаемый бард по имени Беогин из ныне вымершего племени варваров
  Регеда. Его песни до сих пор поют во многих племенах Севера. Беогин повидал немало
  титанических сражений. Он всегда носил при себе этот рог — дар вождя племени, который
  велел барду воспользоваться инструментом в минуту смертельной опасности. Но Беогин
  был слишком горд, чтобы призвать на помощь соплеменников, и погиб в бою, так и не
  подув в рог.'
