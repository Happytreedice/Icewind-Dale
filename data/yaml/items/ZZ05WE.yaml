description: 'Даже без чар эта булава стоила бы немалых денег за отменную работу.
  Рукоять — бронзовый цилиндр, укреплённый стальным стержнем по центру и шестью тонкими
  кольцами полированной стали: три над хватом и три под навершием. Само навершие яйцевидное,
  из вишнёвого дерева с красной морилкой, усиленного изогнутыми бронзовыми полосами.
  Из навершия асимметрично торчат стальные рёбра. Два самых больших покрыты богатой
  гравировкой: на одном — классический образ Тиморы со словом «БЛАГО» на торассе,
  на другом — образ Бешабы со словом «ГОРЕ». Несмотря на хрупкие материалы, булава
  на редкость прочна. История её по большей части — загадка.

  Точность: Оружие ближнего боя, бонус+1к атаке и урону.

  Усиление: Против законопослушных существ бонус усилен до +2.

  Благо: Пока булава у вас, вы получаете бонус +1 к спасброскам.

  Горе: При провале спасброска СЛ 14 поражённая цель проклята на 1 минуту: она получает
  штраф −1 к броскам атаки, а её боевой дух подорван.

  Даже не обладай эта вещь магическими возможностями, она бы немало стоила только
  потому, что прекрасно сделана. Рукоятка булавы выполнена из бронзы и укреплена стальным
  стержнями. Боек яйцеобразной формы сделан из кроваво-красного вишневого дерева и
  укреплен изогнутыми бронзовыми обручами, его украшают асимметричные стальные выступы.
  На двух самых больших выступах искусная гравировка — на одном традиционное изображение
  Тиморы и надпись «БЛАГО» на торасском наречии, а на другом портрет Бешабы и надпись
  «ГОРЕ». Несмотря на хрупкость использованных в работе материалов, булава очень крепкая.
  История же ее покрыта тайной.'
