description: 'Одеяния мага сопротивления холоду — обычное зрелище на Побережье Мечей,
  особенно по пути на север, к Невервинтеру и Долинам Ледяного Ветра. Многие юные
  маги получают такое в подарок от наставников, успешно завершив первые пять лет обучения.
  Как и прочие такие одеяния, носить их могут лишь люди волшебного ремесла.

  Сопротивление: Даёт сопротивление урону холодом.

  Волшебные мантии сопротивления холоду нередко встречаются на Побережье Меча, в особенности
  распространены они к северу, ближе к Невервинтеру и Долине Ледяных Ветров. Многие
  молодые волшебники получают их от своих преподавателей, отучившись пять лет. Как
  и другие подобные мантии, их могут носить только маги.'
