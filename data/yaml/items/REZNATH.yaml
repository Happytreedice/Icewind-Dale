description: 'Книга с записями и преданиями. Может содержать полезные сведения для
  тех, кто её прочтёт.

  Мне был неведом страх до сегодняшнего дня. Я не знал его ни в юности, ни в зрелости.
  Но вот теперь он каким-то образом подкрался ко мне, готовясь поглотить всё, чем
  я дорожил, и всё, что любил. Люди и эльфы... лишь они на такое способны, лишь они
  могут согнуться, когда больше всего нужны окружающим их. Я не могу более предстать
  перед своим народом: я изменился и не могу вернуться, чтобы принять то, чего не
  заслуживаю. Простите меня, пожалуйста.'
