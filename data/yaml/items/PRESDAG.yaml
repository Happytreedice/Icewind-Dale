description: 'Кинжал Пресио явно служил лишь для церемоний: её нечестивые обеты запрещали
  ей использовать в бою клинковое оружие. Она получила его в дар, достигнув сана Самой
  Изнуряющей Святости. Клинок зачарован на особую остроту и ядовитость.

  Точность: Оружие ближнего боя, бонус +2 к атаке и урону.

  Ядовитый клинок: Существо, поражённое этим кинжалом, должно преуспеть в спасброске
  Телосложения [[/save ability=con]], иначе яд разъедает рану: цель получает 8 урона
  ядом (по 1 в секунду в течение 8 секунд).

  Очевидно, кинжал Пресио предназначен только для церемониальных нужд, так как клятвы,
  данные ею, запрещают пользоваться в бою острым оружием. Пресио получила этот кинжал
  в дар, когда получила звание Самого Болезнетворного Святейшества. Лезвие заколдовано
  для достижения максимальной остроты и обработано ядом.'
