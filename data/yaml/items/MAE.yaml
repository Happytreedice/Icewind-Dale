description: 'Цеп с головой из цельного гранита — плата медуз своему защитнику.

  Каменящий удар: Существо, поражённое цепом, должно преуспеть в спасброске Телосложения
  [[/save ability=con dc=13]], иначе окаменеет до конца следующего хода.

  Это цеп, подаренный безжалостному воину Эледу Святотатцу, во многом кажется обычным.
  Единственное, что привлекает внимание в его конструкции, это боек из цельного гранита.
  Элед сражался за злые народы и готов был защищать их интересы всегда, когда ему
  предлагали достаточную плату. Одна группа медаров и медуз рассчиталась за его услуги
  этим цепом. Элед ужасающе эффективно применял это оружие до конца своих дней.'
