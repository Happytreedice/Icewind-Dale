description: 'Древний самовзводящийся арбалет из руин безымянного народа.

  Скорострельность: Арбалет взводится сам: свойство «перезарядка» игнорируется, и
  вы можете совершать им дополнительную атаку бонусным действием.

  Меткость: Благодаря качеству изготовления это оружие даёт бонус +3 к броскам атаки.

  Легкий арбалет скорости: Косящий Армии

  В Замороженном Лесу некоторое время просуществовал форпост людей. В глубине холодных
  земель они нашли руины древнего поселения и откопали там старинное оружие, в том
  числе и этот арбалет. Так и не узнав, кем были их покойные благодетели, люди с помощью
  этих «инструментов» расчистили себе территорию побольше, только в итоге ни к чему
  это не привело. Несчастных поселенцев сокрушила огромная орда хобгоблинов, и они
  разделили забвение со своими древними предшественниками.'
