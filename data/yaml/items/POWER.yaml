description: 'Алебарда Бича Покорности — стража Чёрных Шпилей Девы.

  Символ боли (3/день): Действием вы чертите в воздухе пылающий знак: каждое существо
  по вашему выбору в радиусе 15 футов в пределах 35 футов должно преуспеть в спасброске
  Телосложения [[/save ability=con dc=15]], иначе на 1 минуту его пронзает боль: помеха
  на броски атаки и проверки характеристик.

  Черным Шпилям Девы, храму Ловиатар в Долине Плакальщиц, церкви добра всегда предоставляли
  такую свободу, о которой другие темные культы только мечтают. Но крупному храму
  для защиты от нападений и шпионажа требуется большая постоянная армия. Главу храмовой
  стражи звали Кнутом Повиновения. По традиции в его вооружение входил Знак Власти,
  магическая алебарда. Видя Знак во время обходов командира, стражники преисполнялись
  большего уважения к своим обязанностям. К несчастью для Кнута, один хитрый человек-вор
  задумал доказать свое мастерство, украв алебарду. Ему удалось осуществить свои планы,
  и вор, чье имя не сохранилось в истории, продал Знак церкви Бэйна. Жрецы Бэйна хранили
  артефакт в знак своего презрения к Кнуту. Знак Власти был утерян, когда Обсидиановую
  Часовню, пустынный храм, где хранилась алебарда, разграбили бединские бандиты.'
