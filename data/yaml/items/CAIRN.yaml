description: 'Назван за способность укладывать воинов в могилу; принадлежал наёмнику
  Адалу Керну, умелому тяжёлому пехотинцу.

  Точность: Оружие ближнего боя, бонус +4 к атаке и урону.

  Меч-могильщик, получивший название за способность отправлять воинов в могилу, принадлежал
  наемнику Адалу Керрну. Этот талантливый пехотинец со своим отрядом, Разрушителями
  Керрна, послужил множеству военачальников, бандитов, волшебников и религиозных лидеров.
  Как правило, этот отряд ставили в первых рядах, чтобы встречать атаку тяжелых кавалеристов
  и расстраивать их ряды. Керрн погиб в 1054 л.д., когда случайно убил лошадь под
  противником в тяжелом доспехе. Лошадь рухнула на Керрна и придавила его насмерть.
  Последовало безумное сражение, и в горячке боя почти все его товарищи потеряли друг
  друга. Тело Керрна так и не нашли, но его знаменитый меч всё-таки разыскали последние
  наниматели воина, жрецы Хельма.'
