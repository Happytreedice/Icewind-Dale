description: 'Кожаный доспех, вопреки расхожему заблуждению, вовсе не мягкий и податливый,
  как кожа сапог следопыта или одеяния друида. Такая кожа защищает не лучше обычной
  одежды. Магические чары усиливают защитные свойства этого кожаного доспеха.

  Защита: Кожаный доспех с лёгким зачарованием, дающий бонус +1 к классу доспеха сверх
  обычного.

  Профиль защиты: -2 к КД против колющего урона, -2 к КД против урона от снарядов.

  Кожаный доспех, вопреки расхожему убеждению, делается не из такой же мягкой и гибкой
  кожи, которая идет на сапоги для следопыта или мантию для друида, — она защищает
  не лучше обычной одежды. Защитные свойства этого кожаного доспеха усилены с помощью
  магии.'
