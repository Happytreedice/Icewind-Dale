description: 'Притча...

  «Два целомудренных шукенья шли по дороге под дождем и вдруг увидели красивую молодую
  женщину, прятавшуюся от дождя под деревом. Она попросила монахов перенести ее через
  ручей. Один монах тут же пришел к ней на помощь, пока второй укоризненно молчал.
  Первый монах поднял женщину на руки, перенес ее через поток, поставил на землю и
  продолжил свой путь. Второй монах молчал, пока женщина не скрылась из виду. Наконец
  он сказал брату:

  „Мы шукенья, нам нельзя прикасаться к женщинам! Как ты мог так запросто взять и
  перенести эту женщину через ручей?“

  Первый монах ответил:

  „Брат, я оставил ту женщину уже давно. Почему ты всё еще несешь ее с собой?“»'
