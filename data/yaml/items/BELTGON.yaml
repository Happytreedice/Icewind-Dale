description: 'Пояс Гонда помогает вскрывать замки и находить ловушки; предназначен
  для плутов.

  Воровская сноровка: Вы совершаете с преимуществом проверки на взлом замков (воровские
  инструменты) и проверки на поиск и обезвреживание ловушек.

  Редкие искатели приключений почитают бога Гонда, покровителя изобретений и ремесел.
  Но некоторые воры уважают его вклад в развитие замков, ловушек и других сложных
  механизмов. Одним из таких воров был взломщик Джармер Невозмутимый, славившийся
  своим спокойствием и твердостью руки, который в юные годы обучался слесарному делу.
  Этот пояс с инструментами он заказал у жрецов Гонда. Если у Джармера не находилось
  под рукой нужного инструмента, подходящее приспособление оказывалось в одном из
  кармашков на поясе.'
