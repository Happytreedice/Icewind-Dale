description: 'Как и многие прославленные дварфийские клинки, эта секира обрела чары
  молитвами и служением дварфийских жрецов. Секира Пленённых Душ была создана как
  защита от оживших трупов врагов и соратников, которых тёмноэльфийские чародеи и
  жрицы раз за разом гнали на дварфийские укрепления. В Битве Мёртвых ею сражался
  Джамот Каменное Древо — тогда двадцать дварфийских ветеранов сдержали десять магов-дроу
  и их армию зомби, упырей и умертвий. Надпись вдоль вечно острого лезвия гласит:
  «С каждым ударом — освобождение».

  Точность: Оружие ближнего боя, бонус +3 к атаке и урону.

  Подобно иному замечательному оружию, вышедшему из кузниц дворфов, этот топор был
  зачарован молитвами жрецов-дворфов. Топор плененных душ создали для защиты от оживленных
  трупов павших в бою товарищей и врагов — маги и жрицы темных эльфов постоянно бросали
  нежить на укрепления дворфов. С этим топором в руках Джемот Камнедрев участвовал
  в Битве Мертвых, когда двадцать закаленных воинов-дворфов отбили атаку десяти дроу-магов
  и их войска зомби, упырей и пожирателей.

  Вдоль неизменно острого лезвия идет надпись: «С каждым ударом — освобождение».'
