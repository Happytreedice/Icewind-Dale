description: '«Цеп зубов»: три черепа братьев Вичгара скалятся на серебряных цепях.

  Кусающие черепа: Черепа рвут плоть: дополнительный колющий урон уже включён в атаку;
  при провале спасброска СЛ 14 они вцепляются намертво — ещё [[/damage 1d6 piercing]].

  Цеп черепов, также известный как «зубастый цеп», изготовили в 1035 л.д. для варварского
  военачальника Викгара. Он потерял трех братьев в битве на северных пустошах, которые
  теперь называют Священным перевалом, против армии орков под предводительством Краага
  Могучего. Снедаемый безграничной печалью, ночами Викгар бродил по полю боя, разыскивая
  их тела, чтобы похоронить должным образом. Наткнувшись на них, он встретился с духами
  братьев, которые томились на перепутье между миром живых и мертвых. Не в силах помочь
  им, воин с помощью шамана поместил их души в цеп.

  Вместо шипованных шаров к рукояти на серебряных цепях подвешены три черепа братьев
  Викгара. Они жутко скалятся, ухмыляясь своей новой жизни. В бою они больно кусают
  цель, разрывая плоть.'
