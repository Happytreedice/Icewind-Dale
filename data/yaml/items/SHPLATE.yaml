description: 'Присмотревшись к этим латам, можно заметить, что металл их словно бесплотен
  — отсюда и теневой облик. Надетые, они делают носителя таким же теневым, как и сама
  броня, а в этом состоянии дают дополнительную защиту от метательного оружия.

  Профиль защиты: +3 к КД против рубящего урона, +3 к КД против урона от снарядов.

  При более близком рассмотрении видно, что этот составной доспех изготовлен не из
  металла, а из какого-то неизвестного материала, на котором трудно сфокусировать
  взгляд. Надевший его становится таким же расплывчатым. Также доспех дает дополнительную
  защиту от метательного оружия.'
