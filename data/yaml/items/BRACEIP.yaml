description: 'Морозные наручи отрекателя Прашнака, повелевающие водой и стужей.

  Ледовый панцирь: Ваш базовый КД равен 16, но Ловкость снижена на 2, пока наручи
  надеты.

  Призыв водяного элементаля (1/день): Действием вы призываете водяного элементаля
  в свободное пространство в пределах 20 футов; он дружественен вам, подчиняется устным
  командам и исчезает через 1 час.

  Конус холода (1/день): Сотворяет заклинание @UUID[Compendium.dnd5e.spells24.Item.phbsplConeofCold]
  без траты ячейки.

  Иссушающий мор Аби-Далзима (1/день): Действием вы иссушаете живое в радиусе 30 футов
  в пределах 100 футов: каждое существо в области должно совершить спасбросок Телосложения
  [[/save ability=con dc=17]], получая [[/damage 12d8 necrotic]] при провале или половину
  при успехе; растения и водные существа проходят спасбросок с помехой.

  Говорят, эти замечательные наручи были созданы в горах Хребта Мира, притом совсем
  недавно. На берегу Моря Движущихся Льдов жил Прашнак, маг-оградитель, и довольно
  упрямый. Серьезной проблемой для него были постоянные нашествия троллей, которых,
  без сомнения, привлекало исключительно удобное убежище волшебника. Прашнак отгонял
  троллей кислотным дождем. Однако нападения начали его утомлять, а тролли всё больше
  наглели.

  Потратив несколько месяцев на изучение действия иссушающей магии, призывания элементалей
  и волшебных методов заморозки, Прашнак осуществил свой эксперимент. Призвав водного
  элементаля, он испарил из тела несчастного существа часть жидкости и заморозил его.
  Таким образом он возвел в окрестностях своего жилища множество ужасных ледяных скульптур.
  Глуповатые тролли ужасно испугались этих тотемов и, по слухам, вообще сбежали из
  тех краев. Увидев, что эксперимент увенчался успехом, Прашнак с новой силой взялся
  за свои жестокие изыскания и ведет их по сей день. Какому вору удалось стащить эти
  наручи, неизвестно, но пропали они несколько лет назад.'
