description: 'Дополнительный урон: Соприкоснувшись с воздухом, это масло мгновенно
  вспыхивает, нанося [[/damage 5d6 fire]]{5d6 урона огнём} (спасбросок от дыхания
  — половина) всем поблизости. Его можно метнуть примерно на 40 футов: ударившись
  о землю, оно тут же взрывается огненным шаром.

  Дополнительный урон: Метнув этот сосуд (действие, 20 футов), вы наносите цели [[/damage
  5d6 fire]] урона огнём (спасбросок Ловкости СЛ 15 уменьшает урон вдвое).

  Это масло моментально вспыхивает при контакте с воздухом и наносит всем существам
  непосредственно в области возгорания 5d6 единиц урона (вдвое меньше при успешном
  спасброске против дыхания). Сосуд с маслом можно метнуть на расстояние до 40 футов.
  Как только он разобьется, произойдет мощный взрыв огня.'
