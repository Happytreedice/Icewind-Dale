description: 'Сшит вручную эльфийскими мастерами из лучших тканей и мехов.

  Защита: Эльфийский шитый плащ тонкой работы даёт +1 к КД.

  Защита от холода: Пока плащ надет, вы получаете сопротивление урону холодом.

  Эта накидка сшита из самых лучших тканей и меха, какие только можно найти в этих
  землях. Талантливые эльфийские мастера изготавливали их вручную. В Руке Селдарин
  многие носили такую одежду, не пренебрегали ей и иноземные гости, так как эта необычайно
  теплая накидка защищает от жестоких холодов Севера.'
