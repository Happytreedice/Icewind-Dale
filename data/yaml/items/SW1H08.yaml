description: 'Короткий меч — первый из появившихся типов мечей. Проще говоря, короткий
  меч можно считать кинжалом с клинком настолько длинным, что кинжалом его уже не
  назовёшь. В классификации мечей термина «короткий меч» не существует, однако им
  принято называть обоюдоострый клинок длиной около двух футов. Остриё обычно заострено
  и идеально подходит для колющих ударов.

  Точность: Оружие ближнего боя, бонус +1 к атаке и урону.

  Короткий меч — самая древняя разновидность меча. Фактически, короткий меч — это
  обоюдоострый кинжал, слишком длинный, чтобы его можно было именовать кинжалом. Официальная
  классификация мечей не включает этот тип, однако в обиходе название «короткий меч»
  часто употребляется по отношению к обоюдоострым клинкам длиной около двух футов.
  Кончик обычно заострен, что очень удобно для колющих ударов.'
