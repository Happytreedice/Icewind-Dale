description: 'Сапоги, сотканные иллюзией: их носитель словно идёт сразу несколькими
  дорогами.

  Размытие (1/день): Действием вы активируете сапоги и на 7 раундов расплываетесь,
  как под действием заклинания @UUID[Compendium.dnd5e.spells24.Item.phbsplBlur000000]{Размытие}:
  вы получаете +3 к КД и +1 ко всем спасброскам.

  Созданные гномом-иллюзионистом в 931 л.д. сапоги множества путей носил не один искатель
  приключений. Много лет они переходили от владельца к владельцу. Уэлди Бейкер, их
  создатель, утверждал, что сила сапог основывается не только на магии иллюзии, но
  и на «потенциале разрыва временной ткани и макроскопическом эффекте микроскопических
  изменений малых объектов окружающей среды».'
