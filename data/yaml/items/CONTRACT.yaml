description: 'Помятый пергамент — письменный договор: «Балин, доставь эти пять ящиков
  припасов в эмпорий в Истхавене».

  Квестовый документ.

  Контракт каравана

  По-видимому, на этом измятом кусочке пергамента записано что-то вроде договора:

  Балин,

  Эти пять ящиков с припасами нужно доставить в лавку в Восточной Гавани. Постарайся
  добиться от калимшанского проныры Помаба приличной оплаты. На вырученные деньги
  купи три бочки необработанной кости на складе у Гаспара. Возвращайся с ними в Каэр-Динивал,
  там и рассчитаемся. Будь поосторожнее в тундре. Говорят, в холмах возле Восточной
  Гавани видели орков. Советую потратить часть аванса и нанять дополнительную охрану
  для каравана.

  Счастливого пути,

  Илмус Галлавей из Каэр-Динивала'
