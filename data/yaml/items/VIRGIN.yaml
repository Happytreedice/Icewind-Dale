description: 'Плащ, сотканный из человеческих волос, шевелящихся в свете факелов.

  Плач дев: +2 к КД и иммунитет к состоянию Испуган, пока плащ надет.

  Плащ ужаса (1/день): Действием вы источаете волну ужаса радиусом 10 футов на 3 раунда:
  не-нежить, начинающая ход в области, должна преуспеть в спасброске Мудрости [[/save
  ability=wis dc=15]], иначе в панике бежит от вас 2d8 раундов.

  Профиль защиты: -2 к КД против рубящего урона, -4 к КД против дробящего урона, -4
  к КД против колющего урона, -4 к КД против урона от снарядов.

  На первый взгляд кажется, что эта накидка изрядно потрепана, но если присмотреться,
  становится ясно, что выбившиеся нитки — это человеческие волосы, из которых она
  соткана. В свете факелов накидка переливается; пряди волос едва заметно шевелятся,
  и кажется, будто легкий ветерок колышет накидку.

  На изготовление этой накидки пошли волосы девственниц, которых отправляли на Погребальный
  остров вместе с мертвыми героями варваров. Чтобы успокоить этих девушек и унять
  их боль, Провидица у каждой из них она отрезала прядь волос и сплела эту накидку,
  которая оберегала девственниц от духов страха и вселяла в них мужество. Накидка
  отягощена чувством вины и плохо защищает от холодов Севера.

  Волосы опутывают тело надевшего эту накидку, сплетаясь, словно нити на ткацком станке.
  Она отпустит хозяина только под воздействием заклинания «Снять проклятие».'
