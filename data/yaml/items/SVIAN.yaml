description: 'Огромная палица мрачного воина племени Лося.

  Эта массивная палица принадлежала великому варварскому воину Свиану из племени Лося.
  Суровый, высокий и жилистый Свиан по всему Северу был известен как строгий и серьезный
  человек. В битве он редко впадал в панику или неистовство, как его соплеменники.
  Он просто удерживал позицию и убивал каждого врага, что подходил близко. Говорят,
  получив смертельную рану, Свиан отошел в сторону и уселся на ближайший камень, ничем
  не показывая, что мучается от боли. Его сородичи лишь через несколько часов поняли,
  что воин мертв.'
