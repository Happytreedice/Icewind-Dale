description: 'История Севера — Распространение человечества:

  Люди умеют приспосабливаться ко всему, и теперь они научились магии от Гордых Народов,
  порой отбирая знания силой. Новообретенные навыки они использовали против всех своих
  врагов, подавив даже великанов и орков, правда, лишь на время. Был основан Вотердип.
  Последние чистокровные эльфы исчезли, смешиваясь с людьми.

  Далеко на западе также поселились люди — мудрый первобытный народ, называвший себя
  Ледяными Охотниками. Они вели свою простую жизнь на побережье с незапамятных времен,
  еще задолго до того, как первые основатели Нетерила высадились на западных берегах
  Узкого Моря. Этот мирный народ стал жертвой очередного вторжения с юга: на грубых
  кораблях приплыли высокие светловолосые воины и изгнали Ледяных охотников из родных
  мест.

  Этот воинственный народ, известный под названием Северян, расселился по побережью
  от Петляющей Воды до ущелий Мирара. Северяне гнали Охотников все дальше и дальше
  на север, заставили гоблинов скрыться в своих горных убежищах и стали причиной последнего
  Совета Иллефарна. Через 500 лет после прибытия Северян Иллефарна не стало — все
  его обитатели отправились на Эвермит.

  С побережья Северяне отплыли на запад, основав колонии на крупных западных островах
  Руатим и Гундарлун и постепенно расселившись по всем островам северных морей. Другие
  отправились на север, через Хребет Мира, и там, на просторах Долины Ледяных Ветров,
  стали настоящими варварами.

  В последующие века Аскальхольм попал в руки демонов и превратился в Крепость Адских
  Врат, а Эйрланн пал под натиском новой орды орков. Эльфы бежали на юго-восток, где
  вместе с Северянами, потомками нетерильцев, и дворфами создали государство, позднее
  названное Павшим Королевством. Оно просуществовало недолго и было разрушено следующим
  орочьим нашествием, но успело нанести по гоблиноидным расам такой удар, что его
  последствия чувствуются до сих пор.'
