description: 'Прозрачный неразрушимый самоцвет-слеза давно умершего короля-некроманта.

  Слезы короля — редчайшие камни, которые встречаются только в Королевствах. Иногда
  их также называют замерзшими слезами. Это очень гладкие прозрачные камни в форме
  капли, которые никакими средствами не удается сломать или разрушить. По легенде,
  это окаменевшие слезы древних королей-некромантов, и в каждом камне можно увидеть
  то, что рыдавший король когда-то любил. Достоверно о природе этих камней ничего
  не известно, но достаточно упомянуть, что мудрецы их ценят выше всех остальных.'
