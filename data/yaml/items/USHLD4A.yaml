description: 'Ростовой щит, известный также как каплевидный или башенный, — это массивный
  металлический или деревянный щит, закрывающий владельца почти от подбородка до пят.
  Его необходимо прочно крепить к предплечью и всё время крепко держать щитовой рукой,
  что, разумеется, не позволяет использовать эту руку ни для чего, кроме удержания
  щита.

  Защита: Большой щит силы: щит +1 к КД и +1 к Силе носителя.

  Крепость щита: Пока щит у вас в руках, вы получаете сопротивление рубящему и колющему
  урону, а против дальнобойных атак и снарядов щит прикрывает ещё лучше.

  Ростовой щит, называемый также башенным, — массивный щит из металла или дерева.
  Его высота соответствует росту владельца, закрывая его от подбородка до пят. Такой
  щит крепко пристегивают к предплечью и всё время крепко удерживают за ручку. Естественно,
  больше в руке, занятой щитом, ничего держать нельзя.

  Свойства ростового щита (Tower Shield): +2 к КД (+ магический бонус).

  • Укрытие от стрел (Missile Cover): владелец получает преимущества Укрытия на 1/2
  (+2 к спасброскам Ловкости от атак дальнего боя и заклинаний по площади).

  • При Силе менее 15 налагает помеху на проверки Скрытности.'
