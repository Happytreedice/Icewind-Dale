description: 'Крепкий молот дворфа Дурлоу Железнобрада, выкованный и благословлённый
  жрецами Морадина.

  Точность: Оружие ближнего боя, бонус +3 к атаке и урону.

  Этот крепкий молот, Демоноруб, прошел через много сражений вместе со своим хозяином,
  дворфом-воином Дурлоу Железным Брусом. Как и много другое оружие дворфов, молот
  Дурлоу выковали и благословили жрецы Морадина. Свое имя оружие получило за то, что
  с ним в руках дворф отбивал нападение дроу-магов и адских чудовищ, призванных ими
  на помощь. Легенды говорят, что Дурлоу одержал победу даже над одной из кошмарных
  йоклол, «Прислужниц Лолт». Героический дворф умер, когда его перехитрили дроу. Группа
  темных эльфов-убийц замаскировалась с помощью магии и попала в неприступную крепость
  Дурлоу, притворившись людьми — послами из Тетира. Они отравили пищу дворфа, и он
  съел ее у них на глазах. Постепенно Дурлоу догадался, что происходит, добрался до
  своей комнаты и схватил Демоноруб. Он бросился на врагов и успел разделаться с четырьмя
  убийцами из пяти, пока яд не прикончил его самого. Пятому дроу, очевидно, удалось
  бежать.'
