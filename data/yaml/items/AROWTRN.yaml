description: 'Стрела перемещения — диковинное творение магов: поражая цель, она на
  миг искажает пространство вокруг неё, перенося жертву с места на место. Стрелки
  ценят такие стрелы за способность сбрасывать врагов с выгодных позиций.

  Перемещение: При попадании стрелок мгновенно переносится в свободное пространство
  рядом с поражённой целью.

  Эти потенциально опасные стрелы очень редко встречаются, чаще всего по одной. Это
  довольно неэффективное оружие, но его стратегическую пользу трудно переоценить.
  Обычно их применяют воины ближнего боя, умеющие стрелять из лука. С помощью стрел
  перемещения они настигают противников и уничтожают их в ближнем бою.'
