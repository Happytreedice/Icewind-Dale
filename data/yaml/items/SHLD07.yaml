description: 'Этот большой щит зачарован защищать носителя от метательных снарядов
  любого рода.

  Защита: Большой щит, дающий бонус +1 к КД. Особенно хорошо отражает снаряды: против
  дальних атак его защита ощутимо возрастает.

  Этот большой щит зачарован, чтобы лучше защищать владельца от всех видов метательного
  оружия.

  Свойства ростового щита (Tower Shield): +2 к КД (+ магический бонус).

  • Укрытие от стрел (Missile Cover): владелец получает преимущества Укрытия на 1/2
  (+2 к спасброскам Ловкости от атак дальнего боя и заклинаний по площади).

  • При Силе менее 15 налагает помеху на проверки Скрытности.'
