description: 'Боевой топор +2: Отголоски Глубин Дорна. Среди множества оружия, откованного
  в тени Хребта Мира, немало клинков несёт клеймо дварфийских кузнецов. Этот великолепный
  боевой топор — не исключение. Его сталь и баланс — свидетельство труда заботливого
  оружейника, а по лезвию вплетены чары, позволяющие ранить даже сверхъестественных
  существ. Как и многое оружие дварфийской работы, клинок лёгок, что ускоряет замах,
  а никогда не тупящаяся кромка делает каждый разрез чистым. Дварфийские руны вдоль
  рукояти складываются в слово «Дорна» — несомненно, клеймо кузнеца, указывающее место
  изготовления.

  Точность: Оружие ближнего боя, бонус +2 к атаке и урону.

  Боевой топор +2: Отголоски Пещер Дорна

  Некоторое оружие, выкованное в тени Хребта Мира, украшено знаками кузниц дворфов.
  Таков и этот чудесный боевой топор. Качество стали и баланс говорят о выдающемся
  мастерстве кузнеца, а лезвие топора зачаровано, позволяя наносить этим оружием раны
  даже сверхъестественным созданиям. Как у многих топоров работы дворфов, лезвие у
  него очень легкое, что позволяет быстро им размахивать, а кромка, никогда не затупляющаяся,
  каждый раз обеспечивает идеальный и чистый удар. На рукояти рунами дворфов написано
  «Дорн» — без сомнения, это знак кузницы, где было изготовлено оружие.'
