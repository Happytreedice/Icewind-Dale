description: 'Волшебник Спенделард славился крайне практичными заклинаниями. Хотя
  при жизни ему мало что угрожало, его редкие, но дальние странствия нередко заводили
  его в опасные переделки — и тогда его защищал посох собственной работы. Со временем
  он обзавёлся посохом больше себе по вкусу, а потрёпанного «Защитника» продал странствующему
  друиду Чонтии.

  Точность: Оружие ближнего боя, бонус +1 к атаке и урону.

  Обережные чары: Вы получаете бонус +1 к спасброскам, вызванным эффектами типа «Заклинание».

  Защита: Пока посох у вас в руке, вы получаете бонус +1 к КД.

  Волшебник Спенделард славился своими полезными заклятиями. В основном он вел жизнь,
  далекую от риска, но изредка отправлялся в далекие путешествия, во время которых
  частенько попадал в опасные ситуации. В этих случаях его защищал сделанный им посох.
  Впоследствии он обзавелся другим посохом, который нравился ему больше, а старый
  Защитник продал странствующему друиду из Чанти.'
