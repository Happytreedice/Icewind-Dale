description: 'Скимитар джинна-чародея с Элементального Плана Воздуха.

  Против элементалей: Против элементалей клинок бьёт с бонусом +5 вместо +4 (атаку
  примените вручную; урон учитывается свойством «Истребитель»).

  Дыхание чистого воздуха: Владелец иммунен к вредоносным газам и облакам (Смертельный
  туман, Зловонное облако и подобные им).

  Небесный Ветер изготовил в подарок калифу Тамьюка могущественный колдун-джинн со
  Стихийного Плана Воздуха. Когда Тамьюк разграбили ифриты, гитьянки, саламандры и
  другие злобные существа, ифрит Амир Тальмед преподнес это оружие великому султану
  города Брасс. Через некоторое время султан отдал оружие Мемнону, ифриту, который
  бился с джинном Калимом на месте нынешнего Калимшана. Мемнон мало пользовался этим
  оружием и вскоре пожаловал им одного из своих лейтенантов. Когда Мемнон и Калим
  были повержены высокой магией эльфов, их слуги сбежали или были водворены на родные
  планы. Полагают, что после великой войны Небесный Ветер всё-таки вернулся к джиннам.'
