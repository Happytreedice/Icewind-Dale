description: 'Рука и ее всадники на гиппогрифах

  Вершина башни Шевараша — место обитания гордых гиппогрифов Руки Селдарин. Преимущественно
  эти существа вместе со своими наездниками используются в разведке, но порой их помощь
  требуется для выполнения задач, где важна максимальная скорость.

  Длительное обучение превращает наездника и гиппогрифа в превосходную команду. Гиппогрифов
  начинают дрессировать, как только они вылупятся. Их приучают есть определенную пищу,
  слушаться наездника, а также выполнять различные боевые приемы в воздухе и на земле.
  Наездники учатся правильно ухаживать за гиппогрифами, слаженно работать с ними в
  команде, проводить наземные и воздушные атаки.

  Всадники на гиппогрифах оказывают отличную поддержку с воздуха во время наземных
  битв. Этот род войск — гордость Руки Селдарин.'
