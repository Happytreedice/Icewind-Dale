description: 'Как ни странно, этот осколок кости имеет форму, схожую с крисом. Ещё
  удивительнее то, что рукоять криса время от времени сочится чёрной ядовитой сукровицей.

  Точность: Оружие ближнего боя, бонус +2 к атаке и урону.

  Чёрная сукровица: При попадании цель должна преуспеть в спасброске Телосложения
  [[/save ability=con]], иначе яд разъедает рану: цель получает [[/damage 6 poison]]
  в конце каждого своего хода в течение 3 раундов.

  Этот странный осколок кости по форме напоминает крис. Еще более странно, что эфес
  криса время от времени выделяет черную ядовитую жидкость.'
