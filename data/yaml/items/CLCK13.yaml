description: 'Это одеяние мага доведено до совершенства для нужд всякого бродячего,
  кочующего из города в город волшебника. Его чары защищают и от разбойничьей стрелы,
  и от завистливого вора-мага, засевшего в засаде со своим зловонным облаком. Как
  и прочие одеяния этого рода, Одеяние путника могут носить только маги.

  Защита: Дорожное одеяние тонкой выделки даёт носителю +1 к КД.

  Защита от дыхания: Носитель получает бонус +1 к спасброскам против оружия дыхания
  (дыхание драконов и подобных существ).

  Мантия путешественника предназначена для магов, которым не сидится на одном месте
  и часто приходится путешествовать из города в город. Ее чары защитят и от стрелы
  разбойника, и от «Зловонного облака» конкурирующего вора-мага, который читает заклинания
  из засады. Как и другие подобные мантии, она предназначена только для магов.'
