description: 'Одеяние безрассудного боевого мага, латающее раны прямо в гуще схватки.

  Защитное плетение: Ваш базовый КД равен 15, пока одеяние надето (несовместимо с
  доспехами).

  Восстановление: В начале каждого своего хода вы восстанавливаете 1 хит (если у вас
  не 0 хитов).

  Волшебник из Теска по имени Намджи изготовил для себя такую могущественную мантию.
  Она не наделяет владельца никакими сопротивлениями, но тем не менее крайне полезна
  для заклинателей, часто попадающих в опасные ситуации. Сам Намджи был боевым магом,
  который безрассудно бросался в самую гущу сражения и в восторге крушил окружающих
  его врагов заклинаниями. Самым опасным считались «Пылающие руки Намджи», его вариант
  широко известных «Пылающих рук».'
