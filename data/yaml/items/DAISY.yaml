description: 'Назван за способность отправлять жертв «удобрять ромашки». Оружие прославленного
  убийцы магов Викалет Ястребиный Глаз.

  Точность: Оружие дальнего боя, бонус +3 к атаке и урону.

  Меткость: Благодаря качеству изготовления это оружие даёт бонус +2 к броскам атаки.

  Этот арбалет, названный так за то, что быстро переправлял свои жертвы в мир иной,
  принадлежал знаменитому истребителю магов, Викалету Ястребиному Глазу. Этот полуэльф-наемник
  присоединялся к различным отрядам искателей приключений, в опасных местах прикрывая
  товарищей с тыла или с фланга и отстреливая всех магов, что видел. Некоторые волшебники
  пытались перехитрить его с помощью проекций образов, но полуэльф безошибочно распознавал
  иллюзию. Викалет ушел на покой, скопив немало денег, и устроил для себя и своей
  семьи виноградник. Арбалет он позже продал молодому и самоуверенному человеку-наемнику.
  Говорят, новый хозяин был не настолько умелым и хитрым, как Викалет, и потому вскоре
  расстался с жизнью.'
