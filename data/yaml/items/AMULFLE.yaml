description: 'Старинный амулет тонкой калишитской работы.

  Проклятие: Надевший амулет оказывается Парализован и поражён магической болезнью;
  снять амулет можно только после снятия проклятия.

  Ужасная проклятая вещь работы калишитского некроманта Нири Эддина, Амулет Тёмной
  Плоти — знак болезни и медленной смерти. Эддин дарил его своим тайным врагам, а
  когда хворь довершала дело, возвращал через слуг-воров. Считается, что Нири и поныне
  «жив» где-то в Королевствах — при том что этот человек родился в 832 году ЛД.

  Изнурение: Пока проклятие действует, болезнь медленно пожирает плоть носителя: он
  получает [[/damage 1 necrotic]] урона некротической энергией в начале каждого своего
  хода.

  Этот жуткий проклятый предмет, сделанный калимшанским некромантом Нири Эддином,
  несет болезни и медленную смерть. Эддин вручал амулет темной плоти своим тайным
  врагам, а его воры-подручные забирали артефакт, когда болезнь сводила жертву в могилу.
  Говорят, будто Нири до сих пор «живет» где-то в Королевствах, хотя он был человеком
  и родился в 832 л.д.'
