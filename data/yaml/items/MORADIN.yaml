description: 'Жрецы Морадина прибегали к этому посоху лишь в самые чёрные часы. Зачарованный
  несколькими верховными жрецами, Посох Дыхания Морадина воскресил величайших дварфийских
  героев Глубин Дорна. В последний раз им воскресили Крида Дорна, павшего от эльфийских
  лучников и магов в битве у перевала Кулдахар. Посох спрятали в Нижних Глубинах Дорна,
  чтобы он не достался оркам, когда те наконец сомнут дварфийскую оборону.

  Точность: Оружие ближнего боя, бонус +2 к атаке и урону.

  Дыхание Морадина (1/день): Действием вы касаетесь посохом тела умершего существа:
  посох сотворяет заклинание @UUID[Compendium.dnd5e.spells.Item.jhhT9PsHy5A7EojO]{«Воскрешение»}
  без траты ячейки и материальных компонентов, а воскрешённое существо возвращается
  к жизни с полными хитами.

  Этот посох, зачарованный несколькими высшими жрецами, служители Морадина свято берегли
  и применяли только в самые черные дни. Его силы вернули к жизни нескольких величайших
  героев-дворфов из Пещер Дорна. В последний раз с его помощью воскресили Крида Дорна,
  убитого эльфийскими магами и лучниками в сражении у Кулдахарского Перевала. Когда
  орки прорвали оборону дворфов, посох спрятали в Нижних Пещерах Дорна, чтобы он не
  достался врагам.'
