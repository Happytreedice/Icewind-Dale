description: 'Скимитар, выкованный из нетающего льда ледника Мрачноморозье.

  Ледяные путы: поражённая цель оплетается льдом: спасбросок Силы [[/save ability=str
  dc=15]], при провале она Опутана на 4 раунда (может повторять спасбросок действием).

  Штормовой панцирь (1/день): Действием вы окружаете себя штормовой оболочкой на 10
  минут: вы получаете сопротивление урону огнём, холодом и электричеством.

  Сопротивление холоду: Пока это оружие у вас в руках, вы имеете сопротивление урону
  холодом (действует постоянно).

  Сопротивление огню: Пока это оружие у вас в руках, вы имеете сопротивление урону
  огнём (действует постоянно).

  Это оружие вы изготовили собственными руками под руководством дворфа Тиернона. Сделанный
  изо льда со стены Ледника Мрака, этот мощный клинок несет в себе частицу энергии
  ледника и вашей силы. Хоть оружие и состоит изо льда, оно лишь немного прохладное
  на ощупь и не тает даже рядом с самым жарким пламенем.'
