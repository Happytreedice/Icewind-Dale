description: 'Выпивший это зелье преображается почти так же, как если бы его обратили
  в камень: цвет кожи, окоченение, даже ощущения тела — всё каменное.

  Сопротивление: В течение 1 часа ваша кожа твердеет, как камень: вы получаете сопротивление
  дробящему, колющему и рубящему урону.

  Каменное тело: Пока действует зелье, ваше тело наливается каменной тяжестью: вы
  получаете бонус +3 ко всем спасброскам, но движения грубеют и замедляются — ваша
  Ловкость уменьшается на 3.

  Выпивший этот напиток как будто становится каменным. Всё тело делается тверже, кожа
  меняет цвет, даже ощущения возникают такие, будто вы сделаны из камня.'
