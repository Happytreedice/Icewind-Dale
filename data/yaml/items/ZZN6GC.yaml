description: 'Эта огромная секира принадлежала Гуктоку, вождю орков. Гукток был печально
  знаменит среди сородичей победами над несколькими дварфийскими заставами Севера
  — и крайней жестокостью к дварфам, имевшим несчастье попасть к нему в плен. Его
  ждал страшный конец: дварфы Глубин Дорна устроили засаду и истребили его клан, а
  самого Гуктока схватили, обезглавили и насадили его голову на пику в назидание оркам,
  забредающим в эти края.

  Точность: Оружие ближнего боя, бонус +2 к атаке и урону.

  Этот гигантский топор принадлежал орочьему вождю Гактоку. Среди соплеменников он
  был знаменит разгромом нескольких застав дворфов на Севере. Славился он также исключительной
  жестокостью по отношению к любому дворфу, попадавшему к нему в руки. Его постигла
  ужасная смерть, когда дворфы Пещер Дорна напали на его клан и перебили всех до единого.
  Самого Гактока они захватили в плен, а потом отрубили ему голову и насадили на копье
  — в знак предупреждения для всех орков, которые осмелятся посягнуть на эти места.'
