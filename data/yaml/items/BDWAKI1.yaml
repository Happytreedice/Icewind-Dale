description: 'Это оружие изначально принадлежало кара-турскому владетелю Ёдаме Акире,
  который сжёг дотла одну из деревень под своей защитой за мнимую дерзость крестьян.
  Хотя Ёдама был в своём праве владетеля, поступок глубоко опозорил его даймё, и тот
  повелел выковать Мороханоцуруги — обоюдоострый меч. Мороханоцуруги вручили Ёдаме,
  чтобы преподать простой урок: причинение вреда другим никогда не должно оставаться
  без последствий.

  Точность: Оружие ближнего боя, бонус +3 к атаке и урону.

  Проклятие обоюдоострого меча: Каждый раз, когда вы попадаете этим мечом по существу,
  вы и сами получаете [[/damage 1d8+3 piercing]] колющего урона. Избавиться от меча
  можно лишь с помощью заклинания @UUID[Compendium.dnd5e.spells.Item.XZhdgVK3cLoxNCQl]{«Снятие
  проклятия»}.

  Это оружие когда-то принадлежало вассалу из Кара-Тура по имени Ёдама Акира, который
  однажды сжег целую деревню из-за мнимой обиды на своих подчиненных. И хотя Ёдама
  не превышал своих полномочий, этот поступок глубоко опозорил даймё Ёдамы, который
  заказал у мастеров Мороханоцуруги, обоюдоострый меч, после этого печального события.
  Даймё отдал меч Ёдаме с наставлением: любой вред, причиненный живым существам, неизбежно
  несет за собой последствия.'
