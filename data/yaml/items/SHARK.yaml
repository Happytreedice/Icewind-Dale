description: 'Жёсткий сахуагинский доспех из шершавой акульей кожи.

  Морская броня: Ловкость −1, пока доспех надет; лёгкая стойкость к огню и кислоте.

  Профиль защиты: -2 к КД против колющего урона, -2 к КД против урона от снарядов.

  Сопротивление кислоте: Пока этот предмет надет, вы имеете сопротивление урону кислотой.

  Сопротивление огню: Пока этот предмет надет, вы имеете сопротивление урону огнём.

  Броню из акульей шкуры изготавливают и носят большей частью сахуагины. Защищает
  она так же, как простой кожаный доспех, но дает улучшение +10% к сопротивлению огненному
  и кислотному урону. Доспех довольно жесткий и сильно ограничивает движения сухопутных
  существ.'
