description: 'Этот смертоносный жезл создал волшебник Хегтен для защиты от огненных
  приспешников своего соперника. Хегтен часто пускал жезл в ход в затяжной войне с
  врагом. После десяти лет преследований Хегтен решил перенести войну к порогу соперника
  и одолел его в одной из самых зрелищных магических дуэлей в истории Сюзейла. По
  условиям победы Хегтен потребовал магически стереть имя врага из памяти всех, кто
  его знал. Враг согласился — а позже стал Пламенем-под-Плащом, опасным террористом,
  которого в 1212 году ЛД убили кормирские Пурпурные Драконы и Боевые Волшебники.

  Использование: Действием и одним зарядом сотворяет заклинание @UUID[Compendium.dnd5e.spells.Item.RpKjTlYASrfqUPVA]{«Конус
  холода»}.

  Ледяное копьё: Действием и одним зарядом вы мечете ледяное копьё в существо в пределах
  100 футов: цель получает [[/damage 5d6 cold]] и должна преуспеть в спасброске Телосложения
  [[/save ability=con]], иначе она Ошеломлена на 3 раунда.

  Волшебник Хегтен создал этот смертоносный жезл, чтобы защититься от огненных прислужников
  своего конкурента. В долгой борьбе с этим соперником Хегтен не раз прибегал к помощи
  жезла. В конце концов после десяти лет травли он дал врагу решающее сражение и взял
  над ним верх в одной из самых зрелищных магических дуэлей в истории Сузейла. Одним
  из условий, выдвинутых победителем, было магическим образом стереть имя своего соперника
  из памяти всех, кто его знал. Противник Хегтена принял это условие и впоследствии
  прославился как Огонь-в-плаще, опаснейший террорист, сраженный в 1212 л.д. кормирскими
  Пурпурными драконами и Боевыми волшебниками.'
