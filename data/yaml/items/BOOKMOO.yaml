description: 'Древние предания о Сеханайн Лунный Серп

  Мастер Э. Л. Бойд

  ...Сеханайн Лунный Серп — эльфийская богиня луны, точнее, полнолуния. Ей подвластны
  прорицания, знамения и тонкие магические искусства; она дарует защиту от безумия.
  Сеханайн наблюдает за снами эльфов, оберегая их во время отдыха и посылая знамения
  о грядущих опасностях. Следит она и за тем, как души эльфов покидают этот мир, и
  защищает мертвых...

  ...Сеханайн называют и супругой, и дочерью Кореллона. Она — самая могущественная
  из богинь эльфийского пантеона. По легенде, ее слезы, отождествляемые с мистическими
  силами луны, породили расу эльфов, смешавшись с кровью Кореллона.'
