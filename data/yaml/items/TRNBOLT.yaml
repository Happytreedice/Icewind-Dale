description: 'Болт, глушащий голос жертвы.

  Немота: Поражённая цель должна преуспеть в спасброске Телосложения [[/save ability=con
  dc=13]], иначе теряет голос до конца своего следующего хода: она не может говорить
  и творить заклинания с вербальным компонентом.

  Эти болты известны каждому, кто изучает магию, своим назначением и характерной окраской.
  Группа Ключа, печально известное собрание оккультных воинов, считала своей задачей
  отбирать магические тексты, содержащие злое волшебство, у тех, кто мог применить
  их во вред. Арбалеты пользовались у Группы больше популярностью, чем луки, так как
  их можно дольше держать взведенными и готовыми к бою. Такие болты для Группы изготавливали
  в больших количествах жрецы Денеира, которых нанял для этой цели лидер Группы, худой
  усатый человек по имени Хеглиф. Болты Молчания имеют характерное желто-зеленое оперение.'
