description: 'Малоизвестное оружие, которым исторически владели лишь следопыты на
  службе Миликки, этот клинок имеет скромную и простую историю. Колыбель Миликки изначально
  благословил триумвират друидов для следопыта по имени Келл Странник Троп. Келл вёл
  мирную жизнь, отгоняя случайных орков и гоблинов, забредавших в его земли. Когда
  он умер от старости, друидам некому было передать клинок. Старший из них, Бимон,
  хранил скимитар, но в бою им не пользовался. Когда Бимон с собратьями надолго покинули
  рощу, странствующий наёмник обчистил дуплистое дерево с их богатствами. Он унёс
  скимитар на север, к Хребту Мира, где и погиб от стужи.

  Точность: Оружие ближнего боя, бонус +1 к атаке и урону.

  Это малоизвестное оружие, которым пользовались только следопыты — последователи
  Миеликки. Происхождение его — самое простое и скромное. Колыбель Миеликки получила
  при создании благословение триумвирата друидов и была предназначена следопыту по
  имени Келл Первопроходец. Келл жил мирно, порой отбивая нападение орка или гоблина,
  что забредал на его земли. Он умер от старости, и друидам некому было передать клинок.
  Старший из них, Бимон, хранил чудесный скимитар, но ни разу не пользовался им в
  бою. Когда Бимон и его товарищи надолго оставили свою рощу, один странствующий наемник
  обнаружил полое дерево, в котором друиды хранили свои сокровища, и всё оттуда выгреб.
  Он унес скимитар на север, к Хребту Мира, а там замерз насмерть.'
