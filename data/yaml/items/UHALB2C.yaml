description: 'Безусловно, старейшее и самое распространённое древковое оружие, алебарда
  состоит из похожего на тесак топорища на древке длиной в среднем шесть футов. Лезвие
  уравновешено сзади клевцом и увенчано острым шипом, обычно четырёхгранным. Иногда
  вместо клевца ставят крюк для стаскивания всадников. Лучше всего алебарду можно
  описать как гибрид копья и топора.

  Меткость: Благодаря качеству изготовления это оружие даёт бонус +1 к броскам атаки.

  Неповоротливость: Пока вы сражаетесь этой громоздкой алебардой, вы получаете штраф
  -2 к КД.

  Эта алебарда, как и другие, представляет собой клинок вроде лезвия топора, закрепленный
  на древке длиной около шести футов. Также она обладает некоторыми магическими свойствами
  и потому более эффективна в бою. Например, ее острое лезвие прорезает плоть врага
  до кости, а зазубренный наконечник находит слабые места в его броне.'
