description: 'Одна из немногих музыкальных инструментов, которые церковь Темпуса открыто
  одобряет, Цитра Войны была создана мастером-полуросликом Релиасом Черносемом. Впечатляющей
  силой цитру благословили жрецы Арворина Защитника. Сам Релиас не собирался играть
  на своём великолепном творении и в конце концов продал румяный инструмент барду
  Гэллоу Дили. Гэллоу был долговязым, худым человеком, которого часто видели в компании
  приключенцев. Негодный для боя, он был исключительно одарён в переложении героических
  историй на музыку. С помощью цитры он помог Отряду Мёрзлых Деревьев одолеть молодого
  зелёного дракона в 1013 году ЛД. Его песня в честь того случая — разудалый мотив
  «Бой Зелёной Чёртовой Дюжины» — звучит в тавернах центра и запада по сей день.

  Воодушевление (2/день): Действием вы наигрываете боевой мотив: каждый союзник в
  пределах 30 футов, слышащий вас, на 1 минуту получает +1 к броскам атаки и урона,
  5 временных хитов и иммунитет к состоянию Испуган.

  Кифара Войны — один из немногих музыкальных инструментов, которые активно одобряла
  церковь Темпуса. Его изготовил мастер-полурослик по имени Релиас Блэксид. Жрецы
  Арворин Защитницы освятили кифару, наделив ее поразительными силами. Релиас никогда
  не собирался играть на этом чудесном инструменте, так что в конце концов продал
  его одному барду, Гэллоу Дили. Худой и долговязый Гэллоу любил общество искателей
  приключений и пусть в бою от него было мало толку, он слагал великолепные песни
  о героических подвигах. В 1013 л.д. благодаря своей кифаре он помог команде Замерзших
  Древ одолеть молодого зеленого дракона. Гэллоу увековечил это событие в песне под
  названием «Битва тринадцати зеленых», которая до сих пор нередко звучит в тавернах
  центральных и западных земель.'
