description: 'Амулеты — магические предметы, которые обычно носят на шее, подвесив
  на цепочке. Цепочка, идущая в комплекте, как правило, повышает лишь красоту вещи,
  а не её магические свойства. На шее можно носить только один амулет.

  Использование: Действием и одним зарядом сотворяет «Каменную кожу», окружая носителя
  также малым шаром неуязвимости. 1 заряд в день.

  Амулеты — это магические украшения, которые обычно носят на шее на цепочке. Цепочка
  имеет эстетическую ценность, но никак не влияет на магические свойства амулета.
  На шее можно носить только один амулет.'
