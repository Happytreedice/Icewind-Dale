description: 'Наручи легендарного мастера боевых искусств, так и не надетые им самим.

  Камнелом: Сила +1; ваши безоружные удары наносят дополнительно [[/damage 2 bludgeoning]],
  а при критическом попадании — ещё [[/damage 2d6 bludgeoning]].

  Один богатый торговец из Шоу Луна преподнес эти наручи своему другу, легендарному
  мастеру боевых искусств, Сарутоби в преддверии его поединка с могучим каменным гигантом.
  Однако, когда Сарутоби узнал о подарке, то, как гласит предание, отказался брать
  наручи и воскликнул: «Я раздавлю череп этого гиганта голыми руками и мне не понадобится
  никакая магия!» Мастер выполнил обещание, а торговец забрал свой дар и запер в надежном
  месте, надеясь, что со временем Сарутоби поймет благие намерения своего друга, а
  его гордость позволит принять эти наручи. Время шло. Как-то раз Сарутоби отправился
  на иные планы бытия и бесследно исчез. Купец, навещавший после этого семью мастера,
  вспомнил о своем прежнем подарке и отдал наручи сыну Сарутоби в качестве утешения.
  Мальчик взял их и впоследствии посвятил всю свою жизнь поискам отца. Увы, он так
  и не нашел его.'
