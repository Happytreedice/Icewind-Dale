description: 'Доспех сахуагинов из акульей кожи с коралловыми пластинами.

  Коралловая броня: Ловкость −2, пока доспех надет; лёгкая стойкость к кислоте и огню
  (слабее полного сопротивления).

  Коралловый пластинчатый доспех изготавливают и носят большей частью сахуагины. Он
  сделан из акульей кожи с твердыми коралловыми пластинами на плечах, груди и запястьях.
  Защищает она так же, как простой пластинчатый доспех, но дает улучшение +15% к сопротивлению
  огненному и кислотному урону. Доспех тяжелый, довольно жесткий и сильно ограничивает
  движения сухопутных существ.'
