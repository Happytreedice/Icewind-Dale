description: 'Обручальное кольцо некроманта, обвенчанного с Искусством.

  Волшебство: Пока кольцо надето, вы восстанавливаете одну потраченную ячейку заклинаний
  5-го круга по окончании короткого отдыха (не чаще раза в день).

  Это могущественное кольцо принадлежало своему создателю, некроманту из Сембии по
  имени Эдион, но недавно он окончательно распрощался с миром живых. Кольцо он изготовил
  исключительно для себя, и в последние годы жизни настолько привык к нему, что уже
  не снимал. Эдион носил его на том пальце, на который обычно надевают обручальное
  кольцо, как символ своего союза с магическим Искусством.'
