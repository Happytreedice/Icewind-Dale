description: 'Панцирный щит, окутанный тёмными чарами дроу Нима.

  Защита: Щит +2: пока вы держите его, вы получаете +4 к КД (2 за щит и 2 за зачарование);
  против дальнобойных атак оружием — дополнительно +1 к КД (нарративно).

  Стойкость к огню: Пока вы держите щит, вы имеете сопротивление урону огнём.

  Этот щит изготовлен из экзоскелета гигантского жука. Твердый от природы, он был
  искусно обработан темными дворфами. Он похож внешне и по функциям на обычный башенный
  щит из дерева и металла, однако весит гораздо меньше. Волшебники из темных эльфов
  также поработали над этим щитом и сделали его устойчивым к ударам и огню.'
