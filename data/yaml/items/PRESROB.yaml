description: 'Невзрачное одеяние прежде принадлежало магу из Лускана.

  Стойкость: Одеяние некроманта повышает стойкость к магии и даёт +1 к спасброскам
  (особенно против паралича, яда и смерти).

  Внешняя простота этой мантии обманчива — надевший ее наделяется особыми силами.
  Мантия некроманта в прошлом принадлежала магу из Лускана, входившему в общество
  Главной Башни Аркана. Он создал этот артефакт для защиты в поисках экзотических
  предметов, необходимых ему для исследований. Сила мантии, однако, не спасла мага
  в схватке с высокопоставленным членом общества Чумных Крыс, организации мерзких
  воров и убийц на службе Талоны. Через несколько лет Пресио купила мантию у убийцы.'
