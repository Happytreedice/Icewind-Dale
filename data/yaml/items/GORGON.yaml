description: 'Зачаровано, чтобы защищать от окаменяющего дыхания горгон.

  Проклятие: Стоит надеть кольцо, как носитель немедленно обращается в камень, словно
  под действием заклинания Плоть в камень (без спасброска). Заклинание Камень в плоть
  возвращает жертву к жизни, однако кольцо при этом теряется. В отличие от обычных
  проклятых предметов, для снятия кольца не требуется Снятие проклятия.

  Зильзанзер Великолепный, могущественный маг, создал это кольцо, чтобы защитить себя
  от воздействия дыхания горгон. Волшебник разводил этих существ, обращающих в камень
  своим дыханием, чтобы продавать их кровь владельцам замков — она служит прекрасной
  защитой от эфирных путешествий. Не один десяток раз Зильзанзер превращался в камень,
  и всякий раз его верный помощник выручал его с помощью свитков «Камень в плоть».
  В конце концов волшебник решил создать артефакт для защиты от окаменения — так появилось
  Кольцо Горгоны. Но Зильзанзеру, видно, при рождении улыбнулась Бешаба, потому что,
  надев кольцо, он тут же превратился в камень. Его помощник привычно обратился к
  помощи свитка «Камень в плоть» и вернул мага к нормальному состоянию. Вот только
  в процессе Зильзанзер расстался с жизнью.'
