description: 'Лук, пышущий жаром, но ледяной на ощупь — он пьёт тепло стрелка.

  Кипучесть: Лук пьёт тепло стрелка: Телосложение −2, пока лук у вас в руках.

  Сопротивление холоду: Пока это оружие у вас в руках, вы имеете сопротивление урону
  холодом.

  Уязвимость к огню: Пока это оружие у вас в руках, вы имеете уязвимость к урону огнём.

  Быстрое: Когда вы совершаете дополнительную атаку, можете совершить её не Бонусным
  действием, а частью действия Атака. Вы можете совершить эту дополнительную атаку
  только один раз за ход.

  От этого изящного лука исходит сильное тепло, но сам он холодный на ощупь, как будто
  вытягивает энергию из тела владельца. Его создал и зачаровал стареющий некромант
  из Брин Шандера, когда верховный жрец Аурил убил его любимца-спутника, лавового
  мефита. Затем некромант отдал лук наемному убийце по имени Теравен Досен, который
  за три года отправил на тот свет множество служителей Морозной Девы. Но он встретил
  достойного противника, напав на гнома-путешественника, у которого был при себе жезл
  огненных шаров. В страшном пламени уцелел только лук.'
