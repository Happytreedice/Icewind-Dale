description: 'Принадлежал женщине по прозванию Красная Рыцарша — преданной воительнице
  Темпуса.

  Щит +3.

  Даже прорицатели расскажут об этом предмете немного. Известно, что этот щит когда-то
  принадлежал воительнице по прозванию Красный Рыцарь, преданной служительнице Темпуса.
  Культ Красного Рыцаря распространен кое-где в Фаэруне, но и об этой религии известно
  мало. Красный Рыцарь считается полубогиней, покровительницей стратегии и тактики
  в войне. Ее почитают преимущественно небольшие группы последователей Темпуса, которым
  нравится серьезное отношение божества к порядку и военной дисциплине. Щит имеет
  простую конструкцию, его единственное украшение — небольшая лошадиная голова, вырезанная
  на ободе с внутренней стороны.'
