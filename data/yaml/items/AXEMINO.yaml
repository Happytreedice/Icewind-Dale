description: 'Отменно сбалансированный двулезвийный топор из катакомб Мастера Приманок.

  Оглушающий удар: Поражённая цель должна преуспеть в спасброске Телосложения [[/save
  ability=con dc=15]], иначе Ошеломлена на 1d4 раунда.

  Это превосходное оружие раньше принадлежало минотавру-командиру, обитавшему в катакомбах
  Властителя Загадок. Двойное лезвие топора насажено на крепкую дубовую рукоять. Оружие
  отлично сбалансировано, его можно держать одной рукой. Топор зачарован и дает улучшение
  +4 к атаке и урону. Кроме того, успешное попадание с вероятностью 25% контузит цель
  на 1d4 раунда.'
