description: 'Мрачный длинный меч-близнец «Цинизма», усмирённый чарами надежды.

  Поиск ловушек (2/день): Действием клинок раскрывает владельцу все ловушки в пределах
  30 футов, как если бы их нашёл опытный вор (длится до конца следующего хода).

  Открывание (2/день): Сотворяет заклинание @UUID[Compendium.dnd5e.spells24.Item.phbsplKnock00000]
  без траты ячейки.

  Воровская сноровка: Вы совершаете с преимуществом проверки на поиск и обезвреживание
  ловушек.

  В 834 л.д. волшебник Легедейн Мудрый поймал знаменитого вора, который пытался забраться
  к нему в башню. Это был циничный взломщик по имени Ильфейн Черное Перо. Легедейн
  старел, телесная слабость начинала его удручать. И вот он сотворил заклинание «Волшебный
  сосуд» и заточил дух Ильфейна в драгоценный камень. Затем Легедейн переместил свою
  душу в молодое эльфийское тело и положил камень на полку. Через сто лет маг решил
  найти ему какое-нибудь применение. Он создал для своего надменного телохранителя
  Гундака волшебный меч, в который переместил из камня дух Ильфейна. Вор и при жизни
  любил покритиковать окружающих, и теперь взялся телепатическим образом регулярно
  сообщать Гундаку свое мнение о его боевых навыках. Спустя две недели Гундак не выдержал
  и бросил прямо на улице донимавший его меч. Многие воины с тех пор подбирали его
  и вскоре так же от него избавлялись. Со временем оружие просто стало известно под
  нынешним названием.

  Киеран Най сумел наложить на оружие заклинание «Эмоция: Надежда». И хотя меч до
  сих пор не умолкает, он больше не критикует своего владельца, а его воровские способности
  можно использовать чаще.'
