description: 'Обычный доспех без магических свойств.

  Обережные чары: Вы получаете бонус +2 к спасброскам, вызванным эффектами типа «Заклинание».

  Профиль защиты: +1 к КД против рубящего урона, -1 к КД против дробящего урона, +1
  к КД против колющего урона, +1 к КД против урона от снарядов.

  Сопротивление кислоте: Пока этот предмет надет, вы имеете сопротивление урону кислотой.

  Доспех изготовили дворфы-жрецы и кузнецы клана Боевого Молота, когда Бруэнхал из
  этого клана повел группу героев на юг биться с черным драконом и вышел из схватки
  победителем. Пусть некоторые дворфы воротили носы от доспехов, сделанных из драконьих
  останков, Бруэнхал гордо носил эту броню до конца своих дней.'
