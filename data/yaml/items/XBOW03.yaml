description: 'Любимое осадное оружие короля Шастира Лонгива для методичного истребления
  защитников на стенах.

  Оружие дальнего боя.

  Меткость: Благодаря качеству изготовления это оружие даёт бонус +7 к броскам атаки.

  Тяжелый арбалет точности: Проводник

  Король Шастир Долгожитель весьма ценил это осадное оружие. Такие арбалеты эффективно
  уничтожали осажденных воинов, уверенных, что стены их прекрасно защищают. Совсем
  немного таких арбалетов сохранилось до наших дней — ведь в конце концов покоренные
  Шастиром народы объединились и разбили войско короля.'
