description: 'У этого камня Йоун за века было много хозяев: вор носил его как талисман
  на удачу, огр считал самым маленьким в мире хрустальным шаром, а одна гномка даже
  вставила его вместо глаза, хотя зрение он ей не улучшил. В конце концов камень попал
  к эльфийским волшебникам — неясно, для исследований или просто как защита от враждебной
  магии. В отличие от обычных камней Йоун, этот бесцветен и почти совершенно прозрачен.

  Сопротивление: Прозрачный камень Йоун кружит вокруг головы носителя, немного повышая
  его сопротивление магии.

  Этот камень йун в течение многих столетий переходил из рук в руки: от вора, который
  держал его в качестве талисмана, к огру, который думал, что это самый маленький
  в мире кристаллический шарик. Какой-то находчивый гном в свое время даже умудрился
  использовать камень в качестве глазного протеза, хоть тот и никак не помогал ему
  лучше видеть. В конце концов этот предмет попал в руки группы эльфийских волшебников.
  Неясно, использовали ли они его в научных целях или просто носили для защиты от
  враждебной магии. В отличие от обычных камней йун, этот бесцветный и почти полностью
  прозрачный.'
