description: 'Латная кольчуга — сочетание кольчужного полотна с металлическими пластинами,
  прикрывающими уязвимые места: грудь, живот и пах. Схожая по устройству с бронзовыми
  латами, настоящая латная кольчуга состоит из кольчуги и кожи. Вдобавок этот доспех
  зачарован и даёт носителю дополнительные бонусы к Классу Доспеха.

  Профиль защиты: +1 к КД против рубящего урона.

  Составной доспех представляет собой кольчугу со стальными пластинами, защищающими
  жизненно важные части тела, как-то: грудь, живот и пах. По конструкции он похож
  на бронзовый доспех, но настоящий составной доспех состоит из кожи и кольчуги. Кроме
  того, этот доспех зачарован, чтобы улучшить защиту владельца.'
