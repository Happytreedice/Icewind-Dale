description: 'Точность: Болты — боеприпасы, которыми стреляют арбалеты любого размера.
  Эти болты несут слабые чары: крошечные руны на древках дают им бонус +1 к попаданию
  и урону, и они способны ранить существ, уязвимых лишь для магического оружия.

  Болт, или арбалетная стрела, используется для стрельбы из арбалетов любых размеров.
  В отличие от остальных, эта арбалетная стрела наделена магическими свойствами, которые
  улучшают ее летные качества и как будто подталкивают ее по направлению к цели.'
