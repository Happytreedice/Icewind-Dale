description: 'Сахуагинский доспех из акульей кожи с коралловыми накладками.

  Морская броня: Ловкость −2, пока доспех надет; лёгкая стойкость к огню и кислоте.

  Профиль защиты: +2 к КД против рубящего урона, +1 к КД против колющего урона, +1
  к КД против урона от снарядов.

  Сопротивление кислоте: Пока этот предмет надет, вы имеете сопротивление урону кислотой.

  Сопротивление огню: Пока этот предмет надет, вы имеете сопротивление урону огнём.

  Броню из акульей шкуры и кораллов изготавливают и носят большей частью сахуагины.
  Она сшита из кожи акулы, а наиболее уязвимые места на теле дополнительно закрывают
  твердые коралловые вставки. Защищает она так же, как простой доспех из клепаной
  кожи, но дает улучшение +10% к сопротивлению огненному и кислотному урону. Доспех
  довольно жесткий и сильно ограничивает движения сухопутных существ.'
