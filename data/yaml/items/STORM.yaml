description: 'Составной лук воинов Талоса, гудящий как далёкий гром.

  Штормовой панцирь (1/день): Действием вы окружаете себя штормовой оболочкой на 10
  минут: вы получаете сопротивление урону огнём, холодом и электричеством.

  Это священное оружие воинов, служащих Талосу, богу бурь и разрушения, состоит из
  нескольких слоев разных пород дерева. Десятилетиями этот короткий лук мастерски
  применяли против многочисленных врагов церкви Талоса. Последним его владельцем был
  Калассан Бреверед, рыцарь бури, погибший после того, как уничтожил огромное число
  следопытов и друидов на Муншейских островах.'
