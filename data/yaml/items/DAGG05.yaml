description: 'Типичный метательный кинжал имеет заострённый, как правило обоюдоострый
  клинок — в отличие от ножа, у которого одна режущая кромка и который немного короче.
  От обычного кинжала этот отличается меньшей рукоятью и иным балансом.

  У типичного метательного кинжала обычно обоюдоострое лезвие с заточенным кончиком,
  в отличие от ножа, который имеет меньшую длину и затачивается с одной стороны. От
  обычного кинжала метательный отличается балансировкой и более короткой рукояткой.'
