description: 'Меч ниндзя, ниндзято, уступает качеством другим кара-турским клинкам
  вроде катаны. Ниндзято короток и прям, что делает его идеальным для тайных дел.
  Он же удобнее в тесноте, порой давая ниндзя преимущество перед длинными клинками
  самураев.

  Меч ниндзя, ниндзято, несколько более низкого качества, чем другие мечи Кара-Тура,
  такие, как катана. Ниндзято — короткий клинок с прямым лезвием, что делает его идеальным
  для изворотливых ниндзя. Ниндзято также более пригоден для боя в тесном пространстве,
  иногда давая своим владельцам преимущество перед длинными клинками самураев.

  Свойства ниндзято (PF2e): 1d6 рубящий, фехтовальное (Finesse), лёгкое (Light).

  • Быстрое (Agile / Nick): атака второй рукой в рамках действия Атака.

  • Удар в спину (Backstabber): +1 точечного урона (+2 для оружия +3..+5) по целям
  в состоянии Off-Guard.

  • Скрытное ношение (Concealable): преимущество на проверки скрытности при спрятывании
  оружия в одежде.'
