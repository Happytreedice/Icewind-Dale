description: 'Это могучее оружие состоит из древка длиной четыре-пять футов и очень
  тяжёлого лезвия. Секира может быть двусторонней, с лезвиями по обе стороны древка,
  или иметь лишь одно лезвие. Оружие это неповоротливо, но умелый воин способен наносить
  им удары чудовищной силы. В гигантское лезвие врезаны дварфийские руны, ещё больше
  усиливающие секиру.

  Точность: Оружие ближнего боя, бонус+2к атаке и урону.

  Дополнительный урон: Наносит дополнительно [[/damage 1d4 cold]] при каждом попадании.

  Фазирование: При провале спасброска СЛ 13 удар вместо дополнительного урона холодом
  выбивает цель из фазы бытия: в течение следующего раунда она получает [[/damage
  20 force]].

  Это мощное оружие состоит из древка в несколько футов длиной и тяжелого лезвия.
  Топор может быть двойной, с лезвиями по обе стороны древка, или одинарный. Это громоздкое
  оружие, но в руках умелого воина очень эффективное. Лезвие украшают руны дворфов,
  повышающие эффективность топора.'
