description: 'Это зелье — флакон боли: при ударе оно взрывается пылающим огненным
  шаром. Держите его в надёжном месте, если не хотите безвременно погибнуть.

  Дополнительный урон: Разбив этот сосуд (действие, 20 футов), вы вызываете взрыв:
  цель получает [[/damage 3d6 fire]] урона огнём (спасбросок Ловкости уменьшает урон
  вдвое).

  Область взрыва: Взрыв охватывает область в радиусе 15 футов от точки удара — урон
  получает каждое существо в этой области.

  В сосуде с этим зельем закупорена истинная боль — от удара оно взрывается шаром
  пламени. Храните его аккуратно, если не собираетесь на тот свет раньше времени.'
