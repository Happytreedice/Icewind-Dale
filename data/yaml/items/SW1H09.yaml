description: 'Клинок маленького кузнеца с великой душой, свистящий владельцу из ножен.

  Короткий меч +2: Свистящий меч

  Жил среди равнин Восточного Шаара один кузнец, человек ростом с гнома, но с огромной
  душой. Он делал великолепное оружие, но главный его талант был не в этом: он умел
  насвистывать такие душевные мелодии, что взрослые мужчины рыдали, как дети. Лишь
  один маг-отшельник любил проводить время с маленьким человечком и дружил с ним,
  прочие же видели обращали внимание только на его рост и смеялись над ним, а предубеждение
  мешало им прислушаться к чудесным песням кузнеца. Насмешки со временем превратились
  в издевательства, и в конце концов добродушный человечек не выдержал и решился навсегда
  уйти из города. Но перед тем, как покинуть родные места, он изготовил этот меч в
  подарок своему единственному другу, а тот наложил на него чары. Клинок стал мягко
  насвистывать, когда его вынимают из ножен. Маг недолго оставался в городе после
  того, как уехал его друг, и меч стал ему прекрасным спутником в странствиях.'
