description: 'Стрела превосходной работы, испещрённая крошечными рунами силы.

  Пронзание: Магическая стрела +1. Благодаря рунам она даёт в сумме +5 к броску атаки
  (включая +1 за зачарование) и наносит дополнительно [[/damage 4d2 piercing]].

  Эти стрелы не только великолепно сделаны — они украшены крохотными рунами силы по
  всей поверхности. Даже трудно представить, сколько времени и труда ушло на изготовление
  такой вещи. От рун исходит слабое голубое свечение.'
