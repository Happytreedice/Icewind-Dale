description: 'Его часто путают с другим жезлом с тем же именем: Жезл Оружейной накладывает
  на владельца защитные заклинания. На беду создателя этого жезла, тролли — существа
  настойчивые.

  Щит: Действием и одним зарядом вы окружаете себя незримым барьером силы на 1 минуту:
  вы получаете бонус +2 к КД, а заклинание @UUID[Compendium.dnd5e.spells.Item.41JIhpDyM9Anm7cs]{«Волшебная
  стрела»} не причиняет вам вреда.

  Призрачный доспех: Действием и одним зарядом вы облекаетесь в полупрозрачный призрачный
  доспех на 1 минуту: пока эффект длится, ваш КД становится равен 18, если он был
  ниже.

  Этот жезл брони, который часто путают с другим одноименным жезлом, позволяет владельцу
  наложить на себя защитные заклинания. К сожалению для создателя этого жезла, тролли
  очень упрямы.'
