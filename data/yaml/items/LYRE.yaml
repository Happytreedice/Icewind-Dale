description: 'Инструмент барда Седини Палетто, помогавший ему защищать учеников.

  Дар лиры: Бард, владеющий лирой, может сотворить два дополнительных заклинания 2-го
  уровня и одно дополнительное заклинание 3-го уровня между Длинными отдыхами, как
  если бы у него были дополнительные ячейки этих уровней.

  Лиру прогресса создал бард по имени Седини Палетто. В трудные времена учил он молодых
  многообещающих музыкантов. Этот инструмент Седини всегда держал при себе и с его
  помощью отбивался от тех, кто пытался напасть на него или на его учеников. Состарившись,
  бард подарил лиру Галуэну Аламану, своему лучшему ученику. Несколько лет Галуэн
  продолжал обучать других, а затем отправился путешествовать по диким местам в поисках
  приключений. Говорят, он потерял лиру, случайно уронив ее в болото.'
