description: '«Камнееды» не едят камни

  ...несмотря на распространенное мнение, наши друзья дворфы не употребляют в пищу
  землю и камни. Недавно я был приглашен в их блистательную твердыню, Пещеры Дорна.
  Я опасался, что попаду в отвратительную грязную шахту, покрытую золой, что вовсе
  не подобает эльфу моего положения, однако все мои опасения чудесным образом рассеялись,
  когда я вступил в прекрасный город, укрытый в одном из великолепнейших лесов Севера.
  К моему удивлению, я узрел вокруг чудеса архитектуры, выдающиеся произведения художников
  и мастеров. Наши друзья дворфы показали мне весь город, подробно рассказывая о каждом
  своем достижении. Я умилился, впечатленный тем, что представители одной из младших
  рас столь способны к искусству и ремеслу. Конечно, им еще далеко до наших, эльфийских,
  мастеров, но было не время указывать дворфам на недостатки...'
