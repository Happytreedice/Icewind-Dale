description: 'Замухрышка был самым мелким гоблином одного из самых жалких гоблинских
  племён, какие только известны. Малый рост он восполнял смекалкой. Во время гоблинского
  налёта на купеческий караван он нашёл в одной из повозок магическое копьё, забрал
  его и кое-что доработал, чтобы удары оставляли раны поглубже.

  Точность: Оружие ближнего боя, бонус +3 к атаке и урону.

  Слабачок был самым мелким гоблином из едва ли не самого ничтожного гоблинского племени,
  какое только существовало. Малый рост он возмещал недюжинным умом. Когда гоблины
  напали на торговый караван, в одной из повозок Слабачок обнаружил волшебное копье.
  Он забрал его и немного доработал, чтобы оно наносило раны поглубже.'
