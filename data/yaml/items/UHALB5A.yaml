description: 'Как и другие алебарды, эта состоит из похожего на тесак топорища, насаженного
  на древко длиной около шести футов. Вдобавок она наделена несколькими магическими
  свойствами, делающими её более действенной в бою. Её острое лезвие, к примеру, рассекает
  плоть противника до самой кости, а зазубренное остриё находит щели в доспехах.

  Точность: Оружие ближнего боя, бонус +4 к атаке и урону.

  Кислотные чары: При попадании цель получает дополнительно [[/damage 2d3 acid]] урона
  кислотой.

  Сопротивление магии: Пока вы держите алебарду, она отводит часть вражеских чар:
  при провале спасброска СЛ 14 заклинание, нацеленное на вас, рассеивается, не причинив
  вреда.

  Эта алебарда, как и другие, представляет собой клинок вроде лезвия топора, закрепленный
  на древке длиной около шести футов. Также она обладает некоторыми магическими свойствами
  и потому более эффективна в бою. Например, ее острое лезвие прорезает плоть врага
  до кости, а зазубренный наконечник находит слабые места в его броне.'
