description: 'Простейшее и самое скромное из древкового оружия, боевой посох — это
  деревянный шест длиной от шести до девяти футов. Лучшие посохи делают из крепкого
  дуба и оковывают металлом с обоих концов. Этот же особенный: он наделён магическими
  свойствами.

  Точность: Оружие ближнего боя, бонус +1 к атаке и урону.

  Посох — простая и скромная разновидность оружия, представляющая собой кусок дерева
  шести-девяти футов в длину. Лучшие посохи делают из крепкой древесины дуба и оковываются
  с обоих концов железом. Посох нужно держать обеими руками.'
