description: 'Создана полуросликом-жрецом Брандобариса Калигопом, панически боявшимся
  пауков.

  Точность: Оружие, дающее бонус +2 к броскам атаки и урона. Против пауков и прочих
  паукообразных бонус возрастает до +4.

  Это оружие сделал жрец Брандобариса, полурослик по имени Калигоп, панически боявшийся
  пауков. Злейшим врагом Калигопа был эльфийский волшебник Эйл-Макар. Свою башню этот
  злой маг окружил лабиринтом из колючих зарослей; и лабиринт, и сама башня кишели
  всевозможными огромными пауками. Больше года Калигоп боялся даже посмотреть в ту
  сторону, но в конце концов решил справиться со своим страхом и изготовил эту палицу.
  Назвал он ее Роковой Крушитель Злых Пауков. Полурослик успешно обчистил логово своего
  врага, оставив за собой десятки убитых пауков.'
