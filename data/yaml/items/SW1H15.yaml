description: 'Изогнутый клинок южной стали, пышущий стужей и гасящий пламя.

  Морозный клинок: Вы получаете сопротивление урону огнём, пока держите скимитар;
  в руке он холоден, а пламя вокруг клинка гаснет.

  Скимитар — изогнутый меч с односторонней заточкой и гардой. Это оружие сродни сабле,
  но его лезвие сильнее изогнуто и заканчивается удлиненным острием. О происхождении
  скимитаров известно очень мало, однако на юге Забытых Королевств они широко распространены.
  Это магический скимитар +3, Печать Холода.'
