description: 'На первый взгляд это обычный кожаный доспех, но, присмотревшись, можно
  заметить приметы тайных усовершенствований. Заклёпки, скрепляющие части доспеха,
  блестят, словно отполированные. Кожа мягка и податлива на ощупь, но мгновенно твердеет
  под тяжёлым ударом. А надетый доспех загадочным образом не издаёт привычного скрипа
  и потрескивания.

  Профиль защиты: -2 к КД против колющего урона, -2 к КД против урона от снарядов.

  На первый взгляд это обычный кожаный доспех, но если рассмотреть его поближе, можно
  заметить следы магических чар. Заклепки, скрепляющие части, сияют, будто полированные.
  Кожа на ощупь мягкая и гибкая, но при сильном ударе мгновенно становится прочной
  и жесткой. А еще по какой-то загадочной причине доспех не издает никакого скрипа
  и шуршания, характерных для подобной брони.'
