description: 'Полуэльфийка-чародейка Пемби Облачный Шёлк создала на своём веку множество
  жезлов и посохов; этот она хранила для собственной защиты.

  Использование: Действием и одним зарядом сотворяет заклинание @UUID[Compendium.dnd5e.spells.Item.41JIhpDyM9Anm7cs]{«Волшебная
  стрела»}.

  Пемби Облачный Шелк, полуэльфийская чародейка, известная своей беззаботностью и
  неразборчивостью в связях, за время своей жизни в Фаэруне изготовила множество жезлов
  и посохов. Этот жезл она держала при себе для самозащиты. Когда в 1103 л.д. Пемби
  убил ревнивый любовник, жезл унаследовал один из прочих ее многочисленных поклонников,
  вор Тэмлок из Уотердипа. Через несколько лет Тэмлок отомстил убийце полуэльфийки,
  поразив его на дуэли незаметно отравленным клинком.'
