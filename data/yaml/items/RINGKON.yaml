description: 'Кольцо архимага, умножающее чародейскую силу и студящее её до звона
  льда.

  Волшебство: Пока кольцо надето и настроено на вас, количество ваших ячеек заклинаний
  1-го и 2-го круга удваивается (только для волшебников и чародеев).

  Морозная мощь: Когда вы наносите урон холодом заклинанием, добавьте к нему [[/damage
  1d4 cold]].

  Контик, могущественная волшебница и последовательница Аурил, заполучила это кольцо,
  сразив враждебного мага Нилля Инфернального. Архимаг Нилль специализировался на
  огненной магии. На создание кольца у Нилля ушло пять лет, но этот мощный предмет
  не раз выручал мага в дальних путешествиях. К сожалению, кольцо не смогло защитить
  Нилля от заклинаний Контик и ее прислужников. Оно изготовлено из очень необычного
  серовато-белого металла, известного как вольфрам.'
