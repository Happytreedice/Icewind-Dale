description: 'Зазубренный клинок на службе у военачальника и разбойника Кат Тала.

  Точность: Оружие ближнего боя, бонус +3 к атаке и урону.

  Этот клинок, зазубренный и потерявший блеск, когда-то верно служил Кату Тахлу, воителю
  и бандиту, который орудовал в деревнях западных областей. В качестве предупреждения
  соседним поселениям Кат обычно уничтожал крестьянские ополчения. В этом деле он
  и находил применение своему мечу. Пока защитники с копьями и пиками нервно пытались
  построиться, Кат и его тяжеловооруженные воины бросались на несчастных, ломая их
  оружие и разбивая строй. Когда сопротивление было разбито, в бой вступала конница
  Ката, и бандиты беспрепятственно могли грабить деревню. В конце концов Кат погиб,
  когда его войско уничтожил более сильный соперник, Мархал Чернобородый.'
