description: 'Этот цеп освятили жрецы великого орочьего бога Груумша для войны с эльфийскими
  и дварфийскими врагами его армий. Его носил верховный жрец Костяного Легиона, пока
  не пал, ведя своих сородичей против эльфийских сил у Длани Селдарин. Цеп прост по
  устройству: рукоять сделана в подобие эльфийской бедренной кости и обтянута дублёной
  эльфийской кожей, крепкая цепь соединяет её с шипастым шаром. Всё изделие отковано
  из метеоритного железа — свидетельство того, на что способно орочье ремесло.

  Точность: Оружие ближнего боя, бонус +3 к атаке и урону.

  Паника: При попадании этим цепом бросьте [[/r 1d10]]: при результате 1 цель должна
  преуспеть в спасброске Мудрости [[/save ability=wis]], иначе впадает в панику на
  4 раунда — она испугана и вынуждена в свой ход перемещаться прочь от носителя цепа.

  Холодное железо: Цеп откован из метеоритного железа и поражает существ, которых
  способно ранить лишь холодное железо.

  Жрецы великого орочьего бога Груумша освятили этот цеп, чтобы крушить эльфов и дворфов,
  с которыми сражались орки. Верховный жрец Костяного легиона владел им, пока не был
  сражен в битве против эльфов Руки Селдарин. Цеп прост по конструкции. Рукоять сделана
  в форме берцовой кости эльфа и обтянута выдубленной эльфийской кожей. Крепкая цепь
  соединяет ручку с шипастым шаром. Всё изготовлено из метеоритного железа. Мастерство
  создателей этого оружия доказывает, что орочьи кузнецы отнюдь не безнадежны.'
