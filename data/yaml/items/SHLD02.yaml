description: 'Малый щит обычно круглый; его носят на предплечье, сжимая рукоять щитовой
  рукой. Благодаря малому весу по сравнению со средним щитом в этой руке можно нести
  другие предметы, но нельзя держать или использовать другое оружие.

  Защита: Магический щит, дающий бонус +1 к КД сверх обычного щита.

  Малый щит обычно имеет круглую форму; носят его на предплечье, удерживая за ручку.
  Его вес, небольшой по сравнению со средним щитом, позволяет владельцу держать в
  той же руке что-нибудь еще, но не оружие.

  Свойства малого щита / баклера (PF2e): +1 к КД (+ магический бонус).

  • Свободная рука (Free-Hand): рука со щитом свободна для удержания факела, зелья,
  фокуса или перезарядки арбалета.

  • Надевается и снимается бонусным действием.'
