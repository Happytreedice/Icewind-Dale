description: '«* Маркет — предводитель непроверенных сведений о невольничьем войске.
  Прежде вор и убийца, время от времени работал на разные наёмничьи роты. * Малавон
  (Многоглазый?) — чародей великой силы. Узурпатор. Дроу? * Шиката — тварь с Элементального
  Плана Огня. Связь неизвестна. * Арундел — духовный «вождь» Кулдахара. Архидруид.
  Убрать, прежде чем позовёт помощь. * Хротгар — фактический вождь Истхэвена. Может
  доставить хлопот. Полагаю, Старый Враг уберёт его сам. * Эверард — жрец Темпуса
  в Истхэвене. Трудно прочесть. Возможно, придётся убрать: способен поднять варваров
  и местных на бой. * Ледяные великаны — связь неизвестна. Похоже, договариваются
  со Старым Врагом. * Дева Ильмадия — эльфийская воительница (дева?). Странная. Видели
  крадущейся у Отрубленной Длани. * Оррик — маг из Кулдахара. Скрытен. Вероятно, не
  угроза. * Брат Покелин — странствующий жрец Ильматера. Странные знаки на одежде.
  Связь неизвестна.»

  «Состав: два десятка людоящеров, два десятка троллей, три десятка холодных умертвий,
  5 лейтенантов-нежити, 5 хистачии и прочие.»

  Лист с небрежно нацарапанными записями...

  * Маркетт. Командир тайной организации рабов. В прошлом вор и профессиональный убийца,
  иногда работавший на различные группы наемников.

  * Малавон (Множество глаз?). Очень сильный колдун. Узурпатор. Темный эльф?

  * Шиката. Существо со Стихийного Плана Огня. Отношения неизвестны.

  * Арундель. Духовный «лидер» Кулдахара. Архидруид. Устранить, прежде чем он успеет
  обратиться за помощью.

  * Хротгар. Фактический правитель Восточной Гавани. Может причинить неприятности.
  Полагаю, что Старый Враг может устранить его.

  * Эверард. Жрец Темпуса из Восточной Гавани. Плохо предсказуем. Возможно, потребуется
  устранить. Может подвигнуть варваров и местных жителей на сопротивление.

  * Морозные великаны. Отношения неизвестны. Вероятнее всего, связаны со Старым Врагом.

  * Дева Ильмадия. Эльфийская воительница (девственница?) Странная. Была замечена
  у Отрубленной Руки.

  * Оррик. Маг из Кулдахара. Скрытен. По всей вероятности, не опасен.

  * Брат Поквелин. Странствующий жрец Ильматера. Странные изображения на одежде. Отношения
  неизвестны.

  Реестр: 2 десятка людей-ящеров, 2 десятка троллей, 6 десятков холодных пожирателей,
  5 лейтенантов нежити, 5 хистачи, и др.'
