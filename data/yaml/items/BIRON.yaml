description: 'Грубо откованный короткий меч с рукоятью в ярко-красной коже, питающийся
  ранами врагов.

  Кровопийство: Каждое попадание этим мечом восстанавливает вам [[/heal 3]] хитов.

  Кровавое Железо, печально известное на морозном Севере, изготовил злой варварский
  шаман Хекеддер и подарил своему двоюродному брату. За долгие годы это оружие побывало
  в руках множества варваров. Каждый владелец в конце концов обнаруживал, что из-за
  этого меча все начинают его ненавидеть. Некромантия столь отвратительна северным
  племенам, что знал о Кровавом Железе и проклинал его чуть ли не каждый. Сегодня
  ни один варвар не захочет прикоснуться к ужасному оружию и не станет даже упоминать
  его название. Меч изготовлен из грубого, плохо выделанного железа, а по всей поверхности
  клинка видны небольшие вмятины и следы неточных ударов молота. Рукоять обернута
  в ярко-красную кожу.'
