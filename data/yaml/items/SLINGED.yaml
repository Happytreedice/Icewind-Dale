description: 'Этим отличным оружием владел полурослик, воин и плут Эдли Брэмбл. Для
  одних Эдли был злодеем, для куда большего числа — героем. Хотя большинство полуросликов
  прилюдно называют Эдли прохвостом и дурным примером для их культуры, многие втайне
  чтят его и восхищаются им. Проделки и приключения Эдли среди людей и эльфов запечатлены
  в народных песнях Варена Чёрного Дрозда.

  Точность: Оружие дальнего боя, бонус +3 к атаке и урону.

  Это прекрасное оружие полурослика Эдли Ежевики, воина-вора. Кто-то называл его злодеем,
  но для большинства Эдли был героем. Большинство полуросликов публично зовет Эдли
  подонком и жалуется на дурное влияние, оказанное им на культуру полуросликов, но
  втайне многие почитают его и гордятся им. Проделки и приключения Эдли среди людей
  и эльфов увековечены в нескольких песнях Уорена Черного Дрозда.'
