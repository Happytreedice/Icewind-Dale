description: 'Проклёпанная кожа имеет мало общего с обычным кожаным доспехом. Если
  кожаный доспех — это затвердевший панцирь, то проклёпанный — мягкий и гибкий, с
  сотнями закреплённых металлических заклёпок. Заклёпки посажены так близко друг к
  другу, что образуют гибкое покрытие из твёрдого металла, отражающее рубящие и режущие
  удары. Мягкая кожаная основа служит лишь для удержания заклёпок.

  Защита: Затенённая проклёпанная кожа: доспех +1 к КД и +2 к проверкам Скрытности;
  тёмная выделка помогает скрываться в тенях.

  Сопротивление магии: Магия частично обтекает этот предмет: носитель имеет сопротивление
  магии 5%.

  Воровская сноровка: Вы совершаете с преимуществом проверки Ловкости (Скрытность).

  У клепаного кожаного доспеха мало общего с обычным кожаным. В то время как кожаный
  доспех изготовлен из жесткой кожи, клепаный сделан из мягкой и гибкой, но ее покрывают
  сотни металлических заклепок. Заклепки расположены очень близко друг к другу и образуют
  гибкое металлическое покрытие, отражающее рубящие и режущие удары. Мягкая кожаная
  основа — только способ держать заклепки на месте.'
