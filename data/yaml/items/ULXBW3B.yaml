description: 'Позволяет стрелять чаще.

  Точность: Оружие дальнего боя, бонус+2к атаке и урону.

  Меткость: Благодаря качеству изготовления это оружие даёт бонус +2 к броскам атаки.

  Арбалетом называется лук, укрепленный на ложе — деревянной или железной ручке. Сам
  лук обычно делают из ясеня или тиса. Для стрельбы из арбалета применяют особые стрелы,
