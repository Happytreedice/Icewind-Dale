description: 'Отрывок...

  «Общество Кракена

  Общество Кракена, созданное недавно в Руинах Аскалы, — это объединение шпионов,
  действующих по всему Северу. Говорят, что организация состоит из воров и жрецов
  Амберли, работающих на таинственного господина. Члены Общества Кракена, также известные
  как „Глашатаи Моря“, не останавливаются перед пытками, похищениями и убийствами,
  добывая нужную им информацию. Их символ — фиолетовый спрут с множеством щупалец».'
