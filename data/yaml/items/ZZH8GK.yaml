description: 'Воин-полурослик Ким Марчвотч пускал это грозное оружие в ход против
  великанов, что часто досаждали его родным краям: он попадал им в голову столькими
  камнями, что те валились от боли или обращались в бегство. Когда Кима сменили на
  посту шир-рива родного края, он стал приключенцем поневоле. Считается, что его поглотили
  жуткие Болотные Туманы Акалло в 760 году ЛД.

  Точность: Оружие дальнего боя, дающее бонус +1 к броскам атаки и урона. Против великанов
  бонус возрастает до +4.

  Истребитель великанов: Против великанов меч наносит дополнительный урон (свойство
  «Истребитель»); бонус атаки — активность «Против великанов».

  Ким Часовой, полурослик-воин, выходил с этим мощным оружием против великанов, нередко
  разорявших его родные края. Он целился в голову врага и так забрасывал его камнями,
  что тот от боли валился наземь или убегал. Оставив пост ширрифа своей родины, Ким
  с неохотой подался на поиски приключений. Рассказывают, что умер он в 760 л.д.,
  когда его засосали жуткие Болота Тумана в Акалло.'
