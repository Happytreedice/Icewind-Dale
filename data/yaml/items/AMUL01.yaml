description: 'Названо в честь единственного владельца, Икаиды Морнива, искавшего похищенную
  дочь.

  Стойкость: Оторвав одну из подвесок-шаров и метнув её (действием), вы сотворяете
  @UUID[Compendium.dnd5e.spells.Item.ztgcdrWPshKRpFd0]{«Огненный шар»} (СЛ спасброска
  15). У ожерелья 5 таких подвесок.

  Ожерелье снарядов: Утраченный Дар

  Названием это ожерелье обязано своему единственному владельцу, Икайде Плакальщику.
  Отправившись на поиски похищенной дочери, он нечасто встречал поддержку, но один
  добрый и щедрый маг согласился помочь ему и подарил этот предмет. К сожалению, Икайда
  уронил ожерелье в реку Вечный Поток, обороняясь от бандитов на подвесном мосту.
  Но говорят, что он и без его помощи отыскал дочь.'
