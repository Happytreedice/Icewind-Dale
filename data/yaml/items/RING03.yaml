description: 'Кольцо друидов Корманнтора, покоряющее сердца зверей.

  Дружба с животными (3/день): Действием вы очаровываете зверя в пределах 40 футов:
  спасбросок Мудрости [[/save ability=wis dc=13]], при провале зверь Очарован вами
  на 2 часа.

  Кольцо дружбы с животными: Кольцо друида

  Друидский орден в Корманторе тщательно хранит тайну создания таких колец; их доверяют
  исключительно членам ордена. Каким образом это кольцо оказалось за пределами их
  леса, неясно; возможно, какой-то друид-изгнанник забрал его с собой, покидая орден.'
