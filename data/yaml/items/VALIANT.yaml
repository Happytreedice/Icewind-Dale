description: 'Этим легендарным клинком недолго владел воин Илбан из Элтурела; своим
  именем оружие обязано его подвигам в Калимшане. До Илбана, однако, Доблестный принадлежал
  святому убийце из далёкой Захары. По словам мудрецов, лёгкий меч был выкован для
  ордена ассасинов. Владельцы Доблестного пережили множество невероятных испытаний
  — во многом благодаря магии оружия. Клинок был утерян в Калимшане, когда святой
  убийца преследовал богохульных агентов паши до самого Калимпорта. Скимитар около
  дюжины лет оставался в руках банды Бариса, пока её не разгромил Илбан со спутниками.
  С Илбаном Доблестный побывал в битвах с песчаными людьми, гигантскими скорпионами,
  пустынными разбойниками, злыми чародеями и демоническими слугами Селана Харада.

  Точность: Оружие ближнего боя, бонус +2 к атаке и урону.

  Быстрое: Когда вы совершаете дополнительную атаку, можете совершить её не Бонусным
  действием, а частью действия Атака. Вы можете совершить эту дополнительную атаку
  только один раз за ход.

  Дополнительная атака: Совершая действие Атака, вы можете совершить этим скимитаром
  одну дополнительную атаку.

  Этим легендарным клинком некоторое время владел воин Илбан из Эльтуреля, и именно
  его подвиги в Калимшане дали мечу имя. До Илбана, однако, Доблесть принадлежала
  святому убийце из далекой Захары. Утверждают, что этот легкий меч создали для ордена
  убийц. Волшебные силы оружия помогали его владельцам проходить самые невероятные
  испытания. Скимитар был потерян в Калимшане, когда святой убийца преследовал нечестивых
  агентов паши, бежавших в Калимпорт. Барис Кабал владел этим мечом около двенадцати
  лет, пока его банду не разбил отряд Илбана. С Доблестью в руках Илбан бился с песчаными
  людьми, гигантскими скорпионами, бандитами пустыни, злыми магами и демоническими
  прислужниками Селана Харада.'
