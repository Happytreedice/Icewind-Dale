description: 'Боевой топор, проклятый дварфами-невольниками своему хозяину на погибель.

  Ярость клинка: При провале спасброска СЛ 15 после попадания владелец впадает в неистовство
  на 1 минуту: он получает преимущество на атаки этим топором, но должен каждый ход
  атаковать ближайшее существо.

  Этот топор сделали для могучего юноши-варвара, воина по имени Хегельфден. Он родился
  в племени Лося, и шаманы пророчили ему великую воинскую славу. Хегельфден вырос,
  убежденный в собственной значимости, неповторимости и превосходстве над окружающими.
  К семнадцати годам он был уже опытным воином. В силе, быстроте и сообразительности
  ему не было равных среди сородичей. Путешествуя по Хребту Мира, Хегельфден в одной
  из пещер столкнулся с двумя дворфами и взял их в плен. Он сказал, что не отпустит
  их на свободу, пока они не сделают ему великолепный топор. Дворфы неохотно согласились
  и изготовили для него крепкий боевой топор с острым лезвием и толстой рукоятью.
  Но когда дворфы попросили отпустить их, Хегельфден отказался. Он хотел оставить
  их у себя в услужении. Тогда они его прокляли и пообещали, что их творение погубит
  Хегельфдена. Он только посмеялся. На следующий день в сражении против враждебного
  племени Хегельфденом вдруг овладела безумная жажда крови, и он принялся рубить направо
  и налево, не различая врагов и друзей. Его сородичи решили, что юноша лишился рассудка
  и убили его на месте. Топор остался лежать на поле, а тело Хегельфдена воины отнесли
  в лагерь. Дворфы к этому времени исчезли без следа.

  Благодаря Тиернону, души мстительных дворфов обрели покой, а проклятие исчезло без
  следа.'
