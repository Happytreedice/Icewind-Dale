description: 'Короткие луки появились первыми, хотя так их тогда не называли: это,
  скорее, обобщённое название всего, что не является длинным луком. Древко короткого
  лука в среднем около пяти футов. С годами дальность луков пытались увеличить: древко
  удлиняли либо повышали упругость без изменения длины. Первый путь и привёл к тому,
  что ныне зовётся длинным луком.

  Точность: Оружие дальнего боя, бонус +1 к атаке и урону.

  Короткие луки — первая разновидность такого оружия. Разумеется, изначально их не
  называли короткими — лишь сейчас этим словом обозначают луки, которые нельзя назвать
  длинными. Средняя длина короткого лука — 5 футов. Со временем возникла необходимость
  увеличить дальность стрельбы, и луки начали совершенствовать, увеличивая либо их
  гибкость, либо длину, последний вариант как раз привел к появлению длинных луков.'
