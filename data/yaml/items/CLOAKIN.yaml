description: 'Если вы носите этот плащ, вы можете надеть на голову капюшон и стать
  невидимым.

  Пока вы невидимы, всё, что вы несёте и носите, становится невидимым вместе с вами.
  Вы видимы, если не надеваете капюшон.

  Капюшон надевается и снимается Действием.

  Суммируйте время, в течение которого вы остаётесь невидимы, порциями по 1 минуте.
  После 2 накопленных часов невидимости плащ перестаёт действовать. За каждые 12 часов,
  пока плащ не используется, он восстанавливает 1 час использования.'
