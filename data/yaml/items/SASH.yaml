description: 'Роскошный шёлковый кушак из Закхары, дарованный Братством Истинного
  Солнца самым преданным членам.

  Защита: Пока кушак надет, вы получаете бонус +3 к КД и +1 ко всем спасброскам.

  Этот роскошный шелковый пояс, одно из прекрасных зачарованных изделий, которыми
  славятся южные земли Захары, предназначен для того, чтобы помогать владельцу уклоняться
  от ударов. Братство Истинного Солнца, общество святых убийц, награждало такими поясами
  самых преданных своих служителей. Этот артефакт принадлежал святому убийце по имени
  Хаму Беди. Черной нитью на красном шелке вышита надпись: «Скорость, сила, смертоносность.
  Но превыше всего — порядочность».'
