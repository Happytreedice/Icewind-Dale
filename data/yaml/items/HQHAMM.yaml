description: 'Конный рыцарь не может толком орудовать длинным древковым оружием в
  седле, поэтому многим видам оружия стали делать укороченные рукояти, чтобы держать
  их одной рукой. Булавы и цепы — два прежних примера; боевой молот — ещё один. Кавалерийский
  боевой молот — потомок люцернского молота. Он целиком сделан из стали, а хват защищён
  и укреплён ронделями (небольшими металлическими дисками, часто украшенными узором).
  Рукоять — около восемнадцати дюймов длиной.

  Меткость: Благодаря качеству изготовления это оружие даёт бонус +1 к броскам атаки.

  Всаднику тяжело управляться с оружием на длинной ручке, поэтому для конных воинов
  многие виды оружия снабжали укороченным древком, удобным для одной руки. Сначала
  так усовершенствовали цепы и булавы, а затем и боевые молоты. Боевой молот всадника
  — потомок люцернского молота. Он полностью изготовлен из стали, рукоять защищена
  и укреплена ронделями — небольшими металлическими дисками, часто имеющими декоративное
  оформление. Длина рукояти — около 18 дюймов.'
