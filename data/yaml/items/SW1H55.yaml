description: 'Почти совершенный клинок Кара-Тура, зачарованный ценой жертвы.

  Зачаровать катану не легко. В отличие от обычного оружия, катана уже является почти
  идеальным боевым мечом. Совершенствование ее, как правило, требует жертв, возможно,
  умирающий самурай мог бы попросить ву джэн влить его боевой дух в дух катаны. Обладатель
  зачарованной катаны, такой, как эта, должен уважать обычаи Кара-Тура и самурая,
  который когда-то воевал этим клином. При невыполнении этого требования, удача может
  покинуть тебя.

  Свойства катаны (PF2e): 1d6 рубящий (1 рука) / 1d10 рубящий (2 руки, Two-Hand d10).

  • Смертоносное d8 (Deadly d8): при критическом попадании добавляет дополнительную
  кость 1d8 урона.

  • Универсальное (Versatile P): при атаке можно наносить колющий урон вместо рубящего.

  • Критический эффект: цель становится Застигнутой врасплох (Off-Guard) до начала
  вашего следующего хода.'
