description: 'Меховые сапоги, хранящие тепло даже посреди Великого Ледника.

  Объятия стужи: Вы получаете сопротивление урону холодом.

  Северные сапоги: Объятия Мороза

  Из-за мешка золота отряд Давиоля Отмороженного бросил его умирать в самом сердце
  Великого Ледника. Его предсмертное проклятие пронеслось над ледяной пустыней и достигло
  слуха Аурил, богини зимы. Богиня сжалилась над ним и наложила чары на его обувь,
  превратив ее в северные сапоги. Они защитили Давиоля от мороза и помогли пересечь
  ледяные земли. Он нагнал своих несостоявшихся убийц в ближайшем городке — они отогревались
  в таверне. Отомстив бывшим товарищам и утолив свою жажду крови, Давиоль отправился
  дальше странствовать по ледяным краям, и никто его больше не видел.'
