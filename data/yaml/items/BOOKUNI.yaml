description: 'Экология единорога

  Единорог — травоядное животное. Его рацион составляют нежные листья деревьев и травянистые
  растения. Естественные враги единорога — это грифоны и все те, кто уничтожает леса,
  в частности, красные драконы и орки.

  О продолжительности жизни единорогов нет письменных свидетельств, но известно, что
  она превышает 1000 лет. Полагают, что на протяжении этого огромного срока они остаются
  молодыми, старея лишь за несколько недель до смерти. Столь долгой жизнью эти существа
  обязаны магической природе своего рога. Хорошо известно, что рог единорога еще и
  прекрасное средство от любых ядов; это становится причиной безжалостного истребления
  этих чудесных созданий.'
