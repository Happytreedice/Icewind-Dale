description: 'Остроумный воин Селдон Мираи славился хладнокровием и шутками в самых
  тяжёлых передрягах. Особенно он был известен полным бесстрашием перед нежитью, которую
  называл, по его собственным словам, «избитой, несмешной старой шуткой». «После сотого
  скелета, — говаривал он, — чего тут бояться? Они прут на тебя, как лошади на водопой,
  а ты просто рубишь их одного за другим. И этого мне бояться?» Он входил в гробницы
  со своим верным цепом и разносил встречную нежить, шутя без умолку. В конце концов
  неуважение Селдона к некромантским искусствам нажило ему врага — лича немалой силы
  по имени Тирон. Тирон схватил Селдона, парализовал его и позволил скелетам забить
  его до смерти. Друзья Селдона позже нашли тело и воскресили его. С тех пор о ходячих
  мертвецах он шутил заметно реже.

  Точность: Оружие ближнего боя, бонус +3 к атаке и урону.

  Остроумный воин по имени Селдон Мирай славился своим хладнокровием и беззаботными
  шутками перед лицом самых тяжких испытаний. Особенно же отличался он тем, что ничуть
  не боялся нежити. «Старые избитые шутки», — говорил он. — «После сотого скелета
  бояться уже нечего. Ну, идут они на тебя, будто лошади к воде, ты их валишь по одному.
  Спрашивается, что тут страшного?» Со своим верным цепом в руках Селдон зачищал гробницы,
  с шутками и прибаутками истребляя нежить. Со временем неуважение к искусству некромантии
  обеспечило воину могущественного врага — лича по имени Тирон. В конце концов лич
  захватил его в плен, парализовал и натравил на него кучу скелетов, которые забили
  воина до смерти. Потом друзья Селдона разыскали его тело и воскресили его. С тех
  пор он относился к нежити серьезнее.'
