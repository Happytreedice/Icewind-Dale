description: 'Книга об истории страны волшебников Халруаа.

  История Халруаа:

  Государство Халруаа основали несколько веков назад волшебники, сбежавшие от фаэриммов
  из земель, которые затем стали пустыней Анорока. Первые волшебники прибыли на необыкновенных
  летающих кораблях, изобретенных нетерезами, и увидели прекрасную и богатую страну,
  в которой раньше обитали одни пастухи да стада зубров. Здесь волшебники решили укрепиться,
  если фаэриммы будут их преследовать. Вместо фаэриммов Халруаа пришлось обороняться
  от набегов всех соседей.

  На протяжении столетий Дамбрат неоднократно нападал на порты и границы Халруаа.
  Однажды под предводительством варвара с устойчивостью к магии войска Дамбрата оккупировали
  часть страны южнее Озера Халруаа. Великий архимаг Миконтил разбил их в сражении,
  убив варвара-предводителя. Пять сотен халруанцев остановили сорокатысячную армию
  Дамбрата, потеряв более двухсот волшебников, в том числе и Миконтила.

  В последний раз на Халруаа напали менее ста лет назад, когда тщеславный король Лапалийа
  привел свои армии по Телатскому перевалу. Он заручился помощью равнинных разбойников,
  но на этот раз халруанцы собрали куда более мощное войско — на их воздушных кораблях
  были не только маги, но и воители. Атака была без труда отбита.

  Около 500 лет назад в Халруаа разгорелась гражданская война. Группа магов начала
  проводить магические эксперименты, которые не одобрили даже нетерезы. Отступников
  изгнали из страны; как говорят в Халруаа, они основали свое государство Тэй.

  С тех пор Халруаа живет в мире (вернее, ни с кем официально не воюет), но регулярно
  дает отпор дамбратским пиратам, равнинным разбойникам, дикарям из джунглей Мхаира
  и множеству других пиратов, разбойников и волшебников, которым кажется, будто в
  Халруаа магия и богатства растут на деревьях.

  Необходимость постоянно защищать свои земли сделала халруанцев консервативными,
  воинственными и скрытными.Эти постоянные налеты сделали Халуранцев очень традиционными,
  воинственными и скрытными. Люди здесь говорят, раз маги всегда управляли ими, то
  так и должно быть всегда.'
