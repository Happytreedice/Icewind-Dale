description: 'Тонкие карты слоновой кости в прочном металлическом футляре.

  Вытянуть карту (заряд): Действием вы тасуете колоду и вытягиваете карту: на 8 раундов
  вы расплываетесь, как под действием заклинания @UUID[Compendium.dnd5e.spells24.Item.phbsplBlur000000]{Размытие}
  (+3 к КД и +1 к спасброскам). В колоде 12 зарядов; вытянув последнюю карту, колода
  исчезает.

  Лишь недавно волшебница Хаэлия смогла найти потерянный секрет создания таких карт.
  Колоды Размытия состоят из тонких костяных карт, хранящихся в металлической коробке.
  Когда хозяин карт хочет воспользоваться их силой, он перемешивает карты и подбрасывает
  одну в воздух. Значение карты (неизвестное ему) определяет длительность действия
  эффекта. Эти колоды часто использовали слуги Порга Толстопуза. Его уверенность в
  картах и стала причиной его смерти, когда группа искателей приключений, используя
  его же колоду, убила его в его же башне в 833 году л.д.'
