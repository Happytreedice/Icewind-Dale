description: 'Особенно воинственная группа друидов-сильванитов создала этот окованный
  железом посох, чтобы вершить кару природы над теми, кто оскверняет леса и выказывает
  неуважение друидическим орденам. Обычно сильваниты пускали посох в ход против жрецов
  Малара и прочих Богов Ярости.

  Точность: Оружие ближнего боя, бонус +1 к атаке и урону.

  Опутывание (1/день): Действием вы указываете на точку на земле в пределах видимости:
  растения в радиусе 12 футов оживают на 1 минуту. Каждое существо в области в начале
  своего хода должно преуспеть в спасброске Силы [[/save ability=str]], иначе оно
  Опутано до начала своего следующего хода.

  Огненный удар (1/день): Действием вы обрушиваете столп пламени на точку в пределах
  видимости: каждое существо в радиусе 5 футов должно совершить спасбросок Ловкости
  [[/save ability=dex]], получая [[/damage 6d8 fire]] урона огнём при провале или
  половину этого урона при успехе.

  Воинствующая группа друидов-сильванитов создала этот посох, укрепленный железом,
  дабы карать тех, кто причиняет вред лесу и оскорбляет друидов. Сильваниты обычно
  использовали этот посох против жрецов Малара и других Богов Ярости.'
