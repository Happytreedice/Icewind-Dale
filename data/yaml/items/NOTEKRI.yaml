description: '«Как ты уже знаешь, твой господин и создатель мёртв. Малавон, соратник
  Сааблика, отныне ведает всеми магическими делами в куполе к северу от Квартала Ремесленников.
  Ты сильнейший из своего рода, потому именно тебе я вручаю знак лейтенанта Сааблика.
  Носи его как символ власти, которую я тебе одолжил. Если тебе и остальным понадобится
  аудиенция со мной, приноси знак с собой. Считай его ключом — одним из шести ключей
  к одному замку. Не потеряй.»

  «Поручаю тебе и другим орогам оборону верхних ярусов Глубин Дорна. Это ваш новый
  дом. Делайте с ним что хотите, но всегда покоряйтесь моей воле и воле Ильматера.
  Ближайший к тебе собрат — Крег Морозная Борода в Зубе Змея. Понадобится подмога
  — призови его и его сородичей. Защищайте оплот ценой жизни: если выживете, потерпев
  неудачу, ваши страдания будут безмерны.»

  «Если какая-то часть письма тебе непонятна, пусть Адинирахк или другой наёмник-дроу
  растолкует её тебе.»

  «Кровью Отца нашего. РБП»

  Вождь Крилаг,

  Как тебе уже известно, твоего хозяина и создателя больше нет. Всеми магическими
  делами теперь будет заниматься Малавон, коллега Сааблика, живущий в здании с куполами
  на севере Квартала Ремесленников. Ты сильнейший из своего рода, потому значок Сааблика
  и его должность я передаю тебе. Это символ власти, которой я тебя наделил. Когда
  тебе и другим моим избранным слугам понадобится со мной встретиться, не забудь взять
  с собой этот значок. Считай, что это ключ от замка, один из шести. Береги его.

  Ты вместе с другими орогами должен охранять верхние части Пещер Дорна. Там будет
  ваш дом. Можете делать там всё, что пожелаете, но чтите мою волю и волю Ильматера.
  Ближайший твой сосед и соратник — Крег Ледобрад в Зубе Змия. Можешь обращаться за
  помощью к нему и его собратьям. Крепость вы должны охранять ценой собственной жизни;
  если защита падет, а кто-то из вас останется жив, страдания его будут беспредельны.

  Если ты чего-то не поймешь в этом письме, Адинирак или другие наемники-дроу тебе
  растолкуют.

  Кровью Отца нашего,

  ПБП'
