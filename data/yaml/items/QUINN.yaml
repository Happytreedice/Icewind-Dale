description: 'Благословлённая праща жреца Вокин из Золотых Шпилей Амна.

  Меткость: Благодаря качеству изготовления это оружие даёт бонус +2 к броскам атаки.

  Эту пращу для Куинна Сребропалого благословили в Амне, в Золотых Шпилях. Куинн гордился
