description: 'Об этой катане известно немного: её истинное происхождение затерялось
  во времени. Кромка клинка отточена до совершенства и даёт владельцу шанс сразить
  противника одним ударом — если только тот не переживёт внезапной потери головы.
  Знаки на рукояти намекают, что меч особенно силён против существ с внешних планов,
  а защитные чары очищают разум владельца от сомнений и укрепляют волю. Кто и зачем
  заказал это оружие — загадка. На самом клинке выгравированы два слова: «Суровый
  Долг».

  Точность: Оружие ближнего боя, бонус +3 к атаке и урону.

  Ясность разума: Пока катана у вас в руке, вы невосприимчивы к смятению: на вас не
  действует заклинание @UUID[Compendium.dnd5e.spells.Item.9hQXdMSmerkTsHDe]{«Замешательство»}
  и подобные эффекты, вызывающие беспорядочное поведение.

  Обезглавливание: При провале спасброска СЛ 14 идеально отточенный клинок сносит
  противнику голову: существо погибает, если оно не способно выжить без головы.

  Об этой катане мало что известно, так как ее подлинное происхождение давно позабыто.
  Клинок превосходно заточен и может убить противника с одного удара, ведь мало кто
  выживет без головы на плечах. По символике на рукоятке можно предположить, что этот
  меч особенно губителен для существ с Внешних Планов, а его защитное зачарование
  сосредотачивает мысли и развеивает сомнения владельца. На клинке же начертаны лишь
  два слова: «священный долг». Кто заказал это оружие и почему, остается загадкой.'
