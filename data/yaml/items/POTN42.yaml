description: 'Это могучий эликсир, дарующий выпившему регенерацию, подобную тролльей:
  раны буквально затягиваются и заживают на глазах. Эффект длится 3 боевых раунда
  (30 минут) и восстанавливает 2 хита в раунд.

  Исцеление: Выпивая это зелье, вы восстанавливаете [[/heal 4d4+4]] хитов; ваша плоть
  затягивается на глазах.

  После употребления этого сильнодействующего эликсира персонаж получает способность
  к регенерации, как у тролля: его раны будут затягиваться и заживать прямо на глазах.
  Действие длится 3 хода, восстанавливая 2 пункта здоровья в раунд.'
