description: 'Зловонный лечебный отвар. Выпив его, вы избавляетесь от слепоты, глухоты
  и всех болезней, как если бы на каждое из этих состояний подействовало заклинание
  @UUID[Compendium.dnd5e.spells24.Item.phbsplLesserRest]{Малое восстановление}.

  Аналог: Действует так же, как @UUID[Compendium.dnd-icewind-dale-pc-game.items.Item.035c50ff08f2819c]{Эликсир
  очищения}.

  Это полезное зелье впервые создали жрецы Хоруса-Ре в далеком Малхоранде. Мерзкий,
  гнилостный вкус и аромат достигаются вывариванием бинтов от мумии вместе с высохшими
  естественным образом останками животных. Полученный отвар избавляет от болезней
  и недугов употребившего его.'
