description: 'Помимо превосходной работы мастера, по всей поверхности видны выгравированные
  крошечные руны силы. Очевидно, что на создание этой вещи ушло немало времени и труда,
  и, хотя это заметно не сразу, от рун исходит слабое синее свечение.

  Точность: Оружие ближнего боя, бонус +2 к атаке и урону.

  Защитник: Пока секира у вас в руках, вы получаете +2 к КД, а топор отводит часть
  летящих в вас снарядов, ослабляя дальнобойные атаки по вам.

  Этот топор не только великолепно сделан — он украшен крохотными рунами силы по всей
  поверхности. Даже трудно представить, сколько времени и труда ушло на изготовление
  такой вещи. От рун исходит слабое голубое свечение.'
