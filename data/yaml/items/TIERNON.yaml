description: 'Ржаво-рыжая сфера — клановый камень дварфов Очажного Камня.

  Защита от огня и холода (1/день): Действием вы касаетесь существа: на 4 раунда оно
  получает сопротивление урону огнём и холодом.

  Горящие руки (1/день): Сотворяет заклинание @UUID[Compendium.dnd5e.spells24.Item.phbsplBurningHan]
  без траты ячейки.

  Снятие усталости (3/день): Действием вы касаетесь существа: с него снимается усталость
  и одна степень истощения.

  Этот небольшой ржавый шарик — особый камень, символ клана дворфов. Тиернон сохранил
  его на память о тех днях, когда жил в Закатных горах вместе со своим кланом Горна.
  Такие камни берут с собой в путь члены Клана, странствующие вдали от родных мест,
  чтобы вспоминать о доме. Только создание с темным сердцем способно украсть такой
  камень у дворфа или забрать с его мертвого тела.'
