description: 'Особое зелье, передающее телесную мощь. Применение — действием.

  Перенос силы: Выпив это зелье, вы навсегда обмениваете часть телесной мощи на проворство:
  ваша Сила уменьшается на 1, а Ловкость увеличивается на 1. Эффект постоянный и не
  снимается окончанием действия зелья.

  Зелья обычно хранят в керамических, хрустальных, стеклянных или металлических сосудах.
  Содержимого сосуда, как правило, хватает на одно применение.'
