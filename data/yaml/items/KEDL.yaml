description: 'Этот маг, живший во Флане, был известен как «Кедл Трёх Колец»: говорили,
  что он довёл до совершенства технику, позволявшую носить три магических кольца разом.
  Зачарователь предметов, он славился разборчивым вкусом в одежде, украшениях и прочих
  аксессуарах. Полированные серебряные наручи были неизменной частью его гардероба.
  В конце концов Кедл продал их, когда понадобились деньги на пару могущественных
  колец. Увы, несколько лет спустя Кедл погиб при нападении орков на Флан.

  Защита: Серебряные наручи Кедла дают +2 к КД (защитное поле вокруг носителя).

  Одного мага, жившего в Флане, прозвали Кедл Три Кольца: говорят, он каким-то способом
  ухитрялся носить сразу три волшебных кольца. Он зачаровывал артефакты и с отменным
  вкусом подбирал себе одежду, украшения и прочие подобные вещи. Неотъемлемым элементом
  его костюма были серебряные наручи, начищенные до блеска. Кедлу пришлось продать
  их, чтобы выручить средства на покупку мощных магических колец. К сожалению, несколько
  лет спустя Кедл погиб во время нападения орков на Флан.'
