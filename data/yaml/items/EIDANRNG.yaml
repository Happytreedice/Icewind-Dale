description: 'Простое кольцо, оставленное Эйданом в знак передачи прав на его постоялый
  двор после его смерти. Магическими свойствами не обладает (квестовый предмет).

  На этом простом серебряном кольце внутри надпись, выполненная искусным ювелиром.
  «Людям Кулдахара. Когда вечные сумерки укроют меня и жизнь моя прекратится, пусть
  „Вечерняя прохлада“ останется вам. Заботьтесь о ней так, как это делал я. Эйдан,
  последний из рода Кайвона».'
