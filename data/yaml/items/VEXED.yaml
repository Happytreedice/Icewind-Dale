description: 'Пылающие латы — демон, воплощённый в инфернальную броню.

  Инфернальная защита: Телосложение +2 и иммунитет к урону холодом, пока доспех надет.

  Профиль защиты: +2 к КД против рубящего урона.

  Этот огненный доспех на самом деле представляет собой материальное воплощение демона.
  На нагруднике изображено злобное лицо, а комплект в целом производит зловещее впечатление
  и кажется слишком уж тщательно выполненным. Доспех теплый на ощупь и определенно
  сверхъестественного происхождения.'
