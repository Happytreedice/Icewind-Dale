description: 'Книга в потускневшей бронзе — исповедь Верховного Смотрителя Аммал-Матиса.

  Переплетные крышки этой тяжелой книги сделаны из потускневшей бронзы, но удерживает
  их вместе только гнилые конопляные шнуры, прошивающие толстые страницы и два листа
  металла. Хотя манускрипт покрыт паутиной и потемнел снаружи, книжный блок совершенно
  не пострадал от времени.

  Аудиенция у лорда Малурадека прошла неудачно. Лишь только я высказал свою просьбу,
  лорд рассвирепел. Он пригрозил заточить меня в подземелье вместе с бардом-предателем,
  если я еще раз заговорю о том, чтобы вскрыть склепы. Расстроенный, я вернулся в
  часовню, и мой взгляд упал на священный символ Хельма. Боюсь, что я подвел своего
  бога, не защитив честное имя Рыцарей-часовых.

  Я не видел никакой причины, по которой моя просьба могла бы так разгневать лорда,
  и теперь меня терзают сомнения: что же произошло во время той битвы с синим драконом
  у Курганов Бури? Четверо Рыцарей-часовых, отдавших жизнь за своего лорда в сражении
  с этим чудовищем, заслуживают почестей, однако их скрывают, как дурные предзнаменования.
  Нельзя построить крепкий замок на таком шатком основании.

  Я должен исправить содеянное, должен почтить память павших Рыцарей, однако боюсь
  что-то предпринять и тем разозлить лорда. О Неспящее Око, о Бдительный, склоняюсь
  пред тобою, Господь Бог мой Хельм, покровитель всех стражей! Но встал ли я на стражу
  памяти храбрых Рыцарей-часовых, отдавших души Хельму, или же интересов своего господина?

  И что с бардом в темнице? Какое преступление он совершил, что настолько разгневал...
  нет, напугал... моего господина? Настолько, что лорд подписал указ, запрещающий
  произносить или писать имя этого барда. Теперь даже намек на пребывание менестреля
  в темнице лорд Малурадек считает достаточным поводом для наказания, в чём недавно
  пришлось убедиться одному несчастному стражнику. Похоже, лорд хочет вычеркнуть барда
  из истории. Чего же он так боится?

  О чём могли бы поведать Рыцари-часовые, будь они живы?

  * * *

  В часовне мы с адептами обсудили план действий, и наши сердца пришли к единому мнению;
  мы построим тайный склеп, чтобы почтить Рыцарей. Малурадек не должен узнать о нем.
  Мы расплавим наши парадные доспехи и сделаем шесть ключей, чтобы запирать склеп:
  медный, бронзовый, электрумовый, серебряный, золотой и платиновый. Так мы сможем
  входить в гробницы Рыцарей-часовых и отдавать им дань уважения, но при этом не нарушим
  запрет лорда Малурадека открывать склеп.

  Но сердце мое неспокойно; подчиняясь букве, но не духу приказов моего господина,
  я показываю собственную трусость. Я не могу понять, на каком пути истина, не могу
  выбрать между желаниями Малурадека и защитой доброго имени Рыцарей. Мой дух стоит
  на развилке, и я боюсь, что две дороги разорвут меня пополам.

  * * *

  Сегодня из темницы снова доносилась песня барда. Сильным, громким голосом пел он,
  когда солнце стояло высоко, когда смеркалось, когда опустилась глубокая ночь, до
  тех пор, пока лорд не созвал стражников и не отправился вместе с ними в подземелья.
  Вскоре песня затихла, и многие стражники были бледны, когда шли назад из темницы.
  В руках лорда Малурадека был окровавленный кинжал, а лицом он походил на безумца.

  Я должен был что-то сделать, как только увидел, что лорд ведет стражников в подземелье.
  Теперь вместе с Рыцарями лежит еще один мертвец.

  * * *

  Ужас переполняет ночь. По всему замку таинственные звуки, призрачные силуэты и эхо
  песни барда. Что бы ни произошло в темнице между Малурадеком и менестрелем, это
  навлекло проклятие на замок и всех его обитателей. Лорд заперся в своих покоях,
  и многие из его стражников и слуг покинули замок или бесследно исчезли.

  Мне некуда уходить, так что я остался. У меня на сердце тяжкий груз, ибо Хельм явил
  мне свою немилость. Я стоял перед чашей для даров, где лежал священный символ Хельма,
  и читал вечерние молитвы, и вдруг воды в чаше сделались темны и туманны. Я погрузил
  туда руку, чтобы вытащить символ, но ничего не нашел. Символ исчез.

  В этот момент я почувствовал, как мое сердце пронзает копье: Бдительный узрел мою
  трусость и осудил меня. Я обречен. Я недостоин быть Верховным Наблюдателем, недостоин
  жить.

  Я оставил открытыми двери часовни. Какая бы тьма ни таилась в ночи, я готов принять
  ее кару.

  - Верховный Наблюдатель Аммал-Матис'
