description: 'Клинок покрыт вечной изморозью; молва приписывает ему убийственный холод
  самой Снежной девы.

  Дополнительный урон: Косарь Снежной девы, дающий бонус +2 к броскам атаки и урона.
  При каждом попадании цель получает дополнительно [[/damage 1d6 cold]] урона холодом.

  Ледяная погибель: При провале спасброска СЛ 14 поражённое существо обращается в
  цельный лёд и мгновенно погибает.

  Это оружие сделано изо льда; материальные у него только эфес и рукоять, выполненные
  из блестящего серебра и стали. Его создала в 1099 л.д. избранница Аурил, Иханора
  Милостивая. Иханора путешествовала по северным землям, безжалостно сражаясь с каждым,
  кто осмеливался искать убежища от холода или сопротивляться ему. Разношерстная компания
  ее спутников состояла из йети, полярных червей, ледяных великанов и белого дракона.
  Замораживать всё на своем пути Иханора прекратила в 1108 л.д., когда ее победила
  известная Бригада Красных Масок во главе с безжалостным убийцей Злобным Харли.'
