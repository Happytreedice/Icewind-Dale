description: 'Этот длинный меч был выкован в 1272 году для странствующего следопыта
  Келханиона из Субара. Носивший лёгкий доспех и не признававший щита Келханион хотел
  оружие, которое защищало бы его в бою. Заступничество сделал для него знакомый —
  волшебник Пет из Элтурела. Само оружие выглядит довольно заурядно — именно так,
  как и хотел Келханион: простой стальной клинок с такой же гардой, рукоять обтянута
  тёмной промасленной кожей огра. Меч наделён слабым подобием чутья: он сам поворачивается
  в руке владельца, подставляясь под удары рукопашного оружия. Заступничество сгинуло
  вместе с Келханионом, когда того растерзала дюжина троллей в лесу Тролльей Коры.

  Точность: Оружие ближнего боя, бонус +1 к атаке и урону.

  Заступничество: Пока вы держите этот меч, он сам подставляется под удары: вы получаете
  бонус +2 к КД против рукопашных атак. Против дальнобойных атак бонус не действует.

  Этот длинный меч изготовили для опытного следопыта Келханиона из Соулбара в 1272
  году. Так как Келханион носил облегченные доспехи и не имел щита, ему требовалось
  особое оружие, которое защитило бы в бою. Меч Заступник сделал для него знакомый
  волшебник, Пет из Элтурела. Как и хотел Кулханион, меч выглядит совершенно обычным:
  простой стальной клинок и такая же гарда. Рукоять обернута в темную промасленную
  кожу огра. Меч обладает способностью «предчувствовать» удар и поворачивается в руке,
  чтобы отразить оружие врага. Заступник был утерян после того, как десяток троллей
  разорвал Келханиона в Троллином Лесу.'
