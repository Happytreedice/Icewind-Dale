description: 'Вакидзаси, «спутник меча», чрезвычайно важен для самурая. Его носят
  всегда, даже в помещении, а ночью он лежит подле спящего самурая. Мастера у-джэни
  сокрыли в этом вакидзаси великую силу, что высвобождается лишь в гуще битвы. Как
  и почему этот вакидзаси попал в Фаэрун, неизвестно, но если владевший им самурай
  жив, он наверняка его ищет.

  Точность: Оружие ближнего боя, бонус +1 к атаке и урону.

  Вакидзаши, или парный меч, крайне важен для самурая. Самурай не снимает его даже
  дома, а по ночам кладет клинок рядом с собой. Мастера ву джен вложили в этот вакидзаши
  большую силу, которая высвобождается только тогда, когда владелец меча находится
  в самой гуще сражения. Как и почему такой клинок попал в Фаэрун, неизвестно, но
  если владевший им самурай до сих пор жив, он наверняка ищет его.

  Свойства вакидзаси (PF2e): 1d4 колющий, фехтовальное (Finesse), лёгкое (Light).

  • Смертоносное d8 (Deadly d8): при критическом попадании добавляет дополнительную
  кость 1d8 урона.

  • Быстрое (Agile / Nick): атака второй рукой совершается в рамках действия Атака
  без траты бонусного действия.

  • Универсальное (Versatile S): возможность наносить рубящий урон вместо колющего.

  • Критический эффект: цель становится Застигнутой врасплох (Off-Guard) до начала
  вашего следующего хода.'
