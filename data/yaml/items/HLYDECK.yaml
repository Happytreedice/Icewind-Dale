description: 'Колода карт четырёх мастей: Улыбчивые Дамы, Чёрные Бесси, Королевы Бурь
  и Несущие Радость.

  Вытянуть карту (заряд): Действием вы вытягиваете карту и бросаете [[/r 1d3]]. 1
  — @UUID[Compendium.dnd5e.spells24.Item.phbsplBless00000]{Благословение} на вашу
  группу на 1 минуту. 2 — Молитва: вы и союзники в пределах 30 футов получаете +1
  к броскам атаки и спасброскам, а враги в той же области — штраф −1, на 3 раунда.
  3 — Речитатив: как Молитва, но бонус и штраф равны 2, длительность 5 раундов. Молитва
  и Речитатив — заклинания AD&D, отсутствующие в D&D 5e; они перенесены как есть.
  В колоде 13 зарядов; вытянув последнюю карту, колода исчезает.

  «Хаос господний!» — малоизвестная карточная игра, популярная у жрецов хаотичных
  богов. Жрецы Тиморы и Амберли особенно любят ее. Карты в колоде четырех мастей:
  Смеющиеся Дамы, Черные Черти, Королевы Урагана и Несущие Радость. Крайне сложные
  «правила» игры ежегодно уточняются и изменяются эдиктом церкви Бешабы. Победители
  ежегодного турнира получают в подарок магические копии колоды, вроде этой. Последователи
  Тира и Хельма презирают подобные артефакты.'
