description: 'Такие мечи обычно называют обоюдоострыми, боевыми или военными мечами.
  Во многих случаях длинный меч имеет одностороннюю заточку. Единого образца длинного
  меча не существует: устройство и длина меняются от культуры к культуре и даже внутри
  одной культуры в зависимости от эпохи. Общая черта почти всех длинных мечей — длина
  от тридцати пяти до сорока семи дюймов; в последнем случае на клинок приходится
  сорок дюймов общей длины. У большинства длинных мечей обоюдоострый клинок и острый
  кончик, но, несмотря на остриё, длинный меч предназначен для рубящих, а не колющих
  ударов. Клинок этого меча покрыт всевозможными тайными символами.

  Точность: Оружие ближнего боя, бонус +2 к атаке и урону.

  Дар жизни: При провале спасброска СЛ 13 при попадании меч делится с владельцем жизненной
  силой: вы восстанавливаете [[/heal 1d3]] хитов.

  Такие мечи обычно называют военными, солдатскими или обоюдоострыми, хотя нередко
  встречаются и длинные мечи, заточенные лишь с одной стороны. Существует множество
  форм и вариантов длинного меча, его конструкция и размеры различаются в зависимости
  от культуры и времени изготовления. Длина таких мечей обычно от 35 до 47 дюймов
  (в последнем случает длина самого клинка достигает 40 дюймов). Большинство длинных
  мечей — обоюдоострые; часто они имеют острый конец, но предназначены все же для
  рубящих, а не колющих ударов. Клинок этого меча покрывают разнообразные магические
  знаки.'
