description: 'Созданное в золотой век дружбы между эльфами Длани Селдарин и дварфами
  Глубин Дорна, это кольцо вручали жрецам, которых посылали в бой против орочьих и
  гоблинских орд. Его сила давала жрецу убежище, пока тот призывал мощь своей веры.

  Использование: Действием и одним зарядом сотворяет @UUID[Compendium.dnd5e.spells.Item.gvdA9nPuWLck4tBl]{«Убежище»}.
  5 зарядов.

  Это кольцо было создано в золотой век сотрудничества между эльфами Руки Селдарин
  и дворфами Пещер Дорна. Его надевали клирики, отправляясь на битву с ордами орков
  и гоблинов. С его помощью жрец оставался в безопасности, пока обращался к силам
  богов.'
