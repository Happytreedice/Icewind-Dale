description: 'События последних недель перемешались у меня в голове, но я попытаюсь
  восстановить их.

  Я прибыла в Пещеры Дорна поздно ночью, и дворфы отнюдь не были рады моему визиту,
  но этого следовало ожидать после всего, что произошло между нашими двумя расами.
  Сначала дворфы, естественно, с недоверием отнеслись к моим словам. Еще не затянулись
  раны, которые нанесли нашим народам недавние события. Переговоры в подобном положении
  всегда оказываются напряженными, но мне кажется, что я такой же хороший дипломат,
  как мой отец, если не лучше.

  Каждое заседание в Совете затягивалось допоздна, пока все не расходились в полном
  изнеможении. Обсуждение недавних событий вызывало множество споров и пререканий.
  Бесчисленные часы проходили в этих беседах, но постепенно дворфы убедились, что
  за моими словами нет злого умысла, а мои намерения чисты. В конце недели они согласились
  заключить договор ради блага обеих наших рас. Моя задача была выполнена. Впервые
  за много месяцев у нас появилась новая надежда.

  Теперь мне осталось только вернуться домой и убедить мой народ, что это наш единственный
  шанс спастись. Самое трудное — это доказать свою правоту отцу, но он выслушает меня.
  Ему придется меня выслушать, ведь от этого зависит жизнь и смерть эльфов.

  Следующее утро чуть не свело все мои усилия на нет. Разведчик дворфов доложил, что
  видел огромнейшую армию орков всего в нескольких часах пути отсюда. Мы не успели
  как следует подготовиться. Наша оборона была пробита, и орки хлынули в Пещеры Дорна.

  Мы начали отступление в глубину владений дворфов. Главные проходы были обрушены,
  чтобы выиграть время и скрыть наши передвижения. Благодаря этому дворфы даже в таких
  трудных обстоятельствах определяли сами, где и когда вступить в схватку с врагом.
  Каждое сражение дорого обходилось оркам, вынужденным принимать бой на наших условиях,
  но они всё равно продолжали теснить нас. Даже сейчас мы готовимся к дальнейшему
  отступлению, на ледник Зуба Змия.

  Каким бы мрачным ни казалось наше положение, я всё еще надеюсь. Надеюсь, что поведаю
  отцу, как я шла в бой бок о бок с дворфами, будто в былые времена. Надеюсь, что
  расскажу, как они отдавали жизнь ради того, чтобы я смогла возвратиться и вновь
  объединить наши народы. Надеюсь снова увидеть его упрямое лицо.

  За мой народ и за Руку Селдарин,

  Эвайна'
