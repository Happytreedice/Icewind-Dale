description: 'Молот пророка безразличия, крушащий двери «прибежищ глупцов».

  Безразличие: Против существ ярко выраженных убеждений — заведомо добрых и заведомо
  злых — молот бьёт больнее: дополнительно [[/damage 1 bludgeoning]] и +1 к броску
  атаки (примените вручную).

  Этот молот создал самопровозглашенный пророк по имени Феллеп, отрицавший божественную
  предопределенность. Он верил, что действия любой отдельно взятой личности не имеют
  никаких последствий для судьбы всего мира. В итоге он отвергал понятия добра и зла,
  вместо этого придерживаясь позиции невмешательства в общественную, политическую
  и моральную деятельность. Феллеп носил с собой этот молот и обыкновенно колотил
  им по дверям храмов, которые он называл «рассадником глупости и безмыслия».'
