description: 'Зачарованный череп врага безумного Красного Волшебника; метательная
  бомба.

  Метнуть череп: Действием вы метаете череп в точку в пределах 20 футов: он взрывается,
  и каждое существо в радиусе 5 футов должно совершить спасбросок Ловкости [[/save
  ability=dex dc=15]], получая [[/damage 4d8 fire]] при провале или половину при успехе.
  Череп уничтожается.

  Ксайнлафар, безумный Алый Маг Тэя, прославился тем, что делал из черепов поверженных
  врагов оружие. Наиболее известны его «Летучие черепа». По своему действию они мало
  отличаются от заклинания «Череп-ловушка», только применяются не для защиты, а для
  нападения. Ксайнлафар умер в 913 л.д., успев использовать меньше половины зачарованных
  черепов. Оставшиеся забрали себе враги волшебника, жрец Хельма и паладин. Они намеревались
  уничтожить черепа, но хитрые воры утащили у них на обратном пути в Сембию не меньше
  сорока штук.'
