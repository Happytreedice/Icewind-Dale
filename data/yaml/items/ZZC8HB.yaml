description: 'Чёрный клинок с серебряной кромкой и живыми огненными рунами; рукоять
  — цельный рубин.

  Против исчадий: Против баатезу и танар''ри (исчадий) меч бьёт с бонусом +4 к атаке
  (примените вручную; дополнительный урон учитывается свойством «Истребитель»).

  Защита от огня: Пока меч в руке, вы получаете сопротивление урону огнём.

  Прекрасный широкий меч необычной конструкции. Клинок сделан из неизвестного матового
  металла черного цвета, но его кончик, похоже, из чистейшего серебра. Пылающие красные
  руны выгравированы по всей длине лезвия. Если присмотреться, то видно, что руны
  сами по себе двигаются и сплетаются. Эфес и гарда меча вырезаны из цельного рубина.

  Для некоторых существ с нижних планов это оружие — настоящая погибель. Баатезу и
  танар''ри этот меч наносит двойной урон, а владельцу дает бонус +4 к атаке и урону
  в бою против этих существ. Кроме того, он дает владельцу некоторую защиту от огня.'
