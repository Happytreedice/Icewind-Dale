description: 'Как и другие боевые молоты, этот целиком сделан из стали: крушащий кости
  боёк насажен на восемнадцатидюймовую рукоять. Вдобавок он наделён несколькими магическими
  свойствами, делающими его более действенным в бою.

  Точность: Оружие ближнего боя, бонус +1 к атаке и урону.

  Боевые молоты обыкновенно изготавливают целиком из стали; этот молот — не исключение.
  На 18-дюймовой рукояти укреплен боек, которым можно дробить кости. Волшебные свойства
  этого молота весьма полезны в бою.'
