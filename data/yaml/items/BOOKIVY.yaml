description: 'Выдержка...

  «Что касается ботаники, то я, конечно, просто любитель, но смело могу сказать, что
  получше многих знаю, как обращаться с плющом. Многие ботаники могут рассказать вам
  о „правилах“ разведения плюща. К сожалению, эти самонадеянные бараны не уделяют
  достаточного внимания различным видам плюща и неспособны понять их специфические
  особенности. К примеру, совсем недавно один глупец убеждал меня, будто плющ „Звонкий
  колокольчик“ следует сажать во влажную почву рядом с „Цветущими подтяжками“. В то
  время как любой мало-мальски стоящий плющевод понимает: „Подтяжкам“ требуется столько
  воды, что „Колокольчик“ рядом с ними попросту утонет. „Влажная почва“ и „болото“
  — это разные вещи. Я задаюсь вопросом, когда же эти шуты от науки всё-таки чему-нибудь
  научатся».'
