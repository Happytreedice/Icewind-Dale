description: 'История Севера — Первый Расцвет:

  На протяжении тысячелетий золотые эльфы жили в Иллефарне (на месте современного
  Уотердипа) и Эйрланне (вдоль Сияющей Реки). Из своих прекрасных лесных городов они
  осуществляли торговлю с зарождающимися империями людей, такими как Нетерил и Иллюск,
  и отражали набеги гоблинов. Между тем, кланы дворфов объединились в государство
  Делзун, названное в честь основателя. Это государство, большей частью подземное,
  простиралось от Ледяных до Нижних Гор. Западной его границей был Перевал Серебряной
  Луны, а восточной — Узкое Море. С севера Хребта Мира пришли орки, но потерпели поражение
  от эльфов и возвратились назад. До наших дней те места остаются домом и главной
  крепостью для орков и их сородичей.'
