description: 'Посох крошечного мага Гульфа, рушащий чужие обереги.

  Рассеивание магии (1/день): Сотворяет заклинание @UUID[Compendium.dnd5e.spells24.Item.phbsplDispelMagi]
  без траты ячейки.

  Снижение сопротивления (1/день): Действием вы бьёте по защитам существа в пределах
  100 футов: до конца следующего хода цель совершает спасброски от заклинаний с помехой.

  Подобные посохи очень любят маги-преобразователи. Этот посох изготовил волшебник
  по имени Гальф Крошка, человек чрезвычайно малого роста. Он не желал оказаться в
  таком положении, чтобы зависеть только от своих физических возможностей. Посох помогал
  ему брать верх в магических поединках. Гальф погиб, когда неосторожно отправился
  за ибенийскими грибами в рощу, населенную шустриками. Несколько лет эти злые феи
  хранили посох, пока проходивший мимо отряд искателей приключений не перебил монстров
  и не забрал артефакт.'
