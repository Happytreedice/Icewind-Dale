description: 'Загадочное красное зелье неизвестного действия (квестовый предмет).

  Это необыкновенное зелье кто-то назовет мечтой волшебника, а кто-то — самым страшным
  кошмаром. Выпивший его превращается в слабое и неразумное существо, но при этом
  его интеллект достигает запредельных высот. Вдобавок он получает 50% сопротивление
  к магии. Эффект длится 24 часа, поэтому хорошенько подумайте, прежде чем откупорить
  бутылочку.'
