description: 'Книга о запретном рае к северу от Хребта Мира.

  История Долины Богов:

  Говорят, иногда и богам хочется повеселиться и поразвлечься. Далеко к северу от
  Хребта Мира лежит Долина Богов, рай, подобного которому нет ни в этом мире, ни в
  иных планах. Смертным дорога в это место заказана — любой, кто достигнет Долины,
  тут же станет божеством, ибо только божества могут войти в нее. Немало мечтавших
  о божественном величии оставило свои королевства и радости земной жизни, надеясь
  отыскать легендарную Долину Богов, но находя лишь безвременную смерть.'
