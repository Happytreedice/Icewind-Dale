description: 'Огромный стальной щит, украшенный чёрной эмалью и одиноким черепом в
  центре.

  Защита: Щит +3: пока вы держите его, вы получаете +5 к КД (2 за щит и 3 за зачарование).
  Против дальнобойных атак оружием щит даёт дополнительно +1 к КД.

  Тайна мёртвых: Заклинания @UUID[Compendium.dnd5e.spells24.Item.phbsplFingerofDe]{Перст
  смерти} и @UUID[Compendium.dnd5e.spells24.Item.phbsplPowerWordK]{Слово силы: смерть}
  не действуют на вас.

  Ограничение: Щит признаёт своим владельцем только человека.

  Лицевую часть этого огромного стального щита украшает орнамент из черной эмали,
  в его центре — череп. На внутренней стороне старинная тайнопись. Единственное, что
  можно прочитать, это несколько слов в самом верху: «И ЧТО С МЕРТВЕЦАМИ?» Происхождение
  этого предмета покрыто густым мраком.

  Эдион расшифровал небольшую часть текста, которая прояснила некоторые особенности
  щита.'
