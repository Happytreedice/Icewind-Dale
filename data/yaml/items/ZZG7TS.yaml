description: 'Клинок, созданный магом Эппом Безрассудным для рейнджера Фарла Зеленобрюха,
  посвятившего жизнь истреблению троллей.

  Точность: Клинок, дающий бонус +1 к броскам атаки и урона. Против троллей бонус
  возрастает до +4.

  Истребитель троллей: Против троллей (тип «великан») молот наносит дополнительный
  урон (свойство «Истребитель»); бонус атаки — активность «Против троллей».

  Этот клинок волшебник Эпп Безрассудный изготовил для своего верного спутника, Фарла
  Болотного. Опытный следопыт Фарл посвятил всю свою жизнь истреблению троллей в северных
  землях Фаэруна. Эпп помогал ему, и вместе они успешно теснили монстров на юг. Фарл
  стал жертвой неожиданного нападения троллей-шаманов. Эпп прибежал на помощь, заслышав
  его крики, но опоздал на несколько мгновений. Волшебник отомстил за смерть друга,
  но от Фарла остался только этот клинок, который Эпп смог вытащить из трясины.'
