description: 'Очки, показывающие магические предметы такими, каковы они есть.

  Опознание (3/день): Сотворяет заклинание @UUID[Compendium.dnd5e.spells24.Item.phbsplIdentify00]
  без траты ячейки.

  Эти очки позволяют владельцу видеть магические предметы такими, какие они есть на
  самом деле. Указания, объясняющие, как использовать все особенности объекта, появляются
  перед обладателем в виде парящих в воздухе слов. Очки можно использовать три раза
  в день. Они действуют примерно так же, как свиток опознания: чтобы опознать предмет,
  щелкните по нему правой кнопкой мыши. Появится меню, в котором вам нужно будет выбрать
  пункт «свиток». После этого предмет будет опознан.'
