description: 'Книга с записями и преданиями. Может содержать полезные сведения для
  тех, кто её прочтёт.

  Боюсь, меня обманули. Бэндот указал, где мне искать дверь в кузницу, но я не нашел
  и следа ее. Я собирался продолжить поиски сегодня ближе к вечеру, но в проходе к
  северу отсюда расположилась группа эттинов, а я сейчас не в состоянии пробежать
  мимо них. Надеюсь, у меня еще будет возможность обыскать древний зал собраний дворфов.
  Ранее я нашел записи, где упоминалась комната, ведущая в нижнюю часть этого комплекса
  пещер. Остается предположить, что проход в эту комнату мне еще предстоит найти.
  Кроме того, в тех же записях говорилось, что комната, вероятно, защищена головоломкой,
  которая не дает посторонним вторгнуться в Усыпальницу и Кузню. Может быть, стоит
  опять обратиться за помощью к Бэндоту.'
