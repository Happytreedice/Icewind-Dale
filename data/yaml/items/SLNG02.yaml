description: 'Пращи существуют с начала письменной истории. Простейшая праща — кожаный
  или тканевый ремень с карманом для снаряда; эта, впрочем, наделена небольшими чарами.
  Оружие держат за оба конца ремня и раскручивают над головой. Набрав скорость, снаряд
  выпускают, отпуская один из концов ремня.

  Точность: Оружие дальнего боя, бонус +1 к атаке и урону.

  Пращи известны с древнейших времен. Праща обычно представляет собой ремешок из кожи
  или ткани, снабженный кармашком, который удерживает снаряд. Пращу берут рукой за
  оба конца ремешка и раскручивают над головой. Добившись максимальной скорости вращения,
  один из концов отпускают, метая снаряд.'
