description: 'Клинок закхарского игрока Кадана ибн-Кадура, помогавший ему выигрывать
  безнадёжные пари.

  Точность: Оружие ближнего боя, бонус +2 к атаке и урону.

  Везение: Пока скимитар у вас в руках, вам сопутствует лёгкая удача: Ведущий может
  позволить вам перебросить один особенно неудачный бросок d20.

  Благословение удачи (1/день): Действием вы даруете удачу одному существу в пределах
  15 футов: на 3 раунда оно получает +1 к броскам атаки, проверкам характеристик и
  спасброскам.

  Это оружие Кадана ибн-Кадура, знаменитого игрока из Захары. Говорят, именно благодаря
  этому клинку Кадану удалось выиграть множество глупых пари. Однако Кадан лишился
  скимитара, когда встретился в западном Фаэруне с печально известным Нидо Охита Инадзумой.
  Инадзума, сын кормирского рыцаря и аристократки из Кара-Тура, говорил, что его мать,
  пока она его вынашивала, дважды ударила молния. В первый раз это якобы случилось,
  когда она узнала, что забеременела, а во второй — сразу перед началом родов. По
  легенде, когда Инадзума появился на свет, то Монета Судьбы — волшебный предмет,
  с помощью которого Тимора и Бешаба определяют удачливость новорожденного, — встала
  на ребро. Мудрецы утверждают, что поэтому он и был неподвластен ни везению, ни неудачам.
  Встретившись с Инадзумой, Кадан вскоре проиграл ему и скимитар, и собственную жизнь.'
