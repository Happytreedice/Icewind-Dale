description: 'Выпив это зелье, вы извергаете струю пламени.

  Выдох пламени: Действием вы выпиваете зелье и извергаете струю огня в направлении
  взгляда. Каждое существо в линии длиной 30 футов совершает спасбросок [[/save ability=dex
  dc=15]], получая [[/damage 6d10 fire]] при провале или половину урона при успехе.

  Зелье огненного дыхания магически трансформирует горло выпившего его так, что тот
  может выдохнуть огромную дугообразную струю пламени. Существо, задетое струей, получает
  6d10 единиц урона или вдвое меньше при успешном спасброске против оружия дыхания.'
