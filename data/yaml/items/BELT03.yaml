description: 'Широкий окованный пояс, гасящий силу дробящих ударов.

  Притупление: Пока пояс надет, вы получаете +4 к КД против атак, наносящих дробящий
  урон.

  Ремень притупления: Разрушитель Холмов

  Лишившись друзей и близких по вине холмовых великанов, Гаррар Могучий поклялся обезопасить
  родную землю от их набегов и избавиться от этих чудовищ. Неизвестно, каким образом
  он обзавелся этим ремнем, но под его защитой, оберегавшей от ударов дубинок, Гаррар
  в одиночку перебил несколько десятков великанов, а остальные разбежались по соседним
  землям, где не было таких грозных защитников.'
