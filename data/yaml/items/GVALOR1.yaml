description: 'Вечно сияющая рукавица — часть Оружья Мощи архимагов Миф Драннора.

  Доблесть: Вы иммунны к состояниям Очарован, Парализован, Опутан и к магическому
  сну.

  Кулак доблести: Трижды в день вы можете 1 минуту наносить рукавицей безоружные удары
  как магическим оружием: [[/damage 1d4 + 1 bludgeoning]], а при критическом попадании
  цель дополнительно получает [[/damage 3d6 bludgeoning]] и Ошеломлена до конца своего
  следующего хода.

  Перчатка храбрости — сама по себе ценный артефакт, но это еще и одна из трех уцелевших
  Рук Силы, созданных эльфами-архимагами из Мит Драннора. Такие предметы предназначались
  для воинов, оборонявших древний эльфийский город в случае опасности (что бывало
  крайне редко). Эта вечно сияющая латная перчатка — вершина мастерства эльфийских
  ремесленников и магов. По всем Королевствам искатели приключений и тщеславные злодеи
  разыскивают оставшиеся Руки Силы.'
