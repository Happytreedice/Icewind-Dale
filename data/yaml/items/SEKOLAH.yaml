description: 'Арбалетный болт, несущий жгучее пламя акульего бога сахуагинов.

  Огонь Секолаха: Поражённая цель загорается: она получает [[/damage 3d6 fire]] в
  начале каждого своего хода в течение 3 раундов; действие можно потратить на тушение.

  Это длинная металлическая трубка с ударником на одном конце. Внутри у нее вязкое
  гелеобразное вещество с сильным рыбным запахом. Трубкой заряжают арбалет, и при
  выстреле ударник резко выбивает содержимое трубки на расстояние до 40 футов. Гель
  воспламеняется при контакте с воздухом и летит к цели, оставляя огненный след. Любой
  объект, на который попадет гель, тоже начинает гореть. Эти болты — любимое оружие
  сахуагинов высокого ранга.'
