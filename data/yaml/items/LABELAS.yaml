description: 'Символ Лабеласа Энорета. Пока надет магом, увеличивает Интеллект на
  1.

  Это кольцо было создано в золотой век сотрудничества между эльфами Руки Селдарин
  и дворфами Пещер Дорна. Оно помогает молодым волшебникам лучше сконцентрироваться
  на заклинаниях. Хотя среди старших магов Руки Селдарин были могущественнейшие из
  заклинателей во всех Королевствах, они принимали участие лишь в самых ответственных
  сражениях и походах, а большую часть своего времени посвящали различным исследованиям
  и опытам.'
