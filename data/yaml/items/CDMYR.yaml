description: 'По легенде выкован фейри в холодных глубинах озера Мирлох на Гвиннете;
  имеет неземной облик.

  Точность: Оружие ближнего боя, бонус +3 к атаке и урону.

  Знание преданий: Меч обостряет чуткость владельца к миру: вы получаете преимущество
  на проверки Интеллекта (История) [[/check ability=int skill=his]] для опознания
  предметов, мест и преданий.

  По легенде, этот красивый меч помогали делать феи, а выкован он был в ледяных глубинах
  Мирлока, огромного озера в центре Гуиннета в Муншесе. Это оружие неземного вида
  считают очень древним. Единственным известным владельцем меча был полуэльф-бард
  Даэн Зимняя Ветвь. Говорят, будто после того, как он по чистой случайности нашел
  меч, в нем пробудились доселе неслыханные таланты и повышенная восприимчивость к
  окружающему миру. Сорок лет он провел в странствиях и создал за это время немало
  мелодий, которые называют самыми поразительными и чарующими во всем Фаэруне. Но
  в конце концов, как рассказывают, Даэна стали слишком удручать чужие невзгоды и
  несправедливость, которую он видел повсюду, и он отправился на дно Мирлока к феям-оружейникам.

  Исполнив балладу Даэна Зимняя Ветвь и поговорив с его духом, вы пробудили новые
  возможности меча.'
