description: 'Освящённый пояс, несущий на себе неугасающее благословение Хельма.

  Благословение: Пока пояс надет и настроен на вас, вы находитесь под постоянным действием
  заклинания @UUID[Compendium.dnd5e.spells24.Item.phbsplBless00000]{Благословение}:
  совершая бросок атаки или спасбросок, добавьте к результату [[/r 1d4]].

  Бердусканские жрецы Хельма освятили этот ремень для воина Тома Уэйнрайта в дар за
  огромные услуги, оказанные их церкви (в частности, он разрушил Невидящее Око и уничтожил
  его последователей, Ослепленных Аколитов). Том с гордостью носил его много лет,
  пока не впал в жестокую нужду. К своему великому сожалению он был вынужден продать
  ремень с аукциона одному известному жрецу Маска.'
