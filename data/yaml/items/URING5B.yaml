description: 'Кольцо, сплетённое из стальных шипов: дар силы для ловких рук.

  Сила: Пока кольцо надето и настроено на вас, ваша Сила увеличивается на 1.

  Дополнительная атака: Когда вы совершаете действие Атака, вы можете совершить одну
  дополнительную атаку оружием. Кольцо признаёт своим носителем только плута: остальным
  оно не даёт никаких свойств.

  Кольцо — ювелирное изделие в виде небольшого ободка из драгоценного металла. Изредка
  встречаются кольца, на которые наложены чары, наделяющие их разнообразными магическими
  свойствами. Такие украшения очень высоко ценятся, особенно среди искателей приключений.
  Это кольцо почему-то теплое на ощупь.'
