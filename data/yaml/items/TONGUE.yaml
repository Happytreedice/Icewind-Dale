description: 'Зловещего вида кинжал с тёмной историей, Язык Саламандры ценят и как
  оружие, и за скрытые магические силы. Клинок похож на экзотический кинжал с волнистым,
  как крис, лезвием, оканчивающимся двумя остриями. В сердце клинка, у самой рукояти,
  каким-то образом заключён кусочек скользкого ярко-красного языка живой саламандры:
  он пульсирует и извивается сам по себе.

  Точность: Оружие ближнего боя, бонус +3 к атаке и урону.

  Дополнительный урон: Наносит дополнительно [[/damage 1d6 fire]] при каждом попадании.

  Сопротивление огню: Пока это оружие у вас в руках, вы имеете сопротивление урону
  огнём.

  Необнаружение: Пока кинжал у вас, вы скрыты от магии прорицания: вас нельзя увидеть
  или выследить такой магией (как заклинание «Необнаружение»).

  Защита от яда: Пока кинжал у вас, вы получаете преимущество на спасброски против
  яда.

  Язык Саламандры, жутковатый экзотический кинжал с мрачной историей, хорош не только
  боевыми качествами, но и скрытыми магическими свойствами. Лезвие у него волнистое,
  как у криса, а на конце раздваивается. В центр клинка, у самой рукояти, каким-то
  образом вставили живой кусочек скользкого ярко-красного языка саламандры. Он хаотично
  извивается и дергается.

  Точное происхождение кинжала неизвестно, но первым его владельцем, по всей видимости,
  был гном Турлам Плоскохолм, прославленный и опасный вор и наемный убийца из Западных
  Врат. Турлама убил в схватке его конкурент, полурослик Дедер Семипалый. Дедер забрал
  себе кинжал в качестве трофея, ничего не зная о его силах, пока артефакт не стащил
  один из его подручных, полурослик Крешиналь Черный Пес. Крешиналь пять лет скрывался
  в Селгонте, а магические силы кинжала защищали его от магического обнаружения. Однако
  затем он попал в искусно расставленную ловушку и проиграл артефакт шулеру, а меньше
  чем через месяц стал жертвой помощников бывшего хозяина. Кинжал достался сембийскому
  преступному союзу, и Дедер попытался заполучить его назад. Ему удалось обнаружить
  воров и забрать кинжал, но он так был занят магическим клинком, что не заметил,
  как сембийские преступники внедрили в ряды его подручных своего наемника, жреца
  Маска, чтобы тот навредил положению Дедера в Западных Вратах. Завязалась война между
  преступными сообществами Селгонта и Западных Врат, а завершению ее помог тот самый
  жрец Маска, Петер Хилый. Обе стороны он довел до такой паранойи, что они принялись
  уничтожать себя сами изнутри. При первой же возможности Петер прихватил кинжал и
  сбежал в Хиллсфар, рассчитывая, что помощники покойного Дедера Семипалого не объединятся
  и не последуют за ним в столь враждебное для нечеловеческих рас место.

  В Хиллсфаре Петер провернул еще одно хитрое дело: продав кинжал наемному убийце
  Мулмастеру Соколу, он в то же время заманил остальных потенциальных покупателей
  на фиктивный аукцион. Вместе с сообщниками он перебил и ограбил всех собравшихся,
  а потом преступники скрылись под защитой амулета незаметности. Новый владелец кинжала,
  Мулмастер Сокол, предположительно стал жертвой жриц Амберли, которые не могли добиться,
  чтобы убийца платил дань Королеве-Стерве. За годы внутренних распрей между служителями
  Амберли артефакт, похоже, удалился от мест, где так скромно началась его история,
  на три тысячи миль. Местонахождение Петера Хилого и его сообщников остается неизвестным.'
