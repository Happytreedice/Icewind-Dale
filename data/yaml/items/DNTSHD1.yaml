description: 'Щит с вмятиной от кулака великана, сохранивший часть былых чар.

  Стойкость к клинкам: Пока щит у вас в руках, вы получаете сопротивление рубящему
  и колющему урону.

  Без защиты от дробящего: Бонус этого щита к КД не действует против атак, наносящих
  дробящий урон.

  Похоже, что по этому волшебному щиту как следует стукнул великан — но надо сказать,
  что зачарованный предмет не просто уцелел, а еще и сохранил часть магических свойств.
  На поверхности щита клеймо мастера: имя «Тиернон» и помятый шлем. Сложно определить,
  был ли он так изображен изначально, или же символ пострадал при ударе великана.'
