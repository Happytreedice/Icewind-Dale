description: 'Побуревший от вина — или крови — дневник лорда Фаллона Малурадека.

  Этот дневник, испачканный чем-то красным, был в свое время профессионально переплетен.
  Однако, судя по состоянию влажных страниц, недавно он побывал в луже крови или вина
  и еще не высох. Книга неприятна на ощупь, ее страницы слиплись. С трудом разделяя
  листы, вы читаете записи, сделанные неровным почерком.

  Завтра на рассвете мы выезжаем к Курганам Бури — я, четверо Рыцарей-часовых Хельма,
  и бард, который сложит историю о нашем путешествии. Впереди у нас славное приключение,
  и мысли мои устремляются к сокровищам, которые мне достанутся! Говорят, чудовище
  уже много лет гнездится у Курганов Бури. Не сомневаюсь, что у него в логове полным-полно
  ценностей! Очень удачно, что смерть чудовища наполнит мои сундуки и возвысит меня
  во мнении простого народа. Никаких больше угрюмых взглядов, возражений по поводу
  королевских указов, жалоб на налоги, конфликтов на границе... мои деяния заставят
  моих подданных смотреть на меня по-другому, и слова лорда Малурадека, Победителя
  дракона из Курганов Бурь, золотыми буквами будут вписаны в историю!

  * * *

  Слава о моем возвращении летела впереди меня, и мое прибытие в замок было триумфальным.
  Я держал в руке голову дракона, и толпа крестьян благоговейно пала передо мной на
  колени. Без промедления я приказал устроить пир в честь моей победы и велел барду,
  сопровождавшему меня в пути, восславить в балладе мою доблесть в битве со змием.
  Я потребовал сложить ее как можно скорее, чтобы услышать ее на пиру.

  Среди крестьян и послушников Хельма были кое-какие разговоры о том, что случилось
  с Рыцарями-часовыми (по настоянию барда мы принесли их тела с собой, хотя это и
  замедлило нас на многие лиги). Чтобы ничем не омрачить предстоящее торжество, я
  приказал запечатать тела Рыцарей в склепах. Я сказал много прекрасных слов о том,
  как отважно бились они с драконом, и все были потрясены их храбростью.

  Боюсь, если Рыцарей не похоронить в ближайшее время, множество ран на их телах заставят
  кого-нибудь задуматься: а каким образом я вышел из битвы без единой царапины? Лучше
  не заострять на этом внимание. Как я сказал барду, прошлое — прах, а путь впереди
  вымощен золотом!

  * * *

  Проклятый бард предал меня! Его слова ранят больнее, чем любой клинок. Как посмел
  он распространять такую грязь... такую ложь?! В предательском, лживом рассказе о
  битве при Курганах Бурь он превознес деяния Рыцарей над моей храбростью, он заявил,
  что я струсил. Я! Его господин!

  Он делал тонкие намеки. Но неужели он думал, что я не замечу его оскорблений? Что
  не распознаю лжи в его словах? Я приказал стражникам схватить его, пока он не закончил
  историю, и вырвал проклятые стихи у него из рук. Я велел бросить его в подземную
  темницу. Пусть сгниет в цепях, не видать ему больше солнца!

  Когда его утащили из зала, я отдал приказ отрубить ему руки в наказание. Да... это
  жестокая кара, но правитель не может терпеть предательства в собственном замке.
  Это угрожает самой его власти.

  Лишь когда я стал жечь ядовитые страницы той ночью, я обнаружил, что нескольких
  недостает! Это встревожило меня — вдруг они попадут не в те руки... но нет, я не
  буду об этом думать. Эта история окончена, и судьба барда решена.

  * * *

  Верховный наблюдатель Хельма явился ко мне в полдень и с почтительным видом попросил
  позволения открыть склепы Рыцарей-часовых, «дабы почтить память мертвых». Я прогнал
  его прочь. Как он смеет оспаривать решения героя в его собственном тронном зале?!
  Да совершил ли этот безмозглый жрец за свою жизнь хоть что-то во имя своего немигающего
  бога, чтобы удостоиться хоть пары слов на полях истории? Пусть только попробует
  еще хоть раз усомниться в моей правоте — сразу попадет на дыбу!

  Всё же... хотя он сказал, что подчинится моему приказу, я ему не доверяю. Рыцари-часовые
  служили Хельму, и Наблюдатель, разумеется, на их стороне, а не на моей. Я буду следить
  за ним... ДОЛЖЕН следить за ним, и очень внимательно. Если он захочет предать меня,
  отправлю его гнить рядом с бардом.

  * * *

  Сегодня один из стражников осмелился произнести имя барда. Для меня это было как
  удар в сердце. Я приказал отхлестать болтливого дурака плетьми, заткнув ему рот
  перчеными тряпками. С этого дня никому не позволяется упоминать о барде. Я сотру
  его имя в пыль, развею ее по ветру и удостоверюсь, что ни от него, ни от его грязных
  слов в мире не осталось и следа. Вот достойная судьба для такого ядовитого гада!

  Я забрал себе единственный ключ от темницы. Даже во сне я с ним не расстаюсь. Никто
  не увидит барда, никто не подаст ему пищи, и он подохнет от голода. Пусть предатель
  подавится собственными словами, и да свершится правосудие!

  * * *

  Он поет! Проклятый бард поет, я слышу его песню даже сквозь стены своих покоев!
  Я не могу уснуть. Она такая громкая, я боюсь, что ее слышит весь замок! Прекрати
  мучить меня, мерзавец, не то я прикажу тебя повесить!

  * * *

  Я не мог больше выносить его пение. Бард мертв. Я вырвал его ядовитый язык и ушел,
  пока жизнь покидала его тело. Стражники... молчат... теперь они боятся меня. Хорошо!
  Пусть боятся! Пусть уважают меня, пусть знают, что их лорд не трус!

  * * *

  Бард жив... хотя мертв! Его призрак приходит в мои покои и поет, дразня меня рассказом
  о моей трусости в битве при Курганах Бурь! Он называет меня «героем», это слово
  вонзаемся мне в грудь, как стрела. Мои слуги, моя стража — все покинули меня...
  а это чудовище осталось мучить меня! Тишина и покой, как же я их жажду. Молчи, дух,
  молчи, МОЛЧИ!

  * * *

  Боюсь, что я больше не выдержу; я не могу верить ни глазам, ни ушам. Меня снова
  терзает искушение покончить с этой пыткой. Что мне делать? Сегодня я видел на башне
  призрака, болтающегося в петле, похожего на меня. Боюсь, это мое будущее висит на
  башне. Приму ли я его? Нет, не могу! Должен быть выход! Но из замка никак не выбраться
  — все коридоры ведут назад в башню. Неужели смерть — единственный путь к спасению
  из этого ада?

  * * *

  Конец близок. Сегодня призрак барда явится снова, я не могу уже выносить его голос.
  Я иду в башню, с открытыми глазами шагаю навстречу своему будущему. Он мечтает убить
  меня, но я не доставлю ему такого удовольствия! Пусть останется в этом замке навечно,
  один, со своими словами! Посмотрим, выдержит ли он тишину этих залов. По крайней
  мере, больше никто не услышит рассказ о Малурадеке.

  Из тьмы я вышел, во тьму я ухожу.

  - Лорд Фаллон Малурадек, герой Курганов Бури, победитель лазурного змия Эгиргласса'
