description: 'Дротик — небольшое, легко скрываемое метательное оружие: его бросают
  рукой, а не выпускают из лука или иного метательного приспособления. На поверхность
  этих дротиков нанесены крошечные серебряные руны, улучшающие их боевые качества.

  Точность: Оружие дальнего боя, бонус +3 к атаке и урону.

  Дополнительный урон: Наносит дополнительно [[/damage 1d6 lightning]] при каждом
  попадании.

  Дротик — метательный снаряд небольшого размера, который легко спрятать. Его не выпускают
  из лука или другого оружия, а метают прямо рукой. Эти дротики по всей поверхности
  украшены крохотными серебристыми рунами.'
