description: 'Древние предания о Шевараше

  Мастер Э. Л. Бойд

  Шевараш воплощает ненависть Дивного Народа к дроу. Это эльфийский бог возмездия
  и священных военных походов. Поклоняются ему эльфы и полуэльфы, потерявшие близких
  из-за войны и насилия, особенно те, кто жаждет отомстить дроу, и те, кто поклялся
  уничтожить Королеву Пауков и других злых богов, почитаемых темными эльфами. Отдельные
  эльфийские теологи полагают, что смысл существования Шевараша — хранить всю горечь
  и ненависть, что снедали эльфов со времен Войн Короны, тем самым не давая зловредному
  влиянию Королевы Пауков распространиться среди других эльфийских народов.'
