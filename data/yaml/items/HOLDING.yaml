description: 'Сумка хранения — обычная с виду сумка, зачарованная так, что её нутро
  открывается в надпространство, значительно превышающее размеры самой сумки: владелец
  может складывать и доставать вещи, не сгибаясь под их тяжестью. Такие сумки редки
  и, по понятным причинам, особенно полезны приключенцам. Увы, чары этой сумки угасают:
  положить в неё что-либо не удаётся. Зато если её сильно встряхнуть, из неё вываливаются
  самые разные предметы.

  Встряска (1/день): Действием вы встряхиваете сумку — из неё вываливаются случайные
  предметы, оказываясь у ваших ног или в вашем инвентаре.

  Бездонная сумка — это обычная сумка, зачарованная таким образом, что внутри нее
  открывается вход в пространство без измерений. Это пространство гораздо больше самой
  сумки, и туда можно складывать разнообразные предметы, чтобы не перегружать свое
  снаряжение. Такие сумки чрезвычайно редки и для искателей приключений весьма полезны
  по ряду очевидных причин. К сожалению, чары на этой сумке начинают отказывать, и
  любая попытка положить туда предмет заканчивается неудачей. Но вот если ее сильно
  потрясти, оттуда что-нибудь да выпадает.'
