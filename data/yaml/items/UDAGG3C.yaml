description: 'Как и большинство обычных кинжалов, этот кинжал имеет заострённый обоюдоострый
  клинок. Кроме того, он наделён магическими свойствами, которые сделали его ещё полезнее.

  Точность: Оружие ближнего боя, бонус +2 к атаке и урону.

  Жизненная сила: Пока кинжал при вас, ваш максимум хитов увеличен на 5.

  Исцеляющий удар: При провале спасброска СЛ 13 при попадании кинжал исцеляет владельца:
  вы восстанавливаете [[/heal 1d6]] хитов.

  У этого кинжала, как и у большинства других, заостренное лезвие, заточенное с обеих
  сторон. Также он обладает некоторыми магическими свойствами и поэтому более эффективен
  в бою.'
