description: 'Клинок морехода Гуллвина, укрывающий владельца непроницаемой сферой.

  Упругая сфера Отилюка (1/день): Действием вы заключаете себя в мерцающую сферу на
  7 раундов: вы неуязвимы для любых атак и эффектов извне, но и сами не можете воздействовать
  на внешний мир.

  Маг Гульвин, торговец-мореплаватель, всегда чтил мощь океана. Не раз он видел, как
  ужасный шторм в одно мгновение уносит за борт моряков. Поэтому он и создал Кинжал
  Тихой Гавани, свое знаменитое оружие. Этот клинок по крайней мере трижды спас ему
  жизнь. Когда Гульвин ушел на покой, то подарил кинжал своему другу Валькуру из Минтарна.'
