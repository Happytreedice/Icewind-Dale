description: 'Это оружие заказал эксцентричный дворянин Пелп Кадари. Пелп водил дружбу
  со всеми хаотическими жречествами, жертвуя деньги тому, кто приглянется в данный
  момент. Его приближённые и слуги держались подальше: дикие перепады настроения бросали
  его от ликующей эйфории к беспросветной тоске или яростному гневу в любой миг. Он
  заплатил за алебарду больше сорока тысяч золотых — при том что «резал» ею только
  птицу за своим длинным обеденным столом. Умирая, Пелп завещал оружие своему козлу
  Азуту, а на случай смерти Азута — первой девушке в синем платье, что войдёт в его
  кабинет. Через двенадцать лет после смерти Азута племянница Пелпа, Амара, зашла
  в кабинет за книгой. Дворецкий особняка вручил Длинный Тесак Амаре, когда ей исполнилось
  шестнадцать. Она продала оружие, чтобы оплатить поступление в академию магии.

  Точность: Оружие ближнего боя, бонус +4 к атаке и урону.

  Это оружие изготовлено по заказу эксцентричного дворянина Пелпа Кадари. Он с большой
  симпатией относился ко всевозможным культам хаотической направленности и нередко
  жертвовал деньги той церкви, которая ему на тот момент больше всего нравилась. Знакомые
  и слуги старались держаться от него на расстоянии, потому что его настроение могло
  мгновенно перейти от восторженной эйфории к мрачной меланхолии или дикой ярости.
  За изготовление этой алебарды он отдал больше сорока тысяч золотых, хотя пользовался
  ей лишь за своим длинным обеденным столом, разделывая дичь. После смерти Пелпа ее
  унаследовал Азут, ручной козлик этого чудака. В случае смерти Азута алебарду должна
  была получить первая девушка в голубом платье, которая зайдет в кабинет Пелпа. Через
  двенадцать лет после того, как умер козлик, Амара, племянница Пелпа, зашла в кабинет
  за книгой. Управляющий дома Пелпа вручил Длинный Секач Амаре, когда ей исполнилось
  шестнадцать лет. Она продала алебарду, чтобы оплатить поступление в академию магии.'
