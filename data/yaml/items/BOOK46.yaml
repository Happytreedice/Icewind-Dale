description: 'История Севера — Исход эльфов:

  Эта эпоха оставила крепости эльфов на разорение людям и оркам. Когда эльфы решили
  покинуть Север и отправиться в Эвермит, следы их деятельности быстро были стерты.
  Сохранилось лишь несколько мест вроде Старой Дороги или разрушенного порта в Высоком
  Лесу, где раньше находился Эйрланн. Но не только эльфы оставили свои дома. Государство
  людей Нетерил тоже уходило в небытие.

  Гибель настигла Нетерил в виде пустыни, которая поглощала Узкое Море и покрывала
  его берега сухой пылью и песком. Легенда гласит, что волшебники Нетерила почувствовали,
  что их земле приходит конец, и покинули ее, разбежавшись по всему свету и унося
  с собой секреты магии. Но более вероятно, что это было постепенное переселение,
  которое началось 3000 лет назад и закончилось 1500 лет спустя.

  Как бы то ни было, волшебники исчезли из Нетерила. На севере переживала трудности
  крепость дворфов Делзоун, некогда величественная и могучая. Затем напали орки. Они
  были вечной проблемой Севера. Каждые десять поколений их число настолько вырастало,
  что они не могли уже прокормиться и вылезали из своих нор. В этот раз орки спускались
  с Хребта Мира, выбирались из заброшенных шахт Серых Вершин, появлялись в затерянных
  крепостях дворфов в Холодных Горах, выходили из склепов в Нижних Горах, карабкались
  из подземелий Гор Высокой Луны. Ни до, ни после этого не было подобного нашествия
  орков. Эта бешеная сила просто смела Делзоун. Нетерил, лишившись волшебников, встретил
  ту же судьбу. Единственные, кто пережил это нашествие — эйрланские эльфы. Заручившись
  поддержкой волшебных деревьев Турланга и других безымянных союзников, они отодвинули
  конец своей цивилизации еще на несколько столетий.

  На востоке эйрланны построили крепость Аскалхорн и отдали ее беженцам из Нетерила;
  другие нетерильцы выстроили город Карс в Высоком Лесу, основали Ллоркх и Водошум.
  Остальные разбрелись по горам, холмам и болотам на север и запад от Высокого Леса.
  Они стали предками варваров Утгардта и основали Серебристую Луну, Эверлунд и Сундабар.'
